<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual content negative 3</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Visual content negative 3</h1>
    <canvas id="target" width="220" height="120" data-v3-visual-content="canvas-chart" aria-label="Bar chart: Q1 30, Q2 60, Q3 80" data-v3-visual-alternative-adequate="true"></canvas>
  </main>
  <script>const c=document.getElementById('target');const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,220,120);x.fillStyle='#c00';x.fillRect(30,70,40,30);x.fillStyle='#0a0';x.fillRect(90,40,40,60);x.fillStyle='#00c';x.fillRect(150,20,40,80);</script>
</body>
</html>
