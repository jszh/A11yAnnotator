<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion positive 2</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    #target{display:inline-block;animation:ticker 8s linear infinite}
  </style>
</head>
<body>
  <main>
    <h1>Motion positive 2</h1>
    <p>Reading task continues while this non-essential ticker moves.</p><div id="target" data-v3-parallel-non-essential="true">Persistent motion 2</div>
  </main>
  <script></script>
</body>
</html>
