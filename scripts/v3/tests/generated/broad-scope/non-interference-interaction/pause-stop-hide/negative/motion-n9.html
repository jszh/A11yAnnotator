<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion negative 9</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    #target{display:inline-block;animation:pulse 2s linear 1}
  </style>
</head>
<body>
  <main>
    <h1>Motion negative 9</h1>
    <div id="target">Brief or controlled motion 9</div>
  </main>
  <script></script>

</html>
