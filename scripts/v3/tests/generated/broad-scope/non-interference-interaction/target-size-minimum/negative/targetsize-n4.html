<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target size negative 4</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    #target,#neighbor{box-sizing:border-box;width:18px;height:18px;padding:0;border:1px solid #333;background:#eee}
       #equiv{margin-left:20px;min-width:120px;min-height:32px}
  </style>
</head>
<body>
  <main>
    <h1>Target size negative 4</h1>
    <button id="target" data-v3-equivalent-target="true" aria-label="Tiny target 4"></button><button id="neighbor" aria-label="Adjacent target 4"></button><button id="equiv">Equivalent large target 4</button>
  </main>
  <script></script>
</body>
</html>
