<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortcut negative 9</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Shortcut negative 9</h1>
    <button id="target" data-shortcut-key="i" data-shortcut-scope="focus" aria-keyshortcuts="i">Focused-only shortcut 9</button><p id="status">Waiting</p>
  </main>
  <script>document.getElementById('target').addEventListener('keydown', (e) => {
        if (e.key === 'i') {
          window.shortcutActivationCount = (window.shortcutActivationCount || 0) + 1;
          window.shortcutActivated = true;
          document.getElementById('target').setAttribute('data-activated', 'true');
          document.getElementById('status').textContent = 'Focused shortcut 9 activated ' + window.shortcutActivationCount;
        }
      });</script>
</body>
</html>
