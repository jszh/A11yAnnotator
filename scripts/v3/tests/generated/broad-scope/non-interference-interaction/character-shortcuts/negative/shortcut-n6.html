<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortcut negative 6</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Shortcut negative 6</h1>
    <button id="off" onclick="window.shortcutRemapped = true; document.getElementById('target').setAttribute('aria-keyshortcuts','Control+f'); document.getElementById('status').textContent = 'Shortcut remapped';">Remap shortcut</button><button id="target" data-shortcut-key="f" aria-keyshortcuts="f">Configurable shortcut 6</button><p id="status">Waiting</p>
  </main>
  <script>document.addEventListener('keydown', (e) => {
        if (e.key === 'f' && !window.shortcutsDisabled && (!window.shortcutRemapped || e.ctrlKey)) {
          window.shortcutActivationCount = (window.shortcutActivationCount || 0) + 1;
          window.shortcutActivated = true;
          document.getElementById('target').setAttribute('data-activated', 'true');
          document.getElementById('status').textContent = 'Configurable shortcut 6 activated ' + window.shortcutActivationCount;
        }
      });</script>
</body>
</html>
