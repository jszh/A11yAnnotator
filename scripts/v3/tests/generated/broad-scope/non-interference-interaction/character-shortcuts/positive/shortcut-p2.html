<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortcut positive 2</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Shortcut positive 2</h1>
    <button id="target" data-shortcut-key="b" aria-keyshortcuts="b">Shortcut action 2</button><div id="activity-log" aria-live="polite">No shortcut activity</div>
  </main>
  <script>document.addEventListener('keydown', (e) => {
      if (e.key === 'b' && !e.ctrlKey && !e.altKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
        document.getElementById('activity-log').textContent = 'Shortcut 2 changed this non-status region';
      }
    });</script>
</body>
</html>
