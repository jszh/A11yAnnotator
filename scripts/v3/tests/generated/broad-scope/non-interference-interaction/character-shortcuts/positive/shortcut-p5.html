<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortcut positive 5</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Shortcut positive 5</h1>
    <button id="target" data-shortcut-key="e" aria-keyshortcuts="e">Shortcut action 5</button><p id="status">Waiting</p>
  </main>
  <script>document.addEventListener('keydown', (e) => {
      if (e.key === 'e' && !e.ctrlKey && !e.altKey && !e.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
        window.shortcutActivationCount = (window.shortcutActivationCount || 0) + 1;
        window.shortcutActivated = true;
        document.body.setAttribute('data-shortcut-activated', 'true');
        document.getElementById('target').setAttribute('data-activated', 'true');
        document.getElementById('status').textContent = 'Shortcut 5 activated ' + window.shortcutActivationCount;
      }
    });</script>
</body>
</html>
