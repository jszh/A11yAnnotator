<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveal positive 3</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Reveal positive 3</h1>
    <div role="tablist"><button id="target" role="tab" aria-selected="false" aria-controls="panel">Security tab 3</button></div><section id="panel" role="tabpanel" hidden><h2>Security settings 3</h2><input aria-label="Recovery code 3"></section>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => { target.setAttribute('aria-selected','true'); panel.hidden = false; });</script>
</body>
</html>
