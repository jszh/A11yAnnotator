<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveal positive 7</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Reveal positive 7</h1>
    <button id="target" data-v3-reveal-trigger aria-expanded="false" aria-controls="filters">Show filters 7</button><form id="filters" hidden><label>Maximum price 7<input type="number"></label><button>Apply filters 7</button></form>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => { target.setAttribute('aria-expanded','true'); filters.hidden = false; });</script>
</body>
</html>
