<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveal negative 9</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Reveal negative 9</h1>
    <button id="target" data-v3-reveal-trigger aria-expanded="false" aria-controls="panel">Class-only state 9</button><section id="panel" hidden><h2>Still hidden 9</h2></section>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => { document.body.classList.add('opened-9'); });</script>
</body>
</html>
