<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveal negative 1</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Reveal negative 1</h1>
    <button id="target" data-v3-reveal-trigger aria-expanded="true" aria-controls="panel">Hide visible details 1</button><section id="panel"><h2>Already visible details 1</h2><a href="#track">Track package 1</a></section>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => { target.setAttribute('aria-expanded','false'); panel.hidden = true; });</script>
</body>
</html>
