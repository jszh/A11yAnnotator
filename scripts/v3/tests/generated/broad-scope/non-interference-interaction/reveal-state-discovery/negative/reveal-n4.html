<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reveal negative 4</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Reveal negative 4</h1>
    <button id="target" data-v3-reveal-trigger aria-expanded="false" aria-controls="panel">Decorative reveal 4</button><span id="panel" hidden aria-hidden="true">*</span>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => { target.setAttribute('aria-expanded','true'); panel.hidden = false; });</script>
</body>
</html>
