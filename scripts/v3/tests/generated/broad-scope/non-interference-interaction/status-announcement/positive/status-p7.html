<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status positive 7</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Status positive 7</h1>
    <button id="target" data-v3-status-trigger>Search 7</button><p id="status" data-v3-status-message></p>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => {
      setTimeout(() => { document.getElementById('status').textContent = '18 results returned 7'; }, 180);
    });</script>
</body>
</html>
