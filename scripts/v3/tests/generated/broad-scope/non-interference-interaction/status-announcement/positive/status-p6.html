<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status positive 6</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    #status{display:inline-block;width:24px;height:24px;margin-left:8px;border-radius:50%;background:#999;vertical-align:middle}
  </style>
</head>
<body>
  <main>
    <h1>Status positive 6</h1>
    <button id="target" data-v3-status-trigger>Favorite 6</button><span id="status" data-v3-status-message data-v3-status-meaning="" aria-label=""></span>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => {
      const s = document.getElementById('status');
      s.style.background = '#0a0';
      s.setAttribute('data-v3-status-meaning', 'Saved as favorite 6');
    });</script>
</body>
</html>
