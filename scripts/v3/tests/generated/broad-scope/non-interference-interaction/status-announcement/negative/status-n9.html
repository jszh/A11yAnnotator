<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status negative 9</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Status negative 9</h1>
    <button id="target" data-v3-status-trigger aria-expanded="false" aria-controls="panel">Show details 9</button><section id="panel" data-v3-disclosure-content hidden><p id="status" data-v3-status-message></p></section>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => {
        const panel = document.getElementById('panel');
        document.getElementById('target').setAttribute('aria-expanded', 'true');
        panel.hidden = false;
        document.getElementById('status').textContent = 'Additional questions added 9';
      });</script>
</body>
</html>
