<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status negative 6</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    
  </style>
</head>
<body>
  <main>
    <h1>Status negative 6</h1>
    <button id="target" data-v3-status-trigger>Save changes 6</button><p id="status" data-v3-status-message data-v3-programmatic-status-announcement="true"></p>
  </main>
  <script>document.getElementById('target').addEventListener('click', () => {
        const status = document.getElementById('status');
        status.textContent = 'Saved changes 6';
        if (window.__v3AnnounceStatus) window.__v3AnnounceStatus(status.textContent, status);
      });</script>
</body>
</html>
