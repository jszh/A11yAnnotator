<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flash negative 10</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(20px); } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
    #target{display:flex;align-items:center;justify-content:center;width:360px;height:260px;background:#444;color:white;opacity:1}
  </style>
</head>
<body>
  <main>
    <h1>Flash negative 10</h1>
    <div id="target" data-v3-flash-target>Flash control 10</div>
  </main>
  <script>setInterval(() => { const t = document.getElementById('target'); t.style.backgroundColor = t.style.backgroundColor === 'rgb(68, 68, 68)' ? 'rgb(90, 90, 90)' : 'rgb(68, 68, 68)'; }, 100);</script>
</body>
</html>
