<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RM negative 6</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    .flex { max-width: 720px; white-space: normal; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { from { opacity: .2; } to { opacity: 1; } }
    #target{display:inline-block;animation:blink 10s linear infinite}
  </style>
</head>
<body>
  <main>
    <h1>RM negative 6</h1>
    <p>Article content remains readable while this ticker can be paused.</p>
      <div id="target" data-v3-parallel-non-essential="true">Pausable persistent motion 6</div>
      <button id="pauseMotion" onclick="document.getElementById('target').style.animationPlayState='paused'">Pause animation</button>
  </main>
</body>
</html>
