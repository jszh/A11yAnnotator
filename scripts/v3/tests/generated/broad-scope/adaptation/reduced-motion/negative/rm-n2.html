<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RM negative 2</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 24px; }
    .flex { max-width: 720px; white-space: normal; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { from { opacity: .2; } to { opacity: 1; } }
    #target{display:inline-block;animation:spin 10s linear infinite}@media (prefers-reduced-motion: reduce){#target{animation:none!important}}
  </style>
</head>
<body>
  <main>
    <h1>RM negative 2</h1>
    <div id="target">Motion stops under reduced motion 2</div>
  </main>
</body>
</html>
