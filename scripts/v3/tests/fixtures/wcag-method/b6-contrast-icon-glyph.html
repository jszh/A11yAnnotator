<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B6 single-char icon glyph (1.4.3 inapplicable)</title></head>
<body>
  <!-- ACT afw4f7 Passed Example 7: a lone visible "X" on a button whose accessible name comes from
       aria-label="Close" does NOT express anything in a human language — it is a decorative close icon,
       so 1.4.3 does not apply even at #666-on-#000 = 3.66:1. The runner must exempt it (notExemptText:false). -->
  <button id="close" aria-label="Close" style="color:#666; background:#000">X</button>

  <!-- GUARD 1: a single low-contrast letter whose accessible name IS its own letter (an A–Z index link,
       name derived from the content "A") is real text content — NOT exempt (must still barrier). -->
  <a id="index" href="#a" style="color:#666; background:#000">A</a>

  <!-- GUARD 2: the glyph and the aria-label are the SAME character ⇒ the name does not OVERRIDE the
       glyph, so it is content, not a decorative icon — NOT exempt. -->
  <button id="named-same" aria-label="X" style="color:#666; background:#000">X</button>

  <!-- GUARD 3: a multi-character word with an overriding aria-label is still readable language — only a
       LENGTH-1 glyph is exempt, so a low-contrast worded button must still barrier. -->
  <button id="word" aria-label="Close dialog" style="color:#666; background:#000">Close</button>
</body></html>
