<!doctype html><html lang="de"><head><meta charset="utf-8"><title>b2</title></head>
<body>
<form id="f" novalidate>
  <label for="t">E-Mail</label>
  <input type="email" id="t" name="email" required>
  <div id="msg" style="color:#222"></div>
  <button type="submit" id="submit">Absenden</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('t').value.trim();
  if(!v){ document.getElementById('msg').textContent = 'E-Mail ist erforderlich.'; }
});
</script>
</body></html>
