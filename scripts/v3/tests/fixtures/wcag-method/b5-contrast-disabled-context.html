<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B5 disabled-context contrast (1.4.3 inapplicable)</title></head>
<body>
  <!-- 1.4.3 does NOT apply to text in a disabled control or disabled context (ACT afw4f7 Inapplicable 7/8/9).
       Each #888-on-white run below is 3.55:1 (a flat fail) but is EXEMPT, so the runner must not barrier. -->

  <!-- (1) text inside a disabled <fieldset> ancestor -->
  <fieldset disabled style="color:#888; background:white;">
    <label id="lbl_fieldset">My name in a disabled fieldset</label>
  </fieldset>

  <!-- (2) text inside an [aria-disabled=true] group ancestor -->
  <div role="group" aria-disabled="true" style="color:#888; background:white;">
    <label id="lbl_aria">My name in an aria-disabled group</label>
  </div>

  <!-- (3) a label that NAMES a disabled widget (aria-labelledby back-reference) -->
  <label id="lbl_target" style="color:#888; background:white;">My pet's name</label>
  <div role="textbox" aria-labelledby="lbl_target" aria-disabled="true" style="height:20px;width:120px;border:1px solid black;">x</div>

  <!-- GUARD: a NON-disabled #888-on-white run IS a real barrier (must still flag) -->
  <p id="lbl_enabled" style="color:#888; background:white;">enabled low-contrast text</p>
</body></html>
