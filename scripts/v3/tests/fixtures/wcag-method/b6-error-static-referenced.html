<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B6 static referenced error (3.3.1)</title></head>
<body>
  <!-- ACT 36b590 Passed Example 1: a number field pre-populated with an invalid value (0), whose
       aria-describedby points to an already-visible, error-styled <span id="error"> that describes the
       problem. The error IS identified statically (no change on submit) — the probe must credit it
       (errorNotIdentified:false), not false-barrier on "no NEW surface". -->
  <form id="pass-form">
    <label for="age">Age (years)</label>
    <input type="number" id="age" aria-describedby="error" value="0" />
    <span id="error">Invalid value for age. Age must be at least 1.</span>
    <input type="button" value="Submit" />
  </form>

  <!-- GUARD: a constrained field whose aria-describedby points to a PLAIN HINT (no error markup), with no
       error surfacing on submit, is a genuine 3.3.1 barrier. A pre-existing, unchanged, NON-error-styled
       referenced node must NOT be mistaken for error identification (errorNotIdentified:true). novalidate
       disables native validation so only the custom channel is under test. -->
  <form id="barrier-form" novalidate>
    <label for="email2">Email</label>
    <input type="email" id="email2" aria-describedby="hint2" required />
    <span id="hint2">Enter your work email.</span>
    <button type="submit">Submit</button>
  </form>
</body></html>
