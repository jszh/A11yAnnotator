<!doctype html><html><head><meta charset="utf-8"><title>a: role-less trap</title></head>
<body>
<button id="before">before</button>
<div id="t" class="modal" style="position:fixed;top:40px;left:40px;width:300px;height:200px;background:#eee;border:1px solid #333">
  <input id="i1" placeholder="field 1">
  <input id="i2" placeholder="field 2">
  <button id="b1">action 1</button>
  <button id="b2">action 2</button>
</div>
<button id="after">after</button>
<script>
// Hard keyboard trap: cycle Tab and Shift+Tab strictly WITHIN the modal's focusables.
// No Esc handler, no close button. This is a 2.1.2 keyboard trap.
(function(){
  var modal = document.getElementById('t');
  var f = ['i1','i2','b1','b2'].map(function(id){return document.getElementById(id);});
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Tab') return;
    var a = document.activeElement;
    var idx = f.indexOf(a);
    if (idx === -1) return; // outside modal: leave alone (but focus can't get back in either)
    e.preventDefault();
    var next;
    if (e.shiftKey) next = f[(idx - 1 + f.length) % f.length];
    else next = f[(idx + 1) % f.length];
    next.focus();
  }, true);
})();
</script>
</body></html>
