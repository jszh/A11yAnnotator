<!doctype html><html lang="en"><head><meta charset="utf-8"><title>f</title></head>
<body>
<h1>Non-button triggers, each producing an un-announced status</h1>

<!-- (1) a link with NO href (so it isn't excluded as navigation) acting as a JS button -->
<a id="t_link" role="link" tabindex="0"
   onclick="document.getElementById('o1').appendChild(Object.assign(document.createElement('div'),{textContent:'Filter applied: in stock only'}))">Apply filter</a>
<div id="o1"></div>

<!-- (2) a checkbox whose toggle inserts an un-announced status -->
<input id="t_check" type="checkbox"
   onclick="document.getElementById('o2').appendChild(Object.assign(document.createElement('div'),{textContent:'Notifications enabled'}))">
<label for="t_check">Notifications</label>
<div id="o2"></div>

<!-- (3) a custom role=tab on a NON-button element (a div) inserting un-announced status -->
<div id="t_tab" role="tab" tabindex="0"
   onclick="document.getElementById('o3').appendChild(Object.assign(document.createElement('div'),{textContent:'Tab content loaded from server'}))">Reports</div>
<div id="o3"></div>
</body></html>
