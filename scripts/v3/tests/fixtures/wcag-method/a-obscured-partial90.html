<!doctype html><html><head><meta charset="utf-8"><title>obscured partial v2</title>
<style>html,body{margin:0;padding:0;height:300px}
#t{position:absolute;top:100px;left:50px;width:200px;height:40px;box-sizing:border-box}
/* bar covers the TOP 36px of the 40px input (90%), leaving a 4px visible strip at the bottom */
#bar{position:absolute;top:100px;left:50px;width:200px;height:36px;background:rgb(10,20,30);opacity:1;z-index:999}
</style></head><body>
<input id="t" type="text" aria-label="partly covered field">
<div id="bar">opaque bar covering 90% leaving a 4px strip</div>
</body></html>
