<!doctype html><html lang="en"><head><meta charset="utf-8"><title>c</title></head>
<body>
<form id="f" novalidate>
  <label for="t">Email</label>
  <input type="email" id="t" name="email" required>
  <div id="msg"></div>
  <button type="submit" id="submit">Submit</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('t').value.trim();
  if(!v){
    var inp = document.getElementById('t');
    // COLOR-ONLY cue: just turn the field border red. No descriptive text anywhere.
    inp.style.border = '2px solid red';
    inp.style.background = '#ffecec';
  }
});
</script>
</body></html>
