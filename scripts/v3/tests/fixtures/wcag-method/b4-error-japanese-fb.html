<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>b3</title></head>
<body>
<form id="f" novalidate>
  <label for="t">メール</label>
  <input type="email" id="t" name="email" required>
  <div id="msg" style="color:#222"></div>
  <button type="submit" id="submit">送信</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var v = document.getElementById('t').value.trim();
  if(!v){ document.getElementById('msg').textContent = 'メールアドレスを入力してください。'; }
});
</script>
</body></html>
