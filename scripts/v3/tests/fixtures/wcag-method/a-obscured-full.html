<!doctype html><html><head><meta charset="utf-8"><title>obscured full v2</title>
<style>html,body{margin:0;padding:0;height:300px}
#t{position:absolute;top:100px;left:50px;width:200px;height:40px;box-sizing:border-box}
/* bar absolutely positioned to FULLY cover the input box (and a margin around it) */
#bar{position:absolute;top:96px;left:40px;width:240px;height:48px;background:rgb(10,20,30);opacity:1;z-index:999}
</style></head><body>
<input id="t" type="text" aria-label="search field">
<div id="bar">opaque bar fully covering the input</div>
</body></html>
