<!doctype html><html><head><meta charset="utf-8"><title>reflow clean</title>
<style>html,body{margin:0;padding:0}#t{max-width:100%;height:40px;background:#393;color:#000}</style>
</head><body>
<div id="t">This block reflows cleanly: max-width:100% so it never exceeds the viewport.</div>
<p>Normal wrapping paragraph text that fits any narrow viewport without horizontal scroll.</p>
</body></html>
