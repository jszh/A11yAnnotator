<!doctype html><html lang="en"><head><meta charset="utf-8"><title>B7 external-link navigation guard (2.1.1)</title></head>
<body>
  <!-- Activating an <a href="absolute external"> by Enter triggers the browser's DEFAULT navigation,
       loading a real page over the network — which stalled the keyboard-activation (2.1.1) probe on ACT
       cases whose links point off-site (gutenberg.org / w3.org), seen as a 30-75s case-timeout, and left
       the probe on the wrong document. The runner must record the activation but NOT leave the page. -->
  <a id="ext" href="https://example.com/some/external/path">External link</a>
</body></html>
