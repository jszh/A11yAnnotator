<!doctype html><html lang="en"><head><meta charset="utf-8"><title>c2</title></head>
<body>
<h1>FAQ</h1>
<!-- Disclosure that INSERTS its primary body content on first expand (lazy render). Common React/Vue pattern. -->
<button id="t" type="button" aria-expanded="false" aria-controls="body"
  onclick="var b=document.getElementById('body');this.setAttribute('aria-expanded','true');b.innerHTML='<p>You may return any item within thirty days of delivery for a full refund. Items must be unused and in original packaging.</p>';">
  What is your return policy?
</button>
<div id="body"></div>
</body></html>
