<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Item 9 overlay+hover</title>
<style>
  header{position:fixed;top:0;left:0;width:100%;height:60px;background:#222;color:#fff;z-index:10}
  main{margin-top:600px}
  button,a{display:block;margin:20px}
</style></head><body>
<header>Sticky header bar</header>
<main>
  <button id="below">Content button below the sticky header</button>
  <button id="pbtn" popovertarget="pop">Open popover</button>
  <div popover id="pop">popover content revealed on activation</div>
  <a id="desc" href="#x" aria-describedby="tt">Link described by a tooltip</a>
  <span role="tooltip" id="tt">tooltip text shown on hover/focus</span>
  <button id="plain">Plain button with a title attr only</button>
</main></body></html>
