<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 888" width="1320" height="888" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4651"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8893"/>
    </marker>
    <style>
      .title{font:700 21px Helvetica,Arial,sans-serif;fill:#16202b}
      .sub{font:italic 12.5px Georgia,serif;fill:#5b6b78}
      .hdr{font:600 12.5px Helvetica,Arial,sans-serif;fill:#1f2933}
      .hdrI{font:italic 600 12.5px Helvetica,Arial,sans-serif;fill:#1f2933}
      .bdy{font:11px Helvetica,Arial,sans-serif;fill:#36434f}
      .sm{font:9.5px Helvetica,Arial,sans-serif;fill:#5b6b78}
      .elab{font:italic 9.5px Helvetica,Arial,sans-serif;fill:#64707c}
      .cap{font:italic 11px Georgia,serif;fill:#4a5560}
      .solid{stroke:#3a4651;stroke-width:1.7;fill:none}
      .thick{stroke:#357a49;stroke-width:2.6;fill:none}
      .dash{stroke:#7c8893;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <!-- title -->
  <text class="title" x="660" y="34" text-anchor="middle">An evidence-gated behavioral accessibility harness</text>
  <text class="sub" x="660" y="55" text-anchor="middle">collect &#8594; enumerate &#8594; measure &#8594; reconcile &#8594; publish</text>

  <!-- legend -->
  <rect x="1112" y="120" width="194" height="150" rx="6" fill="#ffffff" stroke="#c4ccd3"/>
  <text class="hdr" x="1124" y="139">Legend</text>
  <line class="thick" x1="1124" y1="153" x2="1150" y2="153"/>
  <text class="sm" x="1156" y="156">authoritative path</text>
  <line class="dash" x1="1124" y1="170" x2="1150" y2="170"/>
  <text class="sm" x="1156" y="173">non-authoritative / shadow</text>
  <rect x="1124" y="184" width="14" height="11" fill="#e6f1e8" stroke="#3f7d51"/>
  <text class="sm" x="1144" y="193">deterministic — decides</text>
  <rect x="1124" y="201" width="14" height="11" fill="#fbf3df" stroke="#b07e1f"/>
  <text class="sm" x="1144" y="210">LLM — caps at canary</text>
  <rect x="1124" y="218" width="14" height="11" fill="#e7eef8" stroke="#3f5e93"/>
  <text class="sm" x="1144" y="227">obligation ledger</text>
  <rect x="1124" y="235" width="14" height="11" fill="#efe9f6" stroke="#6f4f9c"/>
  <text class="sm" x="1144" y="244">trust / calibration</text>
  <rect x="1124" y="252" width="14" height="11" fill="#eaf1f0" stroke="#4f8088"/>
  <text class="sm" x="1144" y="261">evidence (not verdicts)</text>

  <!-- SAVED -->
  <rect x="525" y="74" width="270" height="38" rx="19" fill="#eef1f4" stroke="#8a98a6"/>
  <text class="bdy" x="660" y="98" text-anchor="middle">Frozen page snapshot &#183; saved dataset</text>
  <line class="solid" x1="660" y1="112" x2="660" y2="138" marker-end="url(#arr)"/>

  <!-- COLLECTOR -->
  <rect x="470" y="140" width="380" height="50" rx="6" fill="#eef1f4" stroke="#8a98a6"/>
  <text class="hdr" x="660" y="160" text-anchor="middle">Collector — static facts</text>
  <text class="bdy" x="660" y="178" text-anchor="middle">DOM &#183; accessibility tree &#183; axe pass &#183; run-id + page-source digest</text>
  <line class="solid" x1="660" y1="190" x2="660" y2="204" marker-end="url(#arr)"/>

  <!-- OBLIGATIONS -->
  <rect x="220" y="206" width="880" height="74" rx="8" fill="#e7eef8" stroke="#3f5e93" stroke-width="2"/>
  <text class="hdr" x="660" y="228" text-anchor="middle">Obligation enumeration — applicability oracle</text>
  <text class="bdy" x="660" y="248" text-anchor="middle">Every (element &#215; criterion &#215; claim-family) becomes one atomic obligation, derived independently of the candidate generators</text>
  <text class="bdy" x="660" y="264" text-anchor="middle">so a forgotten branch surfaces as an auto-PARTIAL rather than a silent pass. Default-closed: every obligation gets exactly one disposition.</text>

  <!-- fan to lanes -->
  <line class="solid" x1="520" y1="280" x2="345" y2="310" marker-end="url(#arr)"/>
  <line class="solid" x1="800" y1="280" x2="975" y2="310" marker-end="url(#arr)"/>
  <!-- checker-uncertainty feedback (dashed, up the clear centre) -->
  <line class="dash" x1="660" y1="312" x2="660" y2="284" marker-end="url(#arrL)"/>
  <text class="elab" x="672" y="298">checker INCOMPLETE &#8658; new obligation</text>
  <text class="elab" x="672" y="310">+ judge hint  (&#8220;absence &#8800; pass&#8221;)</text>

  <!-- LANE: RUNNERS -->
  <rect x="180" y="312" width="300" height="176" rx="7" fill="#e6f1e8" stroke="#3f7d51"/>
  <text class="hdr" x="196" y="334">Behavioral runners (&#215;10) — they DECIDE</text>
  <text class="bdy" x="196" y="354">Drive the live page to settle the criteria</text>
  <text class="bdy" x="196" y="369">static scanners cannot reach:</text>
  <text class="bdy" x="206" y="387">&#8226; focus visibility 2.4.7</text>
  <text class="bdy" x="206" y="403">&#8226; keyboard operability / trap 2.1.1, 2.1.2</text>
  <text class="bdy" x="206" y="419">&#8226; status messages 4.1.3, reflow 1.4.10</text>
  <text class="bdy" x="206" y="435">&#8226; hover 1.4.13, invalid-submit 3.3.1</text>
  <text class="sm" x="196" y="457">Typed directional support: a clear needs</text>
  <text class="sm" x="196" y="471">strictly more evidence than a barrier.</text>

  <!-- LANE: EVIDENCE -->
  <rect x="510" y="312" width="300" height="176" rx="7" fill="#eaf1f0" stroke="#4f8088"/>
  <text class="hdr" x="526" y="334">Instruments &amp; checkers</text>
  <text class="hdrI" x="526" y="350">evidence, never verdicts</text>
  <text class="bdy" x="526" y="372">&#8226; vision + before/after state pairs</text>
  <text class="bdy" x="526" y="388">&#8226; virtual screen reader (CDP-corrected)</text>
  <text class="bdy" x="526" y="404">&#8226; keyboard &amp; reading-order graphs</text>
  <text class="sm" x="536" y="418">BAGEL / LOTUS methods</text>
  <text class="bdy" x="526" y="436">&#8226; status-message &amp; OCR probes</text>
  <text class="bdy" x="526" y="452">&#8226; axe + IBM deterministic cross-signals</text>
  <text class="sm" x="526" y="472">(run over the collected page)</text>

  <!-- LANE: LLM -->
  <rect x="840" y="312" width="300" height="176" rx="7" fill="#fbf3df" stroke="#b07e1f"/>
  <text class="hdr" x="856" y="334">LLM judge — non-authoritative</text>
  <text class="bdy" x="856" y="356">Reasons over the frozen evidence plus a</text>
  <text class="bdy" x="856" y="372">bounded set of read-only / fresh-clone CDP</text>
  <text class="bdy" x="856" y="388">tools that return objective measurements only.</text>
  <text class="bdy" x="856" y="410">Fills only obligations the deterministic</text>
  <text class="bdy" x="856" y="426">lane left open.</text>
  <text class="sm" x="856" y="450">Capped at canary by construction —</text>
  <text class="sm" x="856" y="464">never authoritative.</text>

  <!-- evidence feeds the judge -->
  <line class="solid" x1="810" y1="400" x2="838" y2="400" marker-end="url(#arr)"/>

  <!-- runners -> ledger (authoritative) -->
  <path class="thick" d="M330,488 C 330,504 400,506 425,518" marker-end="url(#arr)"/>
  <text class="elab" x="338" y="508">authoritative CLAIM</text>
  <!-- evidence -> provisional (promotions) -->
  <path class="dash" d="M700,488 C 720,506 790,506 815,518" marker-end="url(#arrL)"/>
  <text class="elab" x="612" y="508">axe / trap promotions</text>
  <!-- llm -> provisional -->
  <path class="dash" d="M990,488 C 980,504 950,506 930,518" marker-end="url(#arrL)"/>

  <!-- LEDGER -->
  <rect x="150" y="520" width="560" height="74" rx="8" fill="#f8eae7" stroke="#a9504a" stroke-width="2"/>
  <text class="hdr" x="430" y="542" text-anchor="middle">Obligation ledger — one disposition per obligation</text>
  <text class="bdy" x="430" y="562" text-anchor="middle">Precedence  CLAIM &#9654; PROVISIONAL &#9654; PARTIAL.</text>
  <text class="bdy" x="430" y="578" text-anchor="middle">Runner CLAIMs are authoritative-capable; everything else fills</text>
  <text class="bdy" x="430" y="589" text-anchor="middle" font-size="9.5" fill="#5b6b78">only what the deterministic lane left at auto-PARTIAL.</text>

  <!-- PROVISIONAL -->
  <rect x="730" y="520" width="360" height="74" rx="8" fill="#fbf3df" stroke="#b07e1f"/>
  <text class="hdr" x="910" y="540" text-anchor="middle">Provisional fills — non-authoritative</text>
  <text class="bdy" x="910" y="558" text-anchor="middle">Barrier-dominates-clear; never override a CLAIM.</text>
  <text class="bdy" x="910" y="574" text-anchor="middle">Three sources: LLM verdict &#183; axe-promotion (axe&#8217;s</text>
  <text class="bdy" x="910" y="586" text-anchor="middle" font-size="10">decided closed-sub-domain violations) &#183; keyboard-trap promotion.</text>

  <!-- prov -> ledger -->
  <line class="dash" x1="730" y1="557" x2="712" y2="557" marker-end="url(#arrL)"/>
  <text class="elab" x="724" y="549" text-anchor="end">fill auto-PARTIAL</text>

  <!-- ledger -> authority ; prov -> authority -->
  <path class="solid" d="M430,594 C 430,612 510,616 545,626" marker-end="url(#arr)"/>
  <path class="dash" d="M910,594 C 900,612 810,616 775,626" marker-end="url(#arrL)"/>

  <!-- AUTHORITY -->
  <rect x="300" y="628" width="720" height="60" rx="8" fill="#efe9f6" stroke="#6f4f9c" stroke-width="2"/>
  <text class="hdr" x="660" y="650" text-anchor="middle">Authority gate — default shadow &#8594; canary &#8594; authoritative</text>
  <text class="bdy" x="660" y="670" text-anchor="middle">Behavioral runners reach authoritative once gold-calibrated; the LLM and all promotions are capped at canary.</text>

  <!-- authority -> outputs -->
  <line class="thick" x1="410" y1="688" x2="410" y2="718" marker-end="url(#arr)"/>
  <line class="dash" x1="850" y1="688" x2="850" y2="718" marker-end="url(#arrL)"/>

  <!-- OUTPUTS -->
  <rect x="250" y="720" width="320" height="48" rx="6" fill="#dcecdf" stroke="#357a49"/>
  <text class="hdr" x="410" y="749" text-anchor="middle">Authoritative claims — published</text>

  <rect x="640" y="720" width="420" height="48" rx="6" fill="#eef0f2" stroke="#8a98a6" stroke-dasharray="5 4"/>
  <text class="hdr" x="850" y="742" text-anchor="middle">Shadow / provisional annotations</text>
  <text class="sm" x="850" y="758" text-anchor="middle">recorded, never published &#183; scored offline</text>

  <!-- CALIBRATION -->
  <rect x="1110" y="520" width="200" height="176" rx="8" fill="#efe9f6" stroke="#6f4f9c"/>
  <text class="hdr" x="1124" y="542">Calibration (offline)</text>
  <text class="bdy" x="1124" y="562">Gold set is hand-labeled</text>
  <text class="bdy" x="1124" y="577">AFTER the run.</text>
  <text class="bdy" x="1124" y="599">A mechanism reaches canary</text>
  <text class="bdy" x="1124" y="614">only with zero false clears</text>
  <text class="bdy" x="1124" y="629">over &#8805;149 labelled clears</text>
  <text class="bdy" x="1124" y="644">(false-barrier &#8804;10%,</text>
  <text class="bdy" x="1124" y="659">coverage &#8805;50%).</text>

  <!-- shadow -> calibration -> authority loop -->
  <path class="dash" d="M1060,742 C 1150,720 1200,705 1205,698" marker-end="url(#arrL)"/>
  <text class="elab" x="1112" y="724">scored</text>
  <path class="dash" d="M1110,606 C 1070,624 1045,636 1022,648" marker-end="url(#arrL)"/>
  <text class="elab" x="1030" y="616">gates promotion</text>

  <!-- INTEGRITY footnote -->
  <rect x="150" y="800" width="1160" height="40" rx="6" fill="#f3f4f5" stroke="#b3bac1"/>
  <text class="bdy" x="660" y="816" text-anchor="middle">Reproducibility — every artifact is bound by a run-id and a digest of the page source; a signed manifest and per-runner attestation gate</text>
  <text class="bdy" x="660" y="831" text-anchor="middle">authoritative publication, so the whole pipeline replays deterministically over the frozen dataset.</text>

  <text class="cap" x="150" y="868">Figure 1. Architecture of the harness. Deterministic behavioral runners decide interaction-manifested criteria (solid, authoritative-capable); instruments,</text>
  <text class="cap" x="150" y="882">checkers, and the LLM judge are non-authoritative (dashed) and may only fill obligations the deterministic lane left open, capped at canary by the gold-calibrated authority gate.</text>
</svg>
