<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 716" width="1440" height="716" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4651"/>
    </marker>
    <style>
      .title{font:700 21px Helvetica,Arial,sans-serif;fill:#16202b}
      .sub{font:italic 12.5px Georgia,serif;fill:#5b6b78}
      .seg{font:700 14px Helvetica,Arial,sans-serif;fill:#3a4651;letter-spacing:1px}
      .segd{font:italic 11px Georgia,serif;fill:#6a7681}
      .hdr{font:600 12.5px Helvetica,Arial,sans-serif;fill:#1f2933}
      .bdy{font:11px Helvetica,Arial,sans-serif;fill:#36434f}
      .sm{font:9.5px Helvetica,Arial,sans-serif;fill:#5b6b78}
      .q{font:11px Helvetica,Arial,sans-serif;fill:#2c3a47}
      .elab{font:italic 9.5px Helvetica,Arial,sans-serif;fill:#64707c}
      .cap{font:italic 11px Georgia,serif;fill:#4a5560}
      .solid{stroke:#3a4651;stroke-width:1.7;fill:none}
      .flag{fill:#b14a3a} .clear{fill:#2f7144} .nv{fill:#6a7681}
    </style>
  </defs>

  <text class="title" x="720" y="36" text-anchor="middle">Accessibility evaluation pipeline</text>
  <text class="sub" x="720" y="57" text-anchor="middle">from a web page, to per-element accessibility checks, to results</text>

  <!-- ============ PANELS ============ -->
  <rect x="40"   y="92" width="400" height="560" rx="10" fill="#f4f7fb" stroke="#d6e0ec"/>
  <rect x="470"  y="92" width="640" height="560" rx="10" fill="#f5faf6" stroke="#d3e6d9"/>
  <rect x="1140" y="92" width="270" height="560" rx="10" fill="#fbf7f1" stroke="#e8ddc9"/>

  <text class="seg"  x="60"   y="122">INPUT</text>
  <text class="segd" x="60"   y="140">the page &amp; what each element owes</text>
  <text class="seg"  x="490"  y="122">ANALYSIS</text>
  <text class="segd" x="490"  y="140">automated tests + an agent for the judgment calls</text>
  <text class="seg"  x="1160" y="122">RESULTS</text>
  <text class="segd" x="1160" y="140">findings, per element</text>

  <!-- main horizontal flow arrows between segments -->
  <path class="solid" d="M420,300 C 452,300 458,250 488,250" marker-end="url(#arr)"/>
  <path class="solid" d="M962,220 C 1060,220 1090,248 1156,250" marker-end="url(#arr)"/>
  <path class="solid" d="M1094,462 C 1118,462 1132,432 1156,430" marker-end="url(#arr)"/>

  <!-- ============ INPUT ============ -->
  <rect x="80" y="154" width="320" height="40" rx="6" fill="#eaf1f8" stroke="#5b7da6"/>
  <text class="hdr" x="240" y="178" text-anchor="middle">Web page under test  (frozen snapshot)</text>
  <line class="solid" x1="240" y1="194" x2="240" y2="206" marker-end="url(#arr)"/>

  <rect x="70" y="208" width="340" height="52" rx="6" fill="#eaf1f8" stroke="#5b7da6"/>
  <text class="bdy" x="240" y="229" text-anchor="middle">Captured from the page &#8212; every control:</text>
  <text class="sm"  x="240" y="246" text-anchor="middle">role &#183; name &#183; state &#183; colour &#183; size &#183; on-screen position</text>
  <line class="solid" x1="240" y1="260" x2="240" y2="272" marker-end="url(#arr)"/>

  <rect x="60" y="274" width="360" height="336" rx="8" fill="#e7eef8" stroke="#3f5e93" stroke-width="2"/>
  <text class="hdr" x="240" y="298" text-anchor="middle">Accessibility checklist for each element</text>
  <text class="segd" x="240" y="315" text-anchor="middle">every requirement it owes &#8212; an &#8220;obligation&#8221;</text>
  <text class="q" x="84" y="346">?  Can a keyboard user reach and operate it?</text>
  <text class="q" x="84" y="372">?  Is the keyboard focus clearly visible?</text>
  <text class="q" x="84" y="398">?  Is its text / colour contrast high enough?</text>
  <text class="q" x="84" y="424">?  Is its name present, clear, and accurate?</text>
  <text class="q" x="84" y="450">?  Are changes announced to a screen reader?</text>
  <text class="q" x="84" y="476">?  Does the layout still work when zoomed in?</text>
  <text class="q" x="84" y="502">?  Is its alt text or link purpose meaningful?</text>
  <text class="segd" x="240" y="556" text-anchor="middle">Built automatically for every element,</text>
  <text class="segd" x="240" y="572" text-anchor="middle">so nothing is quietly skipped.</text>

  <!-- ============ ANALYSIS ============ -->
  <!-- Lane A: automated runners -->
  <rect x="490" y="158" width="472" height="196" rx="8" fill="#e6f1e8" stroke="#3f7d51"/>
  <text class="hdr" x="506" y="180">Automated runners &#8212; drive the real page &amp; measure</text>
  <text class="bdy" x="508" y="202">&#8226;  operate every control by keyboard; detect traps</text>
  <text class="bdy" x="508" y="222">&#8226;  confirm the focus indicator is visible</text>
  <text class="bdy" x="508" y="242">&#8226;  sample on-screen pixel contrast</text>
  <text class="bdy" x="508" y="262">&#8226;  reflow the layout at 320&#8201;px; dwell on hover</text>
  <text class="bdy" x="508" y="282">&#8226;  submit forms; watch for an announced status</text>
  <text class="sm"  x="508" y="308">Instruments: virtual screen reader &#183; screenshots (vision) &#183;</text>
  <text class="sm"  x="508" y="322">keyboard &amp; reading-order maps</text>
  <text class="bdy" x="508" y="344">Each check &#8594;  <tspan class="flag">flag</tspan> &#183; <tspan class="clear">clear</tspan> &#183; <tspan class="nv">no verdict</tspan></text>

  <!-- not-decided handoff to the agent -->
  <line class="solid" x1="560" y1="354" x2="560" y2="390" marker-end="url(#arr)"/>
  <text class="elab" x="568" y="376">not decided</text>

  <!-- Lane B: agentic pipeline -->
  <rect x="490" y="392" width="158" height="156" rx="8" fill="#eef3ee" stroke="#6f8f78"/>
  <text class="hdr" x="569" y="414" text-anchor="middle">Assessment item</text>
  <text class="sm"  x="569" y="436" text-anchor="middle">the unresolved check,</text>
  <text class="sm"  x="569" y="452" text-anchor="middle">plus its evidence &#8212;</text>
  <text class="sm"  x="569" y="468" text-anchor="middle">screenshots &#183;</text>
  <text class="sm"  x="569" y="484" text-anchor="middle">transcript &#183;</text>
  <text class="sm"  x="569" y="500" text-anchor="middle">measurements &#183;</text>
  <text class="sm"  x="569" y="516" text-anchor="middle">checker hints</text>
  <line class="solid" x1="648" y1="468" x2="664" y2="468" marker-end="url(#arr)"/>

  <rect x="666" y="384" width="250" height="176" rx="8" fill="#fbf3df" stroke="#b07e1f" stroke-width="2"/>
  <text class="hdr" x="791" y="406" text-anchor="middle">LLM agent &#8212; the judgment calls</text>
  <text class="bdy" x="678" y="428">Settles what automation can&#8217;t: is the</text>
  <text class="bdy" x="678" y="444">alt text right? a link&#8217;s purpose clear?</text>
  <text class="bdy" x="678" y="460">a heading descriptive? &#8212; plus anything</text>
  <text class="bdy" x="678" y="476">left undecided.</text>
  <rect x="678" y="496" width="226" height="50" rx="6" fill="#fff7e6" stroke="#caa14e"/>
  <text class="sm" x="688" y="514">Tools &#8635;  re-screenshot &#183; eyedrop colour &#183;</text>
  <text class="sm" x="688" y="530">activate control &#183; drive screen reader &#183; OCR</text>
  <line class="solid" x1="916" y1="468" x2="932" y2="468" marker-end="url(#arr)"/>

  <rect x="934" y="420" width="160" height="96" rx="8" fill="#f3ece2" stroke="#b08a5a"/>
  <text class="hdr" x="1014" y="446" text-anchor="middle">Judgment + reason</text>
  <text class="bdy" x="1014" y="470" text-anchor="middle"><tspan class="flag">flag</tspan> &#183; <tspan class="clear">clear</tspan> &#183;</text>
  <text class="bdy" x="1014" y="486" text-anchor="middle"><tspan class="nv">no verdict</tspan></text>

  <!-- ============ RESULTS ============ -->
  <rect x="1158" y="210" width="234" height="304" rx="8" fill="#ffffff" stroke="#c9b48f"/>
  <text class="hdr" x="1275" y="236" text-anchor="middle">Accessibility findings</text>
  <text class="sm"  x="1275" y="252" text-anchor="middle">one verdict per element &amp; criterion</text>
  <line x1="1174" y1="266" x2="1376" y2="266" stroke="#e3dac6"/>
  <text class="hdr" x="1174" y="294"><tspan class="flag">&#9873;</tspan>  Flag &#8212; a barrier found</text>
  <text class="hdr" x="1174" y="322"><tspan class="clear">&#10003;</tspan>  Clear &#8212; no barrier</text>
  <text class="hdr" x="1174" y="350"><tspan class="nv">&#9675;</tspan>  No verdict &#8212; left for a human</text>
  <line x1="1174" y1="370" x2="1376" y2="370" stroke="#e3dac6"/>
  <text class="sm" x="1174" y="394">Each outcome can come from either</text>
  <text class="sm" x="1174" y="409">pathway &#8212; the automated runners</text>
  <text class="sm" x="1174" y="424">(deterministic) or the LLM agent</text>
  <text class="sm" x="1174" y="439">(provisional).</text>
  <text class="segd" x="1275" y="476" text-anchor="middle">Each finding keeps its evidence.</text>

  <!-- caption -->
  <text class="cap" x="40" y="684">Figure 1. The harness turns a page into a per-element accessibility checklist (input). Automated runners decide what they can; checks they leave undecided become</text>
  <text class="cap" x="40" y="699">assessment items for an evidence-gathering agent (analysis). Both pathways report one verdict per check &#8212; flag, clear, or no verdict &#8212; with the evidence behind it (results).</text>
</svg>
