<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Non-Interference Prototype Fixture</title>
  <style>
    @keyframes ticker { from { left: 0; } to { left: 10px; } }
    @keyframes flashFast { from { opacity: 0; } to { opacity: 1; } }
    @keyframes brief { from { opacity: 0; } to { opacity: 1; } }
    #move { position: relative; animation: ticker 8s linear infinite; }
    #flash { animation: flashFast .2s linear infinite; }
    #loader { animation: brief 2s 1; }
  </style>
</head>
<body>
  <h1>Non-Interference</h1>
  <audio id="badAudio" autoplay src="tone.mp3"></audio>
  <audio id="mutedAudio" autoplay muted src="tone.mp3"></audio>
  <audio id="controlledAudio" autoplay controls src="tone.mp3"></audio>
  <div id="move">moving ticker</div>
  <div id="flash">fast flashing candidate</div>
  <div id="loader">brief loader</div>
</body>
</html>
