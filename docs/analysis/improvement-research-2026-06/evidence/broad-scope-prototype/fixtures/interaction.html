<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interaction Prototype Fixture</title>
</head>
<body>
  <h1>Interaction Surfaces</h1>
  <label>Focus navigation <input id="focusNav" onfocus="location.hash='moved'"></label>
  <label>Change navigation <select id="changeNav" onchange="location.hash='selected'"><option>One</option></select></label>
  <canvas id="draw" width="120" height="40" onpointerdown="window.drawn=true"></canvas>
  <div id="drag" draggable="true">drag me</div>
  <button id="shortcut" accesskey="x">Save</button>
</body>
</html>
