<!doctype html><html lang="en"><head><meta charset="utf-8"><title>stopimmediate trap</title></head><body>
<div role="dialog" aria-label="modal"><button id="a">A</button><button id="b">B</button></div>
<script>
var a=document.getElementById('a'),b=document.getElementById('b');
// capture-phase, registered first → blocks the harness's passive listeners
document.addEventListener('keydown',function(e){ if(e.key==='Tab'){ e.preventDefault(); e.stopImmediatePropagation(); (document.activeElement===a?b:a).focus(); } },true);
document.addEventListener('focusin',function(e){ e.stopImmediatePropagation(); },true);
</script></body></html>
