<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Declared-but-hidden modal vs a genuinely open one (2.4.3 clause C)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; }
  /* The commonest scripted-dialog shape on the web: the dialog markup — aria-modal and all — ships in the
     document at rest inside a scrim that is display:none, and a class toggle shows it. Nothing is open. */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; }
  .scrim.open { display: flex; }
  .box { background: #fff; margin: auto; padding: 16px; border-radius: 8px; }
  button, input { font: inherit; }
</style>
</head>
<body>
<h1>Page content</h1>
<button id="a">First page control</button>
<button id="b">Second page control</button>
<a href="#x">A page link</a>

<div class="scrim" id="scrim">
  <div class="box" role="alertdialog" aria-modal="true" aria-label="Confirm">
    <button id="ok">OK</button>
    <button id="cancel">Cancel</button>
  </div>
</div>
</body>
</html>
