<!doctype html><html lang="en"><head><meta charset="utf-8"><title>focus fixture</title>
<style>
  body{margin:20px;font:16px sans-serif}
  button{display:block;margin:14px 0;padding:8px 14px}
  /* always-on decorative shadow, NO focus change */
  #alwayson{box-shadow:rgba(0,0,0,0.3) 0 2px 6px;outline:none}
  #alwayson:focus-visible{outline:none}
  /* real focus-visible ring */
  #realring:focus-visible{outline:3px solid #0a64ff;outline-offset:2px}
  /* suppressed: no ring at all */
  #noring:focus-visible{outline:none}
</style></head><body>
<button id="alwayson">Always-on shadow</button>
<button id="realring">Real focus ring</button>
<button id="noring">Suppressed ring</button>
</body></html>
