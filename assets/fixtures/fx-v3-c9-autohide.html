<!doctype html><html lang="en"><head><meta charset="utf-8"><title>C9 tooltip auto-hides (Persistent fails)</title></head>
<body><button id="h" aria-describedby="pop">Help</button>
<div id="pop" role="tooltip" hidden style="position:absolute;background:#222;color:#fff;padding:6px">Press Tab to continue</div>
<script>var h=document.getElementById('h'),pop=document.getElementById('pop');
h.addEventListener('mouseenter',function(){pop.hidden=false;setTimeout(function(){pop.hidden=true;},1500);});</script></body></html>
