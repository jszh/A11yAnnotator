<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H1e ::first-line backdrop</title>
<style>body{font:16px sans-serif;padding:20px;margin:0;background:#fff}
.p{color:#000;width:240px}.p::first-line{background:#000}</style></head>
<body><p class="p">This first visual line is black text on a black first-line background and is therefore invisible, while later lines wrap onto white.</p></body></html>
