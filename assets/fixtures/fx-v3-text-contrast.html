<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>text-over-image contrast fixture</title></head>
<body style="margin:0">
  <!-- FAIL: white text over a black→WHITE gradient. The glyphs over the light end drop to ~1:1 (white-on-white),
       so the WORST-case pixel fails even though the left end is 21:1. -->
  <div id="grad-fail" style="position:absolute; left:0; top:0; width:520px; height:60px; background:linear-gradient(to right, #000 0%, #fff 100%);">
    <span id="txt-fail" style="color:#fff; font-size:28px; font-weight:bold; line-height:60px;">Gradient sample text here wide</span>
  </div>

  <!-- PASS: white text over a uniformly DARK gradient (#111→#333). Non-flat backdrop, but every glyph stays high. -->
  <div id="grad-pass" style="position:absolute; left:0; top:80px; width:520px; height:60px; background:linear-gradient(to right, #111 0%, #333 100%);">
    <span id="txt-pass" style="color:#fff; font-size:28px; font-weight:bold; line-height:60px;">Dark backdrop sample text here</span>
  </div>
</body>
</html>
