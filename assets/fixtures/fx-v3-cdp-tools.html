<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>cdp tools fixture</title></head>
<body>
  <h2 id="realh">Real heading</h2>
  <p id="fakeh" style="font-size:2em;font-weight:bold;margin:0">Styled like a heading</p>
  <input id="lbl" aria-labelledby="lblsrc missing-id">
  <span id="lblsrc">Email address</span>
  <!-- clicking Apply reveals text INSIDE a role=status live region (the insertion-only 4.1.3 case) -->
  <button id="reveal" type="button" onclick="document.getElementById('status').textContent='Coupon applied'">Apply</button>
  <div id="status" role="status" aria-live="polite"></div>
  <style>#focusbtn:focus { outline: 3px solid #1e90ff; outline-offset: 2px; }</style>
  <button id="focusbtn" type="button">Focusable</button>
  <input id="chk" type="checkbox">
  <span id="graytext" style="color:#767676">gray text</span>
  <a id="destlink" href="fx-v3-cdp-dest.html">More</a>
  <a id="extlink" href="https://example.com/x">External</a>
  <div id="chart" style="width:60px;height:20px;display:flex"><span style="flex:1;background:#d00000"></span><span style="flex:1;background:#0000d0"></span></div>
  <!-- div role=checkbox with NO aria-checked: a 4e8ab6/F68 required-state failure (the AX tree synthesizes checked:false) -->
  <div id="ariacheck" role="checkbox" tabindex="0">Subscribe</div>
  <!-- injects a BRAND-NEW role=status together with its text (4.1.3: a region that did not pre-exist is not reliably announced) -->
  <button id="injectlive" type="button" onclick="var d=document.createElement('div');d.setAttribute('role','status');d.textContent='Saved to your list';document.body.appendChild(d)">Save</button>
  <!-- toggles a pre-existing but display:none node visible (visibilityCause should be 'display', not 'inserted') -->
  <button id="toggle" type="button" onclick="document.getElementById('hiddenrow').style.display='block'">Toggle</button>
  <div id="hiddenrow" style="display:none">Now revealed row</div>
  <!-- native checkbox with a REDUNDANT role=checkbox + no aria-checked: must NOT be flagged (native conveys state) -->
  <input id="chkrole" type="checkbox" role="checkbox">
  <!-- wide-gamut oklch colour: compute_contrast_ratio must resolve it to sRGB, not refuse as unparseable -->
  <span id="oklchtext" style="color:oklch(0.45 0.1 250)">oklch text</span>
  <!-- an absolutely-positioned cover paints ON TOP of a sibling target (occludedElements hit-test, 1.4.13) -->
  <div id="occtarget" style="position:absolute;left:4px;top:400px;width:90px;height:40px;background:#cfc"></div>
  <div id="occcover" style="position:absolute;left:24px;top:410px;width:50px;height:20px;background:#900"></div>
  <!-- translucent border: the rendered pixel may best-match an OPAQUE property, but translucentPart must still fire -->
  <span id="translborder" style="border:6px solid rgba(255,0,0,0.4);padding:3px">tb</span>

  <!-- cellHeaders: NATIVE data table w/ scope headers + a LINK in a data cell (2.4.4 link-in-cell context: the row
       header "Ulysses" + column header "Download" ARE the EPUB link's programmatic enclosing context) -->
  <table id="books">
    <tr><th scope="col">Title</th><th scope="col">Download</th></tr>
    <tr><th scope="row">Ulysses</th><td><a id="lnk-epub" href="/u.epub">EPUB</a></td></tr>
  </table>
  <!-- cellHeaders: explicit headers= IDREFs, one of which DANGLES (the classic 1.3.1 mis-wired association) -->
  <table id="prices">
    <tr><th id="hdr-item">Item</th><th id="hdr-price">Price</th></tr>
    <tr><td>Widget</td><td id="cell-price" headers="hdr-price hdr-GONE">$10</td></tr>
  </table>
  <!-- cellHeaders: a COLSPAN header (the EPUB-in-a-table shape) — a single <th colspan=2> spanning both download
       columns; the column-1 "EPUB" cell must STILL resolve the spanning header "Ulysses" (span-aware grid) -->
  <table id="dl">
    <tr><th colspan="2">Ulysses</th></tr>
    <tr><td><a id="dl-html" href="/u.html">HTML</a></td><td><a id="dl-epub" href="/u.epub">EPUB</a></td></tr>
  </table>
  <!-- cellHeaders: an ARIA GRID (role=grid/row/columnheader/rowheader/gridcell) — the case a native-table-only gate
       wrongly suppressed; the resolver must still surface the column header "Status" for the gridcell -->
  <div id="grid" role="grid">
    <div role="row"><div role="columnheader">Name</div><div role="columnheader">Status</div></div>
    <div role="row"><div role="rowheader">Alpha</div><div id="grid-cell" role="gridcell">Active</div></div>
  </div>
</body>
</html>
