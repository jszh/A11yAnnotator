<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FN deep: unlabeled selects + whitespace name widgets</title></head><body>
<main>
  <!-- unlabeled select, options have NO leading placeholder; name leaks first option -->
  <select id="s1">
    <option>Apple</option>
    <option>Banana</option>
  </select>

  <!-- unlabeled select whose first option is a placeholder with empty value (still leaks 'Choose') -->
  <select id="s2">
    <option value="">Choose a country</option>
    <option value="us">United States</option>
  </select>

  <!-- div role=button whose only content is whitespace text node (not &nbsp;) -->
  <div role="button" tabindex="0">   </div>

  <!-- role=link with aria-label that is only whitespace -->
  <span role="link" tabindex="0" aria-label="   ">go</span>

  <!-- combobox role with no name (ARIA) -->
  <div role="combobox" tabindex="0" aria-expanded="false"></div>
</main>
</body></html>
