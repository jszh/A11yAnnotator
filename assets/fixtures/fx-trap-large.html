<!doctype html><html lang="en"><head><meta charset="utf-8"><title>large trap</title></head><body>
<button id="before">Before</button>
<div id="trap">
<button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
<button>7</button><button>8</button><button>9</button><button>10</button><button>11</button><button>12</button>
</div>
<button id="after">After</button>
<script>
var els=[].slice.call(document.querySelectorAll('#trap button'));
els.forEach(function(el,i){el.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();var d=e.shiftKey?-1:1;els[(i+d+els.length)%els.length].focus();}
});});
</script></body></html>
