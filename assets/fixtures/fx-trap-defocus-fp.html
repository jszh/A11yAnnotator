<!doctype html><html lang="en"><head><meta charset="utf-8"><title>defocus fp</title></head><body>
<button id="a">A</button><button id="b">B</button><button id="c">C</button>
<div id="d1"></div><div id="d2"></div>
<script>
var armed=false;
document.addEventListener('keydown',function(e){ if(e.key==='Tab'&&!armed){ armed=true; document.getElementById('d1').setAttribute('tabindex','-1'); document.getElementById('d2').setAttribute('tabindex','-1'); } });
</script></body></html>
