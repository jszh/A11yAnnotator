<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 focus-visual-retry ROUND-2 adversarial fixtures</title>
<style>
  body { font: 16px sans-serif; padding: 60px; }
  button { display: block; margin: 60px 0; padding: 10px 16px; border: 1px solid #888; background: #eee; position: relative; }

  /* #anim: a looping background animation and NO :focus rule. Two non-simultaneous shots differ
     with no focus involvement → the runner must NOT attribute it to focus (R2-F1). Expect: neither
     clear nor barrier (INCONCLUSIVE → PARTIAL); stableUnfocused must be false. */
  @keyframes pulse { 0% { background: #ccc; } 50% { background: #444; } 100% { background: #ccc; } }
  #anim { animation: pulse 0.6s infinite; }

  /* #move: the element MOVES on focus and has no ring. The stale clip would capture the moved
     button against empty background → spurious pixel diff (R2-F2). Expect: movedOnFocus true →
     INCONCLUSIVE, no clear. */
  #move:focus { left: 120px; outline: none; }

  /* #pseudoffset: a REAL, obviously-visible focus ring drawn by ::after with a large negative inset
     (renders well outside the element box). Old code: invisible to both channels → FALSE BARRIER
     (R2-F3). New code: pseudo-aware read + dynamic clip → a correct CLEAR. */
  #pseudoffset:focus::after { content: ''; position: absolute; inset: -40px; border: 5px solid #d00; pointer-events: none; }

  /* #offset12: a genuine 5px focus outline at outline-offset:12px (just beyond the old CLIP_PAD=10).
     Old code: ring outside the clip → FALSE PARTIAL (R2-F4). New code: dynamic clip → CLEAR. */
  #offset12:focus { outline: 5px solid #06c; outline-offset: 12px; }
</style>
</head>
<body>
  <button id="anim" type="button">Animated background, no focus rule</button>
  <button id="move" type="button">Moves on focus, no ring</button>
  <button id="pseudoffset" type="button">::after ring, large inset</button>
  <button id="offset12" type="button">Outline at offset 12</button>
</body>
</html>
