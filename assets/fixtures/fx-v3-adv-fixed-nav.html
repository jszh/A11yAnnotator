<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>position:fixed nav many links, scrolled</title>
<style>
  body { margin:0; font-family:sans-serif; }
  nav.fixed { position:fixed; top:0; left:0; right:0; background:#222; color:#fff;
    padding:10px; display:flex; gap:10px; z-index:10; }
  nav.fixed a { color:#fff; padding:4px; }
  main { padding:60px 16px 16px; }
  main a, main button { display:block; margin:10px 0; padding:6px; }
  .tall { height:1500px; }
</style>
</head>
<body>
  <nav class="fixed">
    <a href="#1">Brand</a>
    <a href="#2">Home</a>
    <a href="#3">Docs</a>
    <a href="#4">API</a>
    <a href="#5">Pricing</a>
    <a href="#6">Blog</a>
    <a href="#7">Login</a>
  </nav>
  <main>
    <button>Content A</button>
    <button>Content B</button>
    <button>Content C</button>
    <div class="tall"></div>
    <button>Content D bottom</button>
  </main>
  <script>
    window.addEventListener('load', () => { window.scrollTo(0, 900); });
  </script>
</body>
</html>
