<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R2-C2 keyboard-activation recipe</title></head>
<body>
  <div><input id="text" type="text" aria-label="Name"></div>
  <div><div role="tablist"><button role="tab" id="tab" tabindex="0" aria-selected="true">A</button></div></div>
  <script>document.querySelector('[role=tablist]').addEventListener('keydown',function(e){if(e.key==='ArrowRight')document.getElementById('tab').setAttribute('aria-selected','true');});</script>
</body></html>
