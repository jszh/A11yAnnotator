<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H1 non-uniform solid backdrop</title></head>
<body style="margin:0;font:16px sans-serif">
  <!-- white text spans TWO solid sibling backdrops: black on the left, white on the right. A single
       centre sample lands on black and false-clears; the run is unreadable over the white half. -->
  <div style="position:absolute;top:40px;left:0;width:200px;height:30px;background:#000"></div>
  <div style="position:absolute;top:40px;left:200px;width:220px;height:30px;background:#fff"></div>
  <p id="t" style="position:absolute;top:44px;left:8px;width:400px;margin:0;color:#fff;white-space:nowrap">white text over black then white — illegible on the right</p>
</body></html>
