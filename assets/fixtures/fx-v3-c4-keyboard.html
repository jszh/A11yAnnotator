<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C4 keyboard-activation fixtures</title></head>
<body>
  <div><button id="honest" aria-pressed="false">Mute</button></div>
  <div><div id="divbtn" role="button" tabindex="0">Delete</div></div>
  <div><button id="syn" aria-pressed="false">Save</button></div>
  <script>
    var honest = document.getElementById('honest');
    honest.addEventListener('click', function () { honest.setAttribute('aria-pressed', honest.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
    document.getElementById('divbtn').addEventListener('click', function () {/* click only; no keydown ⇒ Enter/Space do nothing */});
    var syn = document.getElementById('syn');
    syn.addEventListener('keydown', function (e) { if (!e.isTrusted) syn.setAttribute('aria-pressed', 'true'); }); // synthetic-only
  </script>
</body></html>
