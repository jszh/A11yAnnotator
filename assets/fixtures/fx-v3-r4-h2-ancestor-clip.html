<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R4-H2 ancestor-clipped overlay</title></head>
<body style="margin:0">
  <!-- the opaque overlay is 100px wide but its ancestor clips it to the left 60px (overflow:hidden),
       leaving the right 40px of the button visible. The unclipped border box over-claims coverage. -->
  <button id="b" style="position:absolute;left:20px;top:20px;width:100px;height:100px">Action</button>
  <div style="position:absolute;left:20px;top:20px;width:60px;height:100px;overflow:hidden">
    <div style="width:100px;height:100px;background:#111;position:relative;z-index:5">clipped overlay</div>
  </div>
</body></html>
