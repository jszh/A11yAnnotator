<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H2 visible 1px strip</title></head>
<body style="margin:0">
  <!-- two opaque overlays cover the 100x100 button but leave a 1px vertical strip (x in 79..80)
       between them. A finite sample grid can step over the strip and call it entirely obscured;
       exact rectangle-union coverage leaves a remainder ⇒ NOT entirely obscured. -->
  <button id="b" style="position:absolute;top:20px;left:20px;width:100px;height:100px">Action</button>
  <div style="position:absolute;top:20px;left:20px;width:59px;height:100px;background:#111;z-index:5"></div>
  <div style="position:absolute;top:20px;left:80px;width:40px;height:100px;background:#111;z-index:5"></div>
</body></html>
