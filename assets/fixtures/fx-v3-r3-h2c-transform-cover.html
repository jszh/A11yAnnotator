<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H2c identity-transform full cover</title></head>
<body><button id="b" style="position:absolute;left:40px;top:40px;width:200px;height:60px">Action</button>
<!-- a genuinely-covering opaque overlay carrying an identity/translateZ transform (common GPU hack):
     it fully hides the control and MUST still be a barrier. -->
<div style="position:fixed;left:40px;top:40px;width:200px;height:60px;background:#111;transform:translateZ(0);z-index:9999">fully covers</div></body></html>
