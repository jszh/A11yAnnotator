<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 focus-visual-retry ADVERSARIAL fixture</title>
<style>
  body { font: 16px sans-serif; padding: 40px; }
  button { display: block; margin: 24px 0; padding: 10px 16px; border: 4px solid transparent; background: #eee; }
  /* #transparent: a focus "indicator" that is fully TRANSPARENT → no perceivable pixels.
     The old computed-style rule called any non-none box-shadow "obviously visible" → FALSE CLEAR.
     The pixel/alpha-aware rule must NOT clear this. */
  #transparent:focus { outline: none; box-shadow: 0 0 0 2px transparent; }
  /* #redborder: a focus-DEPENDENT, obviously-visible RED border that appears on focus (no layout
     shift — width is constant, only the colour changes). The old rule ignored borders and called
     this a "stable absence" → FALSE BARRIER. The pixel rule sees the change → it is a real clear. */
  #redborder:focus { outline: none; border: 4px solid red; }
</style>
</head>
<body>
  <button id="transparent" type="button">Transparent focus shadow (must NOT clear)</button>
  <button id="redborder" type="button">Red focus border (real indicator)</button>
</body>
</html>
