<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R4b-H2 clip:rect on overlay</title></head>
<body style="margin:0">
  <button id="b" style="position:absolute;left:20px;top:20px;width:100px;height:100px">Action</button>
  <!-- the overlay clips ITS OWN paint to the left 60px via deprecated clip:rect. -->
  <div style="position:absolute;left:20px;top:20px;width:100px;height:100px;background:#111;z-index:5;clip:rect(0,60px,100px,0)">overlay</div>
</body></html>
