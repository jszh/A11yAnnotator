<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H1b pseudo-element half backdrop</title>
<style>
  body{font:16px sans-serif;padding:20px;margin:0}
  .wrap{background:#fff;display:inline-block;padding:8px}
  .t{position:relative;isolation:isolate;color:#000;display:inline-block}
  .t::before{content:"";position:absolute;top:0;bottom:0;left:50%;right:-2px;background:#000;z-index:-1}
</style></head><body>
  <!-- a ::before paints solid black behind the RIGHT half of the text: the right half is black-on-black
       and invisible, but the pseudo is unseen by elementsFromPoint AND querySelectorAll. -->
  <div class="wrap"><span class="t">RIGHT HALF OF THIS TEXT IS INVISIBLE</span></div>
</body></html>
