<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>vision-capture fixture</title></head>
<body style="margin:0">
  <!-- a tall spacer pushes the button BELOW THE FOLD at an 800x600 viewport (corpus probe: real pages
       have most sampled elements off-screen, so captureVision must scrollIntoView before cropping). -->
  <div style="height:1500px;background:#eee">spacer</div>
  <button id="belowfold" style="width:140px;height:44px;background:#06c;color:#fff">Below the fold</button>
  <!-- a DEGENERATE 4x4 box must be skipped (it yields a near-blank crop that misleads the agent). -->
  <span id="tiny" style="display:inline-block;width:4px;height:4px;background:#000"></span>
  <!-- an informative image with empty alt — a 1.1.1 barrier the LLM lane judges (orchestrator e2e). -->
  <img id="hero" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADwAAAA8CAYAAAA6/NlyAAAAGElEQVR42mP8z8BQz0AEYBxVSF+FowoB6cQHQR3i3JcAAAAASUVORK5CYII=" width="60" height="60">
</body></html>
