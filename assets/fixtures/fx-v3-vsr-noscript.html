<!doctype html><html lang="en"><head><meta charset="utf-8"><title>vsr noscript fixture</title></head><body>
<!-- v3 VSR-collection fixture: with scripting enabled the parser stores the <noscript> children as ONE
     raw TEXT node holding literal markup. Chrome's AX tree ignores it; the VSR prunes by computed style
     and would otherwise "speak" the markup. The collector must SKIP it (server.js artifact fix ported). -->
<h1>Shop</h1>
<noscript><img src="x.png" alt="enable JS"><style>.x{color:red}</style></noscript>
<a href="#">Cart</a>
</body></html>
