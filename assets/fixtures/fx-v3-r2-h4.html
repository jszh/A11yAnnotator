<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R2-H4 advised exit</title></head>
<body><div id="d" role="dialog" aria-modal="true"><p>Press Z to leave this dialog.</p>
<input id="b" aria-label="field one"><input aria-label="field two"></div><button id="out">outside</button>
<script>var fs=[document.getElementById('b'),document.querySelectorAll('#d input')[1]];
document.getElementById('d').addEventListener('keydown',function(e){ if(e.key==='Tab'){e.preventDefault();var i=fs.indexOf(document.activeElement);fs[(i+1)%2].focus();}
 else if(e.key==='z'||e.key==='Z'){document.getElementById('out').focus();} });</script></body></html>
