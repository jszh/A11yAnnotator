<!doctype html><html lang="en"><head><meta charset="utf-8"><title>consent</title></head><body>
<main><p>Page body.</p></main>
<!-- R22-M1: one container matching MULTIPLE selectors (id has "cookie-banner" AND
     "cookie-consent"); a named visible button; an UNNAMED visible button; and a
     HIDDEN input that must NOT inflate the unlabelled-control count. -->
<div id="cookie-banner-consent" role="dialog" aria-label="Cookie consent">
  <h2>We value your privacy</h2>
  <button id="accept">Accept all</button>
  <button id="settings" aria-label=""></button>
  <input type="checkbox" id="hidden-toggle" style="display:none">
</div>
</body></html>
