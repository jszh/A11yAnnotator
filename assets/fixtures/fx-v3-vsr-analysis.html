<!doctype html><html lang="en"><head><meta charset="utf-8"><title>vsr analysis fixture</title>
<!-- v3 VSR-analysis fixture. Exercises (1.3.2) reading order vs visual order and (4.1.2) announcement
     vs meaning. #misplaced is read LAST in DOM but positioned visually at the TOP (a meaningful-sequence
     divergence). The icon button has NO accessible name (aria-hidden svg, no text). The plain button and
     the section links are clean controls (no findings). -->
<style>
body{margin:0}
main{margin-top:60px}
.row{display:block;padding:8px;border:1px solid #ccc}
#misplaced{position:absolute;top:0;left:0;right:0;background:#fdd}
button{display:block;margin:8px}
button:focus{outline:2px solid #00f}
</style></head><body>
<main>
<a href="#1" class="row">Section one</a>
<a href="#2" class="row">Section two</a>
<a href="#3" class="row">Section three</a>
<a href="#4" class="row">Section four</a>
<a href="#5" class="row">Section five</a>
<a href="#6" class="row">Section six</a>
<button type="button">Submit</button>
<button type="button"><svg width="16" height="16" aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#333"></circle></svg></button>
<a href="#top" id="misplaced" class="row">Back to top</a>
</main>
</body></html>
