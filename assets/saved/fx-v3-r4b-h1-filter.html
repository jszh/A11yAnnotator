<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R4b-H1 filter:invert ink override</title></head>
<body style="margin:0;font:16px sans-serif">
  <!-- color:#000 (CSS) but filter:invert renders the ink WHITE on white: illegible. -->
  <p id="t" style="color:#000;filter:invert(1);background:#000;margin:0;padding:6px">inverted ink renders white on (inverted) white</p>
</body></html>
