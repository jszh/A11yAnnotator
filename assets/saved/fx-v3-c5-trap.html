<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C5 true keyboard trap (no escape)</title></head>
<body>
  <div id="trap" role="dialog" aria-modal="true" aria-label="Trapped">
    <input id="i1" aria-label="one">
    <input id="i2" aria-label="two">
  </div>
  <script>
    var trap = document.getElementById('trap'), fs = [i1, i2];
    trap.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') { var i = fs.indexOf(document.activeElement); e.preventDefault(); fs[e.shiftKey ? (i - 1 + 2) % 2 : (i + 1) % 2].focus(); }
      // NO Escape handler — focus cannot leave the region by any keyboard mechanism
    });
  </script>
</body></html>
