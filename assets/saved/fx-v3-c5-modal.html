<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C5 proper modal (Esc closes ⇒ NO trap)</title></head>
<body>
  <button id="opener">Open</button>
  <dialog id="dlg" open aria-label="Settings">
    <button id="b1">First</button>
    <button id="b2">Second</button>
    <button id="b3">Close</button>
  </dialog>
  <script>
    var dlg = document.getElementById('dlg'), opener = document.getElementById('opener');
    var fs = [b1, b2, b3];
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') { var i = fs.indexOf(document.activeElement); e.preventDefault(); fs[e.shiftKey ? (i - 1 + 3) % 3 : (i + 1) % 3].focus(); }
      else if (e.key === 'Escape') { dlg.close(); opener.focus(); }
    });
  </script>
</body></html>
