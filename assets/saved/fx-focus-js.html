<!doctype html><html lang="en"><head><meta charset="utf-8"><title>js focus</title>
<style>button{display:block;width:200px;height:40px;outline:none}</style></head><body>
<button id="jsfocus">JS-driven focus ring</button>
<script>
var b=document.getElementById('jsfocus');
b.addEventListener('focus',function(){b.style.outline='3px solid #0a0';b.style.outlineOffset='2px';});
b.addEventListener('blur',function(){b.style.outline='none';});
</script></body></html>
