<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Untagged div trap</title></head>
<body>
<button id="before">Before</button>
<div id="overlay" class="modal">
  <button id="a">Continue</button>
  <button id="b">Cancel</button>
</div>
<button id="after">After</button>
<script>
// A REAL keyboard trap inside a plain DIV with NO role/aria-modal/dialog.
// Both Tab and Shift+Tab are wrapped within the overlay. No Esc escape. No close that works.
// This is a genuine 2.1.2 violation but the region selector won't tag it.
const ov = document.getElementById('overlay');
const f = [...ov.querySelectorAll('button')];
ov.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey) {
    if (document.activeElement === first) { e.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
// Start focus inside the overlay so the page actually traps a real user.
window.addEventListener('load', () => f[0].focus());
</script>
</body>
</html>
