<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R4-H1 uniform SVG backdrop (CSS resolves a different colour)</title></head>
<body style="background:#000;margin:0;font:16px sans-serif">
  <!-- a UNIFORM white SVG rect sits behind the entire white text. The pixel channel sees a uniform
       white backdrop, but the CSS paint stack (SVG has no CSS background) resolves the BLACK body and
       computes 21:1 — white-on-white is illegible. The colours must AGREE or the verdict is PARTIAL. -->
  <svg style="position:absolute;left:8px;top:40px;z-index:-1" width="520" height="24"><rect x="0" y="0" width="520" height="24" fill="#fff"></rect></svg>
  <p id="t" style="position:absolute;left:10px;top:42px;margin:0;color:#fff">white text over a uniform white SVG painted behind it — illegible</p>
</body></html>
