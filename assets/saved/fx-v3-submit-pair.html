<!doctype html><html lang="en"><head><meta charset="utf-8"><title>form-submit state pair (3.3.1/3.3.3 driver)</title>
<style>
  body{margin:0;font-family:sans-serif;background:#fff}
  form{padding:24px}
  /* the error is display:none initially, so the form GROWS when it surfaces on submit — exercises the
     union-clip (the after-frame must contain the message the before-form-rect did not reserve space for). */
  .err{color:#b00020;font-weight:bold;display:none;margin-top:8px}
  label{display:block;margin-bottom:4px}
</style></head>
<body>
  <form id="f1" novalidate>
    <label for="e1">Email</label>
    <input type="email" id="e1" required>
    <div class="err" id="err1">Email is required — enter an address like name@example.com.</div>
    <button type="submit" id="s1">Submit</button>
  </form>
  <form id="f2" novalidate>
    <label for="e2">Name</label>
    <input type="text" id="e2" required>
    <div class="err" id="err2">Name is required.</div>
    <button type="submit" id="s2">Send</button>
  </form>
  <script>
    [['f1', 'e1', 'err1'], ['f2', 'e2', 'err2']].forEach(function (t) {
      document.getElementById(t[0]).addEventListener('submit', function (e) {
        e.preventDefault();
        if (!document.getElementById(t[1]).value.trim()) document.getElementById(t[2]).style.display = 'block';
      });
    });
  </script>
</body></html>
