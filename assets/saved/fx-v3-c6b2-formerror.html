<!doctype html><html lang="en"><head><meta charset="utf-8"><title>C6b2 3.3.1 error-identification surfaces (gap-fill red-team)</title>
<style>
  body{font-family:sans-serif}
  .err{color:#b00020;font-weight:bold}
  .summary{color:#b00020;border:1px solid #b00020;padding:6px;margin-bottom:8px}
  .toast{position:fixed;bottom:10px;left:10px;background:#b00020;color:#fff;padding:8px;border-radius:6px;font-weight:bold}
  form{margin:6px 0}
</style></head>
<body>
  <!-- A PRE-EXISTING, unrelated live region (e.g. a cart status). Present before any submit and never
       changed by it: the before/after diff must IGNORE it, so it neither masks a real barrier (q6/q7)
       nor is mistaken for a field error on the other rows (gap-fill red-team fc1). -->
  <div aria-live="polite">3 items in your cart</div>

  <!-- q1 NOT a barrier (fb1): a sibling .error div is SHOWN on submit, not aria-referenced, no aria-invalid. -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q1');if(!f.value){document.getElementById('q1msg').style.display='block';}return false;">
    <label>Q1 <input id="q1" required></label>
    <div id="q1msg" class="err" style="display:none">Q1 is required.</div>
    <button type="submit">Go</button>
  </form>

  <!-- q2 NOT a barrier (fb6): an aria-describedby node is POPULATED on submit, but aria-invalid is OMITTED. -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q2');if(!f.value){document.getElementById('q2msg').textContent='Q2 is required.';}return false;">
    <label>Q2 <input id="q2" required aria-describedby="q2msg"></label>
    <span id="q2msg" class="err"></span>
    <button type="submit">Go</button>
  </form>

  <!-- q3 NOT a barrier (fb5): a visible RED message is populated, aria-invalid set, but NOT referenced. -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q3');if(!f.value){f.setAttribute('aria-invalid','true');document.getElementById('q3msg').textContent='Q3 is required.';}return false;">
    <label>Q3 <input id="q3" required></label>
    <span id="q3msg" style="color:#d50000;font-weight:600"></span>
    <button type="submit">Go</button>
  </form>

  <!-- q4 NOT a barrier (fb3): a GOV.UK-style error summary is shown, linking to the field (not referenced). -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q4');if(!f.value){document.getElementById('q4sum').style.display='block';}return false;">
    <div id="q4sum" class="summary" style="display:none"><strong>There is a problem</strong><ul><li><a href="#q4">Enter Q4</a></li></ul></div>
    <label>Q4 <input id="q4" required></label>
    <button type="submit">Go</button>
  </form>

  <!-- q5 NOT a barrier (fb2): a toast/snackbar (no role, no aria-live) is appended on submit. -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q5');if(!f.value){var t=document.createElement('div');t.className='toast';t.textContent='Error: Q5 is required.';document.body.appendChild(t);}return false;">
    <label>Q5 <input id="q5" required></label>
    <button type="submit">Go</button>
  </form>

  <!-- q6 BARRIER (fb4): only a red outline + a title tooltip — NO visible text identifies the error.
       A hover-only title is not perceivable in this state; 3.3.1 wants the error described in TEXT. -->
  <form novalidate action="javascript:void(0)"
    onsubmit="var f=document.getElementById('q6');if(!f.value){f.setAttribute('aria-invalid','true');f.title='Q6 is required.';f.style.outline='2px solid #b00020';}return false;">
    <label>Q6 <input id="q6" required></label>
    <button type="submit">Go</button>
  </form>

  <!-- q7 BARRIER (mc1/fc1): required field, preventDefault, NOTHING shown. The unrelated cart status
       above must NOT clear it. -->
  <form novalidate action="javascript:void(0)" onsubmit="return false;">
    <label>Q7 <input id="q7" required></label>
    <button type="submit">Go</button>
  </form>
</body></html>
