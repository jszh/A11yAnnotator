<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>4.1.3 status messages</title></head>
<body>
<main>
  <!-- BARRIER: activating reveals an error message in a PLAIN div — no live region, focus not moved.
       A screen-reader user is never notified (WCAG 4.1.3 Status Messages failure). -->
  <section>
    <button type="button" id="badbtn"
      onclick="document.getElementById('baderr').textContent='Error: email address is required'">Validate (unannounced)</button>
    <div id="baderr"></div>
  </section>

  <!-- CLEAN: activating reveals a status inside an aria-live polite region → announced, no barrier. -->
  <section>
    <button type="button" id="goodbtn"
      onclick="document.getElementById('goodstatus').textContent='Saved successfully'">Save (announced)</button>
    <div id="goodstatus" role="status" aria-live="polite"></div>
  </section>

  <!-- CLEAN: activating reveals new content AND moves focus to it → perceivable without a live region. -->
  <section>
    <button type="button" id="focusbtn"
      onclick="var d=document.getElementById('focusmsg');d.textContent='Step 2 of 3';d.setAttribute('tabindex','-1');d.focus()">Next (focus-moved)</button>
    <div id="focusmsg"></div>
  </section>

  <!-- NO-OP: activating changes nothing → not a status message at all (must not be flagged). -->
  <section>
    <button type="button" id="noopbtn" onclick="void 0">Inert</button>
  </section>
</main>
</body></html>
