<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R3-H3 cross-stacking-context overlay</title></head>
<body style="margin:0">
  <!-- the overlay child has z-index:999 but lives inside a parent stacking context at z-index:0, so
       it paints BELOW the target (z-index:10) despite geometrically covering it. Numeric z-index
       compared across stacking contexts is not a valid paint order; true paint order (elementsFromPoint)
       shows the button on top ⇒ NOT obscured. -->
  <button id="b" style="position:fixed;top:40px;left:40px;width:120px;height:40px;z-index:10">Action</button>
  <div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none">
    <div style="position:absolute;top:40px;left:40px;width:120px;height:40px;background:#111;z-index:999"></div>
  </div>
</body></html>
