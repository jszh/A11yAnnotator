<!doctype html><html lang="en"><head><meta charset="utf-8"><title>trap4</title></head><body>
<button id="before">Before</button>
<button id="a">A</button><button id="b">B</button><button id="c">C</button><button id="d">D</button>
<button id="after">After</button>
<script>
var els=['a','b','c','d'].map(function(id){return document.getElementById(id);});
els.forEach(function(el,i){el.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();var dir=e.shiftKey?-1:1;els[(i+dir+els.length)%els.length].focus();}
});});
</script></body></html>
