<!doctype html><html lang="en"><head><meta charset="utf-8"><title>advised trap</title></head><body>
<div role="dialog" aria-label="Help">
  <p>Press F6 to close this dialog and return to the page.</p>
  <button id="a">Option A</button><button id="b">Option B</button>
</div>
<script>
var a=document.getElementById('a'),b=document.getElementById('b');
// Tab is trapped between A and B; only F6 (advised) releases focus to body.
[a,b].forEach(function(el){el.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();(document.activeElement===a?b:a).focus();}
  if(e.key==='F6'){document.body.setAttribute('tabindex','-1');document.body.focus();}
});});
</script></body></html>
