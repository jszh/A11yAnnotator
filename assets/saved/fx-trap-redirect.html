<!doctype html><html lang="en"><head><meta charset="utf-8"><title>redirect trap</title></head><body>
<div id="box"><button id="a">A</button><button id="b">B</button></div>
<button id="outside">Outside</button>
<script>
var box=document.getElementById('box');
box.addEventListener('focusout',function(e){
  // if focus is leaving the box, yank it back to the first member (no preventDefault on Tab)
  setTimeout(function(){ if(!box.contains(document.activeElement)) document.getElementById('a').focus(); },0);
});
</script></body></html>
