<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>hover adversarial: corner trap + far tooltip</title>
<style>
  body { margin:0; height:1400px; font-family:sans-serif; background:#fff; }
  /* a FIXED top-left element with a hover reveal — the (0,0)-park contamination trap. */
  #corner { position:fixed; top:0; left:0; width:140px; height:44px; background:#0a0; color:#fff; line-height:44px; text-align:center; z-index:9; }
  #corner:hover #cornermenu { display:block; }
  #cornermenu { display:none; position:fixed; top:44px; left:0; width:360px; height:260px; background:#8f8; }
  /* a trigger near the top-left: its before-frame clip overlaps the corner overlay region. */
  #nearbtn { position:absolute; top:70px; left:24px; }
  #neartip { display:none; position:absolute; top:104px; left:24px; background:#226; color:#fff; padding:6px; }
  #nearbtn:hover ~ #neartip { display:block; }
  /* a trigger whose tooltip renders FAR away (fixed, bottom-right) — outside any small fixed pad. */
  #farbtn { position:absolute; top:340px; left:300px; }
  #fartip { display:none; position:fixed; right:10px; bottom:10px; background:#222; color:#fff; padding:10px; }
  #farbtn:hover ~ #fartip { display:block; }
</style></head>
<body>
  <div id="corner">Corner<div id="cornermenu" role="menu">corner overlay menu</div></div>
  <button id="nearbtn" aria-describedby="neartip">Near</button>
  <div id="neartip" role="tooltip">near tip</div>
  <button id="farbtn" aria-describedby="fartip">Far</button>
  <div id="fartip" role="tooltip">far tip (bottom-right)</div>
</body></html>
