<!doctype html><html lang="en"><head><meta charset="utf-8"><title>freeze</title></head><body>
<button id="a">A</button><button id="b">B</button>
<script>
/* preventDefault ALL Tab globally (capture, first) → focus is frozen on body, never reaches a control */
document.addEventListener('keydown',function(e){ if(e.key==='Tab') e.preventDefault(); },true);
</script></body></html>
