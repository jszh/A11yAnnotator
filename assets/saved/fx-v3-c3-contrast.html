<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C3 contrast fixtures</title>
<style>
  body { font: 16px sans-serif; padding: 20px; }
  div { margin: 14px 0; }
  .grad { background: linear-gradient(90deg, #000, #fff); color: #3b3b3b; padding: 10px; }
  .large { font-size: 19px; font-weight: 700; color: #767676; background: #fff; }
  @keyframes pulse { 0% { color: #777; } 50% { color: #ddd; } 100% { color: #777; } }
  .anim { background: #fff; animation: pulse 1s infinite; }
</style></head>
<body>
  <div><span style="color:#000;background:#fff">CLEAR: black on white</span></div>
  <div><span style="color:#aaaaaa;background:#ffffff">BARRIER: grey on white (~2.3:1)</span></div>
  <div><span style="color:rgba(0,0,0,.35);background:#ffffff">BARRIER: rgba composited (~2.3:1)</span></div>
  <div><span class="grad">INCONCLUSIVE: text over a gradient</span></div>
  <div><span class="large">CLEAR: $49 large bold (#767676 = 4.54:1, large⇒3:1)</span></div>
  <div><span class="anim">INCONCLUSIVE: colour-cycling animation</span></div>
</body></html>
