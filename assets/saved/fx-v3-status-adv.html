<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>4.1.3 status — adversarial false-positive guards</title></head>
<body>
<main>
  <!-- FP guard 1: trigger inside aria-hidden — no AT user can reach it, so its message is not a barrier -->
  <div aria-hidden="true">
    <button type="button" id="h1"
      onclick="document.getElementById('m1').textContent='message behind aria-hidden'">In aria-hidden</button>
  </div>
  <div id="m1"></div>

  <!-- FP guard 2: visibility:hidden trigger — non-operable to every user (offsetParent stays non-null) -->
  <button type="button" id="h2" style="visibility:hidden"
    onclick="document.getElementById('m2').textContent='message from an invisible button'">Invisible</button>
  <div id="m2"></div>

  <!-- FP guard 3: re-parenting ALREADY-VISIBLE content is not a NEW status message -->
  <span id="pre">already-visible pre-existing content node</span>
  <button type="button" id="h3"
    onclick="document.getElementById('dest').appendChild(document.getElementById('pre'))">Move existing</button>
  <div id="dest"></div>

  <!-- FP guard 4: an inline scripted-navigation trigger must be SKIPPED, not driven (would end the page) -->
  <button type="button" id="h4" onclick="window.location.hash='#gone'">Navigate</button>

  <!-- the ONE true barrier: a genuine un-announced status message -->
  <button type="button" id="real"
    onclick="document.getElementById('realmsg').textContent='Error: phone number is invalid'">Validate</button>
  <div id="realmsg"></div>
</main>
</body></html>
