<!doctype html><html lang="en"><head><meta charset="utf-8"><title>modal-escape</title></head><body>
<button id="open">Open</button>
<div id="modal" role="dialog"><button id="m1">OK</button><button id="m2">Cancel</button></div>
<button id="other">Other</button>
<script>
var modal=document.getElementById('modal'),m1=document.getElementById('m1'),m2=document.getElementById('m2'),open=document.getElementById('open');
m1.focus(); // modal is open
[m1,m2].forEach(function(el){el.addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();(document.activeElement===m1?m2:m1).focus();}
  if(e.key==='Escape'){modal.remove();open.focus();}  // STANDARD EXIT — not a trap
});});
</script></body></html>
