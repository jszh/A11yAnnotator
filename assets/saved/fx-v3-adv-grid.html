<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card grid</title>
<style>
  body { margin:0; font:16px/1.4 sans-serif; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
  .card { border:1px solid #ccc; padding:12px; }
  .card h3 { margin:0 0 8px; }
</style></head>
<body>
  <div class="grid">
    <article class="card"><h3>Card 1</h3><p>Body of card one here.</p><a href="#1">Open 1</a></article>
    <article class="card"><h3>Card 2</h3><p>Body of card two here.</p><a href="#2">Open 2</a></article>
    <article class="card"><h3>Card 3</h3><p>Body of card three here.</p><a href="#3">Open 3</a></article>
    <article class="card"><h3>Card 4</h3><p>Body of card four here.</p><a href="#4">Open 4</a></article>
    <article class="card"><h3>Card 5</h3><p>Body of card five here.</p><a href="#5">Open 5</a></article>
    <article class="card"><h3>Card 6</h3><p>Body of card six here.</p><a href="#6">Open 6</a></article>
  </div>
</body>
</html>
