<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>native dialog fixture</title></head>
<body>
  <h1>Settings</h1>
  <!-- a SAFE (non-submit) trigger that surfaces its message via a native alert() — status-detector clicks
       it, the dialog would otherwise be auto-dismissed and invisible. #21 must capture it. -->
  <button type="button" id="save" onclick="alert('Your changes were saved')">Save</button>
  <p>Adjust your preferences above.</p>
</body>
</html>
