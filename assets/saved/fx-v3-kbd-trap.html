<!doctype html><html lang="en"><head><meta charset="utf-8"><title>kbd trap fixture</title></head><body>
<!-- v3 keyboard-trap fixture (WCAG 2.1.2). #trap is a real JS focus trap: its keydown handler cycles
     Tab/Shift+Tab within the dialog and never lets focus leave, with NO Escape handler — a confirmed
     keyboard trap. #ok is a well-behaved dialog with no trap handler: Tab flows out naturally, so it is
     NOT a trap. The detector must confirm #trap and clear #ok. -->
<button id="before">Before</button>

<div role="dialog" aria-modal="true" id="trap" aria-label="Trapping dialog">
  <button>Trap A</button>
  <button>Trap B</button>
  <button>Trap C</button>
</div>

<div role="dialog" aria-modal="true" id="ok" aria-label="Well behaved dialog">
  <button>OK A</button>
  <button>OK B</button>
</div>

<button id="after">After</button>

<script>
(function () {
  var trap = document.getElementById('trap');
  var fs = trap.querySelectorAll('button');
  trap.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;            // no Escape handling ⇒ no keyboard way out
    var arr = Array.prototype.slice.call(fs);
    var i = arr.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    var ni = e.shiftKey ? (i - 1 + arr.length) % arr.length : (i + 1) % arr.length;
    arr[ni].focus();
  });
  // #ok has no trap handler: Tab naturally moves focus past the dialog (not a trap).
})();
</script>
</body></html>
