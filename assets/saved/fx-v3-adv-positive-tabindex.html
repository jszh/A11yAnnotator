<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Positive tabindex full inversion</title>
<style>
  body { margin:0; font-family:sans-serif; padding:16px; }
  .row { display:flex; gap:12px; margin:10px 0; }
  button { padding:8px; }
</style>
</head>
<body>
  <h1>Form with reversed tab order</h1>
  <!-- Visual top-to-bottom: A,B,C,D,E,F. Tab order forced reverse via positive tabindex:
       F(1) E(2) D(3) C(4) B(5) A(6). Tabbing walks bottom-to-top. Clear 2.4.3 violation. -->
  <div class="row"><button tabindex="6">A top</button></div>
  <div class="row"><button tabindex="5">B</button></div>
  <div class="row"><button tabindex="4">C</button></div>
  <div class="row"><button tabindex="3">D</button></div>
  <div class="row"><button tabindex="2">E</button></div>
  <div class="row"><button tabindex="1">F bottom</button></div>
</body>
</html>
