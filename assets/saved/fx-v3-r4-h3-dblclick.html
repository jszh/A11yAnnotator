<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R4-H3 native button with a mouse-only secondary function</title></head>
<body>
  <!-- onclick is keyboard-operable AND observable (the label changes); ondblclick is a SECOND,
       mouse-only function. SC 2.1.1 covers ALL functionality, so this must NOT clear. -->
  <button id="b" onclick="this.textContent='Saved '+(this.dataset.n=(+this.dataset.n||0)+1)" ondblclick="window.__d=1">Save</button>
</body></html>
