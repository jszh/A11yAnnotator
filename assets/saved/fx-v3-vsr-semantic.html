<!doctype html><html lang="en"><head><meta charset="utf-8"><title>vsr semantic fixture</title></head><body>
<!-- v3 VSR-collection fixture: a small, fully-semantic page whose reading-order transcript is easy to
     assert. The button carries an ARIA state (not expanded) and the input a value (Boston) so the parse
     of role/name/states/value is exercised. -->
<h1>Weather</h1>
<nav aria-label="Main"><a href="#a">Home</a><a href="#b">Forecast</a></nav>
<button type="button" aria-expanded="false">Menu</button>
<label>City <input type="text" value="Boston"></label>
<p>Sunny today.</p>
</body></html>
