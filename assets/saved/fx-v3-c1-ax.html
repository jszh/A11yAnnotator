<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C1 ax-state-diff fixtures</title></head>
<body>
  <div><button id="disc" aria-expanded="false" aria-controls="p1">Details</button><div id="p1" hidden>panel body</div></div>
  <div><div id="noname" role="button" tabindex="0" aria-expanded="false"></div></div>
  <script>
    var disc = document.getElementById('disc'), p1 = document.getElementById('p1');
    disc.addEventListener('click', function () { var x = disc.getAttribute('aria-expanded') !== 'true'; disc.setAttribute('aria-expanded', x); p1.hidden = !x; });
    var noname = document.getElementById('noname');
    noname.addEventListener('click', function () { noname.setAttribute('aria-expanded', noname.getAttribute('aria-expanded') !== 'true'); }); // toggles state but has NO accessible name
  </script>
</body></html>
