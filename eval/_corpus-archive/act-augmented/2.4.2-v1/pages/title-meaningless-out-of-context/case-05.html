<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    SC 2.4.2 Page Titled — aspect: title-meaningless-out-of-context
    An account-setup wizard. The body is a password-creation form with live
    strength feedback. The <title> is the verb-fragment "Continue" — the label
    of the wizard's forward button, reused as the page title. It tells a user
    nothing about the page's subject; "Continue" could title any step of any
    flow. A user who steps away and returns to a tab reading "Continue", or who
    finds "Continue" in history, has no idea this is the password step of the
    Helios Mail sign-up.
    AUTOMATED TOOLS MISS IT: title present & non-empty (2779a5 passes); the word
    "Continue" appears verbatim on the submit button and in the step caption, so a
    lexical title/body comparison sees agreement. The strength meter is conveyed
    with proper ARIA, so 4.1.2-style checks are clean too. The only thing wrong is
    that "Continue" cannot identify the page out of context — a semantic human
    judgement automated tooling does not make.
  -->
  <title>Continue</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, Arial, sans-serif; margin: 0;
           background: linear-gradient(160deg,#0b132b,#1c2541); color: #e6e9f0;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 420px; background: #1f2a44; border: 1px solid #2c3a5e; border-radius: 14px;
            padding: 30px 32px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    .wm { font-size: .75rem; letter-spacing: 2px; color: #5bc0be; text-transform: uppercase; }
    .step { font-size: .8rem; color: #9aa5c4; margin: 2px 0 16px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    p.lead { color: #9aa5c4; margin-top: 0; font-size: .92rem; }
    label { display: block; font-size: .85rem; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #33415f;
            background: #16203a; color: #fff; font-size: .95rem; }
    .meter { height: 7px; background: #16203a; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .meter > i { display: block; height: 100%; width: 60%; background: #f5a623; }
    .hint { font-size: .78rem; color: #9aa5c4; margin-top: 6px; }
    ul.req { font-size: .78rem; color: #9aa5c4; padding-left: 18px; margin: 10px 0 0; }
    button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px;
             background: #5bc0be; color: #0b132b; font-weight: 700; font-size: .95rem; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <p class="wm">Helios Mail</p>
    <p class="step">Set up your account — step 3 of 5: Continue</p>
    <h1>Create a password</h1>
    <p class="lead">Choose a strong password for helios.mail@example to finish securing your account.</p>

    <form action="#recovery" method="post">
      <label for="pw">New password</label>
      <input id="pw" name="pw" type="password" autocomplete="new-password"
             aria-describedby="reqs" value="basket-Tiger-9">
      <div class="meter" role="progressbar" aria-label="Password strength"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-valuetext="Medium">
        <i></i>
      </div>
      <p class="hint">Strength: Medium</p>

      <label for="pw2">Confirm password</label>
      <input id="pw2" name="pw2" type="password" autocomplete="new-password">

      <ul class="req" id="reqs">
        <li>At least 12 characters</li>
        <li>A mix of letters, numbers, and symbols</li>
        <li>Not a password you have used before</li>
      </ul>

      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
