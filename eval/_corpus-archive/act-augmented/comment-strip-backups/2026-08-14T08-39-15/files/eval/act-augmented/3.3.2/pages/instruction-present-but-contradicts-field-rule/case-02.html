<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm it's you — Northbank two-step verification</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS:
  The verification-code field has a correctly associated, VISIBLE helper text via
  aria-describedby ("Enter the 6-digit code we sent to your phone"). The helper is
  non-empty, names what to enter, and is in the accessibility tree. axe / WAVE /
  Lighthouse all confirm: label present, aria-describedby resolves, contrast fine, role
  textbox. The "instruction is present" facet of 3.3.2 (TT 5.A) is satisfied.
  THE DEFECT IS SEMANTIC + NUMERIC: the field's ENFORCED rule is FOUR digits — the input
  has maxlength="4", pattern="\d{4}", and the inline validator requires exactly four.
  The OTP boxes rendered on screen are FOUR, not six. A user who waits for / types a
  6-digit code can physically only enter four, and the helper's stated count is simply
  wrong relative to what the field accepts. No checker reads "6-digit" from the prose,
  reads maxlength="4" / counts the boxes, and judges the two numbers disagree.
-->
<style>
  :root{ --ink:#1a1f2b; --muted:#6b7280; --line:#d7dbe2; --brand:#7a1fa2; --danger:#c2243b;
         --paper:#fff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:16px/1.55 "Inter",system-ui,Segoe UI,sans-serif; color:var(--ink);
        background:linear-gradient(160deg,#f6f2fb,#eef1f7); min-height:100vh; }
  .wrap{ max-width:460px; margin:0 auto; padding:48px 20px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand .mark{ width:34px; height:34px; border-radius:9px;
        background:linear-gradient(135deg,#7a1fa2,#b14de0); }
  .brand b{ font-size:1.15rem; letter-spacing:.2px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px;
        padding:30px 28px; box-shadow:0 10px 30px rgba(40,20,70,.08); }
  h1{ font-size:1.4rem; margin:0 0 6px; }
  .sub{ color:var(--muted); margin:0 0 24px; font-size:.95rem; }
  .helper{ color:var(--muted); font-size:.9rem; margin:0 0 14px; }
  .otp{ display:flex; gap:10px; margin:0 0 6px; }
  .otp input{ width:54px; height:60px; text-align:center; font-size:1.6rem; font-weight:700;
        border:2px solid var(--line); border-radius:12px; background:#fbfaff; color:var(--ink);
        font-variant-numeric:tabular-nums; }
  .otp input:focus{ outline:3px solid var(--brand); outline-offset:1px; border-color:var(--brand); }
  .otp input[aria-invalid="true"]{ border-color:var(--danger); background:#fff5f6; }
  .err{ color:var(--danger); font-size:.9rem; font-weight:600; margin:8px 0 0; min-height:1.1em; }
  button{ margin-top:22px; width:100%; padding:13px; font-size:1rem; font-weight:700; color:#fff;
        background:var(--brand); border:0; border-radius:12px; cursor:pointer; }
  button:focus{ outline:3px solid #2b0b3a; outline-offset:2px; }
  .resend{ margin-top:16px; text-align:center; font-size:.85rem; color:var(--muted); }
  .resend a{ color:var(--brand); font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Northbank</b></div>
    <main class="card">
      <h1>Confirm it's you</h1>
      <p class="sub">For your security, we sent a one-time code to the phone ending in <strong>&middot;&middot;&middot;&middot;71</strong>.</p>

      <form action="#" method="post" novalidate id="form" autocomplete="one-time-code">
        <!--
          The visible helper claims SIX digits. The field below physically accepts FOUR:
          four boxes, each maxlength="1", overall pattern \d{4}, validator wants exactly 4.
        -->
        <p class="helper" id="otp-help">Enter the 6-digit code we sent to your phone.</p>

        <div class="otp" role="group" aria-labelledby="otp-help" aria-describedby="otp-err">
          <input type="text" inputmode="numeric" pattern="\d" maxlength="1" aria-label="Digit 1 of code" autocomplete="one-time-code">
          <input type="text" inputmode="numeric" pattern="\d" maxlength="1" aria-label="Digit 2 of code">
          <input type="text" inputmode="numeric" pattern="\d" maxlength="1" aria-label="Digit 3 of code">
          <input type="text" inputmode="numeric" pattern="\d" maxlength="1" aria-label="Digit 4 of code">
        </div>
        <p class="err" id="otp-err" role="alert"></p>

        <button type="submit">Verify and sign in</button>
      </form>

      <p class="resend">Didn't get it? <a href="#">Resend code</a></p>
    </main>
    <p style="text-align:center;margin-top:22px;color:#9aa1ad;font-size:.78rem">Northbank demo · renders from file://</p>
  </div>

<script>
(function(){
  var form = document.getElementById('form');
  var boxes = Array.prototype.slice.call(document.querySelectorAll('.otp input'));
  var err  = document.getElementById('otp-err');

  // auto-advance between the FOUR boxes
  boxes.forEach(function(b,i){
    b.addEventListener('input', function(){
      b.value = b.value.replace(/[^0-9]/g,'').slice(0,1);
      if (b.value && i < boxes.length-1) boxes[i+1].focus();
    });
    b.addEventListener('keydown', function(e){
      if (e.key === 'Backspace' && !b.value && i>0) boxes[i-1].focus();
    });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var code = boxes.map(function(b){ return b.value; }).join('');
    // ENFORCED RULE: exactly FOUR digits. Contradicts the "6-digit" helper.
    if (/^\d{4}$/.test(code)) {
      boxes.forEach(function(b){ b.setAttribute('aria-invalid','false'); });
      err.textContent = 'Code accepted. Signing you in…';
      err.style.color = '#00703c';
    } else {
      boxes.forEach(function(b){ b.setAttribute('aria-invalid','true'); });
      err.textContent = 'Enter the 4-digit code to continue.';
      err.style.color = '';
      boxes[0].focus();
    }
  });
})();
</script>
</body>
</html>
