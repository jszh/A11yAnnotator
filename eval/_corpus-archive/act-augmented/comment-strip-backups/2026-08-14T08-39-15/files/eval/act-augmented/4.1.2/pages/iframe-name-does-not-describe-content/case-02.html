<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit Us — Larkspur Dental Studio</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 16px/1.6 Georgia, "Times New Roman", serif; color: #23231f; margin: 0; background: #fbfaf7; }
    .topbar { background: #0f4c5c; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .topbar nav a { color: #d7eef2; text-decoration: none; margin-left: 18px; font: 14px/1 -apple-system, Segoe UI, sans-serif; }
    .wrap { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; color: #0f4c5c; }
    .lede { color: #5a574f; margin: 0 0 26px; }
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 26px; align-items: start; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e6e2d8; border-radius: 10px; padding: 20px; }
    .card h2 { margin: 0 0 10px; font-size: 1.15rem; color: #0f4c5c; }
    address { font-style: normal; line-height: 1.7; }
    iframe { width: 100%; height: 380px; border: 0; border-radius: 10px; display: block; }
    .hours dt { font-weight: 700; }
    .hours dd { margin: 0 0 8px; color: #5a574f; }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>Larkspur Dental Studio</strong>
    <nav aria-label="Primary"><a href="#services">Services</a><a href="#team">Team</a><a href="#visit">Visit</a></nav>
  </div>
  <div class="wrap">
    <h1 id="visit">Visit our practice</h1>
    <p class="lede">Free street parking after 9am. The N-Judah stops one block away.</p>
    <div class="grid">
      <div class="card">
        <h2>Larkspur Dental Studio</h2>
        <address>
          2241 Irving Street, Suite 4<br>
          San Francisco, CA 94122<br>
          <a href="tel:+14155550142">(415) 555-0142</a>
        </address>
        <dl class="hours">
          <dt>Mon–Thu</dt><dd>8:00am – 5:30pm</dd>
          <dt>Fri</dt><dd>8:00am – 1:00pm</dd>
        </dl>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <!--
          The location map was dropped in through the page builder's "Embed" block.
          The block ships with the placeholder title "content" and the editor never
          renamed it after pasting the map markup.
        -->
        <iframe title="content" srcdoc='
          <!DOCTYPE html><html lang=&quot;en&quot;><head><meta charset=&quot;utf-8&quot;>
          <style>
            html,body{margin:0;height:100%;font:13px/1.4 -apple-system,Segoe UI,Arial,sans-serif}
            .map{position:relative;height:100%;background:
              linear-gradient(0deg,#cfe3d6 0 100%);overflow:hidden}
            .road{position:absolute;background:#fff;box-shadow:0 0 0 1px #b9c6bd}
            .r1{left:0;right:0;top:46%;height:14px}
            .r2{top:0;bottom:0;left:38%;width:14px}
            .r3{left:0;right:0;top:74%;height:8px}
            .park{position:absolute;left:54%;top:8%;width:34%;height:30%;background:#bfe0b6;border:1px solid #9cc591;border-radius:6px}
            .pin{position:absolute;left:38%;top:46%;transform:translate(-50%,-100%);color:#c0392b;font-size:30px}
            .lbl{position:absolute;font-size:11px;color:#3a4a3f}
            .ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid #b9c6bd;border-radius:6px;overflow:hidden}
            .ctrl button{display:block;width:30px;height:30px;border:0;background:#fff;font-size:16px;cursor:pointer;border-bottom:1px solid #e1e6e2}
            .attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#5a6b5f;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px}
          </style></head>
          <body>
            <div class=&quot;map&quot; role=&quot;application&quot; aria-label=&quot;Interactive street map&quot;>
              <div class=&quot;road r1&quot;></div><div class=&quot;road r2&quot;></div><div class=&quot;road r3&quot;></div>
              <div class=&quot;park&quot;></div>
              <div class=&quot;lbl&quot; style=&quot;left:56%;top:20%&quot;>Sunset Rec Center</div>
              <div class=&quot;lbl&quot; style=&quot;left:40%;top:50%&quot;>Irving St</div>
              <div class=&quot;pin&quot;>&#128205;</div>
              <div class=&quot;ctrl&quot;><button type=&quot;button&quot; aria-label=&quot;Zoom in&quot;>+</button><button type=&quot;button&quot; aria-label=&quot;Zoom out&quot;>&minus;</button></div>
              <div class=&quot;attr&quot;>Map data &copy; OpenStreetCarto</div>
            </div>
          </body></html>'></iframe>
      </div>
    </div>
  </div>

  <!--
    WHY AUTOMATED TOOLS MISS THIS
    The iframe has a non-empty accessible name ("content" from the title attribute),
    so cae760 PASSES; only one iframe exists so 4b1c6c is inapplicable. axe/WAVE/
    Lighthouse report no name/role error. They cannot open the frame, see that it
    renders an interactive location map with a pin and zoom controls, and judge that
    "content" tells an AT user nothing about that map. Determining the name does not
    describe the frame is the human content comparison Trusted Tester 12.D requires.
  -->
</body>
</html>
