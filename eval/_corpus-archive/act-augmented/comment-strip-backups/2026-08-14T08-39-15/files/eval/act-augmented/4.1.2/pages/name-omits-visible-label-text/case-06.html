<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Comptoir des Halles — Réservations</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 "Cormorant Garamond", Garamond, Georgia, serif; color:#2a241d; background:#f6f1e7; }
  .hero { background:#2a241d; color:#f4ead2; padding:34px 24px 28px; text-align:center; }
  .hero .nom { font-size:30px; letter-spacing:.04em; }
  .hero .sous { font-family:Arial, sans-serif; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:#c9b994; margin-top:8px; }
  main { max-width:600px; margin:30px auto; padding:0 20px 70px; }
  .panel { background:#fff; border:1px solid #e6ddca; border-radius:10px; padding:26px 28px; box-shadow:0 6px 20px rgba(42,36,29,.08); }
  h1 { font-size:26px; margin:0 0 4px; }
  .panel p.intro { color:#6b6051; margin:0 0 20px; font-family:Arial, sans-serif; font-size:14px; }
  .ligne { display:flex; gap:14px; margin-bottom:16px; }
  .champ { flex:1; }
  label { display:block; font-family:Arial, sans-serif; font-size:13px; font-weight:700; margin-bottom:6px; color:#4a4236; }
  input, select { width:100%; padding:11px 12px; font-size:15px; border:1.5px solid #d8cdb4; border-radius:8px; font-family:Arial, sans-serif; }
  input:focus, select:focus { outline:3px solid #e3d2a3; border-color:#8a7445; }
  .actions { margin-top:22px; display:flex; gap:12px; }
  .btn { flex:1; font-family:Arial, sans-serif; font-size:16px; font-weight:700; border-radius:9px; padding:14px; cursor:pointer; border:1.5px solid transparent; }
  .btn-primary { background:#8a7445; color:#fff; }
  .btn-primary:hover { background:#75623a; }
  .btn-ghost { background:#fff; color:#8a7445; border-color:#d8cdb4; }
  .btn-ghost:hover { background:#faf6ec; }
  .visually-hidden { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
                     clip:rect(0 0 0 0); clip-path:inset(50%); border:0; white-space:nowrap; }
</style>
</head>
<body>
  <header class="hero">
    <div class="nom">Le Comptoir des Halles</div>
    <div class="sous">Bistrot · Lyon 2ᵉ</div>
  </header>

  <main>
    <div class="panel">
      <h1>Réservez votre table</h1>
      <p class="intro">Service du soir, 19 h – 22 h 30. Pour les groupes de plus de 6 couverts, appelez-nous.</p>

      <form onsubmit="return false;">
        <div class="ligne">
          <div class="champ">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" value="2025-11-14">
          </div>
          <div class="champ">
            <label for="couverts">Nombre de couverts</label>
            <select id="couverts" name="couverts">
              <option>2 personnes</option>
              <option selected>4 personnes</option>
              <option>6 personnes</option>
            </select>
          </div>
        </div>
        <div class="champ">
          <label for="heure">Heure souhaitée</label>
          <select id="heure" name="heure">
            <option>19 h 30</option>
            <option selected>20 h 00</option>
            <option>21 h 00</option>
          </select>
        </div>

        <div class="actions">
          <!--
            PASSING SIBLING (to sharpen the aspect): this secondary button visibly reads "Annuler".
            Its aria-label "Annuler la réservation" is a SUPERSET — it CONTAINS the visible word the
            user reads. Per F111 check #3 the accessible name contains the visible label, so a voice
            user saying "Annuler" still matches. This control PASSES; it is here to contrast.
          -->
          <button type="button" class="btn btn-ghost" aria-label="Annuler la réservation">Annuler</button>

          <!--
            THE DEFECT (this page's failure): the primary button visibly reads, in French, "Réserver
            une table" — the words a francophone diner reads and would speak. But aria-labelledby was
            wired to two hidden English nodes from a multilingual theme that never translated the
            booking widget, concatenating to "Confirm booking". The accessible name is non-empty
            (button rule passes) and role is correct, but it (a) is in a DIFFERENT LANGUAGE than the
            visible label and the page lang="fr", and (b) shares ZERO words with "Réserver une table".
            A French voice-control user saying « Réserver une table » activates nothing; a screen
            reader on a French page abruptly announces English "Confirm booking", contradicting the
            visible label. The visible label is present but absent from the programmatic name.
          -->
          <button type="submit" class="btn btn-primary" aria-labelledby="lbl-verb lbl-noun">Réserver une table</button>
        </div>
        <span id="lbl-verb" class="visually-hidden">Confirm</span>
        <span id="lbl-noun" class="visually-hidden">booking</span>
      </form>
    </div>
  </main>
</body>
</html>
