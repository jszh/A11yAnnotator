<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassroom — Team workspace</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f3f3f3; color: #1c1c1c;
         font-family: "Inter", system-ui, Arial, sans-serif; }
  .shell { max-width: 660px; margin: 0 auto; padding: 36px 26px; }

  .panel {
    /* "Frosted glass" card: a faint diagonal gradient from pure white at the
       top-left to a soft grey (#efefef) at the bottom-right. The shift is gentle
       and reads as a flat panel, but there is no single background colour: the
       luminance behind the heading slides from white to ~#efefef. */
    background: linear-gradient(135deg, #ffffff 0%, #f7f7f7 55%, #efefef 100%);
    border-radius: 12px;
    padding: 26px 28px 30px;
    box-shadow: 0 1px 0 #e3e3e3;
  }

  /* Card heading. The designer wanted a refined, low-key header, so it is set in
     #8c8c8c "secondary" grey at font-size:14pt / weight 400.
     14pt = 18.667px. CRITICAL: 14pt qualifies for the relaxed 3:1 ratio ONLY when
     it is BOLD. At weight 400 it is NORMAL text, and the boundary for normal text
     is 18pt (24px). 14pt < 18pt, so this is NOT large-scale and the 4.5:1 threshold
     applies. #8c8c8c over the panel gives 3.36:1 (white end) down to ~2.92:1
     (#efefef end) — both well under 4.5:1. -> FAIL.
     The same 14pt set BOLD would be large-scale and only need 3:1; the verdict
     flips entirely on the font weight. */
  .panel h2 { margin: 0 0 4px; font-size: 14pt; font-weight: 400; color: #8c8c8c; line-height: 1.3; }
  .panel .count { margin: 0 0 18px; font-size: 14pt; font-weight: 400; color: #8c8c8c; }

  .row { display: flex; justify-content: space-between; font-size: 15px;
         color: #1c1c1c; padding: 8px 0; border-top: 1px solid #e3e3e3; }
  .row .who { color: #1c1c1c; }
  .row .when { color: #2a2a2a; }
</style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <!--
        h2 + .count: colour #8c8c8c, font-size 14pt (= 18.667px), weight 400,
        over a faint white->#efefef diagonal gradient. axe returns "incomplete"
        for text over a gradient and emits NO violation.
        14pt is large-scale ONLY when bold; at weight 400 it is NORMAL text, whose
        boundary is 18pt. 14pt < 18pt => normal => 4.5:1 required. The contrast is
        3.36:1 (best) to ~2.92:1 (worst), below 4.5:1. Correct verdict: FAIL.
        (If this header were BOLD, 3:1 would apply and ~3.36:1 would pass — the
        threshold turns on the weight.)
      -->
      <h2>Open review requests</h2>
      <p class="count">3 items waiting on you</p>

      <div class="row"><span class="who">payments-service · refactor retry queue</span><span class="when">2h ago</span></div>
      <div class="row"><span class="who">web-client · fix date picker locale</span><span class="when">yesterday</span></div>
      <div class="row"><span class="who">infra · rotate staging credentials</span><span class="when">3 days ago</span></div>
    </section>
  </div>
</body>
</html>
