<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة — أمسية الخط العربي</title>
<!--
  SC 1.4.3 F83 — least-contrast over a geometric (zellige) tile background, RTL/i18n.
  WHY AUTOMATED TOOLS MISS IT: the invitation headline is live Arabic text (color:#fff) over
  a zellige PNG. Because the document is RTL, the line STARTS on the right — and the right
  third of the tile raster is a band of pale sand-coloured tiles, so the first (rightmost,
  reading-start) Arabic letters of the headline wash out to ~1.38:1 white-on-sand, while the
  rest of the line over the deep-teal tiles is fine (~10:1+). Scanners can't read the raster
  and fall back to the section solid #0c4660, where #fff is ~7:1 and "passes". An evaluator
  must visually trace the FIRST glyphs in the RTL reading order over the lightest tiles —
  exactly the per-letter least-contrast check. ACT's best-case pixel pick (~14:1) reports PASS.
-->
<style>
  body { margin:0; background:#07232e; color:#eaf2f4;
    font-family: "Segoe UI", Tahoma, "Geeza Pro", sans-serif; }
  .card { max-width: 980px; margin: 0 auto; padding: 36px 18px 54px; }
  .crest { text-align:center; color:#cfa14b; letter-spacing:.1em; font-size:.85rem; margin:0 0 16px; }
  .invite {
    background-color:#0c4660;                 /* fallback scanners measure */
    background-image:url("bg-03-zellige.png");
    background-size:100% 100%; background-position:center;
    border:2px solid #cfa14b; border-radius:6px;
    padding:48px 46px; text-align:center;
  }
  .invite h1 {
    margin:0 0 10px;
    color:#ffffff;                            /* white over tiles, no shadow */
    font-size: clamp(1.9rem, 5vw, 3rem);
    font-weight:700; line-height:1.3;
  }
  .invite p.sub { margin:0; color:#ffffff; font-size:1.1rem; opacity:.97; }
  .details { display:flex; gap:24px; justify-content:center; flex-wrap:wrap;
    margin-top:30px; color:#dfeaec; }
  .details div { min-width:140px; }
  .details dt { color:#9fc2cc; font-size:.8rem; }
  .details dd { margin:4px 0 0; font-size:1.05rem; font-weight:600; }
  .rsvp { display:block; width:fit-content; margin:30px auto 0;
    background:#cfa14b; color:#1a1206; font-weight:700; padding:12px 30px;
    border-radius:4px; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <p class="crest">جمعية الخطاطين &middot; الرباط</p>
  <section class="invite" aria-label="بطاقة الدعوة">
    <h1>يسرّنا دعوتكم لحضور أمسية الخط</h1>
    <p class="sub">ليلة من الحبر والذهب على الزليج</p>
  </section>
  <dl class="details">
    <div><dt>التاريخ</dt><dd>السبت ١٤ مارس</dd></div>
    <div><dt>الوقت</dt><dd>٧:٣٠ مساءً</dd></div>
    <div><dt>المكان</dt><dd>دار الفن، الرباط</dd></div>
  </dl>
  <a class="rsvp" href="#rsvp">أكّد حضورك</a>
</div>
</body>
</html>
