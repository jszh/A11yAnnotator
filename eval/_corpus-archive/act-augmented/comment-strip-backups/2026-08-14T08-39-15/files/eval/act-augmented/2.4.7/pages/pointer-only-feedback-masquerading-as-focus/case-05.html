<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Shipping Country | Lumen Outfitters</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fff; color: #161a1d;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 460px; margin: 3rem auto; padding: 0 1.2rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .2rem; }
    .step { color: #6a727a; font-size: .85rem; margin: 0 0 1.6rem; }
    label.lbl { display: block; font-weight: 600; margin-bottom: .4rem; font-size: .92rem; }

    .combo { position: relative; }
    .combo__input {
      width: 100%; padding: .65rem .8rem; font-size: 1rem;
      border: 1px solid #b9c0c7; border-radius: 7px; background: #fff;
    }
    .combo__input:focus { outline: none; border-color: #2563eb; }

    .listbox {
      list-style: none; margin: .35rem 0 0; padding: .25rem;
      border: 1px solid #d7dce1; border-radius: 8px;
      max-height: 220px; overflow-y: auto;
      box-shadow: 0 8px 22px rgba(20,30,45,.12);
    }
    .opt {
      padding: .5rem .65rem; border-radius: 5px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .opt .code { color: #8a929b; font-size: .8rem; font-variant-numeric: tabular-nums; }

    /* The visual "this option is highlighted" treatment. It is applied by the
       JS below via a .hot class, and the JS toggles .hot on POINTER MOVEMENT. */
    .opt.hot { background: #2563eb; color: #fff; }
    .opt.hot .code { color: #cfe0ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Shipping destination</h1>
    <p class="step">Checkout · step 3 of 5</p>

    <label class="lbl" id="country-label" for="country-input">Country or region</label>
    <div class="combo">
      <input class="combo__input" id="country-input" type="text"
             role="combobox" aria-expanded="true" aria-controls="country-list"
             aria-autocomplete="list" aria-activedescendant="opt-fr"
             aria-labelledby="country-label" value="" autocomplete="off">
      <ul class="listbox" id="country-list" role="listbox" aria-labelledby="country-label">
        <li class="opt" id="opt-fr"  role="option">France <span class="code">FR</span></li>
        <li class="opt" id="opt-de"  role="option">Germany <span class="code">DE</span></li>
        <li class="opt" id="opt-it"  role="option">Italy <span class="code">IT</span></li>
        <li class="opt" id="opt-es"  role="option">Spain <span class="code">ES</span></li>
        <li class="opt" id="opt-nl"  role="option">Netherlands <span class="code">NL</span></li>
        <li class="opt" id="opt-se"  role="option">Sweden <span class="code">SE</span></li>
        <li class="opt" id="opt-pt"  role="option">Portugal <span class="code">PT</span></li>
      </ul>
    </div>
  </div>

  <script>
    (function () {
      var input = document.getElementById('country-input');
      var list  = document.getElementById('country-list');
      var opts  = Array.prototype.slice.call(list.querySelectorAll('.opt'));

      // --- Pointer highlight: the only thing that ever paints an option blue ---
      // Ported from the legacy mouse-driven autocomplete. Moving the cursor over
      // an option marks it .hot; leaving clears it.
      opts.forEach(function (o) {
        o.addEventListener('mousemove', function () {
          opts.forEach(function (x) { x.classList.remove('hot'); });
          o.classList.add('hot');
        });
        o.addEventListener('mouseleave', function () { o.classList.remove('hot'); });
      });

      // --- Keyboard handling: moves aria-activedescendant correctly for AT,
      //     but NEVER applies the .hot class, so sighted keyboard users see
      //     nothing move. The CSS has no [aria-activedescendant] / :focus rule
      //     that targets the active option, only the pointer-driven .hot class. ---
      var active = 0;
      input.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { active = Math.min(active + 1, opts.length - 1); }
        else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); }
        else { return; }
        e.preventDefault();
        input.setAttribute('aria-activedescendant', opts[active].id);
        opts[active].scrollIntoView({ block: 'nearest' });
        // NOTE: no visual class change here.
      });
    })();
  </script>

  <!--
    WHY THIS FAILS SC 2.4.7 (Focus Visible) AND WHY AUTOMATED TOOLS MISS IT
    ----------------------------------------------------------------------
    This is an ARIA combobox using aria-activedescendant: real keyboard focus
    stays on the <input>, and the "focused option" is conveyed to AT by
    aria-activedescendant. The criterion requires the keyboard-focused option to
    be VISIBLY indicated. Here the blue highlight (.hot) is the focus indicator,
    but it is toggled exclusively by `mousemove` / `mouseleave` — pointer events.
    The ArrowUp/ArrowDown handler dutifully updates aria-activedescendant (so a
    screen reader announces the active option) but never paints it, and the CSS
    has no selector targeting the active descendant. A sighted keyboard user
    arrowing through the list sees the highlight stay frozen on whatever the mouse
    last touched — or nothing at all — with no indication of which option is
    "focused".

    Automated tools miss it because the ARIA wiring is textbook-correct:
    aria-activedescendant moves, roles are valid, the input has an accessible
    name. axe even rewards correct activedescendant usage. No scanner correlates
    "the keyboard moves the active descendant" with "no CSS ever makes that
    descendant look different", because the highlight lives behind pointer-only JS
    listeners. Catching it requires a human to arrow through and watch whether the
    visually-highlighted option follows the keyboard.
  -->
</body>
</html>
