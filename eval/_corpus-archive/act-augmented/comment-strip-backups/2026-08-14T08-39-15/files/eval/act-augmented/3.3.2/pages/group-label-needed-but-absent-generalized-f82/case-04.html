<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a payment card — Solstice Bank</title>
<style>
  :root { --ink:#0f1b2d; --muted:#5b6573; --line:#cdd4de; --brand:#13335f; --bg:#eef2f7; }
  * { box-sizing: border-box; }
  body { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         color: var(--ink); background: var(--bg); margin:0; padding:34px 16px 56px; }
  .wrap { max-width: 560px; margin:0 auto; }
  .brandbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .brandbar .mark { width:26px; height:26px; border-radius:6px;
    background:conic-gradient(from 210deg, #13335f, #2f6fb0, #13335f); }
  .brandbar b { font-size:1rem; letter-spacing:.2px; }
  h1 { font-size:1.3rem; margin:8px 0 4px; }
  .lede { color:var(--muted); font-size:.88rem; margin:0 0 22px; }
  form { background:#fff; border:1px solid var(--line); border-radius:12px;
         padding:26px 24px 28px; box-shadow:0 1px 3px rgba(15,27,45,.07); }
  .field { margin-bottom:18px; }
  label { display:block; font-weight:600; font-size:.82rem; margin:0 0 6px; }
  input { padding:12px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px;
          font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing:1px; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; }
  input::placeholder { color:#9aa3ad; letter-spacing:2px; }
  /* The card number is split into four equal groups separated by dashes. */
  .cc-groups { display:flex; align-items:center; gap:9px; }
  .cc-groups input { width:78px; text-align:center; }
  .cc-groups .dash { color:#9aa3ad; font-weight:700; user-select:none; }
  .duo { display:flex; gap:14px; }
  .duo > div { flex:1 1 0; }
  .duo input { width:100%; }
  .actions { margin-top:8px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:9px;
           padding:13px 24px; font-size:.95rem; font-weight:600; cursor:pointer; width:100%; }
  .secure { color:var(--muted); font-size:.76rem; margin:14px 2px 0; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar"><span class="mark" aria-hidden="true"></span><b>Solstice Bank</b></div>
    <h1>Add a payment card</h1>
    <p class="lede">Your card details are encrypted end-to-end and tokenized before storage.</p>

    <form action="#" novalidate aria-label="Add a payment card">
      <!-- THE DEFECT: the 16-digit card number is split into four inputs. The only visible
           "label" for each is a placeholder of four dashes, and there is NO "Card number"
           text labelling the group. The four-part grouping is conveyed only by the literal
           dash separators between the boxes. -->
      <div class="field">
        <div class="cc-groups">
          <input id="cc1" name="cc_g1" inputmode="numeric" maxlength="4" placeholder="----" aria-label="First four digits">
          <span class="dash" aria-hidden="true">&ndash;</span>
          <input id="cc2" name="cc_g2" inputmode="numeric" maxlength="4" placeholder="----" aria-label="Next four digits">
          <span class="dash" aria-hidden="true">&ndash;</span>
          <input id="cc3" name="cc_g3" inputmode="numeric" maxlength="4" placeholder="----" aria-label="Next four digits">
          <span class="dash" aria-hidden="true">&ndash;</span>
          <input id="cc4" name="cc_g4" inputmode="numeric" maxlength="4" placeholder="----" aria-label="Last four digits">
        </div>
      </div>

      <div class="field">
        <div class="duo">
          <div>
            <label for="exp">Expiry</label>
            <input id="exp" name="exp" inputmode="numeric" placeholder="MM / YY" value="">
          </div>
          <div>
            <label for="cvc">Security code</label>
            <input id="cvc" name="cvc" inputmode="numeric" placeholder="123" value="">
          </div>
        </div>
      </div>

      <div class="field">
        <label for="cardholder">Name on card</label>
        <input id="cardholder" name="cardholder" type="text" autocomplete="cc-name" style="width:100%; letter-spacing:.3px;" value="">
      </div>

      <div class="actions">
        <button type="submit">Add card</button>
        <p class="secure">&#128274; Solstice Bank never stores your full card number.</p>
      </div>
    </form>
  </div>

  <!--
    WHY AUTOMATED TOOLS MISS IT
    Every one of the four card-number boxes carries a non-empty programmatic accessible name
    via aria-label ("First four digits" / "Next four digits" / "Last four digits"), and
    Expiry, Security code and Name on card all have real associated <label>s. So axe's "form
    elements must have labels" rule and every 4.1.2 name/role check PASS — there is no
    empty/missing name to flag.

    The defect is precisely the 3.3.2 limb the Understanding calls out: a label can satisfy
    4.1.2 (via aria-label) yet still fail 3.3.2 if it "isn't presented to all users, not
    just those using assistive technologies." Here the four card boxes have NO meaningful
    VISIBLE label — only a placeholder of four dashes "----", which is not a label and
    vanishes on input — and there is NO visible "Card number" text labelling the SET at all.
    The four-part grouping and its meaning are conveyed solely by the visual dash separators
    between the boxes — exactly F82 (visually formatting a set of fields without a text label
    identifying the set). A sighted, non-AT user must infer "credit card" purely from the
    four-by-four dashed layout; nothing on screen says these compose a card number, and the
    aria-labels read "First/Next/Last four digits" — never "card number" — so even an AT
    user never hears the set's purpose. Tools cannot judge that a four-dash placeholder is
    not a real visible label, nor that the dashed four-box layout silently encodes (without
    stating) "card number" — that is a human visual-semantic judgment.
  -->
</body>
</html>
