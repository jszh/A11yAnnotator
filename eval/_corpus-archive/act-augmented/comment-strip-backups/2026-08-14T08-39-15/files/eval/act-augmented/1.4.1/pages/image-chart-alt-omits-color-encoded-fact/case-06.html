<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SC 1.4.1 (and 1.1.1) TRUE NEGATIVE / PASS — the contrast case for this aspect.

    Same chart FAMILY as case-01 (four reps' annual sales against a quota, below-quota bars
    drawn red), but here the text alternative RESOLVES the color-encoded fact instead of merely
    restating the color rule. The accessible name and the on-screen caption both say, in words,
    WHICH reps fell below quota and which met it:
      "...Fred and Bob fell below the $3.0M quota; Mary and Andrew met it."
    Because the salient distinction (who missed quota) is now available as TEXT, the red fill is
    REDUNDANT — a colour-blind user, a screen-reader user, and a monochrome-display user all
    recover the same conclusion the colour communicates. This is exactly what WCAG Technique G14
    requires ("the information conveyed by the color differences are also conveyed explicitly in
    text") and is the inverse of Failure F13.

    To make the alternative genuinely non-color-dependent, the chart ALSO gives each below-quota
    bar a non-color cue (a "▼ below quota" tag and a hatch pattern), and the caption resolves
    the fact in prose. So even sighted users who cannot perceive red get the meaning on screen,
    satisfying 1.4.1's "visible alternative to color" requirement, not just the AT path.

    WHY THIS IS THE BOUNDARY: structurally case-06 looks almost identical to case-01 to an
    automated scanner (an inline SVG with role=img and a long accessible name) — both PASS every
    automated check. The ONLY difference that flips fail->pass is the SEMANTIC content of the
    alternative: case-01 states the rule, case-06 resolves the fact. That a human must read the
    chart and the prose to tell these two apart is the whole point of the aspect; this PASS page
    proves the distinction is about meaning, not markup.
  -->
  <title>Q4 Sales Performance — Northwind Field Sales (accessible)</title>
  <style>
    :root { --ink:#1c2530; --muted:#5a6675; --line:#dbe2ea; --bg:#f4f7fb; --brand:#1f5fa6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    .wrap { max-width:860px; margin:0 auto; padding:28px 22px 48px; }
    header.app { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding-bottom:16px; }
    header.app .logo { width:34px; height:34px; border-radius:8px; background:var(--brand); }
    header.app h1 { font-size:18px; margin:0; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin-top:22px; }
    .panel h2 { font-size:16px; margin:0 0 4px; }
    .panel .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
    figure { margin:0; }
    svg.bars { width:100%; max-width:680px; height:auto; display:block; border:1px solid var(--line); border-radius:8px; background:#fff; }
    figcaption { color:var(--muted); font-size:13px; margin-top:10px; line-height:1.6; }
    figcaption b { color:var(--ink); }
    table.sr { border-collapse:collapse; width:100%; max-width:520px; margin-top:16px; font-size:13px; }
    table.sr caption { text-align:left; color:var(--muted); padding-bottom:6px; }
    table.sr th, table.sr td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
    table.sr th { background:var(--bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <span class="logo" aria-hidden="true"></span>
      <h1>Northwind Sales Insights</h1>
    </header>

    <section class="panel" aria-labelledby="ch2">
      <h2 id="ch2">Annual sales vs. quota — Field Sales team</h2>
      <p class="sub">Reps below the $3.0M quota are flagged in red, marked with a ▼ tag, and hatched.</p>

      <figure>
        <!--
          Inline SVG. Below-quota bars (Fred, Bob) are red AND hatched AND tagged "▼ below quota".
          Met-quota bars (Mary, Andrew) are green AND tagged "✓ met". The accessible name RESOLVES
          the fact (names who is below). Caption + a data table repeat it in visible text. Color is
          therefore redundant -> PASSES 1.4.1 (G14) and 1.1.1.
        -->
        <svg class="bars" viewBox="0 0 680 380" role="img"
          aria-label="Bar chart of FY24 annual sales for the four-person Field Sales team against a 3.0 million dollar quota. Mary sold 3.1 million and met quota; Fred sold 2.6 million and fell below quota; Bob sold 2.2 million and fell below quota; Andrew sold 3.4 million and met quota. Fred and Bob are the two representatives who fell below the quota; Mary and Andrew met it.">
          <defs>
            <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="8" height="8" fill="#d23b3b"></rect>
              <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="2"></line>
            </pattern>
          </defs>
          <rect width="680" height="380" fill="#ffffff"></rect>
          <g stroke="#dbe2ea" stroke-width="1">
            <line x1="70" y1="40" x2="70" y2="300"></line>
            <line x1="70" y1="300" x2="650" y2="300"></line>
          </g>
          <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5a6675">
            <text x="40" y="304" text-anchor="end">0</text>
            <text x="40" y="170" text-anchor="end">2M</text>
            <text x="40" y="105" text-anchor="end">3M</text>
            <text x="40" y="44" text-anchor="end">4M</text>
          </g>
          <!-- bars -->
          <rect x="110" y="98"  width="80" height="202" fill="#2f9e57"></rect>
          <rect x="250" y="131" width="80" height="169" fill="url(#hatch)"></rect>
          <rect x="390" y="157" width="80" height="143" fill="url(#hatch)"></rect>
          <rect x="530" y="80"  width="80" height="220" fill="#2f9e57"></rect>
          <!-- quota line -->
          <line x1="70" y1="105" x2="650" y2="105" stroke="#1c2530" stroke-width="1.5" stroke-dasharray="6 4"></line>
          <text x="648" y="100" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1c2530">Quota 3.0M</text>
          <!-- names -->
          <g font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="middle">
            <text x="150" y="320">Mary</text>
            <text x="290" y="320">Fred</text>
            <text x="430" y="320">Bob</text>
            <text x="570" y="320">Andrew</text>
          </g>
          <!-- value labels -->
          <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="middle">
            <text x="150" y="90">3.1M</text>
            <text x="290" y="123">2.6M</text>
            <text x="430" y="149">2.2M</text>
            <text x="570" y="72">3.4M</text>
          </g>
          <!-- NON-COLOR status tags below each name -->
          <g font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
            <text x="150" y="340" fill="#1f7a3d">✓ met</text>
            <text x="290" y="340" fill="#b3261e">▼ below quota</text>
            <text x="430" y="340" fill="#b3261e">▼ below quota</text>
            <text x="570" y="340" fill="#1f7a3d">✓ met</text>
          </g>
        </svg>

        <figcaption>
          Figure 1. FY24 annual sales by representative against the $3.0M quota.
          <b>Fred ($2.6M) and Bob ($2.2M) fell below quota; Mary ($3.1M) and Andrew ($3.4M) met it.</b>
          Below-quota reps are additionally marked with a ▼ tag and a hatch pattern, so the
          flag does not depend on seeing the colour red.
        </figcaption>
      </figure>

      <table class="sr">
        <caption>Same data in tabular form</caption>
        <thead>
          <tr><th>Representative</th><th>Annual sales</th><th>Quota status</th></tr>
        </thead>
        <tbody>
          <tr><td>Mary</td><td>$3.1M</td><td>Met quota</td></tr>
          <tr><td>Fred</td><td>$2.6M</td><td>Below quota</td></tr>
          <tr><td>Bob</td><td>$2.2M</td><td>Below quota</td></tr>
          <tr><td>Andrew</td><td>$3.4M</td><td>Met quota</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</body>
</html>
