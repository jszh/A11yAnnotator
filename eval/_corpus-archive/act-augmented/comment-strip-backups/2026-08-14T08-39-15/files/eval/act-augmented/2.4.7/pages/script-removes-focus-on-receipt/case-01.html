<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move money — Northshore Credit Union</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS:
  The "Transfer funds" submit button has a perfectly valid :focus style in CSS
  (a 3px solid outline) and a real, computable accessible name. axe-core / WAVE /
  Lighthouse have no rule for 2.4.7 at all, and even a CSS-aware scanner sees a
  legitimate focus indicator declared. What they cannot see is the inline
  onfocus="this.blur()" handler that fires the instant Tab lands on the button and
  immediately removes focus — so the :focus rule is real but never gets to paint.
  A single focused snapshot renders as UNFOCUSED because focus was already stolen.
  Catching this requires driving keyboard focus and observing OVER TIME that the
  indicator never settles (a temporal/behavioral check), which static scanners
  and single-frame pixel diffs do not perform.
-->
<style>
  :root { --navy: #103a5e; --gold: #b8860b; --line: #d4dbe2; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0; background: #eef2f6; color: #1c2733; line-height: 1.5;
  }
  header.app-bar {
    background: var(--navy); color: #fff; padding: 14px 22px;
    display: flex; align-items: center; gap: 12px;
  }
  header.app-bar .logo { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); }
  header.app-bar h1 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: .3px; }
  main { max-width: 560px; margin: 28px auto; padding: 0 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 26px 28px; }
  .card h2 { margin: 0 0 4px; font-size: 1.3rem; color: var(--navy); }
  .card p.sub { margin: 0 0 22px; color: #5a6b7b; font-size: .9rem; }
  label { display: block; font-weight: 600; font-size: .85rem; margin: 16px 0 5px; }
  select, input[type=text], input[type=number] {
    width: 100%; padding: 9px 11px; border: 1px solid #b6c1cc; border-radius: 6px;
    font-size: .95rem; background: #fff;
  }
  select:focus, input:focus { outline: 3px solid #2f7fd6; outline-offset: 1px; border-color: #2f7fd6; }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .actions { margin-top: 26px; display: flex; gap: 12px; }
  .btn-primary {
    background: var(--navy); color: #fff; border: 0; border-radius: 6px;
    padding: 12px 26px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  /* A genuine, perfectly valid keyboard focus indicator IS declared here — */
  /* it just never gets to paint because onfocus blurs the button first.    */
  .btn-primary:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn-secondary {
    background: #fff; color: var(--navy); border: 1px solid var(--navy);
    border-radius: 6px; padding: 12px 22px; font-size: 1rem; cursor: pointer;
  }
  .btn-secondary:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
  footer { max-width: 560px; margin: 18px auto 40px; padding: 0 18px; color: #7a8896; font-size: .78rem; }
</style>
</head>
<body>
<header class="app-bar">
  <span class="logo" aria-hidden="true"></span>
  <h1>Northshore Credit Union — Online Banking</h1>
</header>

<main>
  <section class="card" aria-labelledby="xfer-h">
    <h2 id="xfer-h">Move money between accounts</h2>
    <p class="sub">Transfers between your own Northshore accounts post immediately.</p>

    <form action="/transfer/review" method="post" novalidate>
      <div class="row">
        <div>
          <label for="from-acct">From</label>
          <select id="from-acct" name="from">
            <option>Everyday Checking ••4821</option>
            <option>High-Yield Savings ••0934</option>
          </select>
        </div>
        <div>
          <label for="to-acct">To</label>
          <select id="to-acct" name="to">
            <option>High-Yield Savings ••0934</option>
            <option>Everyday Checking ••4821</option>
          </select>
        </div>
      </div>

      <label for="amount">Amount (USD)</label>
      <input type="number" id="amount" name="amount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">

      <label for="memo">Memo (optional)</label>
      <input type="text" id="memo" name="memo" maxlength="60" placeholder="e.g. Rent, savings goal">

      <div class="actions">
        <!--
          The defect: onfocus="this.blur()" removes focus the instant Tab reaches
          the submit button. The :focus outline above never paints; the button is
          reachable only by mouse. Markup is well-formed; name & focus style exist.
        -->
        <input type="submit" class="btn-primary" value="Review transfer"
               onfocus="this.blur();">
        <button type="reset" class="btn-secondary">Clear</button>
      </div>
    </form>
  </section>
</main>

<footer>
  Northshore Credit Union is federally insured by the NCUA. For assistance call 1-800-555-0142.
</footer>
</body>
</html>
