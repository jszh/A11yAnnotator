  <!--
    WHY THIS PASSES, AND WHY AUTOMATED TOOLS STILL MIS-HANDLE IT (boundary case):
    This page is a deliberate PASS that a naive checker gets WRONG for the right reasons.
    The .menu element has a transparent background and warm off-white text (#f2f2f2). A CSSOM
    tool that walks ancestors finds no opaque background on .menu and either (a) falls back to
    a WHITE canvas assumption -> off-white-on-white -> reports a contrast FAILURE, or (b)
    cannot reduce the .hero multiple-background (gradient over image) to a single color and
    SKIPS the node. Both are wrong. The real EFFECTIVE backdrop is the linear-gradient
    rgba(0,0,0,0.72) scrim composited over the photo: even over the photo's BRIGHTEST region
    (sun/sky) the composite resolves to roughly #474744, against which #f2f2f2 is about 8.3:1
    -- comfortably above 4.5:1. Confirming the PASS requires compositing the scrim over the
    worst-case (lightest) photo region behind the glyphs and computing least-contrast -- the
    same human visual judgment the failing cases need, here yielding a pass.
  -->
