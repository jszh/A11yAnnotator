<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Quote — Driver details | Meridian Insurance</title>
<!--
  SC 4.1.3 aspect: non-textual status (icon) given a status role but no usable text alternative.
  WHY AUTOMATED TOOLS MISS IT:
  The inline-validation banner is a *present* role="alert" container (so the
  missing-live-region checkers and ACT/F103 seeds all PASS). When validation fails,
  the ONLY content that changes inside that alert is an SVG that swaps from a neutral
  gray dot to a red "X". That SVG is marked aria-hidden="true" and carries no
  <title>/aria-label, and there is no co-located text. So the alert region fires on
  change but its computed text content is the empty string — the screen reader is
  told "alert" and then announces nothing. axe/WAVE/Lighthouse see a valid role="alert"
  region and an explicitly-decorative SVG (aria-hidden is the *correct* markup for a
  decorative graphic); no linter can know that THIS particular dot->X swap is the sole
  carrier of the error status and therefore needed a text alternative. Judging that the
  red X means "invalid" (vs. ornament) and that the alert announces emptiness is a
  visual + semantic decision.
-->
<style>
  :root { --ink:#1d2430; --line:#c9d1dc; --brand:#0b5d8f; --bad:#c0271a; }
  * { box-sizing: border-box; }
  body { font: 16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); margin: 0; background: #eef2f6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 18px 64px; }
  header.brand { display:flex; align-items:center; gap:10px; padding:14px 0; }
  header.brand .logo { width:30px; height:30px; border-radius:6px; background:var(--brand); }
  header.brand strong { font-size:18px; letter-spacing:.2px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; }
  h1 { font-size:22px; margin:.2em 0 .1em; }
  .step { color:#5a6675; font-size:13px; margin:0 0 18px; }
  .field { margin:18px 0; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  .hint { font-weight:400; color:#5a6675; font-size:13px; }
  input[type=text] { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line);
                     border-radius:8px; }
  input[aria-invalid="true"] { border-color: var(--bad); background:#fff7f6; }
  /* The validation row: a status icon sits left of a (here unused) text slot. */
  .vstatus { display:flex; align-items:center; gap:8px; margin-top:8px; min-height:22px; }
  .vstatus svg { width:18px; height:18px; flex:0 0 18px; }
  .actions { margin-top:26px; display:flex; gap:12px; }
  button { font:inherit; font-weight:600; padding:11px 20px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .primary { background:var(--brand); color:#fff; }
  .ghost { background:#fff; border-color:var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><span class="logo" aria-hidden="true"></span><strong>Meridian Insurance</strong></header>
  <main class="card">
    <p class="step">Auto quote &middot; Step 2 of 5</p>
    <h1>Driver details</h1>

    <form id="quoteForm" novalidate>
      <div class="field">
        <label for="licence">Driver's licence number
          <span class="hint">— 8 characters, letters and digits</span>
        </label>
        <input type="text" id="licence" name="licence" autocomplete="off"
               aria-describedby="licenceStatus" value="A4">

        <!--
          PRESENT live region. On submit, JS toggles the SVG between #dot (gray) and
          #cross (red X). The role="alert" fires, but the ONLY thing inside it is an
          aria-hidden SVG with no accessible name and no sibling text.
        -->
        <div class="vstatus" id="licenceStatus" role="alert" aria-atomic="true">
          <svg viewBox="0 0 20 20" aria-hidden="true" id="vIcon">
            <circle cx="10" cy="10" r="5" fill="#c9d1dc"></circle>
          </svg>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="ghost">Back</button>
        <button type="submit" class="primary">Continue</button>
      </div>
    </form>
  </main>
</div>

<script>
  var form = document.getElementById('quoteForm');
  var input = document.getElementById('licence');
  var icon = document.getElementById('vIcon');

  var OK = '<circle cx="10" cy="10" r="6" fill="#1e8a4c"></circle>' +
           '<path d="M6.2 10.3l2.3 2.3 5.3-5.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  // Red "X" badge — visually unmistakable "error". No <title>, SVG stays aria-hidden.
  var BAD = '<circle cx="10" cy="10" r="6" fill="#c0271a"></circle>' +
            '<path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>';

  function valid(v){ return /^[A-Za-z0-9]{8}$/.test(v); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (valid(input.value)) {
      input.setAttribute('aria-invalid', 'false');
      icon.innerHTML = OK;            // green check — also unlabeled, but field is valid
    } else {
      input.setAttribute('aria-invalid', 'true');
      icon.innerHTML = BAD;           // red X injected INTO role="alert" -> announces nothing
      input.focus();
    }
  });
</script>
</body>
</html>
