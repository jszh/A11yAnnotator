<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وزارة الصحة — تسجيل المريض الجديد</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS (case-05):
  A Health-Ministry (Arabic, RTL) new-patient registration form has a split
  date-of-birth control: three inputs for اليوم / الشهر / السنة (Day / Month / Year)
  sitting under a visual heading "تاريخ الميلاد" (Date of birth). Each of the three
  inputs is given an accessible name via title="يوم", title="شهر", title="سنة"
  (Day / Month / Year), so axe e086e5 PASSES — every input is named. BUT:
    1. The single question "Date of birth" is a styled <div>, not a <fieldset>/
       <legend> or role="group" with aria-labelledby — so the three inputs are not
       programmatically tied to the one question they jointly answer. A screen
       reader announces three separate "Day / Month / Year" fields with no
       indication they form ONE date-of-birth value.
    2. RTL twist: in right-to-left reading the visual order of the three boxes is
       Day(rightmost) Month Year(leftmost), but the DOM source order is
       year, month, day — so the title on each box (which is correct per-box) and
       the visual position can be cross-checked only by a human; more importantly
       the GROUP question never reaches AT regardless of order.
  No static rule says "these three inputs jointly answer one labelled question and
  must be grouped." Recognizing that اليوم/الشهر/السنة compose the single
  تاريخ الميلاد question is a reading-and-layout judgment.
-->
<style>
  body { font-family: "Segoe UI", "Tahoma", "Arial", sans-serif; background: #eef4f1; color: #1b2b25; margin: 0; }
  .form { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 10px rgba(20,60,40,.1); padding: 30px 34px 38px; }
  .min { color: #2e7d5b; font-size: 13px; font-weight: bold; }
  h1 { font-size: 21px; margin: 4px 0 18px; }
  .field { margin-bottom: 20px; }
  .field > label, .group-q { display: block; font-size: 15px; margin-bottom: 6px; font-weight: 600; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #b9cdc4; border-radius: 4px; font-size: 15px; }
  /* the date group: three small boxes laid out in a row */
  .group-q { color: #1b2b25; }
  .dob { display: flex; gap: 10px; }
  .dob input { flex: 1 1 0; min-width: 0; text-align: center; box-sizing: border-box; padding: 9px 6px; border: 1px solid #b9cdc4; border-radius: 4px; font-size: 15px; }
  .dob .yr { flex: 1.4 1 0; }
  .hint { color: #5a7268; font-size: 12px; margin-top: 5px; }
  .save { background: #2e7d5b; color: #fff; border: none; border-radius: 5px; padding: 12px 30px; font-size: 15px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
  <div class="form">
    <p class="min">وزارة الصحة · بوابة المرضى</p>
    <h1>تسجيل مريض جديد</h1>

    <form action="#" method="post" novalidate>
      <div class="field">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" autocomplete="name">
      </div>

      <div class="field">
        <label for="nid">رقم الهوية الوطنية</label>
        <input type="text" id="nid" inputmode="numeric">
      </div>

      <!-- DATE OF BIRTH: one question, three inputs, NO grouping element.
           "تاريخ الميلاد" is a styled <div>, not a legend/group label.
           Each input is individually named via title, so it dodges e086e5,
           but the three are never tied to the single question. -->
      <div class="field">
        <div class="group-q">تاريخ الميلاد</div>
        <div class="dob">
          <!-- DOM source order (RTL): year, month, day. Visual order right→left: day, month, year. -->
          <input type="text" class="yr" title="سنة" inputmode="numeric" maxlength="4" placeholder="السنة">
          <input type="text" title="شهر" inputmode="numeric" maxlength="2" placeholder="الشهر">
          <input type="text" title="يوم" inputmode="numeric" maxlength="2" placeholder="اليوم">
        </div>
        <p class="hint">مثال: ١٥ / ٠٣ / ١٩٩٠</p>
      </div>

      <button type="submit" class="save">حفظ المتابعة</button>
    </form>
  </div>
</body>
</html>
