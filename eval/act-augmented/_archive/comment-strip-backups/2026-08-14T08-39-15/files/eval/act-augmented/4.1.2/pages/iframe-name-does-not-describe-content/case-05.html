<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Console — Meridian Cloud</title>
  <style>
    * { box-sizing: border-box; }
    body { font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #e8edf4; margin: 0; background: #0d1424; }
    .appbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #121b30; border-bottom: 1px solid #223152; }
    .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); }
    .appbar h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    .appbar .who { margin-left: auto; color: #9fb0cc; font-size: .85rem; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 20px; max-width: 1140px; margin: 0 auto; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .pane { background: #111a2e; border: 1px solid #223152; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .pane > .hd { padding: 10px 14px; font-size: .78rem; letter-spacing: 1px; text-transform: uppercase; color: #7d8db0; border-bottom: 1px solid #223152; }
    iframe { width: 100%; height: 420px; border: 0; display: block; background: #fff; }
  </style>
</head>
<body>
  <div class="appbar">
    <span class="logo" aria-hidden="true"></span>
    <h1>Meridian Cloud — Support Console</h1>
    <span class="who">signed in as ops@northwind.example</span>
  </div>

  <div class="layout">
    <!--
      Two unrelated embedded tools sit side by side. The dashboard's grid component
      auto-names each embed slot by position ("Section A", "Section B"). Because the
      names DIFFER, the identical-name rule never applies, yet neither name says what
      the embedded tool actually is.
    -->
    <div class="pane">
      <div class="hd">Panel 1</div>
      <iframe title="Section A" srcdoc='
        <!DOCTYPE html><html lang=&quot;en&quot;><head><meta charset=&quot;utf-8&quot;>
        <style>
          html,body{height:100%;margin:0}
          body{font:14px/1.5 -apple-system,Segoe UI,Arial,sans-serif;color:#1f2933;display:flex;flex-direction:column}
          .hdr{background:#2563eb;color:#fff;padding:12px 14px;font-weight:600}
          .hdr small{display:block;font-weight:400;opacity:.85}
          .log{flex:1;overflow:auto;padding:14px;background:#f7f9fc}
          .msg{max-width:80%;margin:0 0 10px;padding:8px 11px;border-radius:12px}
          .them{background:#e7edf6}
          .me{background:#2563eb;color:#fff;margin-left:auto}
          .typing{font-size:.85em;color:#7a8aa3;margin-top:4px}
          form{display:flex;gap:8px;padding:10px;border-top:1px solid #e3e8f0}
          input{flex:1;padding:9px 11px;border:1px solid #cdd6e2;border-radius:20px;font:inherit}
          button{border:0;border-radius:20px;background:#2563eb;color:#fff;padding:9px 16px;cursor:pointer}
        </style></head>
        <body>
          <div class=&quot;hdr&quot;>Live chat with Support<small>Avg reply &lt; 2 min</small></div>
          <div class=&quot;log&quot;>
            <div class=&quot;msg them&quot;>Hi! You are chatting with Mara from Meridian. How can I help?</div>
            <div class=&quot;msg me&quot;>Our nightly backup job is stuck at 0%.</div>
            <div class=&quot;msg them&quot;>Got it — can you share the job ID from the Backups tab?</div>
            <div class=&quot;typing&quot;>Mara is typing&hellip;</div>
          </div>
          <form onsubmit=&quot;return false&quot;>
            <input aria-label=&quot;Type a message&quot; placeholder=&quot;Type a message&hellip;&quot;>
            <button type=&quot;submit&quot;>Send</button>
          </form>
        </body></html>'></iframe>
    </div>

    <div class="pane">
      <div class="hd">Panel 2</div>
      <iframe title="Section B" srcdoc='
        <!DOCTYPE html><html lang=&quot;en&quot;><head><meta charset=&quot;utf-8&quot;>
        <style>
          html,body{height:100%;margin:0}
          body{font:14px/1.6 -apple-system,Segoe UI,Arial,sans-serif;color:#23303f;padding:16px;overflow:auto}
          h1{font-size:1.15rem;margin:0 0 4px}
          .crumbs{font-size:.8rem;color:#7a8aa3;margin:0 0 14px}
          h2{font-size:1rem;margin:18px 0 6px}
          p{margin:0 0 10px}
          code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:.9em}
          ol{margin:0 0 10px 20px}
          .note{background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;font-size:.9em}
        </style></head>
        <body>
          <div class=&quot;crumbs&quot;>Docs &rsaquo; Backups &rsaquo; Troubleshooting</div>
          <h1>Backup job stuck at 0%</h1>
          <h2>Why this happens</h2>
          <p>A stuck job almost always means the snapshot agent lost its lease on the
             volume. The job waits for the lease instead of failing.</p>
          <h2>Fix it</h2>
          <ol>
            <li>Open the <strong>Backups</strong> tab and copy the job ID.</li>
            <li>Run <code>meridian backups release-lease &lt;job-id&gt;</code>.</li>
            <li>Click <strong>Retry</strong> on the job row.</li>
          </ol>
          <div class=&quot;note&quot;>If the job stalls again within an hour, the volume may be
            read-only at the hypervisor &mdash; contact support with the job ID.</div>
        </body></html>'></iframe>
    </div>
  </div>

  <!--
    WHY AUTOMATED TOOLS MISS THIS
    Both iframes have non-empty accessible names ("Section A", "Section B" via title),
    so cae760 PASSES for each. Because the two names are DIFFERENT, rule 4b1c6c
    (iframes with identical names must have equivalent purpose) is inapplicable — its
    whole basis is name collision, which does not occur here. axe/WAVE/Lighthouse see
    two validly named, uniquely named frames and report nothing. They cannot render the
    frames to learn that Section A is a live chat widget and Section B is a help-doc
    viewer, nor judge that "Section A/B" fails to distinguish those purposes for an AT
    user navigating frames. That per-frame content-to-name judgement is exactly what
    Trusted Tester 12.D requires a human to perform.
  -->
</body>
</html>
