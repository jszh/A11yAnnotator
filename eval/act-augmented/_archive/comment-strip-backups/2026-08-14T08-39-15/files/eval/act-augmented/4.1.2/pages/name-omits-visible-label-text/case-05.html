<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trellis Insurance — Renters quote in 2 minutes</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#16202b; background:#f3f6fb; }
  .topbar { background:#fff; border-bottom:1px solid #e5eaf1; padding:14px 22px; display:flex; align-items:center; }
  .topbar .brand { font-weight:800; color:#1f5dd0; letter-spacing:-.01em; }
  .topbar .steps { margin-left:auto; font-size:13px; color:#6a7686; }
  .quote { max-width:560px; margin:30px auto; background:#fff; border:1px solid #e5eaf1; border-radius:16px;
           box-shadow:0 10px 30px rgba(31,93,208,.08); overflow:hidden; }
  .quote header { padding:24px 28px 8px; }
  .quote header h1 { margin:0 0 4px; font-size:22px; }
  .quote header p { margin:0; color:#6a7686; font-size:14px; }
  form { padding:14px 28px 28px; }
  .row { display:flex; gap:14px; }
  .grp { margin-top:16px; flex:1; }
  label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; }
  input, select { width:100%; padding:11px 12px; font-size:15px; border:1.5px solid #cdd7e3; border-radius:9px; }
  input:focus, select:focus { outline:3px solid #bcd2fb; border-color:#1f5dd0; }
  .price { margin-top:22px; background:#f0f5ff; border:1px solid #d4e2fc; border-radius:12px; padding:14px 16px;
           display:flex; align-items:baseline; justify-content:space-between; }
  .price .amt { font-size:26px; font-weight:800; color:#1f5dd0; }
  .price .amt small { font-size:13px; font-weight:600; color:#6a7686; }
  .submit { width:100%; margin-top:18px; background:#1f5dd0; color:#fff; border:none; border-radius:11px;
            padding:15px; font-size:17px; font-weight:700; cursor:pointer; }
  .submit:hover { background:#184bad; }
  .legal { font-size:12px; color:#8693a4; margin-top:12px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Trellis Insurance</span>
    <span class="steps">Step 3 of 3 · Review &amp; price</span>
  </div>

  <section class="quote">
    <header>
      <h1>Your renters quote</h1>
      <p>Confirm the details below and lock in today's rate.</p>
    </header>
    <form onsubmit="return false;">
      <div class="row">
        <div class="grp">
          <label for="zip">ZIP code</label>
          <input id="zip" name="zip" type="text" inputmode="numeric" value="44113">
        </div>
        <div class="grp">
          <label for="cov">Personal property coverage</label>
          <select id="cov" name="cov">
            <option>$20,000</option>
            <option selected>$30,000</option>
            <option>$50,000</option>
          </select>
        </div>
      </div>
      <div class="grp">
        <label for="ded">Deductible</label>
        <select id="ded" name="ded">
          <option>$250</option>
          <option selected>$500</option>
          <option>$1,000</option>
        </select>
      </div>

      <div class="price">
        <span>Estimated monthly premium</span>
        <span class="amt">$14.20<small>/mo</small></span>
      </div>

      <!--
        THE DEFECT: a native submit button. Its visible label is the value attribute "Get my quote"
        (rendered on the button face). But an aria-label was wired up by a form-builder integration
        that emits the component's INTERNAL id as the label. aria-label OVERRIDES the value in the
        accessible-name computation, so accName = "quote-submit-btn-v2" — non-empty (button rule
        passes), role=button correct. A sighted user reads "Get my quote"; AT exposes an internal
        identifier string. A voice user saying "click Get my quote" fails; a screen-reader user
        hears a developer slug that means nothing and matches nothing visible on screen.
      -->
      <input class="submit" type="submit" value="Get my quote" aria-label="quote-submit-btn-v2">

      <p class="legal">By continuing you agree to Trellis's terms. This quote is an estimate and not a
         binding offer of insurance.</p>
    </form>
  </section>
</body>
</html>
