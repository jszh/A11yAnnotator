<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SC 1.4.5 FAILURE — the "Symbolic text characters" exception applied to text that IS human
    language.

    The Understanding doc's PASS: a toolbar may use images whose glyphs "do not form a
    sequence that expresses something in human language" — e.g. "B" for bold, "I" for italic,
    "ABC" for spell-check. The exception turns on the glyphs being SYMBOLIC, not on the
    control being a toolbar button.

    Here a developer themed a rich-text editor and decided single letters were "too cryptic
    for our users," so they replaced the symbolic glyphs with the FULL WORD LABELS — the
    button faces are images reading "Bold", "Italic", "Underline", "Spell check". Those are
    English words: a sequence that DOES express something in human language. So the symbolic-
    character exception does NOT apply; this is ordinary label text rendered as images and it
    should be live text. The visible words pixelate on zoom and cannot be resized/restyled by
    users who need a larger or higher-contrast UI font.

    EXTRA HARDNESS: each button has an aria-label equal to the same word, so a screen reader
    announces "Bold, button" correctly — 1.1.1 / 4.1.2 are MET, which is exactly why an
    automated tool stays green. The defect is purely 1.4.5: the human-language label is
    pixels, not adjustable text. A sighted low-vision user who relies on OS font scaling /
    high-contrast mode loses the labels' legibility; the toolbar text won't reflow or recolour.

    WHY AUTOMATED TOOLS MISS IT: buttons have correct accessible names; there are no
    contrast/alt/role violations. No tool OCRs the button faces to discover the labels are
    full words (not symbols), and none can judge that "Bold" expresses human language while a
    bare "B" glyph is symbolic. That symbolic-vs-language call is the human judgment.
  -->
  <title>Compose message — Helio Mail</title>
  <style>
    :root { --ink:#1d2330; --muted:#5c6577; --line:#dfe4ee; --bg:#f3f5fa; --accent:#2557d6; --btn:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
    .app { max-width:760px; margin:30px auto; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 6px 24px rgba(20,30,60,.07); }
    .head { padding:14px 18px; border-bottom:1px solid var(--line); font-weight:700; }
    .field { display:flex; gap:10px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); }
    .field label { width:64px; color:var(--muted); font-size:14px; }
    .field input { flex:1; border:none; font:inherit; padding:6px 0; outline:none; }
    .toolbar { display:flex; gap:8px; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); background:#fafbfe; }
    .toolbar button { background:var(--btn); border:1px solid var(--line); border-radius:8px; padding:6px 8px; cursor:pointer; line-height:0; }
    .toolbar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .toolbar img { display:block; height:18px; width:auto; }
    .editor { min-height:200px; padding:16px 18px; font-size:15px; line-height:1.6; outline:none; }
    .foot { display:flex; gap:10px; padding:12px 18px; border-top:1px solid var(--line); }
    .send { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-weight:600; cursor:pointer; }
    .discard { background:transparent; border:1px solid var(--line); border-radius:8px; padding:9px 14px; color:var(--muted); cursor:pointer; }
  </style>
</head>
<body>
  <main class="app" aria-label="Compose message">
    <div class="head">New message</div>

    <div class="field"><label for="to">To</label><input id="to" type="email" value="team@example.com"></div>
    <div class="field"><label for="subj">Subject</label><input id="subj" type="text" value="Q3 planning notes"></div>

    <!--
      THE VIOLATION: the toolbar button faces are IMAGES of the FULL WORD LABELS
      "Bold", "Italic", "Underline", "Spell check" — human-language text rendered as pixels.
      This is NOT a symbolic-character case. Each button's aria-label matches the word, so AT
      announces it correctly and 1.1.1/4.1.2 pass — but the visible label is an un-adjustable
      raster, failing 1.4.5.
    -->
    <div class="toolbar" role="toolbar" aria-label="Text formatting">
      <button type="button" aria-label="Bold">
        <img alt="" width="48" height="18"
             src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='48'%20height='18'%20viewBox='0%200%2048%2018'%3E%3Ctext%20x='0'%20y='14'%20fill='%231d2330'%20font-family='Arial,sans-serif'%20font-size='14'%20font-weight='700'%3EBold%3C/text%3E%3C/svg%3E">
      </button>
      <button type="button" aria-label="Italic">
        <img alt="" width="44" height="18"
             src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='44'%20height='18'%20viewBox='0%200%2044%2018'%3E%3Ctext%20x='0'%20y='14'%20fill='%231d2330'%20font-family='Arial,sans-serif'%20font-size='14'%20font-style='italic'%3EItalic%3C/text%3E%3C/svg%3E">
      </button>
      <button type="button" aria-label="Underline">
        <img alt="" width="74" height="18"
             src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='74'%20height='18'%20viewBox='0%200%2074%2018'%3E%3Ctext%20x='0'%20y='14'%20fill='%231d2330'%20font-family='Arial,sans-serif'%20font-size='14'%20text-decoration='underline'%3EUnderline%3C/text%3E%3C/svg%3E">
      </button>
      <button type="button" aria-label="Spell check">
        <img alt="" width="86" height="18"
             src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='86'%20height='18'%20viewBox='0%200%2086%2018'%3E%3Ctext%20x='0'%20y='14'%20fill='%231d2330'%20font-family='Arial,sans-serif'%20font-size='14'%3ESpell%20check%3C/text%3E%3C/svg%3E">
      </button>
    </div>

    <div class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message body">
      <p>Hi team — sketching the Q3 themes below. Reply with anything I've missed before Friday.</p>
    </div>

    <div class="foot">
      <button class="send" type="button">Send</button>
      <button class="discard" type="button">Discard</button>
    </div>
  </main>
</body>
</html>
