<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SC 2.4.3 — FAIL (focus order scatters across a seating grid with no relationship).
    This is the MEANING-DESTROYING near-twin of a legitimate seating picker. It is
    a theatre seat-selection map: ROWS are seat rows (A, B, C, D — front to back)
    and COLUMNS are seat numbers (1..6 within each row). Each seat is a focusable
    <button role="checkbox"> the patron toggles to select.

    For a seating map BOTH orders are valid: row-by-row (A1..A6, B1..B6, ...) OR
    column-by-column (A1,B1,C1,D1 then A2,...). Either reflects the spatial
    relationship of the auditorium. This page provides NEITHER. The seats are
    emitted in DOM source order in a RANDOM SCATTER (the order they were dragged
    onto the canvas in the layout tool): B3, A6, D1, A2, C5, B1, D4, ... So Tab
    teleports the focus ring all over the auditorium map — front-left, then
    back-right, then mid-center — with no relationship to seat rows, seat numbers,
    or proximity. A keyboard user watching the focus ring cannot track their
    position in the seating plan; a screen-reader user hears seats announced in an
    order that conveys no spatial structure ("Row B Seat 3", "Row A Seat 6",
    "Row D Seat 1"). Both meaning (the auditorium's spatial layout) and operability
    (methodically choosing adjacent seats) are destroyed.

    This is the failure the valid row/column orders are contrasted against —
    NOT a protected alternative. Correct verdict: FAIL.

    Why automated tools miss it: every seat button has an accessible name
    (aria-label "Row B, Seat 3, available"), correct role/aria-checked, fine
    contrast, visible focus ring — axe/WAVE/Lighthouse find nothing wrong. No
    static tool computes whether the DOM/focus sequence follows the seating grid's
    spatial relationship. Telling this random scatter apart from a valid
    column-major seat order requires a human reasoning about the spatial meaning
    of the map and watching where the focus ring actually goes.
  -->
  <title>Choose your seats — Glasshouse Playhouse</title>
  <style>
    :root { --ink:#20171f; --muted:#6a5f68; --line:#d8ccd4; --brand:#7a1f4b; --avail:#fbeef4; --sel:#7a1f4b; --bg:#faf6f8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Avenir Next", "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    header { background:var(--brand); color:#fff; padding:16px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:3px 0 0; font-size:13px; opacity:.9; }
    main { max-width:640px; margin:24px auto; padding:0 20px 48px; }
    .lead { font-size:14px; color:var(--muted); margin:0 0 6px; }
    .stage { text-align:center; background:#2a2230; color:#fff; border-radius:6px; padding:8px; font-size:12px; letter-spacing:3px; margin:14px 0 22px; }
    .map {
      display:grid;
      grid-template-columns: 36px repeat(6, 1fr);
      grid-template-rows: auto repeat(4, auto);
      gap:10px;
      justify-items:center; align-items:center;
    }
    .seatnum, .rowlbl { font-size:12px; color:var(--muted); font-weight:700; }
    .seat {
      width:46px; height:40px; border:1px solid var(--brand); border-radius:8px 8px 3px 3px;
      background:var(--avail); color:var(--brand); font-size:13px; cursor:pointer; font-weight:600;
    }
    .seat[aria-checked="true"] { background:var(--sel); color:#fff; }
    .seat:focus { outline:3px solid #c45c8c; outline-offset:2px; }
    .legend { margin-top:20px; font-size:12px; color:var(--muted); display:flex; gap:18px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .chip { width:16px; height:16px; border-radius:3px; border:1px solid var(--brand); display:inline-block; }
    .chip.sel { background:var(--sel); }
    .actions { margin-top:22px; }
    button.book { background:var(--brand); color:#fff; border:0; padding:11px 22px; border-radius:7px; font-size:15px; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Glasshouse Playhouse — Seat Selection</h1>
    <p>"The Winter Almanac" · Fri 14 Nov · 7:30 pm · Stalls</p>
  </header>
  <main>
    <p class="lead">Tap the seats you'd like. Selected seats turn solid.</p>
    <div class="stage">S T A G E</div>

    <form>
      <div class="map" role="group" aria-label="Stalls seating map, rows A to D, seats 1 to 6">
        <!-- header: seat numbers -->
        <span class="rowlbl" style="grid-column:1;grid-row:1;"></span>
        <span class="seatnum" style="grid-column:2;grid-row:1;">1</span>
        <span class="seatnum" style="grid-column:3;grid-row:1;">2</span>
        <span class="seatnum" style="grid-column:4;grid-row:1;">3</span>
        <span class="seatnum" style="grid-column:5;grid-row:1;">4</span>
        <span class="seatnum" style="grid-column:6;grid-row:1;">5</span>
        <span class="seatnum" style="grid-column:7;grid-row:1;">6</span>

        <!-- row labels -->
        <span class="rowlbl" style="grid-column:1;grid-row:2;">A</span>
        <span class="rowlbl" style="grid-column:1;grid-row:3;">B</span>
        <span class="rowlbl" style="grid-column:1;grid-row:4;">C</span>
        <span class="rowlbl" style="grid-column:1;grid-row:5;">D</span>

        <!--
          Seats are emitted in DOM source order as a RANDOM SCATTER (the drag order
          from the layout tool). CSS Grid pins each to its true (row,seat) position
          so the MAP looks correct, but Tab follows the scattered source order:
          B3, A6, D1, A2, C5, B1, D4, A4, C2, B6, D3, A1, C6, B4, D5, A3, C1, B5,
          D2, A5, C4, B2, D6, C3.
          Consecutive focus stops share neither a row, a seat number, nor adjacency.
        -->
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 3, available" style="grid-column:4;grid-row:3;">B3</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 6, available" style="grid-column:7;grid-row:2;">A6</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 1, available" style="grid-column:2;grid-row:5;">D1</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 2, available" style="grid-column:3;grid-row:2;">A2</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 5, available" style="grid-column:6;grid-row:4;">C5</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 1, available" style="grid-column:2;grid-row:3;">B1</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 4, available" style="grid-column:5;grid-row:5;">D4</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 4, available" style="grid-column:5;grid-row:2;">A4</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 2, available" style="grid-column:3;grid-row:4;">C2</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 6, available" style="grid-column:7;grid-row:3;">B6</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 3, available" style="grid-column:4;grid-row:5;">D3</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 1, available" style="grid-column:2;grid-row:2;">A1</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 6, available" style="grid-column:7;grid-row:4;">C6</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 4, available" style="grid-column:5;grid-row:3;">B4</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 5, available" style="grid-column:6;grid-row:5;">D5</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 3, available" style="grid-column:4;grid-row:2;">A3</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 1, available" style="grid-column:2;grid-row:4;">C1</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 5, available" style="grid-column:6;grid-row:3;">B5</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 2, available" style="grid-column:3;grid-row:5;">D2</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row A, Seat 5, available" style="grid-column:6;grid-row:2;">A5</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 4, available" style="grid-column:5;grid-row:4;">C4</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row B, Seat 2, available" style="grid-column:3;grid-row:3;">B2</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row D, Seat 6, available" style="grid-column:7;grid-row:5;">D6</button>
        <button type="button" class="seat" role="checkbox" aria-checked="false" aria-label="Row C, Seat 3, available" style="grid-column:4;grid-row:4;">C3</button>
      </div>

      <div class="legend">
        <span><span class="chip"></span> Available</span>
        <span><span class="chip sel"></span> Selected</span>
      </div>
      <div class="actions">
        <button type="submit" class="book">Continue to checkout</button>
      </div>
    </form>
  </main>
  <script>
    // Toggle seat selection on click/Enter/Space (button already handles keys).
    document.querySelectorAll('.seat').forEach(function (b) {
      b.addEventListener('click', function () {
        var on = b.getAttribute('aria-checked') === 'true';
        b.setAttribute('aria-checked', String(!on));
        var lbl = b.getAttribute('aria-label').replace(/, (available|selected)$/, '');
        b.setAttribute('aria-label', lbl + (!on ? ', selected' : ', available'));
      });
    });
  </script>
</body>
</html>
