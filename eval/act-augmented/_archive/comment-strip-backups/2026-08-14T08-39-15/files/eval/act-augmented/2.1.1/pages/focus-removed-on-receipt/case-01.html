<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Harborline Credit Union</title>
<style>
  :root { --navy:#102a43; --teal:#0f6f72; --line:#cfd9e3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; color:#1c2b36; background:#eef3f7; }
  header { background:var(--navy); color:#fff; padding:14px 26px; display:flex; align-items:center; gap:10px; }
  header .mark { width:26px; height:26px; border:2px solid #6fd2d6; border-radius:50%; }
  header .name { font-weight:700; letter-spacing:.4px; }
  main { max-width:420px; margin:46px auto; background:#fff; border:1px solid var(--line);
         border-radius:10px; padding:30px 32px; box-shadow:0 2px 10px rgba(16,42,67,.07); }
  h1 { font-size:1.35rem; margin:0 0 4px; color:var(--navy); }
  p.sub { margin:0 0 22px; color:#5a6b78; font-size:.92rem; }
  label { display:block; font-weight:600; font-size:.86rem; margin:16px 0 6px; }
  input[type=text], input[type=password] {
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-size:1rem;
  }
  input[type=text]:focus, input[type=password]:focus { outline:3px solid #2f80c8; outline-offset:1px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin:18px 0 6px; font-size:.85rem; }
  .row a { color:var(--teal); }
  .signin {
    margin-top:22px; width:100%; padding:13px; border:0; border-radius:6px;
    background:var(--teal); color:#fff; font-size:1.02rem; font-weight:600; cursor:pointer;
  }
  .signin:focus { outline:3px solid #2f80c8; outline-offset:2px; }
  .alt { margin-top:18px; text-align:center; font-size:.85rem; color:#5a6b78; }
  .alt a { color:var(--teal); }
  footer { max-width:420px; margin:10px auto 50px; color:#8597a4; font-size:.74rem; text-align:center; }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"></span>
  <span class="name">Harborline Credit Union</span>
</header>

<main>
  <h1>Sign in to online banking</h1>
  <p class="sub">Manage accounts, transfers, and statements.</p>

  <form action="#" method="post" novalidate>
    <label for="user">Member number or username</label>
    <input type="text" id="user" name="user" autocomplete="username" required>

    <label for="pass">Password</label>
    <input type="password" id="pass" name="pass" autocomplete="current-password" required>

    <div class="row">
      <label style="font-weight:400;margin:0;display:inline-flex;align-items:center;gap:6px;">
        <input type="checkbox" name="remember"> Keep me signed in
      </label>
      <a href="#reset">Forgot password?</a>
    </div>

    <!--
      THE DEFECT (F55) is on the submit control below.
      A front-end contractor disliked the focus outline jumping to the big teal button
      during keyboard tab-through QA ("it looks broken when it flashes"), and pasted a
      Stack Overflow one-liner: onfocus="this.blur()". The button is a perfectly valid,
      named, focusable <input type="submit">. The username/password fields are untouched
      and fully operable. Only the submit button strips its own focus the instant it
      receives it, so a keyboard user can tab to it but focus immediately leaves — they
      can never press Space/Enter ON the button. (Enter inside the password field still
      submits, but that is a separate path; the visible primary control is unoperable by
      keyboard, and a screen-reader user navigating control-by-control to "Sign in,
      button" lands on nothing.)
    -->
    <input class="signin" type="submit" value="Sign in" onfocus="this.blur()">
  </form>

  <p class="alt">New member? <a href="#enroll">Enroll in online banking</a></p>
</main>

<footer>Federally insured. Harborline Credit Union, Routing #291174.</footer>
</body>
</html>
