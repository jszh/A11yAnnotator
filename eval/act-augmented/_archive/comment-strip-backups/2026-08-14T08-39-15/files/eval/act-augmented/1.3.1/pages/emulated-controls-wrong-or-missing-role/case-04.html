<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SC 1.3.1 (Info and Relationships) — F42 emulated-control failure path (img variant).
    Aspect: emulated-controls-wrong-or-missing-role.

    "Skylark Air" flight-search widget. The submit control at the end of the search bar
    is an IMAGE: a glossy round teal disc with a white magnifying glass + the word
    "Search" baked into the picture (here an inline SVG data URI standing in for a PNG).
    It has cursor:pointer and a subtle hover scale. Clicking it submits the search.
    Visually and behaviourally it IS the search BUTTON.

    THE DEFECT: it is <img ... onclick="submitSearch()"> with NO role, NO tabindex, and
    its alt describes the PICTURE ("Round teal search icon with a magnifying glass"),
    not the action. So:
      - exposed role is "img" (a graphic), not "button";
      - keyboard users cannot Tab to it or activate it;
      - even a sighted SR user who hovers gets "image, Round teal search icon…",
        i.e. announced as a decorative-ish graphic, never as the submit control.
    The button relationship conveyed by appearance + click-to-submit behaviour is not
    programmatically determinable.

    NOTE: the alt is PRESENT and non-empty, so the missing-alt linter passes. The alt is
    describing the wrong thing (the graphic, not the function) AND the element is the
    wrong role — both human-judgment failures, not a missing attribute.

    WHY AUTOMATED TOOLS MISS IT: <img> has alt (no 1.1.1 missing-alt flag) and no role
    (so 1.3.1 role-validity rules don't apply). axe/WAVE/Lighthouse see a valid image
    with a click handler; nothing static says "this image is actually the submit button
    and is exposed as a graphic". Reading the rendered disc + 'Search' wording + submit
    behaviour AS a button is human visual/behavioural judgment.
  -->
  <title>Find flights — Skylark Air</title>
  <style>
    :root { --ink:#0e2433; --muted:#5a6b78; --line:#d8e0e8; --teal:#0d7d8c; --bg:#eef4f8; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
    .hero { max-width:900px; margin:2.4rem auto; padding:0 1.25rem; }
    h1 { font-size:1.7rem; margin:0 0 1.1rem; }
    form.search { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:.75rem; align-items:end; box-shadow:0 2px 6px rgba(14,36,51,.06); }
    @media (max-width:680px){ form.search { grid-template-columns:1fr 1fr; } }
    .field label { display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:.3rem; }
    .field input, .field select { width:100%; padding:.6rem .65rem; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
    /* The IMG that acts as the submit button */
    .searchbtn { width:60px; height:60px; cursor:pointer; transition:transform .1s; display:block; justify-self:center; }
    .searchbtn:hover { transform:scale(1.05); }
    .results-note { color:var(--muted); font-size:.9rem; margin-top:1rem; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Where would you like to go?</h1>

    <form class="search" onsubmit="return false;">
      <div class="field">
        <label for="from">From</label>
        <input id="from" name="from" type="text" value="Lisbon (LIS)">
      </div>
      <div class="field">
        <label for="to">To</label>
        <input id="to" name="to" type="text" value="Reykjavík (KEF)">
      </div>
      <div class="field">
        <label for="depart">Depart</label>
        <input id="depart" name="depart" type="date" value="2026-07-14">
      </div>

      <!--
        DEFECT: the submit control is an <img> (role=img), not a <button>/<input type=submit>.
        alt describes the GRAPHIC, not the action; no role=button, no tabindex.
        The inline SVG data URI stands in for a PNG button graphic (keeps file:// self-contained).
      -->
      <img
        class="searchbtn"
        onclick="submitSearch()"
        alt="Round teal search icon with a white magnifying glass"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='29' fill='%230d7d8c'/%3E%3Ccircle cx='26' cy='26' r='10' fill='none' stroke='white' stroke-width='4'/%3E%3Cline x1='34' y1='34' x2='44' y2='44' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Ctext x='30' y='53' font-family='Arial' font-size='9' fill='white' text-anchor='middle'%3ESearch%3C/text%3E%3C/svg%3E">
    </form>

    <p class="results-note" id="note">Round-trip and one-way fares from 142 carriers.</p>
  </div>

  <script>
    function submitSearch() {
      document.getElementById('note').textContent =
        'Searching Lisbon → Reykjavík for 14 Jul 2026 …';
    }
  </script>
</body>
</html>
