<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificaci&oacute;n en dos pasos | Banco Aurora</title>
<!--
  SC 4.1.3 aspect: non-textual status (icon) in a present live region, alt is a present-but-MEANINGLESS symbol name.
  WHY AUTOMATED TOOLS MISS IT:
  This is a Spanish-language banking 2FA screen. After the 6-digit code is accepted, the result is
  shown in a real aria-live="assertive" region (present at load -> live-region/F103 PASS). The success
  is carried solely by a green-check <svg> given role="img" and aria-label="check". The label is
  non-empty (no missing-name rule fires) and it even MATCHES the visible glyph (a check mark), so a
  "name reflects the image" sanity check would also pass. But "check" names the SHAPE, not the STATUS:
  the region announces the bare English word "check" (also untranslated on a lang="es" page) instead of
  "Identidad verificada" / "Código correcto". A blind user hears "check" and cannot tell whether their
  identity was verified, the code was wrong, or something else. No automated tool can decide that naming
  the symbol ("check") fails to convey the verification status, or that an English symbol-name is wrong
  on a Spanish page — that is a semantic + i18n judgment.
-->
<style>
  :root { --ink:#101828; --line:#d0d5dd; --brand:#1b3a6b; --ok:#157347; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { font:16px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); margin:0; background:#eef1f6; }
  .wrap { max-width:460px; margin:0 auto; padding:40px 18px 64px; }
  .brand { text-align:center; margin-bottom:18px; font-weight:800; color:var(--brand); letter-spacing:.3px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px; }
  h1 { font-size:20px; margin:.1em 0 .2em; text-align:center; }
  p.lead { color:#475467; text-align:center; margin:0 0 20px; }
  .codeRow { display:flex; gap:8px; justify-content:center; margin:18px 0; }
  .codeRow input { width:44px; height:54px; text-align:center; font-size:22px; border:1px solid var(--line); border-radius:8px; }
  /* result region — the icon is the only state carrier */
  .result { min-height:32px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
  .result svg { width:26px; height:26px; }
  button { width:100%; font:inherit; font-weight:700; padding:13px; border-radius:9px; border:1px solid transparent; background:var(--brand); color:#fff; cursor:pointer; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Banco Aurora</div>
  <main class="card">
    <h1>Verificaci&oacute;n en dos pasos</h1>
    <p class="lead">Introduce el c&oacute;digo de 6 d&iacute;gitos enviado a tu tel&eacute;fono ****&nbsp;31.</p>

    <form id="otpForm" novalidate>
      <div class="codeRow" aria-label="C&oacute;digo de verificaci&oacute;n">
        <input inputmode="numeric" maxlength="1" value="4" aria-label="D&iacute;gito 1">
        <input inputmode="numeric" maxlength="1" value="8" aria-label="D&iacute;gito 2">
        <input inputmode="numeric" maxlength="1" value="1" aria-label="D&iacute;gito 3">
        <input inputmode="numeric" maxlength="1" value="9" aria-label="D&iacute;gito 4">
        <input inputmode="numeric" maxlength="1" value="0" aria-label="D&iacute;gito 5">
        <input inputmode="numeric" maxlength="1" value="2" aria-label="D&iacute;gito 6">
      </div>

      <!-- live region present at load; success conveyed only by an icon named "check" -->
      <div class="result" id="otpResult" aria-live="assertive" aria-atomic="true"></div>

      <button type="submit">Verificar</button>
    </form>
  </main>
</div>

<script>
  var form = document.getElementById('otpForm');
  var result = document.getElementById('otpResult');

  // Green check given role=img + aria-label="check" (names the SHAPE, untranslated).
  var OK = '<svg viewBox="0 0 26 26" role="img" aria-label="check">' +
           '<circle cx="13" cy="13" r="12" fill="#157347"/>' +
           '<path d="M7 13.4l3.4 3.4 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    // (Demo: treat the prefilled code as correct.) Inject the success icon.
    result.innerHTML = OK;
  });
</script>
</body>
</html>
