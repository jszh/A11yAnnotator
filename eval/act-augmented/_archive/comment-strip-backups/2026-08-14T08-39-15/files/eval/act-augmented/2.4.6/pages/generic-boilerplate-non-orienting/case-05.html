<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply for a Council Tax Reduction — Step 3 of 5</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS (SC 2.4.6, button-label sub-limb of 5.B):
  A government benefits wizard step shows several real <button>s, each with a non-empty,
  correctly-exposed accessible name. Three of them say "Submit" but do three DIFFERENT
  things: one adds a household member to a list, one uploads the chosen evidence file, and
  one saves the whole application and moves to step 4. A fourth button says "Action". Every
  name is a real word and is loosely true (each does submit/act on something), so it is not
  a 100% mismatch. axe ("button-name") and Lighthouse pass — every button is named. Deciding
  that "Submit"/"Action" fails to make each button's DISTINCT function clear is a semantic
  judgment (TT 5.B: "each visual button label … so users know its function").
-->
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Helvetica Neue", Arial, sans-serif; color:#0b0c0c;
         background:#fff; line-height:1.55; }
  .gov-bar { background:#0b0c0c; color:#fff; padding:10px 0; }
  .gov-bar .inner { max-width:760px; margin:0 auto; padding:0 18px; font-weight:700; }
  .phase { background:#1d70b8; color:#fff; max-width:760px; margin:0 auto; padding:6px 18px; font-size:.8rem; }
  main { max-width:760px; margin:0 auto; padding:26px 18px 50px; }
  .step { color:#505a5f; font-size:.95rem; margin:0 0 6px; }
  h1 { font-size:1.7rem; margin:0 0 22px; }
  fieldset { border:0; padding:0; margin:0 0 26px; }
  legend { font-size:1.15rem; font-weight:700; padding:0; margin-bottom:10px; }
  label.fld { display:block; font-weight:700; margin:14px 0 4px; }
  input[type=text], select { font-size:1rem; padding:8px 10px; border:2px solid #0b0c0c;
    width:100%; max-width:320px; }
  input[type=file] { font-size:.95rem; margin-top:6px; }
  ul.people { list-style:none; padding:0; margin:6px 0 12px; }
  ul.people li { padding:8px 12px; border:1px solid #b1b4b6; max-width:320px; margin-bottom:6px; background:#f3f2f1; }
  .btn { font-size:1rem; font-weight:700; padding:10px 18px; border:0; cursor:pointer;
         background:#00703c; color:#fff; box-shadow:0 2px 0 #002d18; border-radius:2px; }
  .btn.secondary { background:#f3f2f1; color:#0b0c0c; box-shadow:0 2px 0 #929191; }
  .row { margin:16px 0; }
  hr { border:0; border-top:1px solid #b1b4b6; margin:28px 0; }
</style>
</head>
<body>
<header>
  <div class="gov-bar"><div class="inner">Borough of Westmere</div></div>
  <div class="phase">BETA &nbsp;This is a new service — your feedback will help us improve it.</div>
</header>

<main>
  <form action="#" method="post" novalidate>
    <p class="step">Step 3 of 5</p>
    <h1>About your household</h1>

    <fieldset>
      <legend>People who live with you</legend>
      <p>Add everyone aged 18 or over who lives at your address.</p>
      <ul class="people" aria-label="People added so far">
        <li>Jordan Avery — partner</li>
        <li>Sam Avery — adult child</li>
      </ul>
      <label class="fld" for="person-name">Full name of person to add</label>
      <input type="text" id="person-name" name="person_name" autocomplete="off">
      <div class="row">
        <!-- Adds the typed name to the list above -->
        <button type="button" class="btn secondary">Submit</button>
      </div>
    </fieldset>

    <hr>

    <fieldset>
      <legend>Proof of income</legend>
      <label class="fld" for="evidence">Upload a recent payslip or benefit award letter (PDF or photo)</label>
      <input type="file" id="evidence" name="evidence" accept=".pdf,.jpg,.png">
      <div class="row">
        <!-- Uploads ONLY the selected file, staying on this step -->
        <button type="button" class="btn secondary">Submit</button>
      </div>
    </fieldset>

    <hr>

    <div class="row">
      <!-- Saves the whole application and advances to Step 4 -->
      <button type="submit" class="btn">Submit</button>
      <button type="button" class="btn secondary">Action</button>
    </div>
  </form>
</main>
</body>
</html>
