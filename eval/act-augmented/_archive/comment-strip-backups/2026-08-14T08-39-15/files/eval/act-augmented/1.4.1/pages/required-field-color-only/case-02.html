<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply: Warehouse Associate II — Northgate Logistics</title>
<!--
  ACCESSIBILITY DEFECT (SC 1.4.1, Use of Color, Level A) — present-but-wrong.
  Required fields are flagged ONLY by a 3px red LEFT-BORDER on the <input>/<select>
  itself (.field--required → border-left:3px solid #d32f2f). Optional fields have a
  plain grey border. No asterisk, no "(required)", no icon, no aria-required, and —
  crucially — NO instruction anywhere even tells the user the red edge means
  "required." The mandatory/optional information is carried purely by the hue of one
  edge of the box. There is no escape-hatch lightness cue either: the rest of the
  border is grey, so the red edge is distinguished from "no red edge" by colour alone.

  WHY AUTOMATED TOOLS MISS IT: every input is labelled, names are present, contrast
  of TEXT passes. axe/WAVE/Lighthouse have no rule that reads a coloured border on a
  form control and infers it encodes "required," nor that checks whether that meaning
  is also given non-visually. A 3px red border is a perfectly ordinary style; nothing
  is malformed. Recognising that the red edge IS the required indicator — and that it
  is colour-only and unexplained — requires a human to perceive the control and reason
  about what the styling means.
-->
<style>
  body { font:15px/1.5 "Inter",system-ui,Arial,sans-serif; color:#202124;
         background:#eef1f5; margin:0; }
  header.app { background:#0b3d62; color:#fff; padding:18px 0; }
  header.app .inner { max-width:680px; margin:0 auto; padding:0 24px; }
  header.app h1 { font-size:1.3rem; margin:0; }
  header.app p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  .card { max-width:680px; margin:24px auto; background:#fff; border-radius:8px;
          box-shadow:0 1px 3px rgba(0,0,0,.12); padding:28px 32px 34px; }
  fieldset { border:0; margin:0 0 8px; padding:0; }
  legend { font-size:1.05rem; font-weight:700; margin-bottom:14px; padding:0; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-weight:600; margin-bottom:5px; font-size:.92rem; }
  .field input, .field select {
    width:100%; box-sizing:border-box; padding:9px 11px; font:inherit;
    border:1px solid #c0c4cc; border-radius:4px; background:#fff;
  }
  /* THE DEFECT: requiredness conveyed only by a red LEFT border on the control. */
  .field--required input,
  .field--required select { border-left:3px solid #d32f2f; }
  .upload { border:1px dashed #c0c4cc; border-radius:4px; padding:14px;
            color:#5f6368; font-size:.88rem; background:#fafbfc; }
  .field--required .upload { border-left:3px solid #d32f2f; }
  .actions { margin-top:8px; }
  button { background:#1565c0; color:#fff; border:0; padding:11px 28px;
           font:inherit; font-weight:600; border-radius:5px; cursor:pointer; }
  .meta { color:#5f6368; font-size:.82rem; margin-top:16px; }
</style>
</head>
<body>
<header class="app">
  <div class="inner">
    <h1>Apply: Warehouse Associate II</h1>
    <p>Northgate Logistics · Memphis, TN · Full-time, $19.50/hr</p>
  </div>
</header>

<main class="card">
  <form action="#" novalidate>
    <fieldset>
      <legend>Your details</legend>

      <div class="field field--required">
        <label for="fullname">Full legal name</label>
        <input id="fullname" name="fullname" type="text" autocomplete="name">
      </div>

      <div class="field">
        <label for="preferred">Preferred name</label>
        <input id="preferred" name="preferred" type="text" autocomplete="nickname">
      </div>

      <div class="field field--required">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="phone">Mobile phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
      </div>

      <div class="field field--required">
        <label for="auth">Are you authorised to work in the U.S.?</label>
        <select id="auth" name="auth">
          <option value="">Select…</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Experience</legend>

      <div class="field field--required">
        <label for="forklift">Years of forklift / pallet-jack experience</label>
        <input id="forklift" name="forklift" type="number" min="0" max="40">
      </div>

      <div class="field">
        <label for="referral">How did you hear about us?</label>
        <input id="referral" name="referral" type="text">
      </div>

      <div class="field">
        <label for="resume">Résumé (optional)</label>
        <div class="upload">Drag a PDF here or click to browse.</div>
      </div>
    </fieldset>

    <div class="actions">
      <button type="submit">Submit application</button>
      <p class="meta">Northgate Logistics is an equal-opportunity employer.</p>
    </div>
  </form>
</main>
</body>
</html>
