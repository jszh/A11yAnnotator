<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vineyard Cellars — Reserve a tasting</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS (case-01):
  EVERY input here is correctly, programmatically labelled. Each <label> uses a
  real `for=` that points at a real input `id`, every accessible name is
  descriptive ("Number of guests", "Preferred date", "Mobile number", "Party
  name"), and no field relies on title= or placeholder for its name. So axe-core
  (label, label-title-only, F111/aria-name checks), WAVE (missing / title-only
  label alerts) and Lighthouse ALL pass: the accessibility tree is internally
  consistent and lint-clean.

  The defect is a purely VISUAL / PROGRAMMATIC MISMATCH. Labels and inputs are
  SEPARATE grid items. Their CSS grid-row/grid-column placement paints each
  label directly ABOVE an input that it is NOT wired to. Example: the label
  "Preferred date" (for="visit-date") is rendered immediately above the input
  whose id is "guests"; the box for visit-date sits under "Number of guests".
  A sighted user types their guest count into the box captioned "Preferred
  date" and a date into the box captioned "Number of guests". A screen-reader
  user, who follows the for/id wiring, gets the OPPOSITE pairing. The visible
  relationship and the programmatic relationship contradict each other.

  No static checker evaluates whether a label's for-target is the input it is
  VISUALLY adjacent to. axe/WAVE/Lighthouse confirm "every input has a real
  label" and stop. Deciding that the label printed above a box governs a
  DIFFERENT box requires reading the rendered pixels and comparing visible
  adjacency to the for/id graph — contextual human/visual judgment.
-->
<style>
  body { font-family: "Trebuchet MS", Verdana, sans-serif; color: #2e2a26; margin: 0; background: #f3efe8; }
  .card { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid #e0d8c9; border-radius: 6px; padding: 30px 34px; box-shadow: 0 1px 3px rgba(80,60,30,.08); }
  .kicker { color: #8a6d3b; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 4px; }
  h1 { font-size: 22px; margin: 0 0 6px; color: #5a3e22; }
  .intro { color: #6b6258; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }

  /* A 2-column grid whose ROWS alternate label-row / input-row.
     Each label and each input is its OWN grid item, explicitly placed by
     grid-column / grid-row. The placement intentionally puts a label above an
     input it is NOT programmatically associated with. */
  .grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 22px; row-gap: 6px;
          grid-template-rows: auto auto 22px auto auto; align-items: end; }

  label { font-size: 13px; font-weight: bold; color: #5a3e22; margin-bottom: 6px; }
  input { box-sizing: border-box; padding: 9px 10px; border: 1px solid #cdbfa6; border-radius: 4px; font-size: 15px; background: #fffdf8; }

  /* --- Visual placement (what the eye sees) --- */
  /* Row 1: labels.  Left = "Number of guests", Right = "Preferred date". */
  .lbl-guests { grid-column: 1; grid-row: 1; }
  .lbl-date   { grid-column: 2; grid-row: 1; }
  /* Row 2: inputs SWAPPED.  Under "Number of guests" sits the DATE input;
     under "Preferred date" sits the GUESTS input. */
  .in-date    { grid-column: 1; grid-row: 2; }   /* id=visit-date, painted left  */
  .in-guests  { grid-column: 2; grid-row: 2; }   /* id=guests,     painted right */

  /* Row 4: labels.  Left = "Mobile number", Right = "Party name". */
  .lbl-mobile { grid-column: 1; grid-row: 4; }
  .lbl-party  { grid-column: 2; grid-row: 4; }
  /* Row 5: inputs SWAPPED the same way. */
  .in-party   { grid-column: 1; grid-row: 5; }   /* id=party-name, painted left  */
  .in-mobile  { grid-column: 2; grid-row: 5; }   /* id=mobile,     painted right */

  .btn { margin-top: 26px; background: #5a3e22; color: #fff; border: none; padding: 12px 28px; border-radius: 4px; letter-spacing: .06em; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker">Vineyard Cellars · Tasting reservations</p>
    <h1>Reserve a tasting</h1>
    <p class="intro">Book a guided flight in our barrel room. Tell us a little about your visit and we will hold your spot.</p>

    <form action="#" method="post" novalidate>
      <!--
        DOM order: label(guests), input#guests, label(date), input#visit-date,
        label(mobile), input#mobile, label(party), input#party-name.
        Every for/id pair is valid. CSS grid-column/grid-row (above) repaints
        the INPUT cells swapped within each row, so the visible caption over a
        box names a different field than the box's programmatic label.
      -->
      <div class="grid">
        <label class="lbl-guests" for="guests">Number of guests</label>
        <input class="in-guests" type="text" id="guests" name="guests" inputmode="numeric" autocomplete="off">

        <label class="lbl-date" for="visit-date">Preferred date</label>
        <input class="in-date" type="text" id="visit-date" name="visit-date" placeholder="MM / DD / YYYY" autocomplete="off">

        <label class="lbl-mobile" for="mobile">Mobile number</label>
        <input class="in-mobile" type="text" id="mobile" name="mobile" inputmode="tel" autocomplete="tel">

        <label class="lbl-party" for="party-name">Party name</label>
        <input class="in-party" type="text" id="party-name" name="party-name" autocomplete="name">
      </div>

      <button type="submit" class="btn">Hold my spot</button>
    </form>
  </div>
</body>
</html>
