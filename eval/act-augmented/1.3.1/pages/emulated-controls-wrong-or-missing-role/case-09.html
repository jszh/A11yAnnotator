<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funnel report — Plumeline Analytics</title>
  <style>
    :root { --ink:#1a2230; --muted:#677182; --line:#e4e8ef; --teal:#0e9488; --bg:#f6f8fb; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .app { max-width:820px; margin:2rem auto; padding:0 1.25rem; }
    h1 { font-size:1.45rem; margin:0 0 .15rem; }
    .sub { color:var(--muted); font-size:.9rem; margin:0 0 1.3rem; }

    .tabs { display:flex; gap:.4rem; border-bottom:2px solid var(--line); }
    .tab {
      padding:.6rem 1rem; cursor:pointer; user-select:none; font-weight:600; font-size:.95rem;
      color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px;
    }
    .tab:hover { color:var(--ink); }
    .tab.active { color:var(--ink); border-bottom-color:var(--teal); }   
    .tab:focus-visible { outline:2px solid var(--teal); outline-offset:2px; border-radius:4px; }

    .panel { background:var(--card); border:1px solid var(--line); border-top:0; border-radius:0 0 12px 12px; padding:1.4rem; }
    .panel[hidden] { display:none; }
    .kpi { display:flex; gap:2.2rem; flex-wrap:wrap; }
    .kpi .n { font-size:1.7rem; font-weight:700; }
    .kpi .l { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.4px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Funnel report</h1>
    <p class="sub">Acme Store &middot; last 30 days &middot; updated 09:12</p>

    <div class="tabs" role="tablist" aria-label="Funnel report sections">
      <div class="tab active" id="tab-overview" role="tab" aria-selected="true" aria-controls="panel-overview" tabindex="0" data-panel="overview" onclick="pick(this)" onkeydown="keyPick(event,this)">Overview</div>
      <div class="tab" id="tab-acquisition" role="tab" aria-selected="false" aria-controls="panel-acquisition" tabindex="-1" data-panel="acquisition" onclick="pick(this)" onkeydown="keyPick(event,this)">Acquisition</div>
      <div class="tab" id="tab-retention" role="tab" aria-selected="false" aria-controls="panel-retention" tabindex="-1" data-panel="retention" onclick="pick(this)" onkeydown="keyPick(event,this)">Retention</div>
    </div>

    <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
      <div class="kpi">
        <div><div class="n">48,210</div><div class="l">Sessions</div></div>
        <div><div class="n">3.4%</div><div class="l">Conversion</div></div>
        <div><div class="n">$61,940</div><div class="l">Revenue</div></div>
      </div>
    </section>
    <section class="panel" id="panel-acquisition" role="tabpanel" aria-labelledby="tab-acquisition" tabindex="0" hidden>
      <div class="kpi">
        <div><div class="n">22,108</div><div class="l">New users</div></div>
        <div><div class="n">Organic</div><div class="l">Top channel</div></div>
        <div><div class="n">$1.92</div><div class="l">Cost / click</div></div>
      </div>
    </section>
    <section class="panel" id="panel-retention" role="tabpanel" aria-labelledby="tab-retention" tabindex="0" hidden>
      <div class="kpi">
        <div><div class="n">38%</div><div class="l">30-day return</div></div>
        <div><div class="n">2.7</div><div class="l">Sessions / user</div></div>
        <div><div class="n">14d</div><div class="l">Median repeat</div></div>
      </div>
    </section>
  </div>

  <script>
    function allTabs() { return Array.from(document.querySelectorAll('[role="tab"]')); }
    function pick(el) {
      allTabs().forEach(function (t) {
        var selected = t === el;
        t.classList.toggle('active', selected);
        t.setAttribute('aria-selected', String(selected));
        t.tabIndex = selected ? 0 : -1;
      });
      var which = el.getAttribute('data-panel');
      ['overview', 'acquisition', 'retention'].forEach(function (p) {
        document.getElementById('panel-' + p).hidden = (p !== which);
      });
    }
    function keyPick(e, el) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(el); return; }
      var tabs = allTabs();
      var index = tabs.indexOf(el);
      var next = null;
      if (e.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
      if (e.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length];
      if (e.key === 'Home') next = tabs[0];
      if (e.key === 'End') next = tabs[tabs.length - 1];
      if (next) { e.preventDefault(); pick(next); next.focus(); }
    }
  </script>
</body>
</html>
