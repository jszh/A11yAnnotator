<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helmsman — Operations Dashboard</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter", system-ui, sans-serif; background:#0f172a; color:#e2e8f0; }
  .appbar { display:flex; align-items:center; justify-content:space-between;
            padding:14px 26px; background:#111c33; border-bottom:1px solid #1e2b45; }
  .appbar .logo { font-weight:700; color:#38bdf8; letter-spacing:.5px; }
  .appbar .env { font-size:.78rem; color:#94a3b8; }
  main { padding:26px; }
  main > h1 { font-size:1.25rem; margin:0 0 4px; }
  main > .since { color:#94a3b8; font-size:.82rem; margin:0 0 22px; }

  .board { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
  .widget { background:#152138; border:1px solid #1e2b45; border-radius:12px; padding:18px 20px; }
  .widget .k { font-size:.78rem; color:#94a3b8; text-transform:uppercase; letter-spacing:.06em; }
  .widget .v { font-size:2rem; font-weight:700; margin:6px 0 2px; }
  .widget .d { font-size:.82rem; }
  .up { color:#f87171; } .down { color:#34d399; } .flat { color:#94a3b8; }
  .widget.head { background:#1b2c4a; }
  .widget.head .k { color:#cbd5e1; }
  .spark { height:34px; margin-top:10px; background:
    repeating-linear-gradient(90deg,#1e3a5f 0 4px,transparent 4px 8px); border-radius:4px; }
</style>
</head>
<body>
  <header class="appbar">
    <span class="logo">Helmsman</span>
    <span class="env">prod · us-east-1</span>
  </header>

  <main>
    <h1 id="metrics-heading">Operations Dashboard</h1>
    <p class="since">Live · refreshed 12 seconds ago</p>

    <section class="board" aria-labelledby="metrics-heading">
      <div>
        <div class="widget head">
          <div class="k">System Health</div>
          <div class="v down">Healthy</div>
          <div class="d flat">all checks green</div>
        </div>
        <div class="widget head">
          <div class="k">Delivery</div>
          <div class="v">4.2/day</div>
          <div class="d down">deploys this week</div>
        </div>
        <div class="widget head">
          <div class="k">Reliability</div>
          <div class="v">99.95%</div>
          <div class="d flat">30-day uptime</div>
        </div>
      </div>
      <div>
        <div class="widget">
          <div class="k">Latency p95</div>
          <div class="v">218&nbsp;ms</div>
          <div class="d up">▲ 9% vs. yesterday</div>
          <div class="spark"></div>
        </div>
        <div class="widget">
          <div class="k">Active Incidents</div>
          <div class="v">0</div>
          <div class="d down">▼ none open</div>
          <div class="spark"></div>
        </div>
        <div class="widget">
          <div class="k">Error Rate</div>
          <div class="v">0.31%</div>
          <div class="d down">▼ 0.04 pts</div>
          <div class="spark"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
