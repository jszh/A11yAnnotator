<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Insurance — Auto quote · Driver details</title>
<style>
  :root { --ink:#1d2733; --line:#cdd6e0; --brand:#0b5cab; }
  body { font-family: Verdana, Geneva, sans-serif; color: var(--ink); background: #eef2f6; margin: 0; }
  .panel { max-width: 600px; margin: 40px auto; background: #fff; border-top: 5px solid var(--brand); box-shadow: 0 1px 8px rgba(20,40,70,.12); padding: 30px 38px 40px; }
  h1 { font-size: 21px; margin: 0 0 2px; }
  .crumb { color: var(--brand); font-size: 12px; font-weight: bold; letter-spacing: .05em; }
  .req-note { background: #fdf0f0; border: 1px solid #f3c9c9; color: #7a1f1f; font-size: 13px; padding: 9px 12px; border-radius: 4px; margin: 16px 0 24px; }
  .fld { margin: 0 0 18px; }
  .fld label { display: block; font-size: 14px; margin-bottom: 5px; }
  label.required { color: #c0182b; }
  input, select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--line); font-size: 14px; border-radius: 3px; }
  .pay { background: var(--brand); color: #fff; border: none; padding: 12px 30px; border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
</style>
</head>
<body>
  <div class="panel">
    <p class="crumb">AUTO QUOTE › DRIVER DETAILS</p>
    <h1>Tell us about the primary driver</h1>

    <p class="req-note" id="required-note">Fields marked <strong>“(required)”</strong> are required to generate your quote and are also shown in red.</p>

    <form action="#" method="post" novalidate>
      <div class="two">
        <div class="fld">
          <label for="first" class="required">Legal first name (required)</label>
          <input type="text" id="first" autocomplete="given-name" required aria-required="true" aria-describedby="required-note">
        </div>
        <div class="fld">
          <label for="last" class="required">Legal last name (required)</label>
          <input type="text" id="last" autocomplete="family-name" required aria-required="true" aria-describedby="required-note">
        </div>
      </div>

      <div class="fld">
        <label for="dob" class="required">Date of birth (required)</label>
        <input type="date" id="dob" autocomplete="bday" required aria-required="true" aria-describedby="required-note">
      </div>

      <div class="fld">
        <label for="middle">Middle name</label>
        <input type="text" id="middle" autocomplete="additional-name">
      </div>

      <div class="fld">
        <label for="license" class="required">Driver's license number (required)</label>
        <input type="text" id="license" inputmode="text" required aria-required="true" aria-describedby="required-note">
      </div>

      <div class="fld">
        <label for="prior">Years with prior insurer</label>
        <select id="prior">
          <option value="">Select…</option>
          <option>Less than 1 year</option>
          <option>1–3 years</option>
          <option>4+ years</option>
        </select>
      </div>

      <button type="submit" class="pay">See my quote</button>
    </form>
  </div>
</body>
</html>
