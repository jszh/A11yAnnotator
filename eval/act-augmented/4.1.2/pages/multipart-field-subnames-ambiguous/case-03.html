<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a payment method — Lumen Studio billing</title>
  <style>
    :root { --ink:#101319; --muted:#6b7280; --line:#e2e5ea; --brand:#5b3df5; --bg:#f7f8fb; --field:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",system-ui,-apple-system,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    .Page { max-width:560px; margin:0 auto; padding:2.2rem 1.25rem 4rem; }
    .Page-eyebrow { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); font-weight:700; }
    h1 { font-size:1.5rem; margin:.35rem 0 .3rem; }
    .Page-sub { color:var(--muted); margin:0 0 1.7rem; font-size:.95rem; }
    .Card { background:var(--field); border:1px solid var(--line); border-radius:14px; padding:1.5rem; box-shadow:0 1px 2px rgba(16,19,25,.04); }
    .Field { margin-bottom:1.25rem; }
    .Field-label { display:block; font-size:.85rem; font-weight:600; margin-bottom:.45rem; }
    .Field-help { font-size:.78rem; color:var(--muted); margin-top:.4rem; }
    .Input { font:inherit; padding:.62rem .7rem; border:1px solid var(--line); border-radius:9px; background:var(--field); width:100%; }
    .Input:focus { outline:2px solid var(--brand); outline-offset:1px; }
    .CardNumber { display:flex; align-items:center; gap:.55rem; }
    .CardNumber .Input { width:4.3rem; text-align:center; letter-spacing:.12em; font-variant-numeric:tabular-nums; }
    .CardNumber .sep { color:var(--muted); user-select:none; }
    .Grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .Btn { width:100%; background:var(--brand); color:#fff; border:0; border-radius:10px; padding:.8rem; font:inherit; font-weight:700; cursor:pointer; margin-top:.4rem; }
    .Brandline { font-weight:800; color:var(--brand); letter-spacing:-.01em; }
  </style>
</head>
<body>
  <main class="Page">
    <div class="Brandline">Lumen Studio</div>
    <p class="Page-eyebrow">Billing</p>
    <h1>Add a payment method</h1>
    <p class="Page-sub">Your card is stored securely and only charged when an invoice is due. You can remove it anytime.</p>

    <div class="Card">
      <form action="#" method="post" novalidate>
        <div class="Field">
          <label class="Field-label" for="cardname">Name on card</label>
          <input class="Input" id="cardname" name="cardname" type="text" value="R. CALDWELL" autocomplete="cc-name">
        </div>

        <div class="Field" role="group" aria-labelledby="cc-group-label">
          <span class="Field-label" id="cc-group-label">Card number</span>
          <div class="CardNumber">
            <input class="Input" type="text" inputmode="numeric" maxlength="4" value="4242" aria-label="Card number" autocomplete="off">
            <span class="sep" aria-hidden="true">&middot;&middot;</span>
            <input class="Input" type="text" inputmode="numeric" maxlength="4" value="4242" aria-label="Card number" autocomplete="off">
            <span class="sep" aria-hidden="true">&middot;&middot;</span>
            <input class="Input" type="text" inputmode="numeric" maxlength="4" value="4242" aria-label="Card number" autocomplete="off">
            <span class="sep" aria-hidden="true">&middot;&middot;</span>
            <input class="Input" type="text" inputmode="numeric" maxlength="4" value="4242" aria-label="Card number" autocomplete="off">
          </div>
          <p class="Field-help">16-digit number on the front of the card.</p>
        </div>

        <div class="Grid2">
          <div class="Field">
            <label class="Field-label" for="exp">Expiry</label>
            <input class="Input" id="exp" name="exp" type="text" inputmode="numeric" placeholder="MM / YY" value="07 / 28" autocomplete="cc-exp">
          </div>
          <div class="Field">
            <label class="Field-label" for="cvc">CVC</label>
            <input class="Input" id="cvc" name="cvc" type="text" inputmode="numeric" maxlength="4" value="123" autocomplete="cc-csc">
          </div>
        </div>

        <button class="Btn" type="submit">Save card</button>
      </form>
    </div>
  </main>
</body>
</html>
