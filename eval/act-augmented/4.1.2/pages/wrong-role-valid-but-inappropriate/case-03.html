<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display settings — Cirro Weather</title>
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#0284c7; --bg:#f1f5f9; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",system-ui,Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:600px; margin:2.4rem auto; padding:0 1.2rem; }
    h1 { font-size:1.5rem; margin:0 0 1.4rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.4rem 1.5rem; }
    .field { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .field .lbl { font-weight:600; }
    .field .hint { color:var(--muted); font-size:.85rem; margin-top:.15rem; }
    .seg { display:inline-flex; border:1px solid var(--brand); border-radius:9px; overflow:hidden; }
    .seg .opt { padding:.5rem 1.1rem; font-weight:600; cursor:pointer; user-select:none; color:var(--brand);
                background:#fff; border-right:1px solid var(--brand); transition:background .12s, color .12s; }
    .seg .opt:last-child { border-right:0; }
    .seg .opt[aria-pressed="true"] { background:var(--brand); color:#fff; }
    .seg .opt:focus-visible { outline:2px solid #38bdf8; outline-offset:-2px; }
    .forecast { margin-top:1.6rem; display:flex; gap:1rem; }
    .day { flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:.9rem; text-align:center; }
    .day .d { font-size:.8rem; color:var(--muted); }
    .day .t { font-size:1.5rem; font-weight:700; margin-top:.3rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Display settings</h1>
    <div class="card">
      <div class="field">
        <div>
          <div class="lbl" id="unit-lbl">Temperature unit</div>
          <div class="hint">Applies to all forecasts and alerts.</div>
        </div>
        <div class="seg" aria-labelledby="unit-lbl">
          <div class="opt" role="button" tabindex="0" aria-pressed="true" data-unit="c">°C</div>
          <div class="opt" role="button" tabindex="0" aria-pressed="false" data-unit="f">°F</div>
        </div>
      </div>
    </div>

    <div class="forecast" id="forecast">
      <div class="day"><div class="d">Mon</div><div class="t" data-c="21">21°</div></div>
      <div class="day"><div class="d">Tue</div><div class="t" data-c="19">19°</div></div>
      <div class="day"><div class="d">Wed</div><div class="t" data-c="24">24°</div></div>
    </div>
  </div>

  <script>
    var opts = document.querySelectorAll('.seg .opt');
    function render(unit) {
      document.querySelectorAll('#forecast .t').forEach(function (el) {
        var c = parseInt(el.getAttribute('data-c'), 10);
        el.textContent = unit === 'f' ? Math.round(c * 9 / 5 + 32) + '°' : c + '°';
      });
    }
    function select(chosen) {
      opts.forEach(function (o) { o.setAttribute('aria-pressed', o === chosen ? 'true' : 'false'); });
      render(chosen.getAttribute('data-unit'));
    }
    opts.forEach(function (o) {
      o.addEventListener('click', function () { select(o); });
      o.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(o); }
      });
    });
  </script>
</body>
</html>
