<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave a review — Tavola</title>
  <style>
    :root { --ink:#2b211a; --muted:#7a6c5d; --line:#e7ddd0; --gold:#e0a106; --bg:#faf6ef; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; }
    .wrap { max-width:560px; margin:2.4rem auto; padding:0 1.2rem; }
    h1 { font-size:1.5rem; margin:0 0 .2rem; }
    p.sub { color:var(--muted); margin:0 0 1.6rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:1.5rem 1.6rem; }
    .field { margin-bottom:1.3rem; }
    .field > label, .field > .flabel { display:block; font-weight:600; margin-bottom:.5rem; }
    .stars { display:inline-flex; gap:.25rem; }
    .star { font-size:1.9rem; line-height:1; color:var(--line); cursor:pointer; transition:color .1s ease; user-select:none; }
    .star.on { color:var(--gold); }
    .star:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }
    textarea { width:100%; min-height:90px; padding:.6rem .7rem; border:1px solid var(--line); border-radius:8px; font:inherit; resize:vertical; }
    button { font:inherit; font-weight:600; background:var(--ink); color:#fff; border:0; border-radius:8px; padding:.7rem 1.5rem; cursor:pointer; }
    .echo { color:var(--muted); font-size:.85rem; margin-top:.4rem; min-height:1.2em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>How was Tavola?</h1>
    <p class="sub">Your review helps other diners. It only takes a minute.</p>

    <form class="card" action="#" method="post" novalidate>
      <div class="field">
        <span class="flabel" id="rating-lbl">Your rating</span>
        <div class="stars" aria-labelledby="rating-lbl">
          <span class="star" role="img" tabindex="0" aria-label="1 star"  data-v="1">★</span>
          <span class="star" role="img" tabindex="0" aria-label="2 stars" data-v="2">★</span>
          <span class="star" role="img" tabindex="0" aria-label="3 stars" data-v="3">★</span>
          <span class="star" role="img" tabindex="0" aria-label="4 stars" data-v="4">★</span>
          <span class="star" role="img" tabindex="0" aria-label="5 stars" data-v="5">★</span>
        </div>
        <div class="echo" id="echo" aria-live="polite"></div>
        <input type="hidden" name="rating" id="rating-input" value="">
      </div>

      <div class="field">
        <label for="comment">Your review</label>
        <textarea id="comment" name="comment" placeholder="What stood out? The pasta, the service, the room…"></textarea>
      </div>

      <button type="submit">Post review</button>
    </form>
  </div>

  <script>
    var stars = Array.prototype.slice.call(document.querySelectorAll('.star'));
    var input = document.getElementById('rating-input');
    var echo = document.getElementById('echo');
    function paint(v) { stars.forEach(function (s) { s.classList.toggle('on', parseInt(s.getAttribute('data-v'),10) <= v); }); }
    function setRating(v) { input.value = v; paint(v); echo.textContent = 'You rated ' + v + ' out of 5.'; }
    stars.forEach(function (s) {
      var v = parseInt(s.getAttribute('data-v'), 10);
      s.addEventListener('mouseenter', function () { paint(v); });
      s.addEventListener('mouseleave', function () { paint(parseInt(input.value || 0, 10)); });
      s.addEventListener('click', function () { setRating(v); });
      s.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setRating(v); }
      });
    });
  </script>
</body>
</html>
