<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan a trip — Riverside Metro Transit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font: 15px/1.5 "Helvetica Neue", Arial, sans-serif;
      margin: 0; color: #1b1f24; background: #f0f3f6;
    }
    .masthead { background: #0b5d3b; color: #fff; padding: .9rem 1.25rem; }
    .masthead .logo { font-weight: 800; letter-spacing: .02em; }
    .masthead .logo span { font-weight: 400; opacity: .8; }
    main { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .toolbar {
      background: #fff; border: 1px solid #d3dae1; border-radius: 10px;
      padding: 1rem 1.1rem; display: flex; flex-wrap: wrap; gap: 1.1rem; align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: .25rem; }
    .field label { font-size: .78rem; font-weight: 700; color: #45525e; text-transform: uppercase; letter-spacing: .03em; }
    .field input {
      font: inherit; padding: .5rem .6rem; border: 1px solid #b9c3cc; border-radius: 6px; min-width: 9.5rem;
    }
    .grp { display: flex; gap: .4rem; align-items: flex-end; }
    .btn {
      font: inherit; font-weight: 700; cursor: pointer;
      background: #0b5d3b; color: #fff; border: 0; border-radius: 6px; padding: .55rem 1.1rem;
    }
    .btn.alt { background: #5b6873; }
    .btn:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
    .results { margin-top: 1.5rem; color: #56636e; }
    .results p { background: #fff; border: 1px dashed #cdd5dd; border-radius: 8px; padding: 1.2rem; }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="logo">Riverside Metro <span>Transit</span></div>
  </header>

  <main>
    <h1>Plan a trip</h1>

    <div class="toolbar" role="toolbar" aria-label="Trip planner controls">
      <div class="field">
        <label for="from">From stop</label>
        <input id="from" type="text" value="Birchwood &amp; 4th">
      </div>
      <div class="field">
        <label for="to">To stop</label>
        <input id="to" type="text" value="Riverside Transit Center">
      </div>

      <div class="grp">
        <button type="button" class="btn" onclick="return false">Go</button>
        <button type="button" class="btn alt" onclick="return false">Go</button>
        <button type="button" class="btn alt" onclick="return false">Go</button>
      </div>
    </div>

    <div class="results" aria-live="off">
      <p>Enter a start and destination stop, then run the planner to see departures,
         transfers, and estimated arrival times for the next two hours.</p>
    </div>
  </main>

</body>
</html>
