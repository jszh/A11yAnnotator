<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a Quote — Step 2 of 4 · MapleShield Auto Insurance</title>
<style>
  body { font:15px/1.5 system-ui,"Helvetica Neue",Arial,sans-serif; color:#1d1d1f;
         background:#e9edf2; margin:0; }
  .shell { max-width:700px; margin:24px auto; background:#fff; border-radius:10px;
           overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  .brandbar { background:#7a1f2b; color:#fff; padding:16px 30px; }
  .brandbar h1 { font-size:1.2rem; margin:0; }
  .steps { display:flex; gap:6px; padding:14px 30px; background:#f5f0f1;
           font-size:.8rem; color:#7a7a7a; }
  .steps b { color:#7a1f2b; }
  .body { padding:8px 30px 32px; }
  .instr { background:#fdf3f4; border:1px solid #f0d8db; border-radius:6px;
           padding:9px 13px; margin:18px 0 24px; font-size:.9rem; }
  h2 { font-size:1.08rem; margin:26px 0 12px; border-bottom:1px solid #ececec;
       padding-bottom:6px; }
  .f { margin-bottom:15px; }
  .f label { display:block; font-weight:600; font-size:.9rem; margin-bottom:4px; }
  .f.req label { color:#c0392b; }
  .reqword { font-weight:600; }
  .f input, .f select {
    width:100%; box-sizing:border-box; padding:8px 11px; font:inherit;
    border:1px solid #c2c6cc; border-radius:5px; background:#fff;
  }
  .nav { display:flex; justify-content:space-between; margin-top:24px; }
  .nav a { color:#7a1f2b; text-decoration:none; font-weight:600; align-self:center; }
  button { background:#7a1f2b; color:#fff; border:0; padding:11px 30px; font:inherit;
           font-weight:600; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div class="shell">
  <div class="brandbar"><h1>MapleShield Auto Insurance — Get a Quote</h1></div>
  <div class="steps">
    <span>1 Coverage</span> ›
    <b>2 Driver &amp; vehicle</b> ›
    <span>3 History</span> ›
    <span>4 Review</span>
  </div>

  <div class="body">
    <p class="instr">Required fields are marked in red. Optional fields help us refine your
    quote but can be left blank.</p>

    <form action="#" novalidate>
      <h2>Driver details</h2>

      <div class="f req">
        <label for="dname">Primary driver name <span class="reqword">(required)</span></label>
        <input id="dname" name="dname" type="text" autocomplete="name">
      </div>
      <div class="f req">
        <label for="dlicense">Driver's licence number <span class="reqword">(required)</span></label>
        <input id="dlicense" name="dlicense" type="text">
      </div>
      <div class="f">
        <label for="dyears">Years licensed</label>
        <input id="dyears" name="dyears" type="number" min="0" max="80">
      </div>
      <div class="f req">
        <label for="dpostal">Postal code <span class="reqword">(required)</span></label>
        <input id="dpostal" name="dpostal" type="text" autocomplete="postal-code">
      </div>

      <h2>Vehicle details</h2>

      <div class="f req">
        <label for="vmake">Make</label>
        <input id="vmake" name="vmake" type="text">
      </div>
      <div class="f req">
        <label for="vmodel">Model</label>
        <input id="vmodel" name="vmodel" type="text">
      </div>
      <div class="f">
        <label for="vtrim">Trim / package</label>
        <input id="vtrim" name="vtrim" type="text">
      </div>
      <div class="f req">
        <label for="vyear">Model year</label>
        <input id="vyear" name="vyear" type="number" min="1980" max="2026">
      </div>
      <div class="f req">
        <label for="vvin">VIN</label>
        <input id="vvin" name="vvin" type="text" maxlength="17">
      </div>
      <div class="f">
        <label for="vmileage">Annual mileage</label>
        <input id="vmileage" name="vmileage" type="number" min="0">
      </div>

      <div class="nav">
        <a href="#">‹ Back to coverage</a>
        <button type="submit">Continue to history ›</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
