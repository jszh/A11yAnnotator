<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحويل أموال — مصرف الواحة الرقمي</title>
<!--
  WHY THIS IS A TRUE-NEGATIVE (PASSES 1.4.1 via the LIGHTNESS escape hatch):
  An Arabic (RTL) mobile-banking transfer form in its post-submit error state. The
  invalid "amount" field is given a DARK-RED border (#7c0c12) while the valid fields
  keep a LIGHT-GRAY border (#c1c7cd). There is still no inline error text and no icon —
  so on its face it looks like the same color-only pattern as case-01. The crucial
  difference is LIGHTNESS: #7c0c12 vs #c1c7cd differ in relative luminance by ~6.4:1,
  far above the 3:1 the Understanding note allows. In grayscale the invalid border reads
  as a conspicuously DARKER, heavier line than the pale valid borders — a non-color
  visual distinction (lightness) survives when hue is removed. Per the WCAG note, this
  counts as an additional visual distinction and PASSES 1.4.1. Included to test the
  evaluator's grasp of the 3:1-lightness escape hatch: this is NOT failed even though
  no text/icon is present. (It may still have OTHER issues under 3.3.1/4.1.2 — those are
  out of 1.4.1's scope.) Note also: this is a lightness difference, NOT a reliance on
  "red vs green" hue identification, so the "perceive a particular color" caveat does
  not bite. Pre-rendered in the error state on load.
-->
<style>
  :root { --ink:#1c2530; --muted:#5a6573; --bg:#eef2f6; --bank:#0a5c54; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 "Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
         color:var(--ink); background:var(--bg); }
  .app { max-width:460px; margin:0 auto; min-height:100vh; background:#fff; box-shadow:0 0 30px rgba(0,0,0,.06); }
  .top { background:var(--bank); color:#fff; padding:18px 22px; }
  .top h1 { margin:0; font-size:1.2rem; } .top p { margin:3px 0 0; opacity:.92; font-size:.86rem; }
  .body { padding:22px 22px 30px; }
  h2 { font-size:1.05rem; margin:0 0 6px; } .lede { color:var(--muted); font-size:.9rem; margin:0 0 20px; }

  .banner { background:#fbecec; border:1px solid #efbcbc; color:#7c1b1b; border-radius:7px;
            padding:9px 12px; font-size:.88rem; margin-bottom:18px; }

  .field { margin-bottom:18px; }
  label { display:block; font-weight:700; font-size:.86rem; margin:0 0 6px; }
  input, select { width:100%; padding:11px 13px; font-size:1rem; border-radius:8px;
                  background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--bank); outline-offset:1px; }

  /* === the (passing) cue ===
     valid = LIGHT-GRAY border; invalid = DARK-RED border.
     Luminance contrast between them ~6.4:1 (>3:1) → distinguishable in grayscale by
     LIGHTNESS alone, so the distinction is not color (hue) only. */
  .ok  { border:2px solid #c1c7cd; }   /* light gray  — L* high */
  .bad { border:2px solid #7c0c12; }   /* dark red    — L* very low; reads as a dark, heavy line */

  .hint { font-size:.8rem; color:var(--muted); margin:6px 0 0; }
  button { width:100%; padding:12px; font-size:1rem; font-weight:700; color:#fff; background:var(--bank);
           border:0; border-radius:8px; cursor:pointer; margin-top:6px; }
  .foot { padding:14px 22px 24px; color:var(--muted); font-size:.76rem; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>مصرف الواحة الرقمي</h1>
    <p>تحويل أموال محلي</p>
  </div>
  <div class="body">
    <h2>تأكيد التحويل</h2>
    <p class="lede">يرجى مراجعة بيانات التحويل قبل الإرسال.</p>

    <div class="banner" role="alert">تعذّر إتمام التحويل. يرجى مراجعة البيانات والمحاولة مرة أخرى.</div>

    <form action="#" method="post" novalidate>
      <!-- valid: light-gray border -->
      <div class="field">
        <label for="to">حساب المستفيد</label>
        <input class="ok" id="to" name="to" inputmode="numeric" value="SA44 2000 0001 6010 0531 9000">
      </div>

      <!-- INVALID: dark-red border. No text/icon — but lightness vs the gray borders is >3:1,
           so a grayscale viewer still sees a distinctly DARKER, heavier line here. -->
      <div class="field">
        <label for="amount">المبلغ (ريال)</label>
        <input class="bad" id="amount" name="amount" inputmode="decimal" value="">
        <p class="hint">الحد الأقصى للتحويل اليومي 20,000 ريال.</p>
      </div>

      <!-- valid -->
      <div class="field">
        <label for="memo">ملاحظة (اختياري)</label>
        <input class="ok" id="memo" name="memo" value="إيجار الشهر">
      </div>

      <div class="field">
        <label for="from">من حساب</label>
        <select class="ok" id="from" name="from">
          <option selected>الحساب الجاري — ‎•••3019</option>
          <option>حساب التوفير — ‎•••8842</option>
        </select>
      </div>

      <button type="submit">تأكيد وإرسال</button>
    </form>
  </div>
  <div class="foot">مصرف الواحة الرقمي · خدمة العملاء 8001234567 · يعمل من file:// بالكامل</div>
</div>
</body>
</html>
