<body>
  <div class="wrap">
    <h1>fern-cli 2.3.0 — Release notes</h1>
    <p class="lead">A maintenance release. Copy the changelog below into your upgrade ticket.</p>

    <pre class="divider" role="img" aria-label="Decorative divider">============================================================</pre>

    <label class="fl" for="log">CHANGELOG (read-only)</label>
    <textarea id="log" readonly>fern-cli 2.3.0  (2026-06-18)

Added
  - `fern sync --dry-run` previews changes without writing to disk.
  - Shell completion for zsh, in addition to bash.
  - New `--since` flag on `fern log` to filter by date.

Fixed
  - Crash when the config file contained a trailing comma.
  - `fern init` no longer overwrites an existing .fernrc without --force.
  - Progress bar now hides correctly in non-interactive shells.

Changed
  - Default timeout raised from 10s to 30s for slow mirrors.
  - Deprecated `fern pull`; use `fern sync` instead (removal in 3.0).

Thanks to everyone who reported issues for this release.</textarea>

  </div>
