<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Time — Harriers 3, Wanderers 1 | Borough League Live</title>
<style>
  :root { --ink:#10151b; --turf:#0f7a3d; --paper:#fff; --line:#d8dee4; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 system-ui,Segoe UI,sans-serif; color:var(--ink);
         background:#eef1f3; }
  header { background:var(--ink); color:#fff; padding:22px 24px; }
  header h1 { margin:0; font-size:1.3rem; letter-spacing:.4px; }
  header .ft { color:#7be0a6; font-weight:700; letter-spacing:1px; font-size:.8rem; }
  main { max-width:620px; margin:0 auto; padding:28px 20px 64px; }

  .board {
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:26px 30px; margin-top:8px;
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "home  homescore"
      "away  awayscore";
    row-gap:14px; column-gap:24px; align-items:center;
  }
  .board .team  { font-size:1.4rem; font-weight:600; }
  .board .score { font-size:2.4rem; font-weight:800; color:var(--turf); justify-self:end; }
  .home      { grid-area:home; }
  .away      { grid-area:away; }
  .homescore { grid-area:homescore; }
  .awayscore { grid-area:awayscore; }

  .note { color:#5a6772; font-size:.92rem; margin-top:22px; }
  footer { border-top:1px solid var(--line); margin-top:40px; padding-top:16px;
           font-size:.85rem; color:#5a6772; }
</style>
</head>
<body>
<header>
  <span class="ft">FULL TIME</span>
  <h1>Borough League · Matchday 11</h1>
</header>
<main>
  <section class="board" aria-label="Final score">
    <div class="team home">Hillside Harriers</div>
    <div class="team away">Riverton Wanderers</div>
    <div class="score homescore">3</div>
    <div class="score awayscore">1</div>
  </section>

  <p class="note">Goals: Achebe 12', 67', Lindqvist 81' (Harriers); Pratt 54' (Wanderers).
     Attendance 4,210.</p>

  <footer>
    Borough League Live · Unofficial fan scoreboard · Renders from file:// with no assets.
  </footer>
</main>
</body>
</html>
