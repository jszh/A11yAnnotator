<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Northwind Outfitters</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; color:#16242e;
           background:#f4f6f8; line-height:1.6; }
    header { background:#0e4d64; color:#fff; padding:.9rem 1.4rem; }
    header .brand { font-weight:700; letter-spacing:.02em; font-size:1.15rem; }
    main { max-width:60rem; margin:1.6rem auto; padding:0 1.2rem; }
    h1 { font-size:1.35rem; margin:.2rem 0 1.2rem; }

    .wizard { display:flex; gap:1rem; align-items:stretch;
              list-style:none; margin:0 0 1.6rem; padding:0; }
    .step { flex:1; background:#fff; border:1px solid #d6dde2; border-radius:10px;
            padding:1rem 1.1rem 1.2rem; position:relative; }
    .step__num {
      display:inline-flex; align-items:center; justify-content:center;
      width:1.9rem; height:1.9rem; border-radius:50%;
      background:#0e4d64; color:#fff; font-weight:700; margin-bottom:.5rem;
    }
    .step h2 { font-size:1rem; margin:.2rem 0 .3rem; }
    .step p { font-size:.86rem; color:#54636d; margin:0; }
    .step--current { border-color:#0e4d64; box-shadow:0 0 0 2px #0e4d64 inset; }

    fieldset { border:1px solid #d6dde2; border-radius:10px; padding:1rem 1.2rem 1.3rem;
               background:#fff; }
    legend { font-weight:700; padding:0 .4rem; }
    label { display:block; font-size:.85rem; margin:.7rem 0 .25rem; }
    input { width:100%; padding:.5rem .6rem; border:1px solid #c2ccd2; border-radius:6px;
            font-size:.95rem; }
    .actions { margin-top:1.2rem; display:flex; gap:.7rem; }
    button { padding:.6rem 1.1rem; border-radius:8px; border:0; font-weight:600; cursor:pointer; }
    .next { background:#0e4d64; color:#fff; }
    .back { background:#e7ecef; color:#16242e; }

    @media (max-width: 600px) {
      .wizard { flex-direction: column; }
      .step--payment  { order: 1; }
      .step--shipping { order: 2; }
      .step--review   { order: 3; }
    }
  </style>
</head>
<body>
  <header><span class="brand">Northwind Outfitters</span></header>

  <main>
    <h1>Secure checkout</h1>

    <ol class="wizard" aria-label="Checkout progress">
      <li class="step step--shipping step--current">
        <span class="step__num" aria-hidden="true">1</span>
        <h2>Shipping</h2>
        <p>Where should we send your order?</p>
      </li>
      <li class="step step--payment">
        <span class="step__num" aria-hidden="true">2</span>
        <h2>Payment</h2>
        <p>How would you like to pay?</p>
      </li>
      <li class="step step--review">
        <span class="step__num" aria-hidden="true">3</span>
        <h2>Review &amp; place order</h2>
        <p>Confirm everything looks right.</p>
      </li>
    </ol>

    <form>
      <fieldset>
        <legend>Step 1 — Shipping address</legend>
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name">
        <label for="addr">Street address</label>
        <input id="addr" name="addr" autocomplete="street-address">
        <label for="city">City</label>
        <input id="city" name="city" autocomplete="address-level2">
        <div class="actions">
          <button type="button" class="next">Continue to payment</button>
        </div>
      </fieldset>
    </form>
  </main>
</body>
</html>
