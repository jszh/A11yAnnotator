<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هيئة النقل — محرر الخرائط (Transit Authority — Route Map Editor)</title>
<style>
  body {
    margin: 0; font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    background: #fafafa; color: #1c1c1c; line-height: 1.6;
  }
  header { background: #1b4d3e; color: #fff; padding: 14px 22px; }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 3px 0 0; font-size: .8rem; color: #cfe7dd; }
  .editor { max-width: 820px; margin: 20px auto; padding: 0 20px 60px; }

  .toolbar {
    display: flex; gap: 6px; background: #e7e7e7; border: 1px solid #cfcfcf;
    border-radius: 8px; padding: 6px; width: max-content;
  }
  .tool {
    appearance: none; width: 44px; height: 44px; border-radius: 6px;
    border: 1px solid transparent; background: #e7e7e7; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tool svg { width: 22px; height: 22px; }

  .tool[disabled] { cursor: not-allowed; }
  .tool[disabled] svg path,
  .tool[disabled] svg line,
  .tool[disabled] svg rect { stroke: #b9b9b9; }   

  .tool--active-fail svg path,
  .tool--active-fail svg line,
  .tool--active-fail svg circle { stroke: #b9b9b9; }  

  .tool--glow svg path,
  .tool--glow svg line { stroke: #3a3a3a; }            
  .tool--glow:hover { box-shadow: 0 0 0 3px rgba(120,120,120,.18); } 

  .panel-close {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-size: 1.45rem; line-height: 1; padding: 4px 10px;
    color: #9c9c9c; font-family: Arial, sans-serif;  
  }

  .canvas {
    margin-top: 16px; height: 240px; border: 1px solid #cfcfcf; border-radius: 8px;
    background:
      repeating-linear-gradient(0deg,#f0f0f0,#f0f0f0 1px,transparent 1px,transparent 24px),
      repeating-linear-gradient(90deg,#f0f0f0,#f0f0f0 1px,transparent 1px,transparent 24px),
      #ffffff;
    display: flex; align-items: center; justify-content: center; color: #8a8a8a; font-size: .85rem;
  }
  .bar-top { display: flex; align-items: center; justify-content: space-between; }
  .why {
    margin-top: 26px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
    padding: 14px 16px; font-size: .82rem; color: #333; direction: rtl;
  }
  .why .en { direction: ltr; text-align: left; color: #444; margin-top: 8px; }
  code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>محرر خرائط المسارات — هيئة النقل</h1>
  <p>Route Map Editor · draw and label bus corridors</p>
</header>

<div class="editor">
  <div class="bar-top">
    <div class="toolbar" role="toolbar" aria-label="أدوات الرسم (Drawing tools)">

      <button class="tool" type="button" disabled aria-label="حذف المسار (Delete route — disabled)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"
          stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <button class="tool tool--active-fail" type="button" aria-label="قلم الرسم (Draw)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"
          stroke-width="2" stroke-linejoin="round"/><line x1="14" y1="6" x2="17" y2="9"
          stroke-width="2"/></svg>
      </button>

      <button class="tool tool--glow" type="button" aria-label="تكبير (Zoom in)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4M11 8v6M8 11h6"
          stroke-width="2" stroke-linecap="round"/></svg>
      </button>

    </div>

    <button class="panel-close" type="button" aria-label="إغلاق المحرر (Close editor)">&#10005;</button>
  </div>

  <div class="canvas">منطقة الرسم — اختر أداة للبدء (Canvas — pick a tool to start)</div>

</div>

<script>
  document.querySelectorAll('.tool:not([disabled])').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tool').forEach(t => t.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed', 'true');
    });
  });
</script>
</body>
</html>
