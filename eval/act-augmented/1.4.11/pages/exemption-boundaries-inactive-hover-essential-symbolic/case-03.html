<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerwise — Trusted by the world's most innovative finance teams</title>
<style>
  body {
    margin: 0; background: #000000; color: #f2f2f2;
    font-family: "Inter", system-ui, Arial, sans-serif; line-height: 1.5;
  }
  .hero { max-width: 1040px; margin: 0 auto; padding: 70px 28px 30px; text-align: center; }
  .hero h1 { font-size: 2rem; font-weight: 700; margin: 0 0 10px; letter-spacing: -.5px; }
  .hero p { color: #c7c7c7; font-size: 1rem; margin: 0; }

  .wall {
    max-width: 1040px; margin: 18px auto 0; padding: 26px 28px 80px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 30px 26px;
    align-items: center; justify-items: center;
  }
  .wall .cell { width: 100%; display: flex; align-items: center; justify-content: center; }

  .logo {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700; font-size: 1.35rem; letter-spacing: .5px;
    color: #1c1c1c;                       
    transition: color .18s ease;
    white-space: nowrap;
  }
  .logo:hover, .logo:focus-visible { color: #ffffff; }   

  .logo--brand {
    color: #11203a;                       
    font-family: "Trebuchet MS", Verdana, sans-serif;
    letter-spacing: 2px; text-transform: uppercase; font-size: 1.25rem;
  }
  .logo--brand:hover { color: #11203a; }  

  .legend {
    max-width: 1040px; margin: 0 auto; padding: 0 28px 70px;
    color: #9a9a9a; font-size: .8rem; border-top: 1px solid #222; padding-top: 22px;
  }
  .legend code { color: #d8d8d8; }
</style>
</head>
<body>
  <section class="hero">
    <h1>Trusted by the world's most innovative finance teams</h1>
    <p>Ledgerwise reconciles ledgers for over 4,000 companies.</p>
  </section>

  <div class="wall" role="list" aria-label="Companies that use Ledgerwise">
    <div class="cell" role="listitem"><a href="#north"     class="logo">Northwind</a></div>
    <div class="cell" role="listitem"><a href="#vela"      class="logo">Velastra</a></div>
    <div class="cell" role="listitem"><a href="#cobalt"    class="logo">Cobalt&amp;Co</a></div>
    <div class="cell" role="listitem"><a href="#harbor"    class="logo">Harborline</a></div>
    <div class="cell" role="listitem"><a href="#meridian"  class="logo">Meridian</a></div>
    <div class="cell" role="listitem"><a href="#solgrid"   class="logo">SolGrid</a></div>
    <div class="cell" role="listitem"><a href="#aperture"  class="logo">Aperture</a></div>
    <div class="cell" role="listitem"><a href="#tideworks" class="logo">Tideworks</a></div>
    <div class="cell" role="listitem"><a href="#quanta"    class="logo">Quanta Pay</a></div>

    <div class="cell" role="listitem">
      <a href="#bnord" class="logo logo--brand" aria-label="BNØRD Bank">BNØRD</a>
    </div>
  </div>

</body>
</html>
