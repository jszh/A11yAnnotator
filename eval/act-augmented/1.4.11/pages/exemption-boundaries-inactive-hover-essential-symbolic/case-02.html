<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie &amp; Telemetry Preferences — Devhaven Docs</title>
<style>
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    margin: 0; background: #ffffff; color: #16191d; line-height: 1.55;
  }
  .shell { max-width: 680px; margin: 0 auto; padding: 36px 26px 60px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #44505a; font-size: .85rem; margin: 0 0 28px; }
  .pref {
    display: grid; grid-template-columns: auto 1fr; gap: 14px;
    align-items: start; padding: 14px 12px; border-radius: 6px;
  }

  .pref input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; cursor: pointer; }
  .box {
    width: 22px; height: 22px; border: 2px solid #111111;   
    border-radius: 4px; background: #fff; position: relative; flex: none;
  }
  .pref input:checked + .box::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 5px; height: 10px; border: solid #111111;        
    border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .pref input:focus-visible + .box {
    outline: 3px solid #0050c8; outline-offset: 2px;          
  }

  .pref:hover { background: #ededed; }   

  .pref label { font-size: .92rem; cursor: pointer; }
  .pref .desc { color: #44505a; font-size: .8rem; margin-top: 2px; }
  .note {
    margin-top: 34px; background: #f6f8fa; border: 1px solid #d8dee4;
    border-radius: 6px; padding: 14px 16px; font-size: .8rem; color: #2d333b;
  }
  code { background: #eef1f4; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<div class="shell">
  <h1>Cookie &amp; telemetry preferences</h1>
  <p class="sub">Devhaven Docs · choose what we may collect while you browse the API reference.</p>

  <form>
    <div class="pref">
      <input type="checkbox" id="essential" checked disabled>
      <label for="essential">Strictly necessary<span class="desc">Always on — required to load docs pages.</span></label>
      <span class="box" aria-hidden="true"></span>
    </div>

    <div class="pref">
      <input type="checkbox" id="analytics">
      <label for="analytics">Usage analytics<span class="desc">Anonymous page-view counts for the docs team.</span></label>
      <span class="box" aria-hidden="true"></span>
    </div>

    <div class="pref">
      <input type="checkbox" id="replay">
      <label for="replay">Session replay<span class="desc">Records anonymized clicks to debug confusing flows.</span></label>
      <span class="box" aria-hidden="true"></span>
    </div>
  </form>

</div>
</body>
</html>
