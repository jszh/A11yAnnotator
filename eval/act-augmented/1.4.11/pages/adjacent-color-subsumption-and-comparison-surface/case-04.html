<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a quote — Step 3 — Harbor &amp; Vale Home Insurance</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    background: #f6f7fb;
    color: #21242b;
  }
  header {
    background: #2b2f6b; color: #fff; padding: 14px 26px;
    display: flex; align-items: center; gap: 12px;
  }
  header .mark { width: 24px; height: 24px; border-radius: 5px; background: #8a90d6; }
  header strong { font-size: 16px; }
  .crumbs { font-size: 12px; color: #6b7280; padding: 10px 26px; }
  main { max-width: 700px; margin: 24px auto 60px; padding: 0 22px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .intro { color: #565c66; margin: 0 0 24px; }

  .quote-panel {
    background: #DDE3F0;            
    border-radius: 12px;
    padding: 24px 24px 28px;
  }
  .quote-panel h2 { margin: 0 0 16px; font-size: 16px; color: #2b2f6b; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #2b2f6b; }
  .field .hint { font-size: 12px; color: #5b6270; margin: 0 0 6px; }
  .field input {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 7px; outline: none;
  }

  .field.input-a input {
    background: #FFFFFF;
    color: #21242b;
    border: 1px solid #6E8FB5;
  }

  .field.input-b input {
    background: #6E5A86;
    color: #ffffff;
    border: 1px solid #7A4A8A;
  }
  .field.input-b input::placeholder { color: #cfc4dd; }

  .actions { margin-top: 6px; display: flex; gap: 12px; }
  .btn { font-size: 15px; font-weight: 700; border-radius: 7px; padding: 11px 22px; cursor: pointer; border: 0; }
  .btn.primary { background: #2b2f6b; color: #fff; }
  .btn.back { background: #fff; color: #2b2f6b; border: 1px solid #b9c0d6; }
</style>
</head>
<body>
  <header><span class="mark" aria-hidden="true"></span><strong>Harbor &amp; Vale</strong></header>
  <p class="crumbs">Get a quote › Property details › <strong>Coverage &amp; budget</strong> › Review</p>

  <main>
    <h1>Coverage &amp; budget</h1>
    <p class="intro">Step 3 of 4. These figures help us tailor the right policy for your home.</p>

    <form class="quote-panel" action="#" method="post" novalidate aria-labelledby="qp">
      <h2 id="qp">Your numbers</h2>

      <div class="field input-a">
        <label for="value">Estimated home value</label>
        <p class="hint">Use your most recent appraisal or tax assessment.</p>
        <input type="text" id="value" name="value" inputmode="numeric" placeholder="$">
      </div>

      <div class="field input-b">
        <label for="budget">Annual policy budget</label>
        <p class="hint">What you'd like to spend per year, before discounts.</p>
        <input type="text" id="budget" name="budget" inputmode="numeric" placeholder="$">
      </div>

      <div class="actions">
        <button type="button" class="btn back">Back</button>
        <button type="submit" class="btn primary">See my quote</button>
      </div>
    </form>
  </main>

</body>
</html>
