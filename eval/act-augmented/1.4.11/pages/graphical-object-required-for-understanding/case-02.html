<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ward recycling rate, 2021–2025 — Eastbrook District Council</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; margin: 0; background: #fbfaf7; color: #20262b; }
  .page { max-width: 820px; margin: 0 auto; padding: 28px 22px 70px; }
  .gov-bar { background: #0b3d2e; color: #fff; font-size: .8rem; padding: 7px 22px; font-family: Arial, sans-serif; }
  h1 { font-size: 1.55rem; margin: 26px 0 4px; }
  .lede { color: #4a545b; margin: 0 0 26px; font-size: 1rem; }
  .panel { background: #fff; border: 1px solid #e4e0d6; border-radius: 4px; padding: 26px 26px 30px; }
  figcaption { font-family: Arial, sans-serif; font-weight: 700; font-size: 1.02rem; margin-bottom: 2px; }
  .units { font-family: Arial, sans-serif; color: #6b7178; font-size: .82rem; margin: 0 0 22px; }
  svg.bars { width: 100%; height: 280px; display: block; }
  .axis { font-family: Arial, sans-serif; font-size: 12px; fill: #3a434a; }
  .barval { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1a2024; }
  .barlabel { font-family: Arial, sans-serif; font-size: 12px; fill: #3a434a; }
  .footnote { font-family: Arial, sans-serif; font-size: .8rem; color: #6b7178; margin-top: 22px; border-top: 1px solid #ece8de; padding-top: 12px; }
</style>
</head>
<body>
<div class="gov-bar">Eastbrook District Council · Environment &amp; Waste</div>
<div class="page">
  <h1>Household recycling rate by year</h1>
  <p class="lede">Percentage of household waste sent for reuse, recycling or composting,
     Eastbrook district, 2021 to 2025.</p>

  <section class="panel" aria-labelledby="bar-title">
    <figure>
      <figcaption id="bar-title">Recycling rate, 2021–2025</figcaption>
      <p class="units">Per cent of household waste recycled. Source: WasteDataFlow returns.</p>

      <svg class="bars" viewBox="0 0 600 280" role="img"
           aria-label="Bar chart: household recycling rate rose from 42% in 2021 to 55% in 2025. Exact values are printed above each bar.">
        <rect x="55" y="10" width="535" height="230" fill="#ffffff"/>
        <line x1="55" y1="240" x2="590" y2="240" stroke="#3a434a" stroke-width="1.5"/>
        <line x1="55" y1="10" x2="55" y2="240" stroke="#3a434a" stroke-width="1.5"/>
        <text class="axis" x="48" y="244" text-anchor="end">0</text>
        <text class="axis" x="48" y="135" text-anchor="end">30</text>
        <text class="axis" x="48" y="30" text-anchor="end">60</text>

        <rect x="80"  y="79"  width="70" height="161" fill="#C8E6C9"/>
        <text class="barval"   x="115" y="72"  text-anchor="middle">42</text>
        <text class="barlabel" x="115" y="258" text-anchor="middle">2021</text>
        <rect x="180" y="68"  width="70" height="172" fill="#B2DFB4"/>
        <text class="barval"   x="215" y="61"  text-anchor="middle">45</text>
        <text class="barlabel" x="215" y="258" text-anchor="middle">2022</text>
        <rect x="280" y="56"  width="70" height="184" fill="#C8E6C9"/>
        <text class="barval"   x="315" y="49"  text-anchor="middle">48</text>
        <text class="barlabel" x="315" y="258" text-anchor="middle">2023</text>
        <rect x="380" y="44"  width="70" height="196" fill="#B2DFB4"/>
        <text class="barval"   x="415" y="37"  text-anchor="middle">51</text>
        <text class="barlabel" x="415" y="258" text-anchor="middle">2024</text>
        <rect x="480" y="29"  width="70" height="211" fill="#C8E6C9"/>
        <text class="barval"   x="515" y="22"  text-anchor="middle">55</text>
        <text class="barlabel" x="515" y="258" text-anchor="middle">2025</text>
      </svg>

      <p class="footnote">
        Rates are rounded to the nearest whole percent. The statutory England target
        is 65% by 2035.
      </p>
    </figure>
  </section>

</div>
</body>
</html>
