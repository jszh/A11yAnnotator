<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy mix by source, 2015–2024 — GridWatch open data</title>
<style>
  body { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; margin: 0; background: #0e1419; color: #e8edf2; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 30px 22px 70px; }
  .kicker { color: #6fb3ff; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 1.5rem; margin: 4px 0 6px; }
  p.lede { color: #9fb0bf; margin: 0 0 24px; }
  .panel { background: #151d24; border: 1px solid #243038; border-radius: 12px; padding: 24px; }
  figcaption { font-weight: 700; margin-bottom: 2px; }
  .sub { color: #9fb0bf; font-size: .85rem; margin: 0 0 16px; }
  svg.area { width: 100%; height: 300px; display: block; }
  .axt { font-size: 11px; fill: #8aa0b2; font-family: inherit; }
  details.ld { margin-top: 18px; border: 1px solid #2c3a44; border-radius: 8px; }
  details.ld > summary { cursor: pointer; padding: 11px 14px; font-weight: 700; color: #cfe0ee;
                        list-style: none; }
  details.ld > summary::-webkit-details-marker { display: none; }
  details.ld > summary::before { content: "▸ "; color: #6fb3ff; }
  details.ld[open] > summary::before { content: "▾ "; }
  table.data { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.data caption { text-align: left; padding: 6px 14px; color: #9fb0bf; }
  table.data th, table.data td { border-top: 1px solid #243038; padding: 7px 14px; text-align: right; }
  table.data th[scope="row"], table.data thead th:first-child { text-align: left; }
  table.data thead th { color: #cfe0ee; }
  .foot { font-size: .78rem; color: #6f8294; margin-top: 18px; border-top: 1px solid #243038; padding-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">GridWatch · open data</p>
  <h1>Electricity generation mix, 2015–2024</h1>
  <p class="lede">Share of national generation by source, ten-year view. Stacked bands sum to
     100% each year.</p>

  <section class="panel" aria-labelledby="area-title">
    <figure>
      <figcaption id="area-title">Generation share by source (stacked)</figcaption>
      <p class="sub">Gas, nuclear, wind, solar, other. Use "View data table" for exact figures.</p>

      <!--
        Stacked-area chart on a DARK panel. The five bands are pale tints that sit
        ~1.05-1.3:1 against EACH OTHER, so the band-to-band boundaries (the graphical
        objects you would normally need to read the shares) are below 3:1. There are
        NO inline values on the chart. NORMALLY this would FAIL like case-01/03.
        BUT immediately below, a working <details> "Long Description" discloses a
        real, conforming <table> with every value for every year. Per the
        Understanding "Required for Understanding" list, when "the information is
        available in another form, such as in a table that follows the graph, which
        becomes visible when a 'Long Description' button is pressed," the graphic is
        not relied upon for understanding -> NOT APPLICABLE. The bands' low contrast
        no longer fails because the data table is the equivalent.
      -->
      <svg class="area" viewBox="0 0 640 300" role="img"
           aria-label="Stacked area chart of electricity generation share by source, 2015 to 2024. Exact figures are in the data table below.">
        <rect x="40" y="8" width="592" height="248" fill="#151d24"/>
        <text class="axt" x="44"  y="276">2015</text>
        <text class="axt" x="320" y="276" text-anchor="middle">2019</text>
        <text class="axt" x="628" y="276" text-anchor="end">2024</text>

        <!-- Five stacked bands, pale tints ~1.1:1 apart, no separating strokes.
             Drawn back-to-front; each band is a filled polygon. -->
        <!-- Gas (bottom) -->
        <polygon fill="#B9C4CE" points="40,256 632,256 632,150 40,170"/>
        <!-- Nuclear -->
        <polygon fill="#C2CCD5" points="40,170 632,150 632,108 40,120"/>
        <!-- Wind -->
        <polygon fill="#CBD4DC" points="40,120 632,108 632,60 40,82"/>
        <!-- Solar -->
        <polygon fill="#D4DCE3" points="40,82 632,60 632,36 40,52"/>
        <!-- Other (top) -->
        <polygon fill="#DDE4EA" points="40,52 632,36 632,8 40,8"/>
      </svg>

      <details class="ld">
        <summary>View data table (Long Description)</summary>
        <table class="data">
          <caption>Electricity generation share (%) by source and year</caption>
          <thead>
            <tr>
              <th scope="col">Year</th>
              <th scope="col">Gas</th>
              <th scope="col">Nuclear</th>
              <th scope="col">Wind</th>
              <th scope="col">Solar</th>
              <th scope="col">Other</th>
            </tr>
          </thead>
          <tbody>
            <tr><th scope="row">2015</th><td>42</td><td>21</td><td>11</td><td>3</td><td>23</td></tr>
            <tr><th scope="row">2018</th><td>40</td><td>20</td><td>17</td><td>4</td><td>19</td></tr>
            <tr><th scope="row">2021</th><td>36</td><td>16</td><td>24</td><td>4</td><td>20</td></tr>
            <tr><th scope="row">2024</th><td>31</td><td>14</td><td>29</td><td>6</td><td>20</td></tr>
          </tbody>
        </table>
      </details>

      <p class="foot">
        Source: GridWatch open dataset, annual means. Bands may not sum to exactly 100
        due to rounding.
      </p>
    </figure>
  </section>

  <!--
    WHY AUTOMATED TOOLS MISS THIS (and why the human answer is Not Applicable)
    A scanner that DID parse the SVG could flag the ~1.1:1 band boundaries as a
    non-text-contrast failure -- a FALSE POSITIVE here. The correct outcome is Not
    Applicable, because a working "Long Description" disclosure reveals a conforming
    data table with every value, so the chart is not relied upon for understanding.
    No automated tool can: (a) find the <details> sibling, (b) confirm the table
    actually contains the chart's data for every series and year, and (c) conclude
    the low-contrast bands are therefore exempt. "Does a long description / data
    table convey the equivalent information?" is precisely the human judgment that
    decides Fail vs Not Applicable.
  -->
</div>
</body>
</html>
