<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where our alumni connect — Northfield College advancement report</title>
<style>
  body { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; margin: 0; background: #ffffff; color: #232a31; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 30px 24px 70px; }
  .eyebrow { color: #6a7682; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 1.5rem; margin: 4px 0 6px; }
  p.lede { color: #4f5b66; margin: 0 0 26px; max-width: 60ch; }
  .info-card { border: 1px solid #e6eaef; border-radius: 14px; padding: 26px; background: #fcfdfe; }
  figcaption { font-weight: 700; margin-bottom: 2px; }
  .sub { color: #4f5b66; font-size: .85rem; margin: 0 0 20px; }
  svg.bubbles { width: 100%; height: 300px; display: block; }
  .clab { font-size: 13px; fill: #2b333a; font-family: inherit; text-anchor: middle; }
  .foot { font-size: .78rem; color: #8a949d; margin-top: 20px; border-top: 1px solid #eef1f4; padding-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Advancement · annual report</p>
  <h1>Where our alumni connect</h1>
  <p class="lede">Relative reach of Northfield College's alumni communities across five
     platforms. Circle area is proportional to active members; the icon marks each platform.</p>

  <section class="info-card" aria-labelledby="bub-title">
    <figure>
      <figcaption id="bub-title">Alumni community reach by platform</figcaption>
      <p class="sub">Larger circle = larger community.</p>

      <!--
        A bubble infographic: five circles whose AREA encodes community size, each
        with a small ICON inside marking the platform. TWO graphical objects per item
        are required for understanding:
          (1) the circle (you must perceive it against the white page to judge size),
          (2) the icon inside (you must perceive it against the circle to know which
              platform it is).
        Both fail 3:1:
          - circle fill #DCE6F1 vs white page  ~1.26:1
          - icon fill   #B8CCE4 vs circle fill ~1.30:1
        The circles' sizes ARE the data (which community is biggest) and the icons
        ARE the identity (which platform). No values, no legend, no table. So both
        sets of graphical objects are required for understanding and both are <3:1
        -> FAILS. This is the Understanding "Infographics (Fail)" example reproduced.
        (The text under each circle names the platform but does NOT convey the size:
        you still must compare the faint circles to read relative reach.)
      -->
      <svg class="bubbles" viewBox="0 0 760 300" role="img"
           aria-label="Bubble infographic comparing the relative size of alumni communities across five platforms.">
        <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>

        <!-- 1: LinkedIn (largest) -->
        <circle cx="100" cy="150" r="62" fill="#DCE6F1"/>
        <!-- icon: 'in' tile (faint) -->
        <rect x="80" y="130" width="40" height="40" rx="6" fill="#B8CCE4"/>
        <text class="clab" x="100" y="232">LinkedIn</text>

        <!-- 2: Facebook -->
        <circle cx="250" cy="150" r="50" fill="#DCE6F1"/>
        <rect x="234" y="134" width="32" height="32" rx="6" fill="#B8CCE4"/>
        <text class="clab" x="250" y="222">Facebook</text>

        <!-- 3: Instagram -->
        <circle cx="390" cy="150" r="40" fill="#DCE6F1"/>
        <rect x="377" y="137" width="26" height="26" rx="8" fill="#B8CCE4"/>
        <text class="clab" x="390" y="210">Instagram</text>

        <!-- 4: Discord -->
        <circle cx="520" cy="150" r="30" fill="#DCE6F1"/>
        <circle cx="520" cy="150" r="11" fill="#B8CCE4"/>
        <text class="clab" x="520" y="198">Discord</text>

        <!-- 5: Mastodon (smallest) -->
        <circle cx="640" cy="150" r="22" fill="#DCE6F1"/>
        <path d="M632 146 q8 -10 16 0 v8 h-16 z" fill="#B8CCE4"/>
        <text class="clab" x="640" y="188">Mastodon</text>
      </svg>

      <p class="foot">
        Active members in the trailing 90 days. Platforms shown are those with a
        College-managed alumni group.
      </p>
    </figure>
  </section>

  <!--
    WHY AUTOMATED TOOLS MISS THIS
    The infographic SVG is labelled and each circle has a text platform name, so
    axe/WAVE/Lighthouse pass it. None of them: (a) recognise this as a bubble chart
    where circle AREA is the data, (b) compute circle-vs-page AND icon-vs-circle
    contrast as two separate required graphical objects, or (c) reason that the
    platform names do NOT convey the SIZE -- so the faint circles remain required for
    understanding. Treating one infographic as a SET of graphical objects, each
    measured against its own adjacent surface, and judging which are required, is a
    human determination. The same image with dark circle borders + dark icons +
    member counts would pass; nothing in the markup tells a scanner which it is.
  -->
</div>
</body>
</html>
