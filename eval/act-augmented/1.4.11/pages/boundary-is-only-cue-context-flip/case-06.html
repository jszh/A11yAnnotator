<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip filters — Wanderwell flights</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif; margin: 0;
    color: #142433; background: #eaf1f6;
  }
  .topbar { background: #0d3b66; color: #fff; padding: 14px 26px; }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 26px 24px 70px; }
  .panel { background: #fff; border-radius: 10px; padding: 22px 22px 26px;
           box-shadow: 0 2px 10px rgba(13,59,102,.08); }
  h2 { font-size: 18px; margin: 0 0 4px; color: #0d3b66; }
  .hint { color: #5a6b78; font-size: 13px; margin: 0 0 20px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cell h3 { font-size: 13px; color: #0d3b66; margin: 0 0 8px; font-weight: 600; }

  .filter {
    width: 100%; height: 44px; padding: 0 12px;
    font-size: 14px; color: #142433; background: #fff;
    border: 2px solid #ADADAD;   
    border-radius: 6px;
  }
  .filter::placeholder { color: #5a5a5a; }

  .field-label { display: block; font-size: 13px; font-weight: 600;
                 color: #142433; margin-bottom: 6px; }

  .filter:disabled { background: #f6f7f8; color: #9aa3ab; cursor: not-allowed; }

  .apply {
    margin-top: 22px; height: 44px; padding: 0 26px;
    background: #0d3b66; color: #fff; border: 0; border-radius: 6px;
    font-size: 15px; cursor: pointer;
  }
  .footnote { margin-top: 16px; font-size: 12px; color: #6b7884; }
</style>
</head>
<body>
  <header class="topbar"><h1>Wanderwell — Search flights</h1></header>

  <main>
    <section class="panel">
      <h2>Refine your search</h2>
      <p class="hint">Filter the results below by origin, destination, and airline.</p>

      <div class="grid">
        <div class="cell">
          <h3>Origin</h3>
          <label class="field-label" for="origin">Origin city</label>
          <input class="filter" id="origin" type="text" placeholder="London (LHR)">
        </div>

        <div class="cell">
          <h3>Destination</h3>
          <input class="filter" id="dest" type="text" aria-label="Destination city">
        </div>

        <div class="cell">
          <h3>Airline</h3>
          <input class="filter" id="airline" type="text"
                 aria-label="Airline (choose a destination first)" disabled>
        </div>
      </div>

      <button class="apply" type="button">Apply filters</button>
      <p class="footnote">The airline filter unlocks once a destination is selected.</p>
    </section>
  </main>
</body>
</html>
