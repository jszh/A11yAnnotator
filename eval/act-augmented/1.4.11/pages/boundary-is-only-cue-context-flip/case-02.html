<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Harborline Credit Union</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #eef1f4; margin: 0; color: #15202b;
    min-height: 100vh; display: grid; place-items: center;
  }
  .card {
    width: 380px; background: #fff; border-radius: 10px;
    box-shadow: 0 8px 30px rgba(20,40,70,.10);
    padding: 34px 32px 30px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg,#0a6b54,#0f9b78);
  }
  .brand strong { font-size: 16px; color: #0a6b54; letter-spacing: .2px; }
  h1 { font-size: 21px; margin: 14px 0 22px; }

  .field { margin-bottom: 20px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: #2a3742; margin-bottom: 7px;
  }

  /* SHARED low-contrast outline used on BOTH inputs.
     #ABABAB on #FFFFFF == 2.30:1 (below 3:1). */
  .ghost-input {
    width: 100%; height: 46px; padding: 0 14px;
    font-size: 15px; color: #15202b; background: #ffffff;
    border: 1px solid #ABABAB;   /* 2.30:1 — same on username + password */
    border-radius: 6px;
  }

  /* The username field also carries an inset icon + placeholder; the password
     field is deliberately bare (no icon, no placeholder, label hidden). */
  .with-affordance { position: relative; }
  .with-affordance .glyph {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #0a6b54; /* 6.47:1 — high-contrast icon */
  }
  .with-affordance .ghost-input { padding-left: 40px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .submit {
    width: 100%; height: 46px; margin-top: 4px;
    background: #0a6b54; color: #fff; border: 0; border-radius: 6px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .helper { font-size: 12px; color: #5a6772; margin-top: 16px; text-align: center; }
  .helper a { color: #0a6b54; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <strong>Harborline Credit Union</strong>
    </div>
    <h1>Sign in to online banking</h1>

    <form action="#" method="post" novalidate>
      <!-- PASS: a visible label AND a high-contrast (6.47:1) lock-user icon AND a
           placeholder all identify this as the username input. Its 2.30:1 border
           is therefore not the only cue, and is not subject to the requirement. -->
      <div class="field">
        <label for="user">Username</label>
        <div class="with-affordance">
          <svg class="glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5Z"/>
          </svg>
          <input class="ghost-input" id="user" name="user" type="text"
                 placeholder="Your member username" autocomplete="username">
        </div>
      </div>

      <!-- FAIL: the visible label was "moved into the box" as a design choice and
           is now visually-hidden (.sr-only). No icon, no placeholder, no visible
           text. The control is a bare white box on a white card; the ONLY visual
           cue that an input exists there is the same 2.30:1 grey border — which is
           now required, and fails. The accessible name is still present, so a name
           checker is satisfied. -->
      <div class="field">
        <label class="sr-only" for="pass">Password</label>
        <input class="ghost-input" id="pass" name="pass" type="password"
               autocomplete="current-password">
      </div>

      <button class="submit" type="submit">Sign in</button>
    </form>

    <p class="helper">
      Trouble signing in? <a href="#">Reset your password</a>
    </p>
  </main>
</body>
</html>
