<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohort report — Pulse Analytics</title>
<style>
  :root { --ink:#1f2733; }
  body { font:14px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--ink);
         background:#eef1f4; margin:0; }
  .panel { max-width:840px; margin:30px auto; background:#fff; border:1px solid #dde2e8;
           border-radius:10px; overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between;
                padding:14px 18px; border-bottom:1px solid #eef1f4; }
  .panel-head h1 { font-size:1.05rem; margin:0; }
  .toolbar { display:flex; gap:6px; background:#fff; padding:4px; border-radius:8px; }
  .tool {
    appearance:none; cursor:pointer; width:34px; height:34px; border:0; border-radius:6px;
    background:transparent; color:#42505f; display:grid; place-items:center;
  }
  .tool:hover { background:#f2f4f7; }
  .tool svg { width:18px; height:18px; }
  .tool:focus       { outline:none; box-shadow:0 0 0 3px #949494; } 
  #tool-export:focus{ outline:none; box-shadow:0 0 0 3px #aaaaaa; } 

  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:9px 18px; border-bottom:1px solid #eef1f4; }
  th { color:#5c6b7c; font-weight:600; background:#fafbfc; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<section class="panel" aria-label="Cohort report">
  <div class="panel-head">
    <h1>Weekly retention by cohort</h1>
    <div class="toolbar" role="toolbar" aria-label="Report actions">
      <button class="tool" id="tool-refresh" type="button" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button class="tool" id="tool-filter" type="button" aria-label="Filter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
      </button>
      <button class="tool" id="tool-columns" type="button" aria-label="Choose columns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="6" height="16"/><rect x="11" y="4" width="6" height="16"/></svg>
      </button>
      <button class="tool" id="tool-export" type="button" aria-label="Export to CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
    </div>
  </div>

  <table>
    <thead><tr><th>Cohort</th><th class="num">Wk 1</th><th class="num">Wk 2</th><th class="num">Wk 4</th></tr></thead>
    <tbody>
      <tr><td>Apr 2026</td><td class="num">100%</td><td class="num">71%</td><td class="num">58%</td></tr>
      <tr><td>May 2026</td><td class="num">100%</td><td class="num">68%</td><td class="num">54%</td></tr>
      <tr><td>Jun 2026</td><td class="num">100%</td><td class="num">74%</td><td class="num">—</td></tr>
    </tbody>
  </table>
</section>
</body>
</html>
