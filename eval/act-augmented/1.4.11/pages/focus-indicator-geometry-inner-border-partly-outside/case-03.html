<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm appointment — Cedar Park Health Portal</title>
<style>
  :root { --ink:#1d2330; --blue:#4189B9; }
  body { font:16px/1.55 "Inter",system-ui,sans-serif; color:var(--ink);
         background:#eef1f6; margin:0; }
  main { max-width:520px; margin:40px auto; padding:0 20px; }
  h1 { font-size:1.45rem; margin:0 0 4px; }
  .sub { color:#5a677a; margin:0 0 22px; }
  .card { background:#fff; border:1px solid #e2e7f0; border-radius:12px;
          padding:24px 26px 26px; }
  .card h2 { font-size:1.05rem; margin:0 0 14px; }
  dl { margin:0 0 22px; display:grid; grid-template-columns:auto 1fr; gap:8px 18px;
       font-size:.94rem; }
  dt { color:#7a8699; }
  dd { margin:0; font-weight:600; }
  .actions { display:flex; gap:12px; }

  .btn-primary {
    appearance:none; cursor:pointer;
    font:600 1rem/1 inherit; color:#fff;
    background:var(--blue);            
    border:2px solid var(--blue);      
    border-radius:8px; padding:12px 22px;
  }
  #confirm:focus { outline:none; border-color:#4B933A; }

  .btn-ghost {
    appearance:none; cursor:pointer;
    font:600 1rem/1 inherit; color:#43505f;
    background:#fff; border:2px solid #c2ccda;
    border-radius:8px; padding:12px 22px;
  }
  #cancel:focus { outline:2px solid #1d2330; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Confirm your appointment</h1>
  <p class="sub">Review the details below, then confirm to reserve this time.</p>

  <div class="card">
    <h2>Appointment summary</h2>
    <dl>
      <dt>Provider</dt><dd>Dr. A. Mensah — Cardiology</dd>
      <dt>Date</dt><dd>Tue, 7 Jul 2026</dd>
      <dt>Time</dt><dd>10:30 AM</dd>
      <dt>Location</dt><dd>Cedar Park Clinic, Suite 4</dd>
    </dl>
    <div class="actions">
      <button class="btn-primary" type="button" id="confirm">Confirm appointment</button>
      <button class="btn-ghost" type="button" id="cancel">Go back</button>
    </div>
  </div>

  <p class="sub" style="margin-top:18px;font-size:.85rem;">
    Tab to “Confirm appointment” to see its focus state.</p>
</main>
</body>
</html>
