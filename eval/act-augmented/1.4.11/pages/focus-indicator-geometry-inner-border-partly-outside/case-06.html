<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات — تطبيق نقل المدينة</title>
<style>
  :root { --ink:#1c2530; --blue:#4189B9; }
  body { font:16px/1.6 "Segoe UI","Tahoma",system-ui,sans-serif; color:var(--ink);
         background:#eef1f5; margin:0; }
  .card { max-width:440px; margin:34px auto; background:#fff; border:1px solid #dfe4ea;
          border-radius:14px; padding:10px 6px; }
  h1 { font-size:1.15rem; margin:14px 18px 4px; }
  .group-label { color:#6a7686; font-size:.82rem; margin:0 18px 8px; }
  .item { display:flex; align-items:center; justify-content:space-between;
          gap:14px; padding:14px 18px; border-top:1px solid #eef1f4; }
  .item:first-of-type { border-top:0; }
  .item .txt b { display:block; font-weight:600; }
  .item .txt small { color:#74808f; }

  .switch {
    appearance:none; cursor:pointer; position:relative; flex:0 0 auto;
    width:52px; height:30px; border-radius:15px; border:0;
    background:#c4cad2;                 
    transition:background .15s;
  }
  .switch[aria-checked="true"] { background:var(--blue); } 
  .switch .thumb {
    position:absolute; top:3px; inset-inline-start:3px; width:24px; height:24px;
    border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3);
    transition:inset-inline-start .15s;
  }
  .switch[aria-checked="true"] .thumb { inset-inline-start:25px; }

  .switch:focus { outline:none; box-shadow: inset 0 0 0 3px #008000; }
</style>
</head>
<body>
<main class="card">
  <h1>الإعدادات</h1>
  <p class="group-label">التنبيهات والإشعارات</p>

  <div class="item">
    <span class="txt"><b>تنبيهات التأخير</b><small>إشعار عند تأخر الحافلة أو المترو</small></span>
    <button class="switch" type="button" role="switch" aria-checked="true"
            aria-label="تنبيهات التأخير"><span class="thumb"></span></button>
  </div>

  <div class="item">
    <span class="txt"><b>تذكير المغادرة</b><small>تنبيه قبل موعد رحلتك بعشر دقائق</small></span>
    <button class="switch" type="button" role="switch" aria-checked="true"
            aria-label="تذكير المغادرة"><span class="thumb"></span></button>
  </div>

  <div class="item">
    <span class="txt"><b>العروض والتخفيضات</b><small>رسائل ترويجية من المشغّل</small></span>
    <button class="switch" type="button" role="switch" aria-checked="false"
            aria-label="العروض والتخفيضات"><span class="thumb"></span></button>
  </div>
</main>
</body>
</html>
