<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Catalog Filters — Northgate Polytechnic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fafafa; color: #20242b;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    header { background: #3b1d6e; color: #fff; padding: 1.1rem 1.6rem; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 880px; margin: 0 auto; padding: 1.8rem 1.4rem 4rem; }
    h2 { font-size: 1.05rem; color: #3b1d6e; margin: 1.6rem 0 .6rem; }

    .chips { display: flex; flex-wrap: wrap; gap: .55rem; }

    .chip {
      border: 1.5px solid #c9c2da;
      background: #fff;
      color: #3b1d6e;
      padding: .45rem .95rem;
      border-radius: 999px;
      font-size: .92rem;
      cursor: pointer;
      transition: border-color .12s ease;
    }
    button:focus { outline: none; }

    .chip:hover,
    .chip:focus {
      border-color: #c4bdd6;
    }

    .chip.is-hot {
      background: #3b1d6e;
      color: #fff;
      border-color: #3b1d6e;
    }

    .results { margin-top: 1.4rem; color: #4a505b; }
    .results p { margin: .3rem 0; }
  </style>
</head>
<body>
  <header><h1>Northgate Polytechnic — Course Catalog</h1></header>
  <main>
    <h2>Filter by subject</h2>
    <div class="chips" id="subjectChips" role="group" aria-label="Subject filters">
      <button type="button" class="chip">Computer Science</button>
      <button type="button" class="chip">Mechanical Engineering</button>
      <button type="button" class="chip">Industrial Design</button>
      <button type="button" class="chip">Applied Mathematics</button>
      <button type="button" class="chip">Architecture</button>
      <button type="button" class="chip">Biotechnology</button>
    </div>

    <div class="results">
      <p>Showing 142 courses across all subjects.</p>
      <p>Hover or tap a subject to preview how many courses match.</p>
    </div>
  </main>

  <script>
    document.querySelectorAll('#subjectChips .chip').forEach(function (chip) {
      chip.addEventListener('mouseenter', function () {
        chip.classList.add('is-hot');
      });
      chip.addEventListener('mouseleave', function () {
        chip.classList.remove('is-hot');
      });
    });
  </script>

</body>
</html>
