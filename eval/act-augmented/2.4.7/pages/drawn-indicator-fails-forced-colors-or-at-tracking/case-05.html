<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your delivery slot — FreshCrate groceries</title>
<!--
  ACCESSIBILITY DEFECT (SC 2.4.7, aspect: drawn-indicator-fails-forced-colors-or-at-tracking)
  This is a custom listbox of delivery time-slots. Real keyboard focus stays on the
  CONTAINER (.listbox, tabindex=0). Arrow keys do NOT move focus; instead JS recolors a
  sibling option <div> (adds .is-active, a pale-green background-color) to indicate the
  "current" option. The container's own native focus ring is removed (outline:none).
  In a default render, arrowing changes the green highlight, pixels change, oj04fd passes.
  TWO compounding failures, both invisible to a default-render checker:
   (1) The active-option cue is ONLY a background-COLOR change conveyed by recoloring a
       sibling div, not by moving focus. AT tracks the real focus (the container), which
       never visibly changes; aria-activedescendant is NOT used, so AT cannot announce or
       locate the "active" option. This is the G165 "color sections of the page in response
       to user action; AT will not usually be able to find your focus indicator" failure.
   (2) The highlight is a thin pale background tint; in forced-colors mode author background
       colors collapse to the system Canvas, so the active option becomes indistinguishable.
  Recognizing that focus never actually moves and the cue is a recolored sibling needs human
  reasoning about the widget mechanism. Markup is well-formed; axe/WAVE/Lighthouse miss it.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; background: #f6f8f5; color: #1d2b1f; }
  .wrap { max-width: 560px; margin: 36px auto; padding: 0 20px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #5f7062; margin: 0 0 22px; }

  .listbox {
    border: 1px solid #cbd8cc;
    border-radius: 10px;
    background: #fff;
    padding: 6px;
    /* ---- defect part of (1): the real focusable element's native ring removed ---- */
  }
  .listbox:focus { outline: none; }   /* container is the tab stop; ring removed, no replacement */

  .opt {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 7px; cursor: pointer;
  }
  .opt + .opt { margin-top: 2px; }
  .opt .price { color: #2f7d4f; font-weight: 600; }
  .opt .full { color: #9aa79c; }

  /* ---- defect part (1)+(2): the ONLY "current option" cue is this pale bg tint,
     applied by JS to a sibling div. No focus moves, no aria-activedescendant. The pale
     tint also flattens to system Canvas in forced-colors mode. ---- */
  .opt.is-active { background-color: #e3f3e7; }

  .legend { font-size: .82rem; color: #6c7c6f; margin-top: 10px; }
  button.confirm {
    margin-top: 18px; font: inherit; font-weight: 600;
    background: #2f7d4f; color: #fff; border: none; border-radius: 8px;
    padding: 11px 22px; cursor: pointer;
  }
  button.confirm:focus { outline: 2px solid #14532d; outline-offset: 2px; } /* the button is fine */
</style>
</head>
<body>
<div class="wrap">
  <h1>Choose your delivery slot</h1>
  <p class="sub">Tomorrow, Saturday 22 June — FreshCrate same-day grocery delivery.</p>

  <div class="listbox" role="listbox" aria-label="Delivery time slots" tabindex="0" id="slots">
    <div class="opt is-active" role="option" aria-selected="true" data-slot="0">
      <span>08:00 – 10:00</span><span class="price">£2.50</span>
    </div>
    <div class="opt" role="option" aria-selected="false" data-slot="1">
      <span>10:00 – 12:00</span><span class="price">£3.50</span>
    </div>
    <div class="opt" role="option" aria-selected="false" data-slot="2">
      <span>12:00 – 14:00</span><span class="full">Full</span>
    </div>
    <div class="opt" role="option" aria-selected="false" data-slot="3">
      <span>16:00 – 18:00</span><span class="price">£3.50</span>
    </div>
    <div class="opt" role="option" aria-selected="false" data-slot="4">
      <span>18:00 – 20:00</span><span class="price">£4.50 (peak)</span>
    </div>
  </div>
  <p class="legend">Use the Up and Down arrow keys to move between slots, then press Enter to select.</p>

  <button type="button" class="confirm">Confirm slot</button>
</div>

<script>
  // Custom listbox: focus STAYS on the container. Arrow keys recolor a sibling .opt
  // (the .is-active class) instead of moving focus. No aria-activedescendant is set.
  var box = document.getElementById('slots');
  var opts = Array.prototype.slice.call(box.querySelectorAll('.opt'));
  var idx = 0;
  function setActive(i) {
    if (i < 0 || i >= opts.length) return;
    opts[idx].classList.remove('is-active');
    opts[idx].setAttribute('aria-selected', 'false');
    idx = i;
    opts[idx].classList.add('is-active');
    opts[idx].setAttribute('aria-selected', 'true');
    // NOTE: focus is never moved to opts[idx], and box has no aria-activedescendant.
  }
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(idx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(idx - 1); }
  });
  opts.forEach(function (o, i) { o.addEventListener('click', function () { box.focus(); setActive(i); }); });
</script>
</body>
</html>
