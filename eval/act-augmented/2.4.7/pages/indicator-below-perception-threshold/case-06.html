<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State of Maridon — Vehicle Registration Renewal</title>
<style>
  :root{
    --bg:#ffffff; --ink:#13242f; --muted:#566872; --line:#c9d4db;
    --gov:#0a2a43; --link:#1763b5; --sans:"Source Sans 3",system-ui,Segoe UI,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#eef2f4; color:var(--ink); font:16px/1.55 var(--sans);}
  .gov-bar{background:var(--gov); color:#fff; font-size:.78rem; padding:6px 18px; letter-spacing:.02em;}
  .masthead{background:#fff; border-bottom:4px solid var(--gov); padding:14px 18px; display:flex; align-items:center; gap:12px;}
  .seal{width:36px; height:36px; border-radius:50%; background:var(--gov);}
  .masthead .t{font-weight:700;}
  main{max-width:620px; margin:24px auto; background:#fff; border:1px solid var(--line);
       border-radius:12px; padding:26px 26px 30px;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  .step{color:var(--muted); font-size:.85rem; margin:0 0 22px;}
  label{display:block; font-weight:600; font-size:.9rem; margin:18px 0 6px;}
  .hint{font-weight:400; color:var(--muted); font-size:.82rem;}
  input[type=text], select{
    width:100%; padding:10px 11px; font:inherit; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px;
  }

  input:focus-visible,
  select:focus-visible,
  .btn:focus-visible{
    outline:2px solid var(--link);
    outline-offset:2px;
  }
  input, select, .btn{ outline-color:transparent; }  

  .row{display:flex; gap:14px;}
  .row > div{flex:1;}
  .actions{margin-top:26px; display:flex; gap:12px;}
  .btn{font:700 .95rem/1 var(--sans); padding:12px 18px; border-radius:9px; cursor:pointer;}
  .btn-primary{background:var(--gov); color:#fff; border:1px solid var(--gov);}
  .btn-ghost{background:#fff; color:var(--gov); border:1px solid var(--line);}
  .note{color:var(--muted); font-size:.8rem; margin-top:18px;}
</style>
</head>
<body>
<div class="gov-bar">An official service of the State of Maridon &middot; Department of Motor Vehicles</div>
<div class="masthead"><span class="seal" aria-hidden="true"></span><span class="t">Maridon DMV &mdash; Online Services</span></div>

<main>
  <h1>Renew your vehicle registration</h1>
  <p class="step">Step 2 of 4 &middot; Vehicle details</p>

  <form action="#step3" method="post" novalidate>
    <label for="plate">License plate number
      <span class="hint">As shown on your current registration card.</span></label>
    <input type="text" id="plate" name="plate" autocomplete="off" placeholder="ABC-1234">

    <div class="row">
      <div>
        <label for="vtype">Vehicle type</label>
        <select id="vtype" name="vtype">
          <option>Passenger car</option>
          <option>Light truck / SUV</option>
          <option>Motorcycle</option>
          <option>Trailer</option>
          <option>Commercial</option>
        </select>
      </div>
      <div>
        <label for="county">County of residence</label>
        <select id="county" name="county">
          <option>Ashford</option>
          <option>Belmont</option>
          <option>Carrow</option>
          <option>Dunmere</option>
        </select>
      </div>
    </div>

    <label for="vin">VIN (last 6 characters)</label>
    <input type="text" id="vin" name="vin" maxlength="6" placeholder="A1B2C3">

    <div class="actions">
      <button type="button" class="btn btn-ghost">Back</button>
      <button type="submit" class="btn btn-primary">Continue to payment</button>
    </div>
    <p class="note">Use Tab to move between fields. The control you are on is
      framed by a blue focus outline.</p>
  </form>
</main>
</body>
</html>
