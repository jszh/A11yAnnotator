<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashmere Crew Sweater — Aurelia</title>
  <style>
    :root { --ink:#1c1a17; --accent:#9a2d3a; --muted:#6c6259; --line:#eae3d9; --bg:#fdfbf7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--bg); }
    header { display:flex; align-items:center; gap:14px; padding:16px 26px; border-bottom:1px solid var(--line); }
    .wordmark { font-family:"Didot","Bodoni MT",Georgia,serif; font-size:24px; letter-spacing:.18em; }
    header nav { margin-left:auto; display:flex; gap:18px; }
    header nav a { color:var(--ink); text-decoration:none; font-size:14px; }
    .product { max-width:980px; margin:0 auto; padding:34px 24px; display:grid; grid-template-columns:1.1fr 1fr; gap:34px; }
    .gallery { background:#f2ece3; border-radius:14px; aspect-ratio:4/5; display:flex; align-items:center; justify-content:center; color:#b6a994; font-size:14px; }
    .info h1 { font-size:26px; margin:0 0 6px; }
    .info .price { font-size:22px; margin:6px 0 14px; }
    .info p { line-height:1.7; color:#3a342d; font-size:15.5px; }
    .badges { display:flex; align-items:center; gap:16px; margin:20px 0; }
    .badges svg { display:block; }
    .info .opts label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    .info select { width:100%; padding:9px; border:1px solid #cfc6ba; border-radius:6px; }
    .info button.add { margin-top:18px; width:100%; padding:13px; border:0; border-radius:8px; background:var(--ink); color:#fff; font-size:15px; cursor:pointer; }
    @media (max-width:760px){ .product{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <span class="wordmark">AURELIA</span>
    <nav aria-label="Primary"><a href="#">Women</a><a href="#">Men</a><a href="#">Sale</a></nav>
  </header>

  <div class="product">
    <div class="gallery">[ product photography ]</div>

    <div class="info">
      <h1>Cashmere Crew Sweater</h1>
      <div class="price">$148.00</div>
      <p>Spun from grade-A Mongolian cashmere with a relaxed crew neck and ribbed cuffs.
         Mid-weight, so it layers in autumn and stands alone in spring.</p>

      <div class="badges">
        <svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Aurelia">
          <circle cx="42" cy="42" r="40" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
          <text x="42" y="48" fill="#1c1a17" font-family="Didot,Georgia,serif"
                font-size="15" letter-spacing="1.5" text-anchor="middle">AURELIA</text>
        </svg>

        <svg width="120" height="120" viewBox="0 0 120 120" role="img"
             aria-labelledby="ship-badge-title">
          <title id="ship-badge-title">Free shipping on orders over $50</title>
          <circle cx="60" cy="60" r="56" fill="#9a2d3a"/>
          <circle cx="60" cy="60" r="49" fill="none" stroke="#fff" stroke-width="1.5"/>
          <text x="60" y="48" fill="#fff" font-family="Helvetica,Arial,sans-serif"
                font-size="15" font-weight="bold" text-anchor="middle">FREE</text>
          <text x="60" y="66" fill="#fff" font-family="Helvetica,Arial,sans-serif"
                font-size="15" font-weight="bold" text-anchor="middle">SHIPPING</text>
          <text x="60" y="86" fill="#ffe2c2" font-family="Helvetica,Arial,sans-serif"
                font-size="11" text-anchor="middle">on orders over $50</text>
        </svg>
      </div>

      <div class="opts">
        <label for="size">Size</label>
        <select id="size"><option>XS</option><option>S</option><option>M</option><option>L</option></select>
        <label for="color">Colour</label>
        <select id="color"><option>Oatmeal</option><option>Charcoal</option><option>Forest</option></select>
      </div>
      <button class="add" type="button">Add to bag</button>
    </div>
  </div>
</body>
</html>
