<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your travel date — Aerolink</title>
<style>
  :root { --ink:#10243a; --muted:#5a6b80; --line:#dbe3ec; --brand:#0a4d8c; --bg:#eef3f8; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:10px; }
  header .mark { width:28px; height:28px; border-radius:7px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:800; }
  main { max-width:540px; margin:30px auto; padding:0 20px 220px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 30px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 24px; font-size:.92rem; }
  .route { font-size:.86rem; color:var(--muted); margin:0 0 22px; }
  .route strong { color:var(--ink); }
  .field { margin:0 0 20px; position:relative; }
  label { display:block; font-weight:600; margin-bottom:6px; font-size:.92rem; }
  input[type=text] { width:100%; padding:11px 12px; border:1px solid #b7c0cc; border-radius:8px; font-size:1rem; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; }
  fieldset.fare { border:1px solid var(--line); border-radius:10px; padding:14px 16px 6px; margin:0 0 20px; }
  fieldset.fare legend { font-weight:600; font-size:.92rem; padding:0 6px; }
  .fare-opt { display:flex; align-items:center; gap:10px; padding:8px 4px; font-size:.92rem; border-bottom:1px solid #f0f3f7; cursor:pointer; }
  .fare-opt:last-child { border-bottom:0; }
  .fare-opt input { width:auto; margin:0; }
  .date-hint {
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:13px 24px; background:#eaf2fb; border-top:1px solid #b9d4f0;
    font-size:.86rem; color:#1d4e82;
  }
  #travel:focus ~ .date-hint { display:block; }
  .summary-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#0a3766; color:#fff; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    box-shadow:0 -6px 18px rgba(0,0,0,.18);
  }
  .summary-bar .total { font-size:1.05rem; font-weight:700; }
  .summary-bar .sub { font-size:.78rem; opacity:.85; }
  .summary-bar button { background:#37b27a; color:#06301e; border:0; border-radius:8px; padding:11px 22px; font-size:1rem; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span class="mark">A</span>
  <strong>Aerolink</strong>
</header>

<main>
  <div class="card">
    <h1>Choose your travel date</h1>
    <p class="lead">Step 2 of 4 — when would you like to fly?</p>
    <p class="route"><strong>EDI</strong> Edinburgh &rarr; <strong>LHR</strong> London Heathrow · 1 adult · Economy</p>

    <form action="/book/date" method="post" novalidate>
      <div class="field">
        <label for="pax">Passenger name (as on passport)</label>
        <input type="text" id="pax" name="pax" autocomplete="name" value="R. Mhlanga">
      </div>

      <fieldset class="fare">
        <legend>Fare class</legend>
        <label class="fare-opt"><input type="radio" name="fare" value="economy" checked> Economy — £128.40</label>
        <label class="fare-opt"><input type="radio" name="fare" value="economy-plus"> Economy Plus — £171.00</label>
        <label class="fare-opt"><input type="radio" name="fare" value="flex"> Economy Flex (free changes) — £214.60</label>
        <label class="fare-opt"><input type="radio" name="fare" value="business"> Business — £498.00</label>
      </fieldset>

      <div class="field">
        <label for="travel">Travel date</label>
        <input type="text" id="travel" name="travel" inputmode="numeric" autocomplete="off"
               aria-describedby="travel-hint">
        <div class="date-hint" id="travel-hint">
          Use day-first format <strong>DD/MM/YYYY</strong> — for example 09/03/2026 for 9 March 2026.
        </div>
      </div>
    </form>
  </div>
</main>

<div class="summary-bar" role="contentinfo">
  <div>
    <div class="total">£128.40</div>
    <div class="sub">Total for 1 passenger · includes taxes</div>
  </div>
  <button type="button">Continue</button>
</div>
</body>
</html>
