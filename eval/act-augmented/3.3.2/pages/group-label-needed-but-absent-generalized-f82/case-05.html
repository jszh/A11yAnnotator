<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register attendees — DevNorth 2026</title>
<style>
  :root { --ink:#1b1f23; --muted:#5b6470; --line:#dfe3e8; --brand:#6a2bd9; --bg:#f5f3fb; }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         color: var(--ink); background: var(--bg); margin:0; padding:32px 16px 60px; }
  .wrap { max-width: 720px; margin:0 auto; }
  .kicker { color:var(--brand); font-weight:800; letter-spacing:.6px; font-size:.72rem; text-transform:uppercase; }
  h1 { font-size:1.4rem; margin:8px 0 2px; }
  .lede { color:var(--muted); font-size:.88rem; margin:0 0 26px; }
  form { background:#fff; border:1px solid var(--line); border-radius:14px;
         padding:8px 24px 28px; box-shadow:0 1px 4px rgba(27,31,35,.06); }

  /* Each attendee's fields live in a card. The card's title bar is a styled DIV that sits
     ABOVE the field <div> as a visual header. It is real text in the DOM (not generated
     content), but it is not a <legend>, not a heading, and is not referenced by the group
     or any control via aria. It is a decorative "section chrome" element. */
  .ticket { border:1px solid var(--line); border-radius:11px; margin:20px 0; overflow:hidden; }
  .ticket-bar { display:flex; align-items:center; gap:10px;
                background:linear-gradient(90deg,#6a2bd9,#9656e8); color:#fff;
                padding:11px 16px; font-weight:800; font-size:.95rem; }
  .ticket-bar .num { display:inline-flex; align-items:center; justify-content:center;
                     width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.22);
                     font-size:.78rem; }
  .ticket-body { padding:18px 16px 4px; }
  .row { display:flex; gap:14px; }
  .row > div { flex:1 1 0; min-width:0; margin-bottom:14px; }
  .row.full > div { flex:1 1 100%; }
  label { display:block; font-weight:600; font-size:.78rem; margin:0 0 6px; }
  input, select { width:100%; padding:10px 11px; font-size:.92rem;
                  border:1px solid var(--line); border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px; }
  .actions { margin-top:20px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px;
           padding:13px 28px; font-size:.95rem; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">DevNorth 2026 · Checkout</p>
    <h1>Who are these tickets for?</h1>
    <p class="lede">You bought 2 conference passes. Enter each attendee's details below. Names print on the badges.</p>

    <form action="#" novalidate aria-label="Attendee registration">

      <!-- ATTENDEE 1 -->
      <section class="ticket">
        <!-- Real DOM text "Attendee 1", but it is a free-floating styled <div>:
             not a <legend>, not a heading, and not wired to the fields via aria-labelledby. -->
        <div class="ticket-bar"><span class="num">1</span>Attendee 1</div>
        <div class="ticket-body">
          <div class="row">
            <div>
              <label for="a1-name">Full name</label>
              <input id="a1-name" name="a1_name" type="text" autocomplete="off" value="">
            </div>
            <div>
              <label for="a1-email">Email for the ticket</label>
              <input id="a1-email" name="a1_email" type="email" autocomplete="off" value="">
            </div>
          </div>
          <div class="row full">
            <div>
              <label for="a1-shirt">T-shirt size</label>
              <select id="a1-shirt" name="a1_shirt">
                <option value="">Choose a size</option>
                <option>Small</option><option>Medium</option>
                <option>Large</option><option>X-Large</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- ATTENDEE 2: byte-for-byte identical inner labels; only the bar text differs -->
      <section class="ticket">
        <div class="ticket-bar"><span class="num">2</span>Attendee 2</div>
        <div class="ticket-body">
          <div class="row">
            <div>
              <label for="a2-name">Full name</label>
              <input id="a2-name" name="a2_name" type="text" autocomplete="off" value="">
            </div>
            <div>
              <label for="a2-email">Email for the ticket</label>
              <input id="a2-email" name="a2_email" type="email" autocomplete="off" value="">
            </div>
          </div>
          <div class="row full">
            <div>
              <label for="a2-shirt">T-shirt size</label>
              <select id="a2-shirt" name="a2_shirt">
                <option value="">Choose a size</option>
                <option>Small</option><option>Medium</option>
                <option>Large</option><option>X-Large</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="submit">Confirm registration</button>
      </div>
    </form>
  </main>

  <!--
    WHY AUTOMATED TOOLS MISS IT
    Every input/select is a native control with a correctly associated <label> ("Full name",
    "Email for the ticket", "T-shirt size"), so axe/WAVE/Lighthouse report all fields labeled
    and pass. The form has an aria-label. The visible group titles "Attendee 1" / "Attendee 2"
    ARE real text in the DOM (a styled <div>, not CSS-generated content), so a contrast or
    text-presence check sees them too. Nothing is empty or missing.

    The defect (the narrower, sound version): the page collects TWO attendees in two
    structurally identical blocks whose inner labels ("Full name / Email for the ticket /
    T-shirt size") are byte-for-byte the same. The ONLY thing disambiguating them is the title
    bar "Attendee 1" / "Attendee 2" — and that title is a free-floating decorative <div>:

      <div class="ticket-bar">...Attendee 1</div>

    It is NOT a <legend> for a <fieldset>, NOT a heading inside the group, and NOT referenced
    by the <section> or any control via aria-labelledby/aria-describedby. So it is not part of
    any field's accessible name and is not the accessible name of any group/region. An AT user
    navigating control-by-control in forms mode (the common way of filling forms with NVDA /
    JAWS / VoiceOver) jumps input-to-input and hears "Full name, edit … Full name, edit" with
    no "Attendee 1 / Attendee 2" boundary announced — the disambiguator the sighted user reads
    in the purple bar never enters the forms-mode reading flow. The group label needed to tell
    the two identical blocks apart is present visually but is not presented as a label to all
    users in the way they consume the form. This is F82's rationale generalized (per-field
    labels insufficient; a group description is required; here it is supplied only as
    chrome, not as an actual label/legend/heading bound to the group). Tools do not reason
    that two identical blocks NEED a programmatically-bound group label, nor model forms-mode
    navigation, so they miss it.
  -->
</body>
</html>
