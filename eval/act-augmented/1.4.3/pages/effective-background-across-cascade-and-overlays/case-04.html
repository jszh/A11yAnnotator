<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resonance — Now Playing</title>
<style>
  body { margin:0; background:#101216; font-family:"Avenir Next", system-ui, sans-serif; }
  .player { max-width: 440px; margin: 48px auto; padding: 0 16px; }

  .art {
    position: relative;
    background: #c0c0c0;           
    aspect-ratio: 1 / 1;
    border-radius: 16px 16px 0 0;
    display: flex; align-items: flex-end; padding: 24px;
  }
  .track-title {
    margin: 0;
    font-size: 1.85rem; font-weight: 800; line-height: 1.1;
    color: #262626;
    mix-blend-mode: soft-light;    
  }

  .meta {
    background:#1b1e24; color:#e7e9ee;
    border-radius: 0 0 16px 16px;
    padding: 16px 24px 22px;
  }
  .meta .artist { font-size: 1.05rem; font-weight: 600; margin: 0 0 2px; }
  .meta .album  { font-size: .85rem; color:#aeb4bf; margin: 0; }
  .controls { margin-top: 16px; display:flex; gap:18px; align-items:center; }
  .controls button {
    background:#2a2f37; color:#e7e9ee; border:none; border-radius:8px;
    padding:8px 14px; font:600 .85rem system-ui; cursor:pointer;
  }
  .scrub { flex:1; height:4px; background:#3a4049; border-radius:2px; position:relative; }
  .scrub::before { content:""; position:absolute; inset:0 55% 0 0; background:#7aa2ff; border-radius:2px; }
</style>
</head>
<body>
  <div class="player">
    <div class="art">
      <h1 class="track-title">Lantern in the Static</h1>
    </div>
    <div class="meta">
      <p class="artist">Halverson &amp; the Tide</p>
      <p class="album">from <em>Coastal Drift</em> &middot; 2025</p>
      <div class="controls">
        <button type="button">Prev</button>
        <button type="button">Pause</button>
        <button type="button">Next</button>
        <div class="scrub" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
