<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Rewards — Cashback summary</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    max-width: 560px;
    margin: 40px auto;
    border: 1px solid #e4e4e4;
    border-radius: 12px;
    padding: 28px 30px 30px;
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
             color: #1a1a1a; margin: 0 0 14px; }

  .promo {
    font-size: 24px;            
    font-weight: 400;
    line-height: 1.2;
    color: #8a8a8a;             
    transform: scale(0.6);      
    transform-origin: left top;
    display: inline-block;
    white-space: nowrap;
    margin: 0 0 18px;
  }

  .amount { font-size: 34px; font-weight: 700; color: #1a1a1a; margin: 0 0 4px; }
  .amount-note { font-size: 14px; color: #1a1a1a; margin: 0 0 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid #ededed; color: #1a1a1a; }
  th { font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Tidewater Rewards · Summer statement</p>

    <p class="promo" id="strapline">Earn 2.4% cashback on every purchase this season</p>

    <p class="amount">$142.80</p>
    <p class="amount-note">Cashback earned this statement period.</p>

    <table>
      <thead>
        <tr><th scope="col">Category</th><th scope="col">Spend</th><th scope="col">Earned</th></tr>
      </thead>
      <tbody>
        <tr><td>Groceries</td><td>$3,210.00</td><td>$77.04</td></tr>
        <tr><td>Travel</td><td>$1,540.00</td><td>$36.96</td></tr>
        <tr><td>Dining</td><td>$1,200.00</td><td>$28.80</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
