<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater Rewards — Cashback summary</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    max-width: 560px;
    margin: 40px auto;
    border: 1px solid #e4e4e4;
    border-radius: 12px;
    padding: 28px 30px 30px;
  }
  .eyebrow { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
             color: #1a1a1a; margin: 0 0 14px; }

  /* PROMO STRAPLINE. The design team set this seasonal cashback line as a
     "display" headline at font-size:24px / weight 400 — i.e. 18.0pt by the CSS
     metric (1pt = 1.333px, so 24px = 18.0pt). At 18pt the WCAG large-scale
     relaxation would grant the 3:1 ratio, and #8a8a8a on #fff = 3.4522:1 clears
     3:1. BUT to fit the strapline on one line inside the narrow card the team
     wrapped it in transform: scale(0.6) — so the GLYPHS actually RENDER at
     24px * 0.6 = 14.4px = 10.8pt. The size that governs the threshold is the
     rendered one ("obtained from the user agent or calculated on font metrics
     in the way that user agents do"), and 10.8pt is well below the 18pt
     large-scale boundary. So this is NORMAL-size text: the 4.5:1 threshold
     applies, and 3.4522:1 < 4.5:1 -> FAIL.

     The trap: axe-core reads the COMPUTED font-size (24px = 18.0pt), classifies
     the text as large-scale, applies 3:1, sees 3.45:1, and PASSES it (0
     violations, 0 incomplete) — it does not fold the CSS transform into the
     size determination. The human must (a) note the rendered glyph size is the
     CSS size times the transform scale, (b) compute 24px*0.6 = 14.4px = 10.8pt,
     (c) conclude it is NOT large-scale, so 4.5:1 (not the relaxed 3:1) is the
     governing threshold, and (d) fail 3.4522:1 against 4.5:1. */
  .promo {
    font-size: 24px;            /* computed = 18.0pt; axe -> large-scale -> 3:1 */
    font-weight: 400;
    line-height: 1.2;
    color: #8a8a8a;             /* #8a8a8a on #fff = 3.4522:1 */
    transform: scale(0.6);      /* rendered glyphs = 24px*0.6 = 14.4px = 10.8pt -> NOT large-scale */
    transform-origin: left top;
    display: inline-block;
    white-space: nowrap;
    margin: 0 0 18px;
  }

  .amount { font-size: 34px; font-weight: 700; color: #1a1a1a; margin: 0 0 4px; }
  .amount-note { font-size: 14px; color: #1a1a1a; margin: 0 0 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid #ededed; color: #1a1a1a; }
  th { font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Tidewater Rewards · Summer statement</p>

    <!--
      .promo: color #8a8a8a on #fff = 3.4522:1. CSS font-size 24px == 18.0pt by
      the UA metric (1pt = 1.333px), which axe treats as large-scale and passes
      at 3:1. But transform: scale(0.6) makes the GLYPHS render at 24px*0.6 =
      14.4px = 10.8pt — below the 18pt large-scale boundary. The threshold is set
      by the rendered size, so this is normal-size text requiring 4.5:1, and
      3.4522:1 < 4.5:1. Correct 1.4.3 verdict: FAIL. axe reports a clean pass
      because it never folds the transform into the size determination.
    -->
    <p class="promo" id="strapline">Earn 2.4% cashback on every purchase this season</p>

    <p class="amount">$142.80</p>
    <p class="amount-note">Cashback earned this statement period.</p>

    <table>
      <thead>
        <tr><th scope="col">Category</th><th scope="col">Spend</th><th scope="col">Earned</th></tr>
      </thead>
      <tbody>
        <tr><td>Groceries</td><td>$3,210.00</td><td>$77.04</td></tr>
        <tr><td>Travel</td><td>$1,540.00</td><td>$36.96</td></tr>
        <tr><td>Dining</td><td>$1,200.00</td><td>$28.80</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
