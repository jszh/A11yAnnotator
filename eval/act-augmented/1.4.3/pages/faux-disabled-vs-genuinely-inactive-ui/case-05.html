<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now playing — Larkwave</title>
  <style>
    :root { --panel:#0c1f2b; --ink:#eef4f7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Helvetica Neue",Arial,sans-serif; background:#07141c; color:var(--ink); }
    .app { max-width:760px; margin:36px auto; padding:0 18px; }
    .app h1 { font-size:20px; margin:0 0 16px; color:#cfe0e9; }

    .card {
      position:relative; border-radius:14px; overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.5); aspect-ratio:16/9;
      background-image:linear-gradient(135deg,
        #0c1f2b 0%, #16323f 30%, #4b6256 52%, #b6a679 70%, #e0cfa3 84%, #e9d9b6 100%);
      background-size:cover;
    }

    .meta { position:absolute; top:18px; left:20px; }
    .meta .now { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#bcd2dd; margin:0 0 4px; }
    .meta .title { font-size:22px; font-weight:800; margin:0; color:#ffffff; }   
    .meta .artist { font-size:14px; margin:4px 0 0; color:#e8eef2; }             

    .bar {
      position:absolute; left:0; right:0; bottom:0;
      display:flex; align-items:center; gap:18px;
      padding:16px 20px;
    }
    .ctrl {
      background:transparent; border:0; padding:6px 4px;
      font-size:15px; font-weight:700; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
    }
    .ctrl .ico { width:18px; height:18px; flex:0 0 auto; }
    .ctrl:focus-visible { outline:2px solid #ffffff; outline-offset:3px; border-radius:6px; }

    .save { color:#ffffff; margin-left:auto; }     
    .save .ico { stroke:#ffffff; }

    .shuffle[disabled] { color:#7f8a86; cursor:not-allowed; }  
    .shuffle[disabled] .ico { stroke:#7f8a86; }

    .toast {
      margin-top:14px; padding:10px 14px; border-radius:8px;
      background:#10303f; color:#dff3e6; border:1px solid #1e6b46;
      font-size:14px; display:none;
    }
    .hint { margin-top:14px; color:#9fb3bf; font-size:13px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Larkwave</h1>

    <section class="card" aria-label="Now playing">
      <div class="meta">
        <p class="now">Now playing</p>
        <p class="title">Harbour Lights</p>
        <p class="artist">The Tessellates</p>
      </div>

      <div class="bar">
        <button type="button" class="ctrl shuffle" id="shuffle" disabled
                aria-label="Shuffle (Premium only)">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
            <path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7M16 21h5v-5M21 21l-7-7M3 3l5 5"/>
          </svg>
          Shuffle
        </button>

        <button type="button" class="ctrl save" id="save" onclick="saved()">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
            <path d="M12 21s-7-4.5-9.5-8.5C.9 9.6 2.2 6 5.5 6 7.4 6 8.9 7 12 10c3.1-3 4.6-4 6.5-4 3.3 0 4.6 3.6 3 6.5C19 16.5 12 21 12 21z"/>
          </svg>
          Save to library
        </button>
      </div>
    </section>

    <p class="toast" id="toast" role="status">Saved “Harbour Lights” to your library.</p>
    <p class="hint">Tip: tap the heart to save tracks for offline listening.</p>
  </div>

  <script>
    function saved() {
      var t = document.getElementById('toast');
      t.style.display = 'block';
      document.getElementById('save').setAttribute('aria-pressed', 'true');
    }
  </script>
</body>
</html>
