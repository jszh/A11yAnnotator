<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linaro — Project workspace</title>
  <style>
    :root { font-family: "Inter", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fbfbfc; color: #20242b; }
    .appbar { display: flex; align-items: center; gap: 28px; height: 60px;
      padding: 0 20px; background: #ffffff; border-bottom: 1px solid #ececf1; }
    a.brand-home { font-family: "Inter", sans-serif; font-weight: 800; font-size: 22px;
      letter-spacing: -0.5px; color: #6ec3b6; text-decoration: none; line-height: 1; }
    a.brand-home:focus-visible { outline: 2px solid #2f6df6; outline-offset: 3px; }
    .appnav { display: flex; gap: 20px; }
    .appnav a { color: #3b4150; text-decoration: none; font-size: 14px; padding: 8px 4px; }
    .appnav a[aria-current="page"] { color: #20242b; border-bottom: 2px solid #2f6df6; }
    .spacer { flex: 1; }
    .who { font-size: 13px; color: #5a6172; }
    main { max-width: 960px; margin: 0 auto; padding: 28px 24px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: #5a6172; margin: 0 0 20px; font-size: .95rem; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .col { background: #fff; border: 1px solid #ececf1; border-radius: 10px; padding: 12px; }
    .col h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .6px;
      color: #5a6172; margin: 0 0 10px; }
    .ticket { background: #f6f7f9; border-radius: 8px; padding: 10px; margin-bottom: 10px;
      font-size: .9rem; }
    .ticket .key { font-size: .72rem; color: #5a6172; }
  </style>
</head>
<body>
  <header>
    <div class="appbar">
      <a class="brand-home" href="/" aria-label="Linaro home">Linaro</a>
      <nav class="appnav" aria-label="Workspace">
        <a href="/board" aria-current="page">Board</a>
        <a href="/backlog">Backlog</a>
        <a href="/reports">Reports</a>
      </nav>
      <span class="spacer"></span>
      <span class="who">Priya N. · Maker plan</span>
    </div>
  </header>

  <main>
    <h1>Sprint 14 — Checkout rewrite</h1>
    <p class="sub">12 issues · ends Friday</p>

    <div class="board">
      <section class="col">
        <h2>To do</h2>
        <div class="ticket"><span class="key">LIN-204</span><br>Split address form into steps</div>
        <div class="ticket"><span class="key">LIN-211</span><br>Add saved-card selector</div>
      </section>
      <section class="col">
        <h2>In progress</h2>
        <div class="ticket"><span class="key">LIN-198</span><br>Tax estimate API integration</div>
      </section>
      <section class="col">
        <h2>Done</h2>
        <div class="ticket"><span class="key">LIN-187</span><br>Coupon field validation</div>
      </section>
    </div>
  </main>

</body>
</html>
