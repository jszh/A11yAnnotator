<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercato — handmade marketplace</title>
  <style>
    :root { font-family: "Helvetica Neue", Arial, sans-serif; }
    body { margin: 0; background: #ffffff; color: #1d1d1f; line-height: 1.55; }

    header.bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 22px; border-bottom: 1px solid #ececec;
      position: sticky; top: 0; background: #ffffff;
    }
    a.brand-home { display: inline-flex; align-items: center; text-decoration: none; }
    a.brand-home:focus-visible { outline: 3px solid #0a66ff; outline-offset: 3px; }
    .brand-svg { height: 34px; width: auto; display: block; }

    nav.acct { display: flex; gap: 18px; align-items: center; }
    nav.acct a { color: #1d1d1f; text-decoration: none; font-size: 14px; }
    nav.acct a:hover { text-decoration: underline; }

    main { max-width: 1040px; margin: 0 auto; padding: 26px 22px 60px; }
    h1.page { font-size: 22px; margin: 6px 0 18px; color: #1d1d1f; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { border: 1px solid #ececec; border-radius: 10px; overflow: hidden; }
    .card .ph { height: 132px; background: #f3f1ee; }
    .card .body { padding: 12px 14px 16px; }
    .card .ttl { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    .card .price { font-size: 15px; color: #1d1d1f; margin: 0; }
    .card .seller { font-size: 13px; color: #5a5a5f; margin: 2px 0 0; }
    footer { max-width: 1040px; margin: 0 auto; padding: 24px 22px;
      color: #5a5a5f; font-size: 13px; border-top: 1px solid #ececec; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand-home" href="/" aria-label="Mercato, home">
      <svg class="brand-svg" viewBox="0 0 168 36" role="img" aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="rosegold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"  stop-color="#d9a86b"/>
            <stop offset="100%" stop-color="#e0b483"/>
          </linearGradient>
        </defs>
        <text x="0" y="27" font-family="Georgia, 'Times New Roman', serif"
              font-size="30" font-weight="700" letter-spacing="1"
              fill="url(#rosegold)">Mercato</text>
      </svg>
    </a>

    <nav class="acct" aria-label="Account">
      <a href="/sell">Sell</a>
      <a href="/cart">Cart</a>
      <a href="/account">Account</a>
    </nav>
  </header>

  <main>
    <h1 class="page">Handmade &amp; vintage finds</h1>
    <div class="grid">
      <article class="card">
        <div class="ph"></div>
        <div class="body">
          <p class="ttl">Stoneware pour-over set</p>
          <p class="price">£48.00</p>
          <p class="seller">by NorthKilnStudio</p>
        </div>
      </article>
      <article class="card">
        <div class="ph"></div>
        <div class="body">
          <p class="ttl">Linen apron, natural</p>
          <p class="price">£32.00</p>
          <p class="seller">by FlaxAndThread</p>
        </div>
      </article>
      <article class="card">
        <div class="ph"></div>
        <div class="body">
          <p class="ttl">Brass desk lamp, restored</p>
          <p class="price">£120.00</p>
          <p class="seller">by ReclaimWorks</p>
        </div>
      </article>
    </div>
  </main>

  <footer>
    Mercato is a marketplace for independent makers. Prices include VAT.
  </footer>

</body>
</html>
