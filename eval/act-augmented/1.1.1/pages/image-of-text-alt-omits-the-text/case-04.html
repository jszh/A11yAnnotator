<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SC 1.1.1 FAILURE — pricing table flattened into one image of text; alt labels it but
    drops every plan name and price (TT 7.A.1.d; F30 / G94 check #4).

    A SaaS marketing page renders its entire pricing comparison as a single exported image
    (inline-SVG data: URI in <img src>) so the bespoke layout survives across browsers. The
    pixels contain the load-bearing commercial terms:
        Starter  $0/mo   — 1 seat, 100 events
        Team     $29/mo  — 10 seats, 50k events
        Scale    $99/mo  — unlimited seats, 1M events
    The alt is non-empty and accurate as a label: alt="Pricing plans comparison". No price,
    seat count, or plan name reaches assistive technology. A blind prospect cannot tell that
    Team is $29 or that Scale exists at all — they hear "Pricing plans comparison, image".

    WHY AUTOMATED TOOLS MISS IT: image-alt passes (non-empty), qt1vmo passes (the name
    truthfully identifies the image as a pricing comparison). No automated checker OCRs the
    table and verifies the alt enumerates the three tiers and their prices. Because the
    information is structured (a table), the correct fix is real HTML text — but detecting
    that the picture IS a price table needing transcription is a manual visual judgment.
  -->
  <title>Pricing — Cadence event tracking</title>
  <style>
    :root { --ink:#10182a; --muted:#5a6478; --line:#e6e9f0; --brand:#3b5bdb; --bg:#f7f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    nav { display:flex; align-items:center; justify-content:space-between; padding:14px 28px; background:#fff; border-bottom:1px solid var(--line); }
    nav .logo { font-weight:800; letter-spacing:-.02em; }
    nav a { color:var(--ink); text-decoration:none; margin-left:18px; font-size:14px; }
    .hero { text-align:center; padding:44px 20px 12px; }
    .hero h1 { font-size:34px; margin:0 0 8px; letter-spacing:-.02em; }
    .hero p { color:var(--muted); margin:0; font-size:17px; }
    .pricing-wrap { max-width:860px; margin:24px auto 40px; padding:0 20px; }
    .pricing-wrap img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:14px; background:#fff; }
    .reassure { max-width:860px; margin:0 auto 60px; padding:0 20px; color:var(--muted); font-size:14px; text-align:center; }
    .reassure a { color:var(--brand); }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Cadence</span>
    <span>
      <a href="#product">Product</a>
      <a href="#docs">Docs</a>
      <a href="#pricing" aria-current="page">Pricing</a>
    </span>
  </nav>

  <section class="hero">
    <h1>Simple, scalable pricing</h1>
    <p>Choose the plan that fits your team. Compare them below.</p>
  </section>

  <div class="pricing-wrap">
    <!--
      The whole pricing comparison is ONE image. Pixels hold plan names, prices, seat
      counts, and event limits. The alt is a truthful label that reproduces none of it.
    -->
    <img alt="Pricing plans comparison"
         src="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='820'%20height='360'%20viewBox='0%200%20820%20360'%3E%3Crect%20width='820'%20height='360'%20fill='%23ffffff'/%3E%3Cg%20font-family='Arial,sans-serif'%3E%3C!--Starter--%3E%3Crect%20x='20'%20y='20'%20width='250'%20height='320'%20rx='12'%20fill='%23f7f8fb'%20stroke='%23e6e9f0'/%3E%3Ctext%20x='145'%20y='62'%20text-anchor='middle'%20font-size='22'%20font-weight='bold'%20fill='%2310182a'%3EStarter%3C/text%3E%3Ctext%20x='145'%20y='112'%20text-anchor='middle'%20font-size='34'%20font-weight='bold'%20fill='%2310182a'%3E%240%2Fmo%3C/text%3E%3Ctext%20x='145'%20y='160'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3E1%20seat%3C/text%3E%3Ctext%20x='145'%20y='186'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3E100%20events%2Fmo%3C/text%3E%3C!--Team--%3E%3Crect%20x='285'%20y='20'%20width='250'%20height='320'%20rx='12'%20fill='%23eef2ff'%20stroke='%233b5bdb'/%3E%3Ctext%20x='410'%20y='62'%20text-anchor='middle'%20font-size='22'%20font-weight='bold'%20fill='%2310182a'%3ETeam%3C/text%3E%3Ctext%20x='410'%20y='112'%20text-anchor='middle'%20font-size='34'%20font-weight='bold'%20fill='%2310182a'%3E%2429%2Fmo%3C/text%3E%3Ctext%20x='410'%20y='160'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3E10%20seats%3C/text%3E%3Ctext%20x='410'%20y='186'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3E50%2C000%20events%2Fmo%3C/text%3E%3Ctext%20x='410'%20y='300'%20text-anchor='middle'%20font-size='13'%20font-weight='bold'%20fill='%233b5bdb'%3EMOST%20POPULAR%3C/text%3E%3C!--Scale--%3E%3Crect%20x='550'%20y='20'%20width='250'%20height='320'%20rx='12'%20fill='%23f7f8fb'%20stroke='%23e6e9f0'/%3E%3Ctext%20x='675'%20y='62'%20text-anchor='middle'%20font-size='22'%20font-weight='bold'%20fill='%2310182a'%3EScale%3C/text%3E%3Ctext%20x='675'%20y='112'%20text-anchor='middle'%20font-size='34'%20font-weight='bold'%20fill='%2310182a'%3E%2499%2Fmo%3C/text%3E%3Ctext%20x='675'%20y='160'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3EUnlimited%20seats%3C/text%3E%3Ctext%20x='675'%20y='186'%20text-anchor='middle'%20font-size='16'%20fill='%235a6478'%3E1%2C000%2C000%20events%2Fmo%3C/text%3E%3C/g%3E%3C/svg%3E">
  </div>

  <p class="reassure">All plans include SSO and a 14-day trial. Questions about the tiers above?
     <a href="mailto:sales@example.com">Talk to sales</a>.</p>
</body>
</html>
