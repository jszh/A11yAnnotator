<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your Plotline account</title>
<style>
  :root { --ink:#15181f; --indigo:#4f46e5; --bg:#0f1117; --card:#ffffff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",system-ui,Arial,sans-serif; color:var(--ink);
         background:linear-gradient(160deg,#1a1d29,#0f1117); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); width:100%; max-width:420px; border-radius:14px;
          padding:32px 30px 36px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .logo { font-weight:800; font-size:1.05rem; letter-spacing:-.01em; color:var(--indigo);
          margin-bottom:4px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:#5b6172; margin:0 0 26px; font-size:.95rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin:0 0 6px; }
  input[type=email], input[type=password] {
        width:100%; padding:11px 13px; font:inherit; border:1.5px solid #d2d6e0;
        border-radius:9px; background:#fff; }
  input:focus { outline:2px solid var(--indigo); outline-offset:1px; border-color:var(--indigo); }
  .group { margin-bottom:20px; }
  .meter { display:flex; gap:6px; margin-top:9px; }
  .meter .seg { height:6px; flex:1; border-radius:3px; background:#e4e7ef; }
  .meter[data-level="weak"] .seg:nth-child(1) { background:#e0392b; }
  .meter[data-level="fair"] .seg:nth-child(-n+2) { background:#e9a23b; }
  .meter[data-level="good"] .seg:nth-child(-n+3) { background:#3b9e5b; }
  .meter[data-level="strong"] .seg { background:#23a455; }
  .group.weak input { border-color:#e0392b; }
  .create { width:100%; margin-top:6px; background:var(--indigo); color:#fff; border:0;
            padding:13px; font:inherit; font-weight:700; border-radius:10px; cursor:pointer; }
  .legal { margin-top:18px; font-size:.78rem; color:#7a808f; text-align:center; }
  .legal a { color:var(--indigo); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">▰ Plotline</div>
    <h1>Create your account</h1>
    <p class="sub">Start your 14-day trial. No card required.</p>

    <form action="/signup" method="post" novalidate>
      <div class="group">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" value="dana@northwind.io" autocomplete="email">
      </div>

      <div class="group weak">
        <label for="pw">Choose a password</label>
        <input type="password" id="pw" name="pw" value="summer24" autocomplete="new-password">
        <div class="meter" data-level="weak" aria-hidden="true">
          <span class="seg"></span><span class="seg"></span>
          <span class="seg"></span><span class="seg"></span>
        </div>
      </div>

      <button type="submit" class="create">Create account</button>
    </form>

    <p class="legal">By continuing you agree to our <a href="/terms">Terms</a> and
       <a href="/privacy">Privacy Policy</a>.</p>
  </main>

<script>
  (function () {
    var pw = document.getElementById('pw');
    var group = pw.closest('.group');
    var meter = group.querySelector('.meter');
    var form = pw.closest('form');
    function classify(v) {
      var score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      if (/^(summer|winter|spring|autumn|password|qwerty)/i.test(v)) score = Math.min(score, 1);
      return ['weak','weak','fair','good','strong'][score];
    }
    function render() {
      var level = classify(pw.value);
      meter.setAttribute('data-level', level);
      group.classList.toggle('weak', level === 'weak');
    }
    pw.addEventListener('input', render);
    form.addEventListener('submit', function (e) {
      if (classify(pw.value) === 'weak') { e.preventDefault();   }
    });
    render();
  })();
</script>

</body>
</html>
