<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استرداد قيمة التذكرة — هيئة النقل العام</title>
<style>
  :root { --ink:#1d2733; --gov:#16604a; --sand:#f4f1ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
         color:var(--ink); background:var(--sand); }
  .page { max-width:600px; margin:0 auto; padding:26px 20px 80px; }
  .gov-bar { background:var(--gov); color:#fff; padding:16px 20px; border-radius:8px;
             margin-bottom:20px; }
  .gov-bar h1 { margin:0; font-size:1.25rem; }
  .gov-bar p { margin:4px 0 0; font-size:.9rem; opacity:.92; }
  form { background:#fff; border:1px solid #ddd6c8; border-radius:8px; padding:22px; }
  .field { margin-bottom:18px; }
  label { display:block; font-weight:700; margin-bottom:6px; }
  .req label::after { content:" *"; color:#cf3b2c; font-weight:700; }
  .field.bad label::after { color:#8e1a0e; font-size:1.15em; }
  input[type=text] { width:100%; padding:10px 12px; font:inherit; border:1px solid #b7b09f;
                     border-radius:6px; background:#fff; }
  .field.bad input { border:2px solid #8e1a0e; background:#fceceb; }
  .help { font-size:.82rem; color:#5f6b62; margin-top:5px; }
  .submit { background:var(--gov); color:#fff; border:0; padding:12px 26px; font:inherit;
            font-weight:700; border-radius:6px; cursor:pointer; }
  .muted { font-size:.82rem; color:#6a7167; margin-top:18px; }
</style>
</head>
<body>
<div class="page">
  <div class="gov-bar">
    <h1>استرداد قيمة التذكرة</h1>
    <p>هيئة النقل العام — الخدمات الإلكترونية</p>
  </div>

  <form action="/refund" method="post" novalidate>
    <div class="field req bad">
      <label for="nid">رقم الهوية الوطنية</label>
      <input type="text" id="nid" name="nid" value="103847562" inputmode="numeric"
             dir="ltr" autocomplete="off">
    </div>

    <div class="field req">
      <label for="ticket">رقم التذكرة</label>
      <input type="text" id="ticket" name="ticket" value="TK-558120" dir="ltr" autocomplete="off">
      <p class="help">يوجد رقم التذكرة في أعلى يمين الإيصال.</p>
    </div>

    <div class="field req">
      <label for="iban">رقم الآيبان لاسترداد المبلغ</label>
      <input type="text" id="iban" name="iban" value="SA44 2000 0001 2345 6789 1234" dir="ltr" autocomplete="off">
      <p class="help">مثال: SA يتبعها 22 رقمًا.</p>
    </div>

    <button type="submit" class="submit">إرسال طلب الاسترداد</button>
  </form>

  <p class="muted">تُعالَج طلبات الاسترداد خلال 7 أيام عمل.</p>
</div>

</body>
</html>
