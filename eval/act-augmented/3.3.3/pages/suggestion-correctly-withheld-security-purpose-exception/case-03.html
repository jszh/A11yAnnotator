<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment — Brightleaf Coffee Co. checkout</title>
<!--
  WHY AUTOMATED TOOLS MISS THIS (expected: FAILED — but the failure is on ONE field):
  This checkout shows TWO fields in the post-submit error state, each with the SAME
  terse message style:
    (A) Security code (CVV): error "Invalid security code." — CORRECT to withhold.
        The CVV is a security-sensitive field; revealing the expected value or how
        "close" the entry is would defeat the card-verification purpose. For this
        field the generic, non-suggesting message is the CONFORMANT outcome (PASS limb).
    (B) ZIP / postal code: error "Invalid." — A REAL 3.3.3 FAILURE.
        The ZIP is NOT security-sensitive. The correct value IS knowable and a
        suggestion IS possible ("ZIP codes are 5 digits, e.g. 94107" or "Did you mean
        94107?"). The page gives only a bare "Invalid" with no description of the
        problem and no suggestion for correction. The exception does NOT apply here,
        so the missing suggestion is a genuine failure.
  The judge must apply the security exception SELECTIVELY: identical-looking generic
  errors, one conformant (CVV) and one failing (ZIP). An automated tool cannot
  distinguish a security-sensitive field from a non-sensitive one, so it would treat
  both messages identically — either passing both (missing the ZIP failure) or
  flagging both (wrongly faulting the CVV). The page is overall FAILED because of the
  ZIP field; the CVV is the foil that forces the discriminating judgment.
  Structurally every error is named, associated via aria-describedby, visible, and
  high-contrast — axe/WAVE/Lighthouse object to nothing.
-->
<style>
  :root{ --ink:#1a1410; --muted:#6a5d52; --line:#ddd2c6; --brand:#6f4e2e; --accent:#c0792f;
         --danger:#a4231f; --paper:#fffdf9; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:16px/1.55 "Inter","Segoe UI",system-ui,sans-serif; color:var(--ink);
        background:#f3ece2; }
  .wrap{ max-width:560px; margin:40px auto; padding:0 18px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .brand .bean{ width:30px; height:30px; border-radius:50% 50% 50% 0;
                background:linear-gradient(135deg,var(--brand),var(--accent)); }
  .brand strong{ font-size:1.1rem; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:12px;
         padding:28px 26px; box-shadow:0 4px 16px rgba(40,28,16,.07); }
  h1{ font-size:1.3rem; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:.88rem; margin:0 0 22px; }
  fieldset{ border:0; padding:0; margin:0 0 6px; }
  legend{ font-weight:700; font-size:.95rem; margin-bottom:12px; }
  .row{ display:flex; gap:14px; }
  .field{ margin-bottom:18px; flex:1; }
  label{ display:block; font-weight:600; font-size:.88rem; margin-bottom:6px; }
  input{ width:100%; padding:11px 12px; font-size:1rem; border:2px solid var(--line);
         border-radius:8px; background:#fff; color:var(--ink); }
  input[aria-invalid="true"]{ border-color:var(--danger); }
  input:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  .err{ display:flex; gap:7px; align-items:flex-start; margin-top:7px;
        color:var(--danger); font-size:.84rem; }
  .err svg{ flex:0 0 auto; margin-top:2px; }
  button{ margin-top:10px; width:100%; padding:13px; font-size:1rem; font-weight:700;
          color:#fff; background:var(--brand); border:0; border-radius:9px; cursor:pointer; }
  .foot{ margin-top:18px; color:var(--muted); font-size:.78rem; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="bean" aria-hidden="true"></span><strong>Brightleaf Coffee Co.</strong></div>
    <main class="card">
      <h1>Payment</h1>
      <p class="sub">Order #BL-49120 · Total $38.40</p>

      <form action="#" method="post" novalidate>
        <fieldset>
          <legend>Card details</legend>

          <div class="field">
            <label for="cardnum">Card number</label>
            <input id="cardnum" name="cardnum" inputmode="numeric"
                   value="4242 4242 4242 4242" autocomplete="cc-number">
          </div>

          <div class="row">
            <div class="field">
              <label for="exp">Expiry (MM/YY)</label>
              <input id="exp" name="exp" value="04/27" autocomplete="cc-exp">
            </div>
            <div class="field">
              <!-- (A) SECURITY-SENSITIVE FIELD — generic withheld message is CORRECT (PASS limb) -->
              <label for="cvv">Security code</label>
              <input id="cvv" name="cvv" inputmode="numeric" maxlength="4"
                     value="•••" aria-invalid="true" aria-describedby="cvv-error"
                     autocomplete="cc-csc">
              <p class="err" id="cvv-error" role="alert">
                <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M8 4.2v4.4M8 11.0h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <span>Invalid security code.</span>
              </p>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Billing address</legend>
          <div class="field">
            <label for="addr">Street address</label>
            <input id="addr" name="addr" value="118 Mission St" autocomplete="address-line1">
          </div>
          <div class="row">
            <div class="field">
              <label for="city">City</label>
              <input id="city" name="city" value="San Francisco" autocomplete="address-level2">
            </div>
            <div class="field">
              <!-- (B) NON-SENSITIVE FIELD — bare "Invalid" with no suggestion is a REAL 3.3.3 FAILURE -->
              <label for="zip">ZIP code</label>
              <input id="zip" name="zip" inputmode="numeric"
                     value="941" aria-invalid="true" aria-describedby="zip-error"
                     autocomplete="postal-code">
              <p class="err" id="zip-error" role="alert">
                <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M8 4.2v4.4M8 11.0h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <span>Invalid.</span>
              </p>
            </div>
          </div>
        </fieldset>

        <button type="submit">Pay $38.40</button>
      </form>
    </main>
    <p class="foot">Brightleaf Coffee Co. · Secure checkout · Renders from file://</p>
  </div>
</body>
</html>
