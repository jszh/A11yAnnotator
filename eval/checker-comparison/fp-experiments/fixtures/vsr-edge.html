<!doctype html><html lang="en"><head><meta charset="utf-8"><title>vsr edge</title></head>
<body>
<button id="sync">Sync</button>
<button id="noop">Noop</button>
<button id="notify">Notify</button>
<button id="newreg">NewReg</button>
<button id="off">Off</button>
<div id="st" role="status" aria-live="polite"></div>
<div id="stoff" role="status" aria-live="off"></div>
<div id="plain"></div>
<script>
 sync.onclick   = function(){ st.textContent = 'Sync status update'; };
 noop.onclick   = function(){ plain.textContent = 'no live region'; };
 notify.onclick = function(){ try { (this.ariaNotify ? this : document).ariaNotify('AriaNotify message'); } catch(e){} };
 newreg.onclick = function(){ var d=document.createElement('div'); d.setAttribute('role','status'); d.textContent='New region content'; document.body.appendChild(d); };
 off.onclick    = function(){ stoff.textContent = 'Off region update'; };
</script>
</body></html>
