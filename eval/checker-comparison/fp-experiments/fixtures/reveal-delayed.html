<!doctype html><html lang="en"><head><meta charset="utf-8"><title>delayed reveal</title></head>
<body>
<button id="b" onclick="setTimeout(function(){var d=document.getElementById('out');d.style.display='block';d.textContent='Error: this field is required (revealed asynchronously 600ms after click)';},600)">Submit</button>
<div id="out" role="alert" style="display:none"></div>
</body></html>
