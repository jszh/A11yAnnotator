<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | hanging indent on references (decorative bibliographic style) that collapses with no loss -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>References</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* DECORATIVE: a hanging indent is a typographic convention for reference lists. It does not
     encode any nesting or hierarchy — each reference is an independent, self-contained entry.
     Flattening the hanging indent at 320px loses no meaning. */
  .ref { padding-left:2em; text-indent:-2em; margin:0 0 8px; max-width:62ch; }
  @media (max-width:480px){ .ref { padding-left:0; text-indent:0; } }
</style></head>
<body>
  <h1>References</h1>
  <p class="ref">Carter, J. (2021). <i>Designing for everyone</i>. Open Press.</p>
  <p class="ref">Okoro, A. (2019). Reflow and zoom on small screens. <i>Journal of Web Practice</i>, 4(2), 33–48.</p>
  <p class="ref">Singh, R. (2022). <i>Type on screens</i>. Quiet Books.</p>
</body></html>
