<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | flat single-level list; indent is just the standard bullet offset, no hierarchy at all -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* NO HIERARCHY: a single-level list. Its only indentation is the conventional bullet offset,
     which carries no nesting meaning. Reducing it at 320px changes nothing structural. */
  ul { padding-left:22px; }
  @media (max-width:480px){ ul { padding-left:18px; } }
</style></head>
<body>
  <h1>Shopping</h1>
  <ul>
    <li>Bread</li>
    <li>Milk</li>
    <li>Eggs</li>
    <li>Apples</li>
    <li>Coffee</li>
  </ul>
</body></html>
