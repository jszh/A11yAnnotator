<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | outline using real <ul> nesting but list-style/padding stripped at 320px, erasing the only depth cue -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllabus outline</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST despite real <ul>: the nested lists DO carry structure, but a media query at
     320px sets padding/margin to 0 AND list-style:none on the inner lists, so the visual
     indentation that distinguished sub-topics from topics is gone. The depth is no longer
     perceivable to a sighted user even though the DOM nesting survives — the presented structure
     (which G224 is about preserving on reflow) is destroyed. */
  ul { list-style:disc; padding-left:28px; }
  @media (max-width:480px){
    ul, ul ul, ul ul ul { padding-left:0; margin-left:0; list-style:none; }
  }
</style></head>
<body>
  <h1>Course syllabus</h1>
  <ul>
    <li>Unit 1: Foundations
      <ul>
        <li>Vocabulary
          <ul><li>Greetings</li><li>Numbers</li></ul>
        </li>
        <li>Pronunciation</li>
      </ul>
    </li>
    <li>Unit 2: Conversation
      <ul><li>Asking directions</li><li>Ordering food</li></ul>
    </li>
  </ul>
</body></html>
