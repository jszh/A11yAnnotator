<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | nested legal clauses where sub-clause scope is shown only by indent that collapses -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract clauses</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST: which sub-clause belongs to which clause is signalled only by padding-left on
     flat divs. At 320px the padding is removed, so clause 2.1 and 2.2 no longer visibly sit under
     clause 2 — the scope of each sub-clause becomes ambiguous, changing the legal reading. */
  .clause { padding-left:0; } .sub { padding-left:36px; } .subsub { padding-left:72px; }
  @media (max-width:480px){ .clause,.sub,.subsub { padding-left:0; } }
</style></head>
<body>
  <h1>Agreement</h1>
  <div class="clause"><strong>2.</strong> Payment terms.</div>
  <div class="sub"><strong>2.1</strong> Invoices are due within thirty days.</div>
  <div class="sub"><strong>2.2</strong> Late payments accrue interest.</div>
  <div class="subsub"><strong>2.2.1</strong> Interest is calculated daily.</div>
  <div class="clause"><strong>3.</strong> Termination.</div>
  <div class="sub"><strong>3.1</strong> Either party may terminate with notice.</div>
</body></html>
