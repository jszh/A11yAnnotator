<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | math/proof steps where indentation marks sub-derivation; collapse makes the logic ambiguous -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof</title>
<style>
  body { margin:0; font:16px/1.7 ui-monospace, Menlo, monospace; padding:16px; }
  /* MEANING LOST: in a structured proof, indentation marks which lines are a sub-derivation under
     an assumption. Removing the indent at 320px makes it ambiguous where the assumption's scope
     ends, which changes the logical reading of the proof. */
  .step { margin:2px 0; }
  .s0 { margin-left:0; } .s1 { margin-left:36px; } .s2 { margin-left:72px; }
  @media (max-width:480px){ .s0,.s1,.s2 { margin-left:0; } }
</style></head>
<body>
  <h1>Proof that the sum is even</h1>
  <div class="step s0">1. Assume a and b are both even.</div>
  <div class="step s1">2. Then a = 2m for some integer m.</div>
  <div class="step s1">3. And b = 2n for some integer n.</div>
  <div class="step s2">4. So a + b = 2m + 2n = 2(m + n).</div>
  <div class="step s0">5. Therefore a + b is even. ∎</div>
</body></html>
