<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | meaningful nested list whose depth ALSO carries explicit text labels, and indent is preserved -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe steps (preserved)</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* PRESERVED: a nested ordered list where sub-steps are genuinely under their parent step. The
     indentation is reduced but kept at 320px, and the ordered-list numbering reinforces the
     structure, so the nesting remains perceivable on reflow. */
  ol { padding-left:26px; }
  @media (max-width:480px){ ol { padding-left:18px; } }
</style></head>
<body>
  <h1>Bread</h1>
  <ol>
    <li>Make the dough
      <ol type="a"><li>Mix flour and water</li><li>Add yeast and salt</li><li>Knead for ten minutes</li></ol>
    </li>
    <li>Prove until doubled</li>
    <li>Bake
      <ol type="a"><li>Preheat to 230°C</li><li>Bake for thirty minutes</li></ol>
    </li>
  </ol>
</body></html>
