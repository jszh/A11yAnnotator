<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | outline whose ONLY structure cue is margin-left, zeroed at 320px so nesting is lost -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org structure</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST ON REFLOW: the hierarchy (who reports to whom) is conveyed ONLY by margin-left
     on flat <p> elements — there is no list nesting or other semantic cue. At 320px a media query
     zeroes the indentation, flattening five distinct levels into one undifferentiated column.
     The reader can no longer tell that "Backend team" sits under "Engineering". */
  p { margin:2px 0; }
  .l1 { margin-left:0; } .l2 { margin-left:40px; } .l3 { margin-left:80px; } .l4 { margin-left:120px; }
  @media (max-width:480px){ .l1,.l2,.l3,.l4 { margin-left:0; } }
</style></head>
<body>
  <h1>Organisation</h1>
  <p class="l1">Chief executive</p>
  <p class="l2">Engineering</p>
  <p class="l3">Backend team</p>
  <p class="l3">Frontend team</p>
  <p class="l2">Operations</p>
  <p class="l3">Support</p>
  <p class="l4">Tier 2 support</p>
</body></html>
