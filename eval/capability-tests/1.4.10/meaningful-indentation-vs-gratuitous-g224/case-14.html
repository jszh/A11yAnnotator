<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | code <pre> that PRESERVES indentation on reflow via horizontal scroll (G224 + 2D exception working together) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code (preserved)</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* PRESERVED: the same code as the positive case-02, but here indentation is MAINTAINED at 320px.
     The <pre> keeps white-space:pre and scrolls horizontally rather than wrapping, so the code
     structure survives. This is exactly G224's intent: maintain meaningful indentation on reflow. */
  pre { background:#0f1117; color:#d6deeb; padding:14px; border-radius:8px;
        font:14px/1.5 ui-monospace, Menlo, monospace; overflow-x:auto; white-space:pre; }
  h1 { max-width:100%; }
</style></head>
<body>
  <h1>Example</h1>
  <pre><code>function build(tree) {
    if (tree.children) {
        for (const child of tree.children) {
            build(child);
        }
    }
    return tree;
}</code></pre>
</body></html>
