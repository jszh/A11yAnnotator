<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | a definition list where term/definition pairing depends on indent that collapses to a flat run -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST: terms and their definitions are flat <p>s distinguished only by indentation
     (definitions indented under their term). At 320px the indent is removed, so terms and
     definitions run together and the reader cannot tell where one entry ends and the next begins. */
  .term { font-weight:600; margin-top:10px; }
  .def { padding-left:32px; }
  @media (max-width:480px){ .def { padding-left:0; } .term { margin-top:0; } }
</style></head>
<body>
  <h1>Glossary</h1>
  <p class="term">Reflow</p>
  <p class="def">Presenting content without loss at a narrow width without two-dimensional scrolling.</p>
  <p class="term">Viewport</p>
  <p class="def">The visible area of a web page in the browser window.</p>
  <p class="term">Breakpoint</p>
  <p class="def">A width at which the layout changes via a media query.</p>
</body></html>
