<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | poem/verse where line indentation carries meaning (speaker/stanza shape) and is stripped on reflow -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse</title>
<style>
  body { margin:0; font:18px/1.7 Georgia, serif; padding:16px; }
  /* MEANING LOST: the poet's deliberate indentation (the visual shape of the verse, signalling
     alternating voices) is removed at 320px. The intended structure of the poem — which lines
     are spoken by which voice — depends on the indent, so collapsing it changes the reading. */
  .verse p { margin:2px 0; white-space:nowrap; }
  .in1 { text-indent:0; } .in2 { padding-left:48px; } .in3 { padding-left:96px; }
  @media (max-width:480px){ .in2,.in3 { padding-left:0; } .verse p { white-space:normal; } }
</style></head>
<body>
  <h1>A conversation in verse</h1>
  <div class="verse">
    <p class="in1">Who calls so late across the water?</p>
    <p class="in2">Only the wind, and only the tide.</p>
    <p class="in1">Then why does the lamp still burn?</p>
    <p class="in3">Because someone, somewhere, waits.</p>
  </div>
</body></html>
