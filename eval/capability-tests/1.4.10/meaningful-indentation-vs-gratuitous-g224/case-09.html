<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | quoted dialogue/nesting of block quotes where quote depth = indent and collapses -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quoted replies</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST: an email-style quote chain where each level of ">" quoting is shown by nested
     indentation. At 320px the indentation collapses, so the reader can no longer tell which
     quoted text is a reply to which — the conversational nesting is meaningful and is erased. */
  blockquote { margin:6px 0; padding-left:16px; border-left:3px solid #ccc; }
  @media (max-width:480px){ blockquote { padding-left:0; border-left:0; margin-left:0; } }
</style></head>
<body>
  <h1>Email thread</h1>
  <blockquote>
    <p>Can we move the meeting to Thursday?</p>
    <blockquote>
      <p>Thursday works for me.</p>
      <blockquote>
        <p>Same here — let's say 2pm.</p>
      </blockquote>
    </blockquote>
  </blockquote>
</body></html>
