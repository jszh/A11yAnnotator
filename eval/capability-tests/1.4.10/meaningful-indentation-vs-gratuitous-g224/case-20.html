<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | meaningful nesting preserved by an explicit "Level N" label so structure survives even if indent reduces -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comments (labelled depth)</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PRESERVED via redundant cue: threaded replies are indented, but each reply ALSO states its
     depth in text ("reply to Ada", "reply to Ben"), and the indentation is reduced (not removed)
     at 320px. The structure remains both visually and textually clear after reflow. */
  .c { border-left:2px solid #ddd; padding:6px 10px; margin:6px 0; }
  .d2 { margin-left:28px; } .d3 { margin-left:56px; }
  @media (max-width:480px){ .d2 { margin-left:12px; } .d3 { margin-left:24px; } }
  .who { color:#666; font-size:13px; }
</style></head>
<body>
  <h1>Discussion</h1>
  <div class="c"><span class="who">top-level</span><br><b>Ada:</b> Has anyone tried the export feature?</div>
  <div class="c d2"><span class="who">reply to Ada</span><br><b>Ben:</b> Yes, it works well for CSV.</div>
  <div class="c d3"><span class="who">reply to Ben</span><br><b>Ada:</b> Does it keep the column order?</div>
  <div class="c"><span class="who">top-level</span><br><b>Dan:</b> The docs are great now.</div>
</body></html>
