<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | a "fake list" of flat divs whose bullet hierarchy is only indentation, lost at 320px -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steps</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST: this looks like a nested bullet list but is flat divs with a leading glyph and
     margin-left for depth. At 320px the indentation collapses, so sub-steps no longer read as
     belonging to their parent step. There is no real <ul>/<li> nesting to fall back on. */
  .row { margin:3px 0; }
  .a { margin-left:0; } .b { margin-left:30px; } .c { margin-left:60px; }
  @media (max-width:480px){ .a,.b,.c { margin-left:0; } }
</style></head>
<body>
  <h1>Assembly steps</h1>
  <div class="row a">• Attach the legs</div>
  <div class="row b">• Insert each bolt</div>
  <div class="row c">• Hand-tighten first</div>
  <div class="row c">• Then use the wrench</div>
  <div class="row a">• Fit the tabletop</div>
  <div class="row b">• Align the pre-drilled holes</div>
</body></html>
