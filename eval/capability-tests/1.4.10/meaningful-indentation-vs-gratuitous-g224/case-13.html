<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | meaningful nesting PRESERVED: real <ul> nesting keeps its indentation at 320px (G224-compliant) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline (preserved)</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* PRESERVED: the syllabus uses real nested <ul>, and the indentation is KEPT at 320px (just
     reduced, not removed). G224's approach is to maintain meaningful indentation while reflowing:
     "the indentation was maintained, but as much text was made visible within the viewport as possible." */
  ul { list-style:disc; padding-left:24px; }
  @media (max-width:480px){ ul { padding-left:16px; } } /* reduced, still present */
</style></head>
<body>
  <h1>Course syllabus</h1>
  <ul>
    <li>Unit 1: Foundations
      <ul>
        <li>Vocabulary
          <ul><li>Greetings</li><li>Numbers</li></ul>
        </li>
        <li>Pronunciation</li>
      </ul>
    </li>
    <li>Unit 2: Conversation
      <ul><li>Asking directions</li><li>Ordering food</li></ul>
    </li>
  </ul>
</body></html>
