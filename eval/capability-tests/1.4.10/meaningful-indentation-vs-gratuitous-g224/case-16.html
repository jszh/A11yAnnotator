<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | nesting conveyed by HEADINGS + numbering, not indent; collapsing indent loses nothing because structure is in the markup/text -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbered outline</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* PRESERVED via text + semantics: the hierarchy is carried by explicit section numbering (1,
     1.1, 1.1.1) and real heading levels, NOT by indentation. The decorative indent may collapse
     at 320px with no loss, because the structure is encoded in the visible numbers and headings. */
  h2 { margin:10px 0 2px; } h3 { margin:6px 0 2px; }
  .indent { margin-left:30px; }
  @media (max-width:480px){ .indent { margin-left:0; } }
</style></head>
<body>
  <h1>Handbook</h1>
  <h2>1. Safety</h2>
  <div class="indent"><h3>1.1 Before you start</h3><p>Read the warnings.</p></div>
  <div class="indent"><h3>1.2 Equipment</h3><p>Wear the supplied gloves.</p></div>
  <h2>2. Operation</h2>
  <div class="indent"><h3>2.1 Power on</h3><p>Hold the button for two seconds.</p></div>
</body></html>
