<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | meaningful-indentation-g224 | decorative indent on an aside note; flat content, no nesting, collapses fine -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide with notes</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* DECORATIVE: the "Note:" aside is indented purely to set it off visually. It is a standalone,
     non-nested remark — its meaning does not depend on the indent (the "Note:" label and the
     <aside>/styling carry it). Collapsing the indent at 320px is harmless. */
  aside { margin-left:40px; background:#f6f6f6; border-left:4px solid #5a8; padding:10px 14px; }
  p, aside { max-width:62ch; }
  @media (max-width:480px){ aside { margin-left:0; } }
</style></head>
<body>
  <h1>Setting up</h1>
  <p>Connect the device to power and wait for the indicator light to turn green.</p>
  <aside><strong>Note:</strong> The first start-up can take up to two minutes while the firmware updates.</aside>
  <p>Once the light is steady, open the companion app to finish setup.</p>
</body></html>
