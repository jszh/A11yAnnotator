<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | threaded comment replies whose depth (who replies to whom) is shown only by margin that collapses -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comments</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* MEANING LOST: reply depth in a threaded discussion is conveyed only by margin-left on flat
     comment divs. At 320px margins are removed, so a reply-to-a-reply becomes visually identical
     to a top-level comment — the conversation's structure (who answered whom) is lost. */
  .c { border-left:2px solid #ddd; padding:6px 10px; margin:6px 0; }
  .d1 { margin-left:0; } .d2 { margin-left:32px; } .d3 { margin-left:64px; }
  @media (max-width:480px){ .d1,.d2,.d3 { margin-left:0; } }
</style></head>
<body>
  <h1>Discussion</h1>
  <div class="c d1"><b>Ada:</b> Has anyone tried the new export feature?</div>
  <div class="c d2"><b>Ben:</b> Yes, it works well for CSV.</div>
  <div class="c d3"><b>Ada:</b> Does it keep the column order?</div>
  <div class="c d2"><b>Cleo:</b> PDF export is still flaky for me.</div>
  <div class="c d1"><b>Dan:</b> Unrelated, but the docs are great now.</div>
</body></html>
