<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* ABSTAIN: several lines are indented and the indentation is removed at 320px. Whether the indent
     encodes meaningful structure (e.g., these are sub-points of the line above) or is merely a
     decorative offset is genuinely ambiguous from the markup alone — the lines could plausibly be
     read either way. Deciding requires understanding the author's intent / the content's meaning,
     which a deterministic runner cannot resolve; it should flag for human review. */
  .line { margin:2px 0; }

  @media (max-width:480px){ .ind { margin-left:0; } }
</style></head>

  <h1>Meeting notes</h1>
