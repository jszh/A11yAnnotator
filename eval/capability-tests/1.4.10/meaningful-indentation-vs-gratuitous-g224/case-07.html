<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | meaningful-indentation-g224 | a file-tree directory listing where folder depth = indent, flattened on reflow -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>File tree</title>
<style>
  body { margin:0; font:15px/1.6 ui-monospace, Menlo, monospace; padding:16px; }
  /* MEANING LOST: a directory tree's nesting (which file lives in which folder) is shown purely
     by left padding on flat rows. At 320px the padding is removed and every path looks top-level,
     so "index.js inside src/components" is indistinguishable from a root file. */
  .node { padding-left:0; } .n1 { padding-left:20px; } .n2 { padding-left:40px; } .n3 { padding-left:60px; }
  @media (max-width:480px){ .n1,.n2,.n3 { padding-left:0; } }
</style></head>
<body>
  <h1>Project files</h1>
  <div class="node">src/</div>
  <div class="node n1">components/</div>
  <div class="node n2">Button.js</div>
  <div class="node n2">Card.js</div>
  <div class="node n1">index.js</div>
  <div class="node">tests/</div>
  <div class="node n1">button.test.js</div>
</body></html>
