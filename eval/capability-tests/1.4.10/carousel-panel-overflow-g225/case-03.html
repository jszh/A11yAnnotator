<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | DECORATIVE dots that are not real controls; panels stranded, overflow-x ancestor is the bug trap -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlights</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* TRAP: there ARE dot indicators, but they are decorative <span>s with no role, no tabindex,
     and no script — purely visual. There is no keyboard path to later panels, which are 480px
     wide and overflow at 320px. The overflow-x:auto ancestor does not make this exempt. */
  .car { overflow-x:auto; white-space:nowrap; }
  .item { display:inline-block; width:480px; white-space:normal; box-sizing:border-box;
          padding:16px; border:1px solid #ccc; margin-right:12px; vertical-align:top; }
  .dots { margin-top:8px; }
  .dots span { display:inline-block; width:10px; height:10px; border-radius:50%; background:#bbb; margin-right:6px; }
  .dots span.on { background:#333; }
</style></head>
<body>
  <h1>This week's highlights</h1>
  <div class="car" aria-label="Highlights">
    <div class="item"><h2>Concert</h2><p>The summer concert series opens on Saturday with a free outdoor performance for all ages.</p></div>
    <div class="item"><h2>Workshop</h2><p>A hands-on bookbinding workshop runs every afternoon at the community studio.</p></div>
    <div class="item"><h2>Talk</h2><p>An evening talk on local birdlife, with a short guided walk to follow at dusk.</p></div>
  </div>
  <div class="dots" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
</body></html>
