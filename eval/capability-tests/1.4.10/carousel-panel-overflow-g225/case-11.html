<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | nested overflow: an outer overflow-x:auto wraps prose that ALSO overflows; the bug would exempt both -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* TRAP: a single 880px panel sits inside overflow-x:auto with no nav. There is only one panel,
     so this is really just fixed-width prose dressed as a carousel — and the overflow-x ancestor
     would trip the harness bug into exempting it. There is nothing 2D here; the text must reflow. */
  .car { overflow-x:auto; }
  .only { width:880px; box-sizing:border-box; padding:16px; border:1px solid #ccc; }
</style></head>
<body>
  <h1>A single story</h1>
  <div class="car" aria-label="Story">
    <div class="only">
      <h2>The lighthouse keeper</h2>
      <p>For thirty winters he had climbed the same stair, lit the same lamp, and watched the same grey water refuse to settle. The town below trusted him without ever thinking of him, which suited him exactly.</p>
    </div>
  </div>
</body></html>
