<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats table</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS: the horizontally scrolling content here is a genuine data table whose columns must stay
     aligned (real 2D content under Note 2). This is the legitimate counterpart to a stranded-prose
     carousel: the overflow is on actual tabular data, and the table is reachable (focusable region). */
