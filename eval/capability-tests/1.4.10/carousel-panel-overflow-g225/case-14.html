<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | REAL working prev/next buttons (inline JS) that scroll to each panel; all panels reachable -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel with buttons</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS: genuine prev/next buttons (wired with inline JS below) scroll the track by one panel.
     Panels fit 320px. Every panel is reachable by activating the buttons with keyboard or mouse. */
  .nav button { padding:8px 14px; margin-right:8px; }
  .track { overflow-x:auto; display:flex; gap:12px; scroll-behavior:smooth; }
  .item { flex:0 0 min(300px, 86vw); box-sizing:border-box; padding:16px; border:1px solid #ccc; }
</style></head>
<body>
  <h1>Our latest releases</h1>
  <div class="nav">
    <button type="button" id="prev">‹ Previous</button>
    <button type="button" id="next">Next ›</button>
  </div>
  <div class="track" id="track" aria-label="Latest releases">
    <div class="item"><h2>Album one</h2><p>A bright, hopeful debut recorded over one summer.</p></div>
    <div class="item"><h2>Album two</h2><p>Slower and darker, written through a long winter.</p></div>
    <div class="item"><h2>Album three</h2><p>A return to form, looser and more generous.</p></div>
  </div>
  <script>
    var t = document.getElementById('track');
    function step(d){ t.scrollBy({left:d*t.clientWidth, behavior:'smooth'}); }
    document.getElementById('prev').addEventListener('click', function(){ step(-1); });
    document.getElementById('next').addEventListener('click', function(){ step(1); });
  </script>
</body></html>
