<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | scroll region with focusable links in EVERY panel; tab order walks through all panels, scrolling them into view -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link carousel</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS: each panel contains a focusable link, so pressing Tab moves focus from panel to panel;
     the browser auto-scrolls each focused link into view, making every off-screen panel reachable
     by keyboard. Panels fit 320px so the focused panel's content is readable without 2D scroll. */
  .car { overflow-x:auto; display:flex; gap:12px; }
  .item { flex:0 0 min(280px, 84vw); box-sizing:border-box; padding:16px; border:1px solid #ccc; }
  a:focus { outline:3px solid #06c; }
</style></head>
<body>
  <h1>Explore categories</h1>
  <div class="car" aria-label="Categories">
    <div class="item"><h2>Books</h2><p>Fiction, non-fiction, and more.</p><a href="#books">Browse books</a></div>
    <div class="item"><h2>Music</h2><p>Vinyl, CDs, and downloads.</p><a href="#music">Browse music</a></div>
    <div class="item"><h2>Films</h2><p>Classics and new releases.</p><a href="#films">Browse films</a></div>
    <div class="item"><h2>Games</h2><p>Board games and puzzles.</p><a href="#games">Browse games</a></div>
  </div>
</body></html>
