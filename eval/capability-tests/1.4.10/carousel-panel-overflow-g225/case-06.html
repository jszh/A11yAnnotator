<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | scroll-snap mandatory but panels are 100vw at desktop width fixed to 1000px each; off-screen, no nav -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour</title>
<style>
  html,body { margin:0; font:16px/1.5 system-ui, sans-serif; }
  /* scroll-snap does not rescue this: panels are a fixed 1000px each (not responsive), there are
     no buttons and nothing focusable inside, so a keyboard-only or zoom user is stranded after
     panel 1 at 320px. The overflow-x scroller is the bug-trap that must NOT be exempted. */
  .strip { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; }
  .frame { flex:0 0 1000px; scroll-snap-align:start; height:240px; box-sizing:border-box;
           padding:24px; border-right:1px solid #ddd; }
</style></head>
<body>
  <h1 style="padding:16px">Take the tour</h1>
  <div class="strip" aria-label="Product tour">
    <section class="frame"><h2>Step 1</h2><p>Create your workspace and invite your team.</p></section>
    <section class="frame"><h2>Step 2</h2><p>Import your existing files in one click.</p></section>
    <section class="frame"><h2>Step 3</h2><p>Share a link and start collaborating.</p></section>
  </div>
</body></html>
