<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | a CTA button lives only in panel 3, which is off-screen with no nav; functionality lost -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* Worst kind of strand: the "Start free trial" action exists ONLY in panel 3, which is off-screen
     at 320px with no buttons and no keyboard path. The user loses functionality, not just text. */
  .car { overflow-x:auto; white-space:nowrap; }
  .item { display:inline-block; width:340px; white-space:normal; box-sizing:border-box;
          padding:16px; border:1px solid #ccc; margin-right:12px; vertical-align:top; }
</style></head>
<body>
  <h1>Pick a plan</h1>
  <div class="car" aria-label="Plans">
    <div class="item"><h2>Free</h2><p>Basic features for one person.</p></div>
    <div class="item"><h2>Pro</h2><p>Everything in Free, plus collaboration.</p></div>
    <div class="item"><h2>Get started</h2><p>Ready to begin?</p><button type="button">Start free trial</button></div>
  </div>
</body></html>
