<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | scrollbar HIDDEN via scrollbar-width:none + no buttons; mouse-wheel-x only, keyboard/zoom stranded -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* TRAP: overflow-x:auto BUT the scrollbar is suppressed (scrollbar-width:none + ::-webkit hidden)
     and there are no buttons and nothing focusable. There is no visible affordance and no keyboard
     path to later 500px panels, which are stranded at 320px. */
  .car { overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
  .car::-webkit-scrollbar { display:none; }
  .item { display:inline-block; width:500px; white-space:normal; box-sizing:border-box;
          padding:16px; border:1px solid #ccc; margin-right:12px; vertical-align:top; }
</style></head>
<body>
  <h1>Latest articles</h1>
  <div class="car" aria-label="Latest articles">
    <div class="item"><h2>On patience</h2><p>Why the slowest path through a problem is sometimes the only one that holds.</p></div>
    <div class="item"><h2>On noise</h2><p>A short defence of silence in a world that rarely offers any.</p></div>
    <div class="item"><h2>On maps</h2><p>What we lose, and occasionally find, when we stop trusting the route.</p></div>
  </div>
</body></html>
