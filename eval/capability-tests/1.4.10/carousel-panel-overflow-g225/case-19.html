<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | single panel that simply fits and wraps at 320px; no overflow at all -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single card</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* PASS: a lone promotional card with a fluid width that wraps and fits at 320px. There is no
     horizontal overflow and nothing to strand — the simplest possible negative. */
  .card { max-width:480px; box-sizing:border-box; padding:20px; border:1px solid #ccc; border-radius:8px; }
</style></head>
<body>
  <h1>This week</h1>
  <div class="card">
    <h2>Members' evening</h2>
    <p>Join us on Thursday for a relaxed members' evening with refreshments, a short talk, and plenty of time to meet other people in the community.</p>
    <a href="#rsvp">RSVP now</a>
  </div>
</body></html>
