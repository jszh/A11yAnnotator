<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | WORKING keyboard nav: scroller is tabbable and panels respond to arrow/scroll; every panel reachable -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachable carousel</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS: panels fit 320px (min(290px,85vw)) and the scroll region is focusable (tabindex=0),
     so a keyboard user can focus it and use arrow keys / the scrollbar to reach every panel.
     Every link inside each panel is also tabbable. Nothing is stranded. */
  .car { overflow-x:auto; display:flex; gap:12px; }
  .car:focus-visible { outline:3px solid #06c; }
  .item { flex:0 0 min(290px, 85vw); box-sizing:border-box; padding:16px; border:1px solid #ccc; }
</style></head>
<body>
  <h1>Browse our guides</h1>
  <div class="car" tabindex="0" role="group" aria-label="Guides, use arrow keys to scroll through panels">
    <div class="item"><h2>Setup</h2><p>Get started in five minutes.</p><a href="#a">Read the setup guide</a></div>
    <div class="item"><h2>Sharing</h2><p>Invite teammates and set roles.</p><a href="#b">Read the sharing guide</a></div>
    <div class="item"><h2>Backups</h2><p>Keep your work safe automatically.</p><a href="#c">Read the backup guide</a></div>
  </div>
</body></html>
