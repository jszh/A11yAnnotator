<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | CANONICAL G225: each panel is designed to fit within 320 CSS px, fully readable without extra horizontal scroll -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Featured (G225)</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* G225 PASS: "each panel is designed to fit within a fixed width of 320 CSS pixels." Panels use
     width:min(300px, 86vw) so at a 320px viewport one panel fills the screen and its text wraps
     and is fully readable with no additional horizontal scroll. The section scrolls between panels. */
  .scroller { overflow-x:auto; scroll-snap-type:x mandatory; display:flex; gap:12px; }
  .panel { flex:0 0 min(300px, 86vw); scroll-snap-align:start; box-sizing:border-box;
           padding:16px; border:1px solid #ccc; }
  .panel p { white-space:normal; }
</style></head>
<body>
  <h1>Featured stories</h1>
  <div class="scroller" aria-label="Featured stories, scroll horizontally between panels" tabindex="0">
    <div class="panel"><h2>One</h2><p>The harbour reopened this spring after a long restoration, and the promenade is busy again.</p></div>
    <div class="panel"><h2>Two</h2><p>A local choir recorded its first album in the old chapel up on the hill.</p></div>
    <div class="panel"><h2>Three</h2><p>Volunteers replanted the ridge that a fire had cleared three summers ago.</p></div>
  </div>
</body></html>
