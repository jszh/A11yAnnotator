<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | native visible scrollbar always shown; panels fit 320px; the scrollbar itself is the reachable mechanism -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollable shelf</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS: overflow-x:scroll keeps a persistent, visible native scrollbar. Panels fit 320px and the
     region is focusable, so the scrollbar (mouse and keyboard) is a genuine mechanism to reach
     every panel. Visible affordance + readable panels = compliant horizontally scrolling section. */
  .shelf { overflow-x:scroll; display:flex; gap:12px; padding-bottom:8px; }
  .book { flex:0 0 min(180px, 70vw); box-sizing:border-box; padding:14px; border:1px solid #ccc; }
</style></head>
<body>
  <h1>On the shelf</h1>
  <div class="shelf" tabindex="0" role="group" aria-label="Books, scroll horizontally">
    <div class="book"><h2>Tides</h2><p>A novel of the coast.</p></div>
    <div class="book"><h2>Embers</h2><p>Short stories.</p></div>
    <div class="book"><h2>Drift</h2><p>Poems for winter.</p></div>
    <div class="book"><h2>Hollow</h2><p>A quiet mystery.</p></div>
    <div class="book"><h2>Salt</h2><p>Essays on the sea.</p></div>
  </div>
</body></html>
