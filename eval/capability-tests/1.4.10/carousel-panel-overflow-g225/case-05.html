<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | panels each WIDER than 320px so even WITH scrolling a single panel's text needs horizontal scroll (G225 violated at panel level) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotlight</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* G225 requires that EACH individual panel fit within 320 CSS px so its content is readable
     without extra horizontal scrolling. Here each panel is a fixed 700px with nowrap text, so
     even after scrolling to a panel, reading it still demands horizontal scrolling. Direct G225 fail. */
  .car { overflow-x:auto; }
  .row { display:flex; }
  .panel { flex:0 0 700px; box-sizing:border-box; padding:16px; border:1px solid #ccc; margin-right:12px; }
  .panel p { white-space:nowrap; }
</style></head>
<body>
  <h1>Spotlight</h1>
  <div class="car" aria-label="Spotlight">
    <div class="row">
      <div class="panel"><h2>Origins</h2><p>The founders began in a single rented room above a bakery on the high street.</p></div>
      <div class="panel"><h2>Growth</h2><p>Within five years the team had outgrown three offices and most of its early assumptions.</p></div>
    </div>
  </div>
</body></html>
