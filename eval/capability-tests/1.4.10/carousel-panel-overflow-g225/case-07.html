<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | nav buttons that scroll the WRONG container (orphaned), so they do nothing; panels stranded -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor picks</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* TRAP: the buttons reference an onclick that scrolls an element ID that does not exist, so
     they are effectively dead. (No inline handler is provided here, mirroring a broken build.)
     Later 560px panels remain off-screen and unreachable. overflow-x ancestor != exception. */
  .car { overflow-x:auto; white-space:nowrap; }
  .item { display:inline-block; width:560px; white-space:normal; box-sizing:border-box;
          padding:16px; border:1px solid #ccc; margin-right:12px; vertical-align:top; }
  .nav button { padding:8px 14px; margin-right:8px; }
</style></head>
<body>
  <h1>Editor's picks</h1>
  <div class="nav">
    <button type="button" aria-controls="does-not-exist">‹ Prev</button>
    <button type="button" aria-controls="does-not-exist">Next ›</button>
  </div>
  <div class="car" aria-label="Editor's picks">
    <div class="item"><h2>The long road</h2><p>A travel memoir tracing a single highway from coast to coast over one slow summer.</p></div>
    <div class="item"><h2>Quiet houses</h2><p>Photographs of empty rooms that somehow still feel lived in.</p></div>
    <div class="item"><h2>Salt and stone</h2><p>Essays on the small towns clinging to a weathered northern shore.</p></div>
  </div>
</body></html>
