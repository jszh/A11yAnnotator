<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | tabindex=-1 panels + aria-hidden on off-screen slides actively REMOVE them from the a11y tree; unreachable by AT -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>News carousel</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* TRAP + active hiding: panels 2..3 carry aria-hidden="true" and tabindex="-1" while there is
     NO mechanism to un-hide or reach them. They are off-screen (380px panels) AND removed from the
     accessibility tree, so assistive tech cannot reach the content at all. */
  .car { overflow-x:auto; white-space:nowrap; }
  .item { display:inline-block; width:380px; white-space:normal; box-sizing:border-box;
          padding:16px; border:1px solid #ccc; margin-right:12px; vertical-align:top; }
</style></head>
<body>
  <h1>In the news</h1>
  <div class="car" aria-label="News">
    <div class="item"><h2>Headline one</h2><p>The council approved the new cycle lane after a long public consultation.</p></div>
    <div class="item" aria-hidden="true" tabindex="-1"><h2>Headline two</h2><p>A grant will fund free swimming lessons for every child in the district.</p></div>
    <div class="item" aria-hidden="true" tabindex="-1"><h2>Headline three</h2><p>The library extends its opening hours through the winter months.</p></div>
  </div>
</body></html>
