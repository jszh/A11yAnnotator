<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | carousel-panel-overflow-g225 | content that GENUINELY REFLOWS: the "carousel" collapses to a vertical stack at 320px via media query -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive cards</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* PASS by reflow: at wide widths these are a horizontal row, but a media query turns the row
     into a vertical stack at narrow widths, removing the horizontal scroll entirely. At 320px
     all panels are simply stacked and fully readable. No exception even needed. */
  .row { display:flex; gap:12px; overflow-x:auto; }
  .card { flex:0 0 280px; box-sizing:border-box; padding:16px; border:1px solid #ccc; }
  @media (max-width:480px){
    .row { display:block; overflow:visible; }
    .card { width:auto; flex:none; margin-bottom:12px; }
  }
</style></head>
<body>
  <h1>What people say</h1>
  <div class="row" aria-label="Testimonials">
    <blockquote class="card">“It saved our team hours every week.” — A. Rivera</blockquote>
    <blockquote class="card">“Simple, reliable, and a joy to use.” — M. Osei</blockquote>
    <blockquote class="card">“We onboarded everyone in a single afternoon.” — J. Lindqvist</blockquote>
  </div>
</body></html>
