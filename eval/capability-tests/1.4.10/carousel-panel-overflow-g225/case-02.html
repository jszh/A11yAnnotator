<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | carousel-panel-overflow-g225 | CLIPPED overflow:hidden carousel: panels 2..N have NO scrollbar and NO buttons, so they are unreachable -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* WORSE than a scroller: overflow:hidden clips everything past the first panel and there is NO
     control to advance. At 320px only panel 1 exists for the user; panels 2..4 are permanently
     off-screen and unreachable. Loss of information per F102. */
  .track { width:100%; overflow:hidden; white-space:nowrap; }
  .slide { display:inline-block; width:300px; white-space:normal; box-sizing:border-box;
           padding:14px; border:1px solid #bbb; margin-right:10px; vertical-align:top; }
</style></head>
<body>
  <h1>Project gallery</h1>
  <div class="track" aria-label="Project gallery">
    <div class="slide"><h2>Bridge</h2><p>A footbridge linking the two halves of the park.</p></div>
    <div class="slide"><h2>Pavilion</h2><p>A timber pavilion used for weekend markets.</p></div>
    <div class="slide"><h2>Fountain</h2><p>The restored fountain at the square's centre.</p></div>
    <div class="slide"><h2>Lighthouse</h2><p>The old lighthouse, now a small museum.</p></div>
  </div>
</body></html>
