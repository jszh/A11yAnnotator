<!doctype html>

<head>
<meta charset="utf-8">

<title>1.4.10 sticky positive (sticky-toolbar-stacks-to-tall)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .tb{position:sticky;top:0;background:#eee;}.tb .row{display:block;padding:14px;border-bottom:1px solid #ccc;}
</style>
</head>
<body>
<div class="tb"><div class="row">Formatting controls</div><div class="row">Insert controls</div><div class="row">Review controls</div></div><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
</html>
