<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky negative (sticky-thumbnail-rail-overflow-x-auto)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .rail{position:sticky;top:0;height:64px;overflow-x:auto;white-space:nowrap;background:#eee;}.rail img,.rail span{display:inline-block;width:90px;height:60px;background:#9cf;margin:2px;}
</style>
</head>
<body>
<div class="rail"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
</html>
