<title>1.4.10 sticky positive (sticky-header-50vh)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .hdr{position:sticky;top:0;height:50vh;min-height:128px;background:#1b3a5c;color:#fff;}

<body>
<div class="hdr">Header sized 50vh</div><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
