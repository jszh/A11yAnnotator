<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky negative (fixed-skip-link-offscreen-until-focus)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .skip{position:fixed;top:-40px;left:0;background:#000;color:#fff;padding:8px;}.skip:focus{top:0;}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a><main id="main"><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
</html>
