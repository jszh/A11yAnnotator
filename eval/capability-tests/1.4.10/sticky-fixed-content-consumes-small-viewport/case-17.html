<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky negative (sticky-bar-no-px-width-content-fluid)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .bar{position:sticky;top:0;height:52px;background:#345;color:#fff;display:flex;align-items:center;padding:0 12px;box-sizing:border-box;}.bar a{color:#fff;margin-right:14px;}
</style>
</head>
<body>
<div class="bar"><a href="#a">Home</a><a href="#b">News</a></div><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
</html>
