<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky positive (fixed-footer-action-bar-tall)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #345;}.actions button{display:block;width:100%;padding:16px;border:0;border-bottom:1px solid #ddd;}main{padding-bottom:160px;}
</style>
</head>
<body>
<main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main><div class="actions"><button>Add to cart</button><button>Buy now</button><button>Save for later</button></div>
</body>
</html>
