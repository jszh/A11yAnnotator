<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky positive (fixed-promo-bar-plus-nav)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .promo{position:fixed;top:0;left:0;right:0;height:60px;background:#c30;color:#fff;}.nav{position:fixed;top:60px;left:0;right:0;height:120px;background:#345;color:#fff;}main{margin-top:180px;}
</style>
</head>
<body>
<div class="promo">Limited-time offer banner (60px)</div><nav class="nav">Expanded navigation (120px)</nav><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main>
</body>
</html>
