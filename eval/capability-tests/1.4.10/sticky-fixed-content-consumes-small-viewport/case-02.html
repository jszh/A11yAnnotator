<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 sticky positive (sticky-header-plus-footer-sandwich)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .hdr{position:sticky;top:0;height:110px;background:#234;color:#fff;}.ftr{position:fixed;bottom:0;left:0;right:0;height:100px;background:#234;color:#fff;}main{padding-bottom:100px;}
</style>
</head>
<body>
<div class="hdr">Sticky header 110px</div><main><h1>Account settings</h1><p>Paragraph one of the main content that the user needs to read and the form below that they must operate.</p><p>Paragraph two adds more body copy so the page is taller than the viewport.</p><label>Email <input></label><button>Save</button><p>Footer note.</p></main><div class="ftr">Fixed footer 100px</div>
</body>
</html>
