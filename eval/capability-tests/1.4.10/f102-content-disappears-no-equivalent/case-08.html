<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 F102 positive (overflowhidden-clips-wide-text)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .clip{overflow-x:hidden;width:100%;}.inner{width:560px;background:#eef;padding:10px;}
</style>
</head>
<body>
<div class="clip"><div class="inner"><p>This 560px inner block is clipped by an overflow-x:hidden parent at 320px, so the right portion of every sentence is cut off and unreadable with no scrollbar to reveal it.</p></div></div>
</body>
</html>
