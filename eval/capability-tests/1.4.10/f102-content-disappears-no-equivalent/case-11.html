<title>1.4.10 F102 positive (fixedheight-overflowhidden-vertical-clip-text)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .box{height:60px;overflow:hidden;width:300px;}
</style>

<body>
<div class="box"><p>This container has a fixed 60px height and overflow:hidden, so the second and third paragraphs of important policy text are clipped below the fold with no way to scroll them into view.</p><p>Hidden line two.</p><p>Hidden line three.</p></div>
