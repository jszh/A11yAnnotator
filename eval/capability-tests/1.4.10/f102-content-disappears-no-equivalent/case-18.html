<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 F102 negative (overflowhidden-but-child-fits)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .clip{overflow:hidden;width:100%;}.inner{max-width:100%;background:#eef;padding:8px;}
</style>
</head>
<body>
<div class="clip"><div class="inner"><p>This block has overflow:hidden on the wrapper but the inner content is max-width:100%, so nothing is actually clipped at 320px (scrollWidth equals clientWidth).</p></div></div>
</body>
</html>
