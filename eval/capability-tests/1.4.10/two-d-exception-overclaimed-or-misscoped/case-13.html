<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | LEGITIMATE map: an interactive geographic map genuinely requires two-dimensional layout -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a branch</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* LEGITIMATE EXCEPTION: a pannable geographic map. Note 2 explicitly lists "maps" and the
     Intent names "a table or map" as content with an exception. Spatial relationships between
     points only have meaning in two dimensions, so panning in 2D is inherent, not a workaround. */
  .map { width:700px; max-width:none; height:340px; overflow:auto; border:1px solid #ccc; }
  .map .canvas { width:1400px; height:900px;
    background:
      repeating-linear-gradient(0deg,#eef 0 39px,#cdd 39px 40px),
      repeating-linear-gradient(90deg,#eef 0 39px,#cdd 39px 40px); position:relative; }
  .pin { position:absolute; width:14px; height:14px; border-radius:50%; background:#c33; }
</style></head>
<body>
  <h1>Branch locator</h1>
  <p>Pan the map to find your nearest branch. The surrounding page reflows; the map keeps its geography.</p>
  <div class="map" role="application" aria-label="Geographic branch map; pan in any direction" tabindex="0">
    <div class="canvas">
      <span class="pin" style="left:180px;top:120px"></span>
      <span class="pin" style="left:900px;top:520px"></span>
      <span class="pin" style="left:1180px;top:200px"></span>
    </div>
  </div>
</body></html>
