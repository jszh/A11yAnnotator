<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | a LIST OF LINKS (not a data table) marked up as a <table> and exempted -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick links</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* OVER-CLAIM: this "table" is a layout table holding a single column of navigation links.
     It carries no row/column data relationships, so the data-table exception does NOT apply.
     It is pinned to 900px and scrolls horizontally rather than reflowing. */
  table { width:900px; border-collapse:collapse; }
  td { padding:10px; }
  .scroller { overflow:auto; }
</style></head>
<body>
  <h1>Helpful links</h1>
  <div class="scroller" aria-label="Links table (two-dimensional layout)">
    <table>
      <tr><td><a href="#a">Getting started guide</a></td></tr>
      <tr><td><a href="#b">Frequently asked questions about billing and refunds</a></td></tr>
      <tr><td><a href="#c">Contact our support team during business hours</a></td></tr>
    </table>
  </div>
</body></html>
