<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | "dashboard" label used to exempt a page that is really a stacked list of text stats -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* OVER-CLAIM: calling a screen a "dashboard" does not make it require 2D layout. These are
     four independent text stat blocks that reflow to one column with no loss. They are pinned
     into a 1000px non-wrapping grid inside overflow:auto and exempted. */
  .grid-scroller { overflow-x:auto; }
  .grid { display:grid; grid-template-columns:repeat(4, 240px); gap:16px; width:1000px; }
  .stat { border:1px solid #ddd; border-radius:8px; padding:16px; }
  .stat b { font-size:28px; display:block; }
</style></head>
<body>
  <h1>Overview</h1>
  <div class="grid-scroller" role="region" aria-label="Dashboard (requires two-dimensional layout)">
    <div class="grid">
      <div class="stat"><b>1,204</b> active users this week</div>
      <div class="stat"><b>98.2%</b> uptime over the last month</div>
      <div class="stat"><b>$8,430</b> revenue in June so far</div>
      <div class="stat"><b>17</b> open support tickets</div>
    </div>
  </div>
</body></html>
