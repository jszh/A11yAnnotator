<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | pricing CARDS in a fixed-width flex row claiming "data table" exception; they are independent cards, not tabular data -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* OVER-CLAIM: three pricing cards are independent blocks that reflow to a single column
     trivially. They are not a data table (no shared row/column relationships). The author
     forced them into a non-wrapping 960px flex row inside overflow:auto and claimed exemption. */
  .scroller { overflow-x:auto; }
  .row { display:flex; flex-wrap:nowrap; width:960px; gap:16px; }
  .card { flex:0 0 300px; border:1px solid #ccc; border-radius:8px; padding:16px; }
</style></head>
<body>
  <h1>Choose a plan</h1>
  <div class="scroller" aria-label="Pricing (two-dimensional layout)">
    <div class="row">
      <section class="card"><h2>Starter</h2><p>$0/mo</p><p>For individuals trying things out.</p></section>
      <section class="card"><h2>Team</h2><p>$12/mo</p><p>For small groups working together.</p></section>
      <section class="card"><h2>Business</h2><p>$40/mo</p><p>For organisations that need more.</p></section>
    </div>
  </div>
</body></html>
