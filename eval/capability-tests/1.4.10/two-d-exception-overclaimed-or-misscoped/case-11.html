<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | white-space:nowrap forces a paragraph onto one ultra-wide line under a "preformatted, needs 2D" pretext -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* OVER-CLAIM: ordinary sentence prose is forced onto a single non-wrapping line with
     white-space:nowrap, then wrapped in overflow:auto and described as needing 2D layout.
     Sentence text is not preformatted code or ASCII art; it must wrap and reflow. */
  .legal { overflow-x:auto; }
  .legal p { white-space:nowrap; }
</style></head>
<body>
  <h1>Terms of service</h1>
  <div class="legal" aria-label="Legal text (two-dimensional layout)">
    <p>By using this service you agree to act lawfully, to respect other users, and to accept that we may update these terms from time to time with reasonable notice.</p>
  </div>
</body></html>
