<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | responsive product grid that genuinely reflows (auto-fill) to one column at 320px; no exception claimed or needed -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* CORRECT REFLOW: an auto-fill grid collapses from many columns to a single column at 320px.
     No fixed width, no overflow scroller, no exception. Nothing is stranded or hidden. */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
  .card { border:1px solid #ddd; border-radius:8px; padding:12px; }
  .thumb { height:120px; background:#eee; border-radius:6px; margin-bottom:8px; }
</style></head>
<body>
  <h1>New arrivals</h1>
  <div class="grid">
    <article class="card"><div class="thumb"></div><h2>Mug</h2><p>$9</p></article>
    <article class="card"><div class="thumb"></div><h2>Notebook</h2><p>$6</p></article>
    <article class="card"><div class="thumb"></div><h2>Pen set</h2><p>$12</p></article>
    <article class="card"><div class="thumb"></div><h2>Tote bag</h2><p>$15</p></article>
  </div>
</body></html>
