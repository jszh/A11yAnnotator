<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | min-width on <body> hides functionality at 320px (also F102-flavoured) under a bogus exception -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout</title>
<style>
  /* OVER-CLAIM: a checkout form locked to 1200px. The "Place order" button sits at the far
     right edge and is off-screen at 320px with no reflow. A checkout is not a map/diagram/game. */
  html,body { margin:0; font:16px/1.5 system-ui, sans-serif; }
  body { min-width:1200px; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:16px; background:#f4f4f4; }
  main { padding:16px; }
  .order-btn { margin-left:900px; padding:12px 24px; }
</style></head>
<body>
  <div class="bar"><strong>Checkout</strong><span>Step 3 of 3</span></div>
  <main aria-label="Checkout (requires two-dimensional layout)">
    <h1>Review your order</h1>
    <p>Two items · subtotal $48.00 · shipping $5.00</p>
    <button class="order-btn" type="submit">Place order</button>
  </main>
</body></html>
