<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | LEGITIMATE data table with genuine row/column relationships; 2D exception correctly scoped to the table only -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train timetable</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* LEGITIMATE EXCEPTION: a multi-column data table whose meaning depends on aligning each
     departure across its row/column headers. Note 2 lists "data tables (not individual cells)"
     as content that requires two-dimensional layout. The exception is scoped to the table only;
     the surrounding page reflows normally. */
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; min-width:640px; }
  th, td { border:1px solid #999; padding:6px 10px; text-align:left; }
  h1, p { max-width:100%; }
</style></head>
<body>
  <h1>Weekday departures</h1>
  <p>This timetable reflows the page around it; the grid itself keeps its two-dimensional structure.</p>
  <div class="table-wrap" role="region" aria-label="Departures timetable" tabindex="0">
    <table>
      <caption>Departures from Central</caption>
      <tr><th scope="col">Time</th><th scope="col">Platform</th><th scope="col">Destination</th><th scope="col">Stops</th></tr>
      <tr><td>08:02</td><td>4</td><td>Riverside</td><td>All</td></tr>
      <tr><td>08:17</td><td>2</td><td>Hilltop</td><td>Express</td></tr>
      <tr><td>08:31</td><td>4</td><td>Riverside</td><td>All</td></tr>
    </table>
  </div>
</body></html>
