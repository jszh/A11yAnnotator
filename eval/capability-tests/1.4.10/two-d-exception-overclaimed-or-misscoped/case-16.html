<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | LEGITIMATE toolbar-kept-in-view: a real editing surface where the toolbar must stay visible while manipulating a 2D canvas -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram editor</title>
<style>
  html,body { margin:0; height:100%; font:16px/1.5 system-ui, sans-serif; }
  /* LEGITIMATE EXCEPTION: Note 2 names "interfaces where it is necessary to keep toolbars in
     view while manipulating content." Here the manipulated content is a true 2D drawing canvas
     (shapes positioned by x/y), so keeping the toolbar in view while panning is inherent. */
  .app { display:flex; flex-direction:column; height:100vh; }
  .toolbar { background:#222; color:#fff; padding:8px; display:flex; gap:8px; }
  .toolbar button { background:#444; color:#fff; border:0; padding:6px 10px; }
  .canvas-wrap { flex:1; overflow:auto; }
  .canvas { width:1600px; height:1100px; background:#fafafa; position:relative; }
  .shape { position:absolute; border:2px solid #06c; }
</style></head>
<body>
  <div class="app" role="application" aria-label="Diagram editor; toolbar stays in view while you pan the canvas">
    <div class="toolbar"><button>Rectangle</button><button>Ellipse</button><button>Arrow</button><button>Zoom</button></div>
    <div class="canvas-wrap" tabindex="0" aria-label="Drawing canvas">
      <div class="canvas">
        <div class="shape" style="left:60px;top:60px;width:160px;height:90px"></div>
        <div class="shape" style="left:900px;top:600px;width:200px;height:120px;border-radius:50%"></div>
      </div>
    </div>
  </div>
</body></html>
