<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | ENTIRE PAGE wrapped in one overflow:auto frame at min-width:1000px claiming exception -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  html,body { margin:0; font:16px/1.5 system-ui, sans-serif; }
  /* OVER-CLAIM / MIS-SCOPE: the whole page (nav + form + footer) is forced to a 1000px
     min-width inside a single overflow scroller. A general settings page is not a map,
     table, game, or toolbar — it must reflow. Exemption is mis-scoped to the entire document. */
  .page { min-width:1000px; overflow:auto; }
  nav, main, footer { padding:16px; }
  label { display:block; margin:8px 0; }
</style></head>
<body>
  <div class="page" role="region" aria-label="Application (requires two-dimensional layout)">
    <nav>Home · Profile · Settings · Help</nav>
    <main>
      <h1>Account settings</h1>
      <form>
        <label>Display name <input type="text"></label>
        <label>Email <input type="email"></label>
        <label>Time zone <input type="text"></label>
        <button type="submit">Save</button>
      </form>
    </main>
    <footer>© Example Org</footer>
  </div>
</body></html>
