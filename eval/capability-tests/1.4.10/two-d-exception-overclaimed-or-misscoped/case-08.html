<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | a single data-table CELL's prose pinned wide; Note 2 says the exception is for tables "not individual cells" -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy details</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* OVER-CLAIM at cell granularity: even within a legitimate data table, Note 2 says the
     exception is for the table "(not individual cells)". Here a single descriptive cell holds
     a long paragraph forced to 800px so its text scrolls sideways instead of wrapping. */
  table { border-collapse:collapse; }
  td, th { border:1px solid #999; padding:8px; vertical-align:top; }
  td.detail { width:800px; }
  td.detail .inner { width:800px; }
</style></head>
<body>
  <h1>Coverage</h1>
  <table>
    <tr><th scope="col">Item</th><th scope="col">Description</th></tr>
    <tr>
      <td>Clause 4</td>
      <td class="detail"><div class="inner">This clause explains in full prose that the policy will reimburse reasonable expenses incurred while the named insured is travelling, provided the expenses are documented and submitted within thirty days of return, and that pre-existing arrangements are excluded.</div></td>
    </tr>
  </table>
</body></html>
