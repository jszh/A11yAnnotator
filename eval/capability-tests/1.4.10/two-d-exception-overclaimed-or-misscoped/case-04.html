<!DOCTYPE html>
<!-- 1.4.10 POSITIVE | two-d-exception-overclaimed | a SINGLE photo with a caption claimed as an "image required for understanding" but it is decorative and pins the page -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>About us</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; }
  /* OVER-CLAIM: a decorative hero photo with body text below it is NOT a map/diagram that
     requires 2D layout. The author froze the whole section to 1024px and exempted it.
     The body text below could and must reflow; pinning it strands the prose off-screen at 320px. */
  .figure-scroller { overflow:auto; }
  .frame { width:1024px; padding:20px; }
  .hero { width:980px; height:220px; background:linear-gradient(90deg,#9ec,#69b); }
  p { max-width:980px; }
</style></head>
<body>
  <div class="figure-scroller" aria-label="Illustration (requires two-dimensional layout)">
    <div class="frame">
      <h1>About our studio</h1>
      <div class="hero" role="img" aria-label="Photo of the studio team smiling"></div>
      <p>We are a small design studio that has spent the last decade building friendly, accessible products for libraries and museums across the country. Our team believes that good design is invisible.</p>
    </div>
  </div>
</body></html>
