<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | a sticky single-row toolbar over reflowing text; toolbar stays in view but content reflows (correct) -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
  html,body { margin:0; font:16px/1.7 system-ui, sans-serif; }
  /* CORRECT: a sticky toolbar remains visible, but the BODY content still reflows to 320px
     in a single column. Keeping a toolbar in view does not require freezing the page width.
     Nothing is exempted that should not be, and nothing is stranded horizontally. */
  .toolbar { position:sticky; top:0; background:#f4f4f4; padding:8px; display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar button { padding:6px 10px; }
  main { padding:16px; max-width:70ch; }
</style></head>
<body>
  <div class="toolbar"><button>A-</button><button>A+</button><button>Theme</button><button>Bookmark</button></div>
  <main>
    <h1>Chapter one</h1>
    <p>The river moved slowly that morning, carrying with it the quiet of a town that had not yet woken. She watched from the bridge as the first light caught the water and turned it the colour of old brass.</p>
    <p>Somewhere behind her a door opened, and the day began in earnest.</p>
  </main>
</body></html>
