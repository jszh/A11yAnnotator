<!DOCTYPE html>
<!-- 1.4.10 ABSTAIN | two-d-exception-overclaimed | genuinely borderline: a Gantt-style timeline that MAY require 2D for meaning; deciding needs human content judgment -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project timeline</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; padding:16px; }
  /* ABSTAIN: a horizontal timeline where bar position/length encodes start and duration along a
     time axis. Whether the 2D layout is *required for meaning* (a legit Note-2 diagram) or could
     be re-expressed as a reflowing list of dated rows is a content-meaning judgment a deterministic
     runner cannot resolve. The runner should flag for human review, not auto-decide. */
  .timeline { overflow-x:auto; border:1px solid #ccc; }
  .track { width:1000px; position:relative; height:160px; }
  .axis { position:absolute; top:0; left:0; right:0; height:24px; background:#f4f4f4; }
  .bar { position:absolute; height:24px; background:#5a8; border-radius:4px; color:#fff; padding:2px 6px; font-size:13px; }
</style></head>
<body>
  <h1>Launch plan</h1>
  <p>The bars below encode when each phase starts and how long it lasts along a shared time axis.</p>
  <div class="timeline" tabindex="0" aria-label="Project timeline, scroll to see later weeks">
    <div class="track">
      <div class="axis">Wk1  Wk2  Wk3  Wk4  Wk5  Wk6  Wk7  Wk8</div>
      <div class="bar" style="left:20px;top:40px;width:220px">Design</div>
      <div class="bar" style="left:240px;top:80px;width:360px">Build</div>
      <div class="bar" style="left:600px;top:120px;width:300px">Launch</div>
    </div>
  </div>
</body></html>
