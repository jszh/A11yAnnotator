<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | LEGITIMATE complex SVG diagram (circuit schematic) that requires 2D layout for meaning -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schematic</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* LEGITIMATE EXCEPTION: a wiring schematic is a diagram whose meaning is the 2D spatial
     arrangement of nodes and connections. Note 2: "images required for understanding (such as
     maps and diagrams)". Allowing it to scroll within a bounded region preserves its meaning. */
  .diagram { overflow:auto; border:1px solid #ccc; max-width:100%; }
  svg { display:block; }
  p { max-width:60ch; }
</style></head>
<body>
  <h1>Sensor wiring</h1>
  <p>The schematic below is a diagram; its meaning is the spatial layout of the connections, so it keeps two dimensions while this text reflows.</p>
  <div class="diagram" tabindex="0" aria-label="Sensor wiring schematic diagram">
    <svg width="900" height="360" role="img" aria-label="Two sensors wired in series to a controller">
      <rect x="20" y="20" width="120" height="60" fill="none" stroke="#333"/>
      <text x="32" y="55">Sensor A</text>
      <rect x="380" y="20" width="120" height="60" fill="none" stroke="#333"/>
      <text x="392" y="55">Sensor B</text>
      <rect x="720" y="140" width="150" height="70" fill="none" stroke="#333"/>
      <text x="735" y="180">Controller</text>
      <line x1="140" y1="50" x2="380" y2="50" stroke="#333"/>
      <line x1="500" y1="50" x2="795" y2="140" stroke="#333"/>
    </svg>
  </div>
</body></html>
