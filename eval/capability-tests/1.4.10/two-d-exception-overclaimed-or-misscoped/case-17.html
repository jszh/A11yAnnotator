<!DOCTYPE html>
<!-- 1.4.10 NEGATIVE | two-d-exception-overclaimed | LEGITIMATE video player; Note 2 lists "video" as content requiring 2D layout -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture recording</title>
<style>
  body { margin:0; font:16px/1.6 system-ui, sans-serif; padding:16px; }
  /* LEGITIMATE EXCEPTION: a video frame keeps a fixed aspect ratio; Note 2 lists "video".
     The player is responsive (max-width:100%) yet inherently a 2D media region. The transcript
     below it reflows as normal prose, so the exception is correctly scoped to the media. */
  .player { max-width:640px; }
  .frame { aspect-ratio:16/9; background:#000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"/>') center/cover; position:relative; }
  .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:48px; }
  p { max-width:65ch; }
</style></head>
<body>
  <h1>Module 2 — recording</h1>
  <div class="player">
    <div class="frame" role="img" aria-label="Video player (paused)"><span class="play">▶</span></div>
  </div>
  <h2>Transcript</h2>
  <p>Welcome to module two. In this session we will look at how reflow works and why some content, such as this very video, is allowed to keep a two-dimensional presentation.</p>
</body></html>
