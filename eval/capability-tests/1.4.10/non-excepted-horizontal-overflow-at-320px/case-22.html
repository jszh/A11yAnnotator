<title>1.4.10 negative (vertical-growth-only)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .box{background:#efe;padding:12px;}
</style>

<body>
<div class="box"><p>This page only grows taller as content is added. Vertical scrolling is permitted by 1.4.10; there is never horizontal overflow at 320px.</p><p>More content makes the page taller, not wider.</p></div>
