<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 negative (em-based-widths)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .col{max-width:30em;margin:0 auto;}
</style>
</head>
<body>
<div class="col"><h2>Readable measure</h2><p>Using a max-width in em units keeps the measure comfortable on wide screens but still collapses to the viewport at 320px. No horizontal scroll.</p></div>
</body>
</html>
