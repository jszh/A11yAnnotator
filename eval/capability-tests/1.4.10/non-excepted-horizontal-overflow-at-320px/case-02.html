<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 positive (min-width-container)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .wrap{min-width:520px;background:#efe;padding:12px;}
</style>
</head>
<body>
<div class="wrap"><h2>Newsletter</h2><p>The content wrapper declares min-width:520px so it can never shrink below 520px. At 320px the page scrolls sideways to reveal the right half of every line.</p></div>
</body>
</html>
