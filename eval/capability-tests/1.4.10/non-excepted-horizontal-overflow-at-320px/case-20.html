<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 negative (overflow-wrap-long-word)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  p{overflow-wrap:anywhere;}
</style>
</head>
<body>
<p>A normally long descriptive sentence followed by averylongunbrokenwordthatwouldotherwiseoverflowbutoverflowwrapanywhereletsitbreak across lines so nothing overflows.</p>
</body>
</html>
