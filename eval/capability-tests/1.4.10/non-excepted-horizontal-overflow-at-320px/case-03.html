<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 positive (two-column-grid-fixed-cols)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .grid{display:grid;grid-template-columns:340px 340px;gap:0;}.col{padding:10px;background:#fafafa;}
</style>
</head>
<body>
<div class="grid"><div class="col"><h3>Left</h3><p>A two-column layout with fixed 340px+340px tracks never collapses to one column. At 320px the second column sits entirely off-screen and the first column is also partly clipped.</p></div><div class="col"><h3>Right</h3><p>Right-hand article text is only reachable by scrolling the page horizontally.</p></div></div>
</body>
</html>
