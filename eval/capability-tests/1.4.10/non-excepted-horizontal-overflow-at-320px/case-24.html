<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 negative (box-sizing-borderbox-padding)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .pad{width:100%;padding:20px;box-sizing:border-box;background:#fff7e6;}
</style>
</head>
<body>
<div class="pad"><p>width:100% combined with box-sizing:border-box keeps padding inside the 320px viewport, so this padded block does not push past the right edge.</p></div>
</body>
</html>
