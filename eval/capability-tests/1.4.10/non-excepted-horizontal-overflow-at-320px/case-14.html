<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.4.10 negative (responsive-grid-autofit)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}.col{padding:10px;background:#fafafa;}
</style>
</head>
<body>
<div class="grid"><div class="col"><h3>Left</h3><p>auto-fit minmax collapses to one column when the viewport is narrow.</p></div><div class="col"><h3>Right</h3><p>Reflows under 320px to a single column with no horizontal scroll.</p></div></div>
</body>
</html>
