<title>1.4.10 C33 positive (long-word-overflow-no-wrap)</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,Arial,sans-serif;}
  p{overflow-wrap:normal;word-break:normal;}
</style>
</head>
<body>
<p>Pneumonoultramicroscopicsilicovolcanoconiosisantidisestablishmentarianismfloccinaucinihilipilification is a famously long word, and with default wrapping rules it cannot break, so it pushes the paragraph past the 320px viewport edge.</p>
