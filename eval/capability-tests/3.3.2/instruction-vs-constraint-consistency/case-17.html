<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | instruction-vs-constraint-consistency | each field describedby its own correct format hint -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-vs-constraint-consistency case 17</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Identity</h1>
  <form id="f">
    <label for="ssn">Tax ID</label>
    <p class="hint" id="ssn-hint">9 digits, no dashes. Example: 123456789</p>
    <input id="ssn" name="ssn" type="text" pattern="\d{9}" aria-describedby="ssn-hint" required>
    <label for="dob">Date of birth</label>
    <p class="hint" id="dob-hint">Use YYYY-MM-DD.</p>
    <input id="dob" name="dob" type="text" pattern="\d{4}-\d{2}-\d{2}" aria-describedby="dob-hint">
    <button type="submit">Continue</button>
  </form>
</body></html>
