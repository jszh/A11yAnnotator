<!DOCTYPE html>
<!-- 3.3.2 POSITIVE | instruction-vs-constraint-consistency | format shown only in placeholder that disappears on input -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-vs-constraint-consistency case 6</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Phone</h1>
  <form id="f">
    <label for="ph">Phone number</label>
    <!-- CONSTRAINT: +NN NNN NNN NNN. The ONLY format hint is the placeholder, which vanishes once typing starts. -->
    <input id="ph" name="ph" type="text" placeholder="+44 020 000 0000"
           pattern="\+\d{2} \d{3} \d{3} \d{4}" required>
    <button type="submit">Save</button>
  </form>
</body></html>
