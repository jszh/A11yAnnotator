<!DOCTYPE html>
<!-- 3.3.2 POSITIVE | instruction-vs-constraint-consistency | password complexity rules enforced but never stated -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-vs-constraint-consistency case 5</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Create password</h1>
  <form id="f">
    <label for="pw">New password</label>
    <!-- CONSTRAINT: >=10 chars, 1 upper, 1 digit, 1 symbol. NONE of this is stated to the user. -->
    <input id="pw" name="pw" type="password" pattern="(?=.{10,})(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).*" required>
    <button type="submit">Set password</button>
  </form>
</body></html>
