<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | instruction-vs-constraint-consistency | instruction names grams and field validates grams range -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-vs-constraint-consistency case 18</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Parcel</h1>
  <form id="f">
    <label for="w">Weight</label>
    <p class="hint" id="w-hint">Enter weight in grams (100–30000).</p>
    <input id="w" name="w" type="number" min="100" max="30000" step="1" aria-describedby="w-hint" required>
    <button type="submit">Submit</button>
  </form>
</body></html>
