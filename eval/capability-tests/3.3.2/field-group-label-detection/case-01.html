<!DOCTYPE html>
<!-- 3.3.2 POSITIVE | field-group-label-detection | radio set: options labeled but no group question -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 field-group-label-detection case 1</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Order</h1>
  <form id="f">
    <!-- The radios have individual labels but NO group label stating WHAT is being chosen. -->
    <div>
      <input type="radio" id="s" name="size" value="s"><label for="s">Small</label>
      <input type="radio" id="m" name="size" value="m"><label for="m">Medium</label>
      <input type="radio" id="l" name="size" value="l"><label for="l">Large</label>
    </div>
    <button type="submit">Next</button>
  </form>
</body></html>
