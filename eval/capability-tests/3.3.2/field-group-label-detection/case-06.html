<!DOCTYPE html>
<!-- 3.3.2 POSITIVE | field-group-label-detection | fieldset legend is generic ("Information") -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 field-group-label-detection case 6</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Address</h1>
  <form id="f">
    <!-- Legend exists but is generic and does not identify the split-field group purpose. -->
    <fieldset>
      <legend>Information</legend>
      <label for="a1">Line 1</label><input id="a1" name="a1" type="text" required>
      <label for="a2">Line 2</label><input id="a2" name="a2" type="text">
    </fieldset>
    <button type="submit">Save</button>
  </form>
</body></html>
