<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | field-group-label-detection | segmented OTP with role=group + instruction labelledby -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 field-group-label-detection case 13</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Verify</h1>
  <form id="f">
    <p id="otp-grp">Enter the 6-digit verification code, one digit per box.</p>
    <div role="group" aria-labelledby="otp-grp">
      <input id="c1" type="text" maxlength="1" aria-label="Digit 1">
      <input id="c2" type="text" maxlength="1" aria-label="Digit 2">
      <input id="c3" type="text" maxlength="1" aria-label="Digit 3">
      <input id="c4" type="text" maxlength="1" aria-label="Digit 4">
      <input id="c5" type="text" maxlength="1" aria-label="Digit 5">
      <input id="c6" type="text" maxlength="1" aria-label="Digit 6">
    </div>
    <button type="submit">Verify</button>
  </form>
</body></html>
