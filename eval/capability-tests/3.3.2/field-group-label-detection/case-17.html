<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | field-group-label-detection | phone parts grouped under a legend "Phone number" -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 field-group-label-detection case 17</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Contact</h1>
  <form id="f">
    <fieldset>
      <legend>Phone number</legend>
      <label for="cc">Country code</label><input id="cc" name="cc" type="text" maxlength="3" required>
      <label for="num">Local number</label><input id="num" name="num" type="text" maxlength="10" required>
    </fieldset>
    <button type="submit">Save</button>
  </form>
</body></html>
