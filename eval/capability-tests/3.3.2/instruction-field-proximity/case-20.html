<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | instruction-field-proximity | amount precision hint sits under the field and is associated -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-field-proximity case 20</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Donate</h1>
  <form id="f">
    <label for="amt">Amount (USD)</label>
    <p class="hint" id="amt-hint">Two decimal places, minimum 5.00 (e.g. 10.00).</p>
    <input id="amt" name="amt" type="text" pattern="\d+\.\d{2}" aria-describedby="amt-hint" required>
    <button type="submit">Give</button>
  </form>
</body></html>
