<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | instruction-field-proximity | G184 instruction at top of a short form covers the field -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-field-proximity case 17</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Card</h1>
  <form id="f">
    <p class="hint" id="form-hint">All card numbers are 16 digits with no spaces.</p>
    <label for="cc">Card number</label>
    <input id="cc" name="cc" type="text" pattern="\d{16}" aria-describedby="form-hint" required>
    <button type="submit">Pay</button>
  </form>
</body></html>
