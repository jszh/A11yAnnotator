<!DOCTYPE html>
<!-- 3.3.2 NEGATIVE | instruction-field-proximity | handle hint sits with the handle field -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.2 instruction-field-proximity case 14</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Profile</h1>
  <form id="f">
    <label for="nick">Nickname</label>
    <p class="hint" id="nick-hint">Letters only, 2-12 characters.</p>
    <input id="nick" name="nick" type="text" pattern="[A-Za-z]{2,12}" aria-describedby="nick-hint">
    <label for="handle">Handle</label>
    <p class="hint" id="handle-hint">Start with @, then 2-15 lowercase letters, numbers, or underscores.</p>
    <input id="handle" name="handle" type="text" pattern="@[a-z0-9_]{2,15}" aria-describedby="handle-hint" required>
    <button type="submit">Save</button>
  </form>
</body></html>
