<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-vs-actual-constraint-match | required-empty but error says "invalid format" (field is simply empty) -->
<html lang="en"><head><meta charset="utf-8"><title>Empty field, format error</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Account</h1>
  <form id="f" novalidate>
    <label for="name">Full name (required)</label>
    <input id="name" name="name" type="text" required aria-describedby="name-err">
    <p id="name-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Create account</button>
  </form>
  <script>
    // CONSTRAINT: required. With invalidValue "" the field is empty; error misdescribes the empty field as a format problem.
    var f=document.getElementById('f'), e=document.getElementById('name'), m=document.getElementById('name-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      if(e.value.trim()===''){
        // BUG: real violation is EMPTY/required; the error claims the (nonexistent) entry has an invalid format.
        m.textContent='Error: Full name is in an invalid format.';
        m.hidden=false; e.setAttribute('aria-invalid','true');
      } else { m.hidden=true; e.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
