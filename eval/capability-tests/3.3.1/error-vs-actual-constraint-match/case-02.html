<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-vs-actual-constraint-match | maxlength violated but error names a pattern that isn't the constraint -->
<html lang="en"><head><meta charset="utf-8"><title>Username too long, wrong error</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Create username</h1>
  <form id="f" novalidate>
    <label for="user">Username (max 12 characters)</label>
    <input id="user" name="user" type="text" aria-describedby="user-err">
    <p id="user-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    // CONSTRAINT: maxlength 12. Error text claims an unrelated "letters and numbers only" rule.
    var f=document.getElementById('f'), e=document.getElementById('user'), m=document.getElementById('user-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      if(e.value.length>12){
        // BUG: real violation is LENGTH; the error blames character set, which the input actually satisfies.
        m.textContent='Error: Username may contain only letters and numbers.';
        m.hidden=false; e.setAttribute('aria-invalid','true');
      } else { m.hidden=true; e.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
