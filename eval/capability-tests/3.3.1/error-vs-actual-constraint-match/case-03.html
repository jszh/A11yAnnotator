<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-vs-actual-constraint-match | number range (min) violated but error says "type=number" / "must be a number" while value IS a number -->
<html lang="en"><head><meta charset="utf-8"><title>Quantity below min, wrong error</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Order quantity</h1>
  <form id="f" novalidate>
    <label for="qty">Quantity (minimum 5)</label>
    <input id="qty" name="qty" type="text" inputmode="numeric" aria-describedby="qty-err">
    <p id="qty-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Add to cart</button>
  </form>
  <script>
    // CONSTRAINT: numeric value must be >= 5. Error blames "not a number" even when a valid number below 5 is entered.
    var f=document.getElementById('f'), e=document.getElementById('qty'), m=document.getElementById('qty-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var n=Number(e.value);
      if(!(Number.isFinite(n) && n>=5)){
        // BUG: with invalidValue "3" the value IS a number; the real violation is min, but the error names format.
        m.textContent='Error: Quantity must be a number.';
        m.hidden=false; e.setAttribute('aria-invalid','true');
      } else { m.hidden=true; e.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
