<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-vs-actual-constraint-match | type=email violated, error is contentless ("Invalid.") with no description of the format -->
<html lang="en"><head><meta charset="utf-8"><title>Contentless error</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Reset password</h1>
  <form id="f" novalidate>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" aria-describedby="email-err">
    <p id="email-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Send reset link</button>
  </form>
  <script>
    // CONSTRAINT: email format. Error is bound and names no field, just "Invalid." — does not DESCRIBE the error in text.
    var f=document.getElementById('f'), e=document.getElementById('email'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.value.trim());
      if(!ok){
        // BUG: G83/G84/G85 require the error be DESCRIBED in text. "Invalid." conveys neither the field nor the rule.
        m.textContent='Invalid.';
        m.hidden=false; e.setAttribute('aria-invalid','true');
      } else { m.hidden=true; e.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
