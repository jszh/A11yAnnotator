<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-vs-actual-constraint-match | RISKY: same field can fail two rules; the error correctly names WHICH rule fired -->
<html lang="en"><head><meta charset="utf-8"><title>Two rules, correct one named</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Set password</h1>
  <form id="f" novalidate>
    <label for="pw">Password (8-20 chars, must include a digit)</label>
    <input id="pw" name="pw" type="password" aria-describedby="pw-err">
    <p id="pw-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    // Two constraints: length and digit-presence. With invalidValue "abcdefgh" (8 chars, NO digit) the error
    // correctly identifies the DIGIT rule as the one violated, not length.
    var f=document.getElementById('f'), e=document.getElementById('pw'), m=document.getElementById('pw-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var v=e.value, lenOK=v.length>=8 && v.length<=20, digitOK=/\d/.test(v);
      if(!lenOK){ m.textContent='Error: Password must be 8 to 20 characters.'; m.hidden=false; e.setAttribute('aria-invalid','true'); return; }
      if(!digitOK){ m.textContent='Error: Password must include at least one digit.'; m.hidden=false; e.setAttribute('aria-invalid','true'); return; }
      m.hidden=true; e.removeAttribute('aria-invalid');
    });
  </script>
</body></html>
