<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-summary-coherence | summary lists fields in a way that double-counts / duplicates one failure and drops another -->
<html lang="en"><head><meta charset="utf-8"><title>Summary duplicates one, drops another</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Register</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="user">Username (required)</label>
    <input id="user" name="user" type="text" required>
    <button id="submit" type="submit">Register</button>
  </form>
  <script>
    // Field under test: Username (empty). Both Email and Username are empty. BUG: the summary lists Email TWICE and
    // never lists Username, so it neither matches the count nor the set of actual failing fields.
    var f=document.getElementById('f'), email=document.getElementById('email'), user=document.getElementById('user'),
        s=document.getElementById('summary'), list=document.getElementById('list');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var emailBad=email.value.trim()==='', userBad=user.value.trim()==='';
      if(emailBad){ list.insertAdjacentHTML('beforeend','<li>Email is required.</li>'); }
      if(emailBad){ list.insertAdjacentHTML('beforeend','<li>Email is required.</li>'); } // duplicate, copy-paste bug
      // userBad never rendered
      if(emailBad || userBad){ s.hidden=false; } else { s.hidden=true; }
    });
  </script>
</body></html>
