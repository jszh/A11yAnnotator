<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE(abstain) | error-summary-coherence | summary is a single free-prose sentence; mapping it to the failing field set is not deterministic -->
<html lang="en"><head><meta charset="utf-8"><title>Free-prose summary</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign up</h1>
  <!-- The summary is a free-prose sentence rather than a structured list. It plausibly names the failing fields, but
       mapping prose to an exact field-set (to verify coherence: no missing/extra fields) is not deterministically
       resolvable by structural inspection, so the runner should abstain on summary coherence. -->
  <div id="summary" class="summary" role="alert" hidden><p id="prose"></p></div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="user">Username (required)</label>
    <input id="user" name="user" type="text" required>
    <button id="submit" type="submit">Create</button>
  </form>
  <script>
    var f=document.getElementById('f'), email=document.getElementById('email'), user=document.getElementById('user'),
        s=document.getElementById('summary'), prose=document.getElementById('prose');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var names=[];
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) names.push('email');
      if(user.value.trim()==='') names.push('username');
      if(names.length){ prose.textContent='Please review your '+names.join(' and ')+' before continuing.'; s.hidden=false; }
      else { s.hidden=true; }
    });
  </script>
</body></html>
