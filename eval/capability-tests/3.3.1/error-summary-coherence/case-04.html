<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-summary-coherence | summary count contradicts the listed items -->
<html lang="en"><head><meta charset="utf-8"><title>Count contradicts list</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign up</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong id="count"></strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="pw">Password (min 8)</label>
    <input id="pw" name="pw" type="password" minlength="8">
    <button id="submit" type="submit">Create</button>
  </form>
  <script>
    // Field under test: Password. Both fields fail (2 errors). BUG: the heading says "1 error" while the list shows two,
    // so the summary's count is incoherent with its own contents and the actual failures.
    var f=document.getElementById('f'), email=document.getElementById('email'), pw=document.getElementById('pw'),
        s=document.getElementById('summary'), list=document.getElementById('list'), count=document.getElementById('count');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var n=0;
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())){ list.insertAdjacentHTML('beforeend','<li>Email is required.</li>'); n++; }
      if(pw.value.length<8){ list.insertAdjacentHTML('beforeend','<li>Password must be at least 8 characters.</li>'); n++; }
      if(n){ count.textContent='1 error found:'; s.hidden=false; } else { s.hidden=true; }  // BUG: hardcoded "1"
    });
  </script>
</body></html>
