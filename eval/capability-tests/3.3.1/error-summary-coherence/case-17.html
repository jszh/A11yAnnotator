<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-summary-coherence | one field fails two rules; summary lists ONE coherent entry for that field -->
<html lang="en"><head><meta charset="utf-8"><title>One field two rules, one coherent entry</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Set password</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="pw">Password (8-20 chars, must include a digit)</label>
    <input id="pw" name="pw" type="password">
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    // invalidValue "abc" violates both length and digit rules, but it is ONE field; the summary lists exactly one entry
    // for Password describing what to fix — coherent (no double-listing of the same field).
    var f=document.getElementById('f'), pw=document.getElementById('pw'),
        s=document.getElementById('summary'), list=document.getElementById('list');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var v=pw.value, reasons=[];
      if(v.length<8 || v.length>20) reasons.push('be 8 to 20 characters');
      if(!/\d/.test(v)) reasons.push('include at least one digit');
      if(reasons.length){ list.innerHTML='<li><a href="#pw">Password must '+reasons.join(' and ')+'</a></li>'; s.hidden=false; }
      else { s.hidden=true; }
    });
  </script>
</body></html>
