<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-summary-coherence | summary hard-codes an extra field that is valid (lists a passing field on the single submit) -->
<html lang="en"><head><meta charset="utf-8"><title>Summary hard-codes a valid field</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign up</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="user">Username (required)</label>
    <input id="user" name="user" type="text" required value="validuser">
    <button id="submit" type="submit">Create</button>
  </form>
  <script>
    // Field under test: Email. Username is valid. BUG: on the single invalid submit the summary always emits BOTH a
    // (correct) Email entry and a hard-coded Username entry; Username is not in error, so the summary lists a passing field.
    var f=document.getElementById('f'), email=document.getElementById('email'),
        s=document.getElementById('summary'), list=document.getElementById('list');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var emailBad=!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(emailBad){
        // always appends a Username error too, regardless of its actual (valid) state
        list.innerHTML='<li>Email is required.</li><li>Username is required.</li>';
        s.hidden=false;
      } else { s.hidden=true; }
    });
  </script>
</body></html>
