<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-summary-coherence | summary OMITS a failing field (lists only one of two failures) -->
<html lang="en"><head><meta charset="utf-8"><title>Summary missing a field</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign up</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="pw">Password (min 8)</label>
    <input id="pw" name="pw" type="password" minlength="8">
    <button id="submit" type="submit">Create account</button>
  </form>
  <script>
    // Field under test: Password (too short). Both Email (empty) and Password (short) fail. BUG: the summary lists ONLY
    // Email and omits the failing Password field, so the summary does not coherently list all actual failures.
    var f=document.getElementById('f'), email=document.getElementById('email'), pw=document.getElementById('pw'),
        s=document.getElementById('summary'), list=document.getElementById('list');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var emailBad=!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      var pwBad=pw.value.length<8;
      if(emailBad){ var li=document.createElement('li'); li.textContent='Email is required.'; list.appendChild(li); }
      // BUG: pwBad is computed but never added to the summary.
      if(emailBad || pwBad){ s.hidden=false; } else { s.hidden=true; }
    });
  </script>
</body></html>
