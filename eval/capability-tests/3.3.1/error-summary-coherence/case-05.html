<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-summary-coherence | empty summary shell shown while a field actually fails -->
<html lang="en"><head><meta charset="utf-8"><title>Empty summary shell</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign in</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <script>
    // BUG: on error the summary container is revealed but the list is never populated, so a failing field produces an
    // empty summary that lists no fields at all.
    var f=document.getElementById('f'), email=document.getElementById('email'), s=document.getElementById('summary');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ s.hidden=false; } else { s.hidden=true; }   // list stays empty
    });
  </script>
</body></html>
