<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-summary-coherence | structured summary lists exactly the single failing field by label, with a link -->
<html lang="en"><head><meta charset="utf-8"><title>Coherent single-field linked summary</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .summary{border:2px solid #b00020;padding:12px;margin-bottom:16px}
  .summary[hidden]{display:none}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Order</h1>
  <div id="summary" class="summary" role="alert" hidden>
    <strong>There is a problem:</strong>
    <ul id="list"></ul>
  </div>
  <form id="f" novalidate>
    <label for="qty">Quantity (minimum 5)</label>
    <input id="qty" name="qty" type="text" inputmode="numeric">
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required value="ok@example.com">
    <button id="submit" type="submit">Add to cart</button>
  </form>
  <script>
    // Field under test: Quantity (below min). Email valid. Summary lists only the Quantity field, linked and named.
    var f=document.getElementById('f'), qty=document.getElementById('qty'), email=document.getElementById('email'),
        s=document.getElementById('summary'), list=document.getElementById('list');
    f.addEventListener('submit',function(ev){
      ev.preventDefault(); list.innerHTML='';
      var items=[];
      var n=Number(qty.value);
      if(!(Number.isFinite(n)&&n>=5)) items.push('<a href="#qty">Quantity must be at least 5</a>');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) items.push('<a href="#email">Email is required</a>');
      list.innerHTML=items.map(function(t){return '<li>'+t+'</li>';}).join('');
      s.hidden=items.length===0;
    });
  </script>
</body></html>
