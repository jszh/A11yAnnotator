<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-field-binding | RISKY: describedby holds MULTIPLE ids (help + error); the error id is still bound to its field -->
<html lang="en"><head><meta charset="utf-8"><title>Multi-id describedby still bound</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .hint{color:#555;margin-top:4px}
  .err{color:#b00020;margin-top:4px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Set password</h1>
  <form id="f" novalidate>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" minlength="8" aria-describedby="pw-hint pw-err">
    <p id="pw-hint" class="hint">Use at least 8 characters.</p>
    <p id="pw-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    // Risky surface (two describedby tokens), but the error token #pw-err belongs to THIS field and receives the message,
    // so the error remains correctly bound to the failing control.
    var f=document.getElementById('f'), pw=document.getElementById('pw'), m=document.getElementById('pw-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      if(pw.value.length<8){ m.textContent='Error: Password must be at least 8 characters.'; m.hidden=false; pw.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; pw.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
