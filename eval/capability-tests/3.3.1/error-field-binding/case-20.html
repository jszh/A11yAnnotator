<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-field-binding | error bound via describedby AND adjacent, single field, value-format violation -->
<html lang="en"><head><meta charset="utf-8"><title>Bound and adjacent</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Contact</h1>
  <form id="f" novalidate>
    <label for="phone">Phone (format 555-123-4567)</label>
    <input id="phone" name="phone" type="text" pattern="\d{3}-\d{3}-\d{4}" aria-describedby="phone-err">
    <p id="phone-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    // The error is both bound via aria-describedby and rendered immediately after the field — correctly bound.
    var f=document.getElementById('f'), phone=document.getElementById('phone'), m=document.getElementById('phone-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^\d{3}-\d{3}-\d{4}$/.test(phone.value);
      if(!ok){ m.textContent='Error: Phone must match the format 555-123-4567.'; m.hidden=false; phone.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; phone.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
