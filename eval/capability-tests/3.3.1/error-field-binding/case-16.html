<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-field-binding | error inside the field's <label> element (label association binds it) -->
<html lang="en"><head><meta charset="utf-8"><title>Error inside label</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;display:block;margin-top:4px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;font-weight:400}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Subscribe</h1>
  <form id="f" novalidate>
    <label for="email">Email address
      <input id="email" name="email" type="email" required>
      <span id="email-err" class="err" role="alert" hidden></span>
    </label>
    <button id="submit" type="submit">Subscribe</button>
  </form>
  <script>
    // The error text is placed inside the field's own <label>, so it is part of the field's accessible description by
    // wrapping association — unambiguously bound to the failing control.
    var f=document.getElementById('f'), email=document.getElementById('email'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ m.textContent='Error: enter a valid email address.'; m.hidden=false; email.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; email.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
