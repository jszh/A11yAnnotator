<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-field-binding | two fields fail; both errors land in one node bound to only ONE field, stranding the other -->
<html lang="en"><head><meta charset="utf-8"><title>Second error stranded</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:4px;margin-bottom:10px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign up</h1>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required aria-describedby="email-err">
    <p id="email-err" class="err" role="alert" hidden></p>
    <label for="pw">Password (min 8)</label>
    <input id="pw" name="pw" type="password" minlength="8">
    <button id="submit" type="submit">Create</button>
  </form>
  <script>
    // Field under test: Password (too short). Email is also empty. BUG: BOTH error sentences are concatenated into the
    // EMAIL field's describedby node; the Password field has no binding, so its error is stranded on the wrong control.
    var f=document.getElementById('f'), email=document.getElementById('email'),
        pw=document.getElementById('pw'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var msgs=[];
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) msgs.push('Email is required.');
      if(pw.value.length<8) msgs.push('Password must be at least 8 characters.');
      if(msgs.length){ m.textContent='Error: '+msgs.join(' '); m.hidden=false; }
      else { m.hidden=true; }
    });
  </script>
</body></html>
