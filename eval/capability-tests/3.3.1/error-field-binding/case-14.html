<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-field-binding | describedby added dynamically on submit, pointing to the new error node -->
<html lang="en"><head><meta charset="utf-8"><title>Describedby wired on submit</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Reset</h1>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <input id="email" name="email" type="email" required>
    <button id="submit" type="submit">Send link</button>
  </form>
  <script>
    // No describedby initially; on error the script creates a message node WITH an id and wires the field's
    // aria-describedby to it, then inserts it right after the field. Binding is correct at the moment of error.
    var f=document.getElementById('f'), email=document.getElementById('email');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      var ex=document.getElementById('email-err'); if(ex) ex.remove();
      if(!ok){
        var p=document.createElement('p'); p.id='email-err'; p.className='err'; p.setAttribute('role','alert');
        p.textContent='Error: Email must be a valid email address.';
        email.insertAdjacentElement('afterend', p);
        email.setAttribute('aria-describedby','email-err'); email.setAttribute('aria-invalid','true');
      } else { email.removeAttribute('aria-describedby'); email.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
