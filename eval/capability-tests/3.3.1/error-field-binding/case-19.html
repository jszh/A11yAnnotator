<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE(abstain) | error-field-binding | binding is plausibly conveyed live via aria-errormessage, which the runner may not resolve deterministically -->
<html lang="en"><head><meta charset="utf-8"><title>aria-errormessage binding</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign in</h1>
  <form id="f" novalidate>
    <label for="email">Email (required)</label>
    <!-- The error is associated via aria-errormessage (only conveyed when aria-invalid="true"). A runner that checks
         only aria-describedby/adjacency cannot deterministically confirm this binding mechanism; it should abstain
         rather than assert the error is stranded. -->
    <input id="email" name="email" type="email" required aria-errormessage="email-err" aria-invalid="false">
    <p id="email-err" class="err" hidden></p>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <script>
    var f=document.getElementById('f'), email=document.getElementById('email'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ m.textContent='Error: Email must be a valid email address.'; m.hidden=false; email.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; email.setAttribute('aria-invalid','false'); }
    });
  </script>
</body></html>
