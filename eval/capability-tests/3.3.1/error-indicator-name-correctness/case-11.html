<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-indicator-name-correctness | error names the field explicitly by its label -->
<html lang="en"><head><meta charset="utf-8"><title>Field named explicitly</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Registration</h1>
  <form id="f" novalidate>
    <label for="email">Email address (required)</label>
    <input id="email" name="email" type="email" required aria-describedby="email-err">
    <p id="email-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Register</button>
  </form>
  <script>
    // CONSTRAINT: email required+format. Error explicitly names the "Email address" field that is in error.
    var f=document.getElementById('f'), email=document.getElementById('email'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ m.textContent='Error: Email address must be a valid email.'; m.hidden=false; email.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; email.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
