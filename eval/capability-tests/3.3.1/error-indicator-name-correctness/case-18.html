<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-indicator-name-correctness | fieldset/legend group; error names the group AND the specific option -->
<html lang="en"><head><meta charset="utf-8"><title>Grouped control named</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  fieldset{margin:0 0 12px;border:1px solid #999;padding:12px}
  legend{font-weight:600}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Survey</h1>
  <form id="f" novalidate>
    <fieldset aria-describedby="rate-err">
      <legend>How would you rate us? (required)</legend>
      <label><input type="radio" name="rating" value="1"> 1</label>
      <label><input type="radio" name="rating" value="2"> 2</label>
      <label><input type="radio" name="rating" value="3"> 3</label>
      <p id="rate-err" class="err" role="alert" hidden></p>
    </fieldset>
    <button id="submit" type="submit">Submit</button>
  </form>
  <script>
    // Field under test: the radio group (none selected). Error names the group via its legend text.
    var f=document.getElementById('f'), m=document.getElementById('rate-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var picked=f.querySelector('input[name="rating"]:checked');
      if(!picked){ m.textContent='Error: Please choose a rating for "How would you rate us?".'; m.hidden=false; }
      else { m.hidden=true; }
    });
  </script>
</body></html>
