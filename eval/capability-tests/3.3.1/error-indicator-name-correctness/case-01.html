<!DOCTYPE html>
<!-- 3.3.1 POSITIVE | error-indicator-name-correctness | generic "form has errors" names no field -->
<html lang="en"><head><meta charset="utf-8"><title>Generic form error</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box;margin-bottom:10px}
  button{margin-top:8px;padding:9px 18px}
</style></head>
<body>
  <h1>Registration</h1>
  <form id="f" novalidate>
    <label for="email">Email address (required)</label>
    <input id="email" name="email" type="email" required>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="text">
    <p id="form-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Register</button>
  </form>
  <script>
    // CONSTRAINT under test: email required+format. BUG: the only error is a page-level "form has errors" that
    // never names WHICH field failed, so the item in error is not identified.
    var f=document.getElementById('f'), email=document.getElementById('email'), m=document.getElementById('form-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ m.textContent='The form has errors. Please correct them and try again.'; m.hidden=false; }
      else { m.hidden=true; }
    });
  </script>
</body></html>
