<!DOCTYPE html>
<!-- 3.3.1 NEGATIVE | error-indicator-name-correctness | RISKY: error text does not repeat the label, but adjacency + describedby clearly identify the field -->
<html lang="en"><head><meta charset="utf-8"><title>Identified by association, not repeated name</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:520px}
  .err{color:#b00020;margin-top:6px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input{padding:8px;width:100%;box-sizing:border-box}
  button{margin-top:14px;padding:9px 18px}
</style></head>
<body>
  <h1>Sign in</h1>
  <form id="f" novalidate>
    <label for="email">Email address (required)</label>
    <input id="email" name="email" type="email" required aria-describedby="email-err">
    <p id="email-err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Sign in</button>
  </form>
  <script>
    // The message ("Please enter a valid email.") does not repeat the label word-for-word, but it is the SINGLE field,
    // is bound via aria-describedby, and sits directly under the labelled control — the item in error is identified.
    var f=document.getElementById('f'), email=document.getElementById('email'), m=document.getElementById('email-err');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      if(!ok){ m.textContent='Please enter a valid email, for example name@example.com.'; m.hidden=false; email.setAttribute('aria-invalid','true'); }
      else { m.hidden=true; email.removeAttribute('aria-invalid'); }
    });
  </script>
</body></html>
