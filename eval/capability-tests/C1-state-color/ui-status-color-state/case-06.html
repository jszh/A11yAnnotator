<!-- SC 1.4.1 | positive | current-tab-color-only-on-focus | the active/current tab is signaled ONLY by a blue color that is ALSO the :hover color, so in the hovered/focused state the current tab is indistinguishable from a merely-hovered tab. No underline, no bold, no aria-current visual. State (current) ambiguous and color-only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current tab by color only, ambiguous on hover</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  [role="tablist"] { display: flex; gap: 4px; border-bottom: 1px solid #e0e0e0; }
  [role="tab"] {
    appearance: none; -webkit-appearance: none;
    padding: 10px 18px; font-size: 14px; color: #5f6368; background: #fff;
    border: none; cursor: pointer;
  }
  /* Hover paints a tab blue... */
  [role="tab"]:hover { color: #1a73e8; }
  /* ...and "current" ALSO only paints it blue — no underline, no bold, no
     bottom-border. So a hovered inactive tab looks identical to the current
     tab. The current state is conveyed by color alone and is ambiguous. */
  [role="tab"][aria-current="page"] { color: #1a73e8; }
</style>
</head>
<body>
  <p>Hover the tabs — the current tab is shown in blue.</p>
  <div role="tablist" aria-label="Sections">
    <button role="tab" aria-current="page">Overview</button>
    <button role="tab">Activity</button>
    <button role="tab">Settings</button>
  </div>
</body>
</html>
