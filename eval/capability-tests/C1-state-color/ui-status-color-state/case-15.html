<!-- SC 1.4.1 | negative | color-plus-shape-or-border-weight-change | the current tab is blue AND gains a 3px solid bottom-border underline that inactive tabs lack. The border (a shape/weight cue) conveys "current" without color, so it survives grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current tab with underline border</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  [role="tablist"] { display: flex; gap: 4px; border-bottom: 1px solid #e0e0e0; }
  [role="tab"] {
    appearance: none; -webkit-appearance: none;
    padding: 10px 18px; font-size: 14px; color: #5f6368; background: #fff;
    border: none; border-bottom: 3px solid transparent; cursor: pointer;
  }
  [role="tab"]:hover { color: #1a73e8; }
  /* Current tab: blue text PLUS a 3px solid blue underline bar that hovered
     inactive tabs never get. The thick bottom-border is a non-color shape cue
     distinguishing the current tab even in grayscale. */
  [role="tab"][aria-current="page"] { color: #1a73e8; border-bottom-color: #1a73e8; }
</style>
</head>
<body>
  <div role="tablist" aria-label="Sections">
    <button role="tab" aria-current="page">Overview</button>
    <button role="tab">Activity</button>
    <button role="tab">Settings</button>
  </div>
</body>
</html>
