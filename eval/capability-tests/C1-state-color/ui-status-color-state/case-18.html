<!-- SC 1.4.1 | negative | invalid-field-with-error-icon-and-message | the invalid field turns red AND shows a visible onscreen error message ("Enter a valid email") plus a "⚠" warning glyph. The persistent onscreen text+icon convey the error without color, surviving grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invalid field with icon and message</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  label { display: block; font-size: 14px; margin-bottom: 4px; }
  .row { width: 280px; }
  input {
    font-size: 15px; padding: 8px 10px; border: 2px solid #5f6368;
    border-radius: 4px; width: 240px;
  }
  input[aria-invalid="true"] { border-color: #d93025; }
  .err { display: none; margin-top: 6px; font-size: 13px; color: #c5221f; }
  /* The error message is plain ONSCREEN text (not mouse-over-only) and includes
     a "⚠" glyph. It is rendered whenever the field is invalid, so the error is
     conveyed without relying on the red color. */
  input[aria-invalid="true"] ~ .err { display: block; }
</style>
</head>
<body>
  <form>
    <div class="row">
      <label for="em">Email</label>
      <input id="em" type="email" value="not-an-email" aria-invalid="true" aria-describedby="emErr">
      <p class="err" id="emErr"><span aria-hidden="true">&#9888;</span> Enter a valid email address</p>
    </div>
  </form>
</body>
</html>
