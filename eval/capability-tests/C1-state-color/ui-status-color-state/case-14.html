<!-- SC 1.4.1 | negative | color-plus-checkmark-icon | the checked custom checkbox fills blue AND draws an onscreen white "✓" checkmark inside the box. The tick is a shape cue present whenever checked, so the state survives grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom checkbox with checkmark</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .opt { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 8px 0; }
  .opt input { position: absolute; opacity: 0; }
  .box {
    width: 20px; height: 20px; border: 2px solid #5f6368; border-radius: 3px;
    background: #fff; display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; line-height: 1;
  }
  .box::after { content: ""; }
  /* Checked fills blue AND renders an onscreen "✓". The checkmark is a shape
     cue independent of color, so the state is distinguishable in grayscale. */
  .opt input:checked + .box { background: #1a73e8; border-color: #1a73e8; }
  .opt input:checked + .box::after { content: "\2713"; }
</style>
</head>
<body>
  <label class="opt">
    <input type="checkbox" checked>
    <span class="box"></span>
    Email me product updates
  </label>
  <label class="opt">
    <input type="checkbox">
    <span class="box"></span>
    Email me about events
  </label>
</body>
</html>
