<!-- SC 1.4.1 | positive | required-field-red-label-color-only | required fields are distinguished from optional ONLY by the label being red (#d93025); no asterisk, no "(required)" text, no glyph. Required-ness = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Required fields by red label color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #202124; }
  /* The instruction says required fields are red. The ONLY thing distinguishing
     a required field's label from an optional one is its text color. */
  label.required { color: #d93025; }
  input { font-size: 15px; padding: 8px 10px; border: 1px solid #5f6368; border-radius: 4px; width: 240px; }
</style>
</head>
<body>
  <p>Fields shown in red are required.</p>
  <form>
    <label class="required" for="nm">Full name</label>
    <input id="nm" type="text">
    <label for="cmp">Company</label>
    <input id="cmp" type="text">
  </form>
</body>
</html>
