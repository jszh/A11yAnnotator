<!-- SC 1.4.1 | positive | checked-state-fill-color-only-no-tick | a custom checkbox shows ONLY a fill-color change when checked (blue #1a73e8 box vs white box, same square shape and size); there is NO tick/checkmark drawn, no border-weight change. checked state = fill color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Custom checkbox checked by fill color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .opt { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 8px 0; }
  .opt input { position: absolute; opacity: 0; }
  .box {
    width: 20px; height: 20px; border: 2px solid #5f6368; border-radius: 3px;
    background: #fff;             /* unchecked fill */
  }
  /* Checked simply fills the box blue. No "✓" glyph is rendered, the border
     weight and the square shape are unchanged. checked = fill color only. */
  .opt input:checked + .box { background: #1a73e8; border-color: #1a73e8; }
</style>
</head>
<body>
  <label class="opt">
    <input type="checkbox" checked>
    <span class="box"></span>
    Email me product updates
  </label>
  <label class="opt">
    <input type="checkbox">
    <span class="box"></span>
    Email me about events
  </label>
</body>
</html>
