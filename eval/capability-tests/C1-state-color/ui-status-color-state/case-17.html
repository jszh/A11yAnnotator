<!-- SC 1.4.1 | negative | toggle-with-on-off-text-and-knob-position | the switch shows onscreen "ON"/"OFF" text AND the knob slides to the right when checked (position cue). Track color is redundant; state survives grayscale via text + knob position. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle with on/off text and knob position</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .switch { position: relative; display: inline-block; width: 72px; height: 28px; vertical-align: middle; }
  .switch input { position: absolute; opacity: 0; }
  .track {
    position: absolute; inset: 0; background: #cccccc; border-radius: 14px;
    font-size: 10px; font-weight: 700; color: #333; line-height: 28px;
  }
  .track::before { content: "OFF"; position: absolute; right: 8px; }
  .knob {
    position: absolute; top: 4px; left: 4px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: none;
  }
  /* Checked: track turns green (redundant color) BUT the visible label flips to
     "ON" on the left AND the knob moves to the right. Both onscreen cues are
     color-independent, so on/off survives grayscale. */
  .switch input:checked + .track { background: #34a853; }
  .switch input:checked + .track::before { content: "ON"; right: auto; left: 8px; }
  .switch input:checked ~ .knob { left: 48px; }
</style>
</head>
<body>
  <p>Notifications</p>
  <label class="switch">
    <input type="checkbox" checked aria-label="Notifications">
    <span class="track"></span>
    <span class="knob"></span>
  </label>
</body>
</html>
