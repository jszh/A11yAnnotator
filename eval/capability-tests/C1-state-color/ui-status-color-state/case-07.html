<!-- SC 1.4.1 | positive | sort-direction-color-only | the actively-sorted column is indicated ONLY by its header text turning blue (#1a73e8); there is NO directional arrow/triangle and no asc/desc glyph anywhere, so neither "which column is sorted" nor "which direction" is conveyed without color. Sort status = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sort column by color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  table { border-collapse: collapse; font-size: 14px; }
  th { padding: 8px 16px; text-align: left; color: #202124; cursor: pointer; border-bottom: 2px solid #e0e0e0; }
  td { padding: 8px 16px; border-bottom: 1px solid #f0f0f0; }
  /* The sorted column header is just recolored blue. No ▲/▼ arrow, no text
     "(sorted)", no underline. Which column drives the sort is color only. */
  th[aria-sort="ascending"] { color: #1a73e8; }
</style>
</head>
<body>
  <p>The blue column header is the one the table is sorted by.</p>
  <table>
    <thead>
      <tr>
        <th aria-sort="ascending">Name</th>
        <th aria-sort="none">Date</th>
        <th aria-sort="none">Size</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Alice</td><td>Jan 2</td><td>4 KB</td></tr>
      <tr><td>Bob</td><td>Jan 9</td><td>9 KB</td></tr>
    </tbody>
  </table>
</body>
</html>
