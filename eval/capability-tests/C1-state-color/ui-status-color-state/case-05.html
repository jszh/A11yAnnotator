<!-- SC 1.4.1 | positive | selected-row-highlight-color-only | the selected table row is distinguished from others ONLY by a background highlight (#e8f0fe); no checkmark cell, no bold, no border, no "selected" text. Row selection = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected row by highlight color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 16px; text-align: left; border-bottom: 1px solid #e0e0e0; }
  /* The selected row's ONLY differentiator is its background tint. Same text,
     same weight, no leading checkmark, no border emphasis. Selection = color. */
  tr[aria-selected="true"] td { background: #e8f0fe; }
</style>
</head>
<body>
  <p>Click a row to select it.</p>
  <table>
    <thead><tr><th>File</th><th>Size</th></tr></thead>
    <tbody>
      <tr><td>report.pdf</td><td>2.1 MB</td></tr>
      <tr aria-selected="true"><td>budget.xlsx</td><td>540 KB</td></tr>
      <tr><td>notes.txt</td><td>4 KB</td></tr>
    </tbody>
  </table>
</body>
</html>
