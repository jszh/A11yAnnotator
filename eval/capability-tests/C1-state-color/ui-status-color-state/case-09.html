<!-- SC 1.4.1 | positive | calendar-current-day-color-only | today's date cell is distinguished from other days ONLY by a blue background fill (#1a73e8 with white text); no ring/border, no "Today" label, no bold, no shape. Current-day status = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current calendar day by color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  table.cal { border-collapse: collapse; font-size: 14px; }
  td { width: 36px; height: 36px; text-align: center; color: #202124; }
  /* "Today" is signaled solely by filling the cell blue. No outline ring, no
     "Today" caption, no bold weight, no different shape. State = color only. */
  td[aria-current="date"] { background: #1a73e8; color: #fff; }
</style>
</head>
<body>
  <p>Today is highlighted in blue.</p>
  <table class="cal">
    <tr><td>10</td><td>11</td><td>12</td></tr>
    <tr><td>13</td><td aria-current="date">14</td><td>15</td></tr>
    <tr><td>16</td><td>17</td><td>18</td></tr>
  </table>
</body>
</html>
