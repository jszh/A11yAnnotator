<!-- SC 1.4.1 | negative | selected-with-bold-and-underline | the selected list row is tinted AND its text becomes bold with an underline; unselected rows are normal weight. The font-weight + underline are non-color cues conveying selection, surviving grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected row with bold and underline</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 16px; text-align: left; border-bottom: 1px solid #e0e0e0; }
  /* The selected row gets a tint PLUS bold, underlined text. Weight + underline
     are color-independent, so the selected row stays distinguishable in
     grayscale. */
  tr[aria-selected="true"] td {
    background: #e8f0fe; font-weight: 700; text-decoration: underline;
  }
</style>
</head>
<body>
  <table>
    <thead><tr><th>File</th><th>Size</th></tr></thead>
    <tbody>
      <tr><td>report.pdf</td><td>2.1 MB</td></tr>
      <tr aria-selected="true"><td>budget.xlsx</td><td>540 KB</td></tr>
      <tr><td>notes.txt</td><td>4 KB</td></tr>
    </tbody>
  </table>
</body>
</html>
