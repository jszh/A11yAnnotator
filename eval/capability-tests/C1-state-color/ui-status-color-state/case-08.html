<!-- SC 1.4.1 | positive | step-complete-color-only | in a progress stepper, completed steps differ from upcoming steps ONLY by circle fill color (green #34a853 vs grey #cccccc); no checkmark inside, no "Done" text, no shape change. Completion status = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Completed step by color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  ol.steps { list-style: none; display: flex; gap: 32px; padding: 0; }
  ol.steps li { text-align: center; font-size: 13px; color: #5f6368; }
  .dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: #cccccc;          /* upcoming step color */
    margin: 0 auto 6px;
  }
  /* A completed step's dot turns green. There is NO tick mark drawn inside it,
     no "✓", no "complete" label. Completion is conveyed by fill color alone. */
  li[data-state="complete"] .dot { background: #34a853; }
</style>
</head>
<body>
  <ol class="steps">
    <li data-state="complete"><span class="dot"></span>Cart</li>
    <li data-state="complete"><span class="dot"></span>Shipping</li>
    <li data-state="upcoming"><span class="dot"></span>Payment</li>
  </ol>
</body>
</html>
