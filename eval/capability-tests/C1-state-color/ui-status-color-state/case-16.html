<!-- SC 1.4.1 | negative | color-plus-aria-and-visible-glyph | today's calendar cell is blue AND has a visible onscreen "•" dot glyph beneath the number plus a bordered ring; aria-current is present too. The visible glyph + ring convey "today" without color, surviving grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Current calendar day with glyph and ring</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  table.cal { border-collapse: collapse; font-size: 14px; }
  td { width: 40px; height: 40px; text-align: center; color: #202124; position: relative; }
  /* Today: blue fill, but ALSO a 2px solid ring AND a visible "•" marker drawn
     below the date number. Both are onscreen non-color cues, so "today" is
     identifiable in grayscale. aria-current additionally exposes it to AT. */
  td[aria-current="date"] {
    background: #1a73e8; color: #fff;
    box-shadow: inset 0 0 0 2px #0b57d0; border-radius: 4px;
  }
  td[aria-current="date"]::after {
    content: "\2022"; position: absolute; bottom: 2px; left: 0; right: 0;
    font-size: 10px; line-height: 1;
  }
</style>
</head>
<body>
  <p>Today is marked with a dot and a ring.</p>
  <table class="cal">
    <tr><td>10</td><td>11</td><td>12</td></tr>
    <tr><td>13</td><td aria-current="date">14</td><td>15</td></tr>
    <tr><td>16</td><td>17</td><td>18</td></tr>
  </table>
</body>
</html>
