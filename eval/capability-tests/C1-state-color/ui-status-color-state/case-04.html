<!-- SC 1.4.1 | positive | toggle-on-off-color-only | a CSS toggle whose ONLY on/off cue is the track color (green #34a853 on, grey #cccccc off). No on/off text, no icon, and the knob does NOT move (no position cue). On/off = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle on/off by track color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .switch { position: relative; display: inline-block; width: 52px; height: 28px; vertical-align: middle; }
  .switch input { position: absolute; opacity: 0; }
  .track {
    position: absolute; inset: 0;
    background: #cccccc;          /* OFF track color */
    border-radius: 14px;
  }
  .knob {
    position: absolute; top: 4px; left: 4px;   /* fixed position in BOTH states */
    width: 20px; height: 20px; background: #fff; border-radius: 50%;
  }
  /* When checked, ONLY the track color changes. The knob stays put (no position
     cue), there is no ON/OFF text and no icon. State = color only. */
  .switch input:checked + .track { background: #34a853; }   /* ON track color */
</style>
</head>
<body>
  <p>Notifications</p>
  <label class="switch">
    <input type="checkbox" checked aria-label="Notifications">
    <span class="track"></span>
    <span class="knob"></span>
  </label>
</body>
</html>
