<!-- SC 1.4.1 | negative (EXEMPTION) | color-is-decorative-no-info | the hovered card merely darkens its background as a decorative affordance; no STATUS/SELECTION/validity is conveyed by that color change (it carries no information). 1.4.1 only applies when color CONVEYS information, so a purely decorative hover tint is exempt. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decorative hover tint, no information conveyed</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .card {
    width: 260px; padding: 16px; border: 1px solid #dadce0; border-radius: 8px;
    font-size: 14px; color: #202124; background: #fff;
  }
  /* The hover tint is a decorative pointer affordance only. It does not encode
     any status, selection, validity, or required-ness — no information is being
     conveyed by the color — so SC 1.4.1 does not apply (exempt). */
  .card:hover { background: #f8f9fa; }
</style>
</head>
<body>
  <a class="card" href="#article">
    <strong>Quarterly results</strong>
    <p>Read the summary of this quarter's figures.</p>
  </a>
</body>
</html>
