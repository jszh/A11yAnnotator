<!-- SC 1.4.1 | negative | required-with-text-required-label | required fields are marked with an onscreen "(required)" text token (and a red asterisk that is itself accompanied by the word). Required-ness is conveyed by text regardless of color, surviving grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Required fields with text marker</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #202124; }
  .req { color: #d93025; }
  /* The asterisk is red, but it is paired with the explicit onscreen word
     "(required)" so the required state does not depend on color. */
  input { font-size: 15px; padding: 8px 10px; border: 1px solid #5f6368; border-radius: 4px; width: 240px; }
</style>
</head>
<body>
  <form>
    <label for="nm">Full name <span class="req" aria-hidden="true">*</span> (required)</label>
    <input id="nm" type="text" required>
    <label for="cmp">Company</label>
    <input id="cmp" type="text">
  </form>
</body>
</html>
