<!-- SC 1.4.1 | negative | color-plus-text-label-every-state | selected chip is blue AND carries an onscreen "Selected" text token; unselected chips have no such token. The text label conveys selection without color in every state, so it passes grayscale. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected chip with text label</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 15px; color: #202124; background: #e8eaed;
    border-radius: 16px; padding: 8px 14px; margin-right: 8px;
  }
  .chip[aria-selected="true"] { color: #fff; background: #1a73e8; }
  .tag { display: none; font-size: 11px; text-transform: uppercase; }
  /* The selected chip ALSO shows an onscreen "Selected" text token. Even in
     grayscale the selected chip is identifiable by its visible label. */
  .chip[aria-selected="true"] .tag { display: inline; }
</style>
</head>
<body>
  <div role="listbox" aria-label="Category">
    <span class="chip" role="option" aria-selected="false">News</span>
    <span class="chip" role="option" aria-selected="true">Sport <span class="tag">Selected</span></span>
    <span class="chip" role="option" aria-selected="false">Tech</span>
  </div>
</body>
</html>
