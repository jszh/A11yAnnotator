<!-- SC 1.4.1 | positive | selected-chip-color-only | selected filter chip differs from unselected ONLY by fill color (#1a73e8 vs #e8eaed); no checkmark, no border-shape change, no text delta. State conveyed by color alone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected chip by color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  .chip {
    display: inline-block;
    font-size: 15px;
    color: #202124;
    background: #e8eaed;        /* unselected fill */
    border-radius: 16px;
    padding: 8px 16px;
    margin-right: 8px;
  }
  /* The ONLY thing that changes when selected is the fill color.
     No tick, no shape change, no label change. Selection = color only. */
  .chip[aria-selected="true"] {
    color: #fff;
    background: #1a73e8;        /* selected fill — the sole differentiator */
  }
</style>
</head>
<body>
  <p>Pick a category. The selected one is shown in blue.</p>
  <div role="listbox" aria-label="Category">
    <span class="chip" role="option" aria-selected="false">News</span>
    <span class="chip" role="option" aria-selected="true">Sport</span>
    <span class="chip" role="option" aria-selected="false">Tech</span>
  </div>
</body>
</html>
