<!-- SC 1.4.1 | positive | valid-invalid-field-color-only | the invalid field signals its error state ONLY by a red border (#d93025); no error icon, no error message, no text. Validity = color only. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invalid field by border color only</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 40px; }
  label { display: block; margin: 4px 0; font-size: 14px; }
  input {
    font-size: 15px;
    padding: 8px 10px;
    border: 2px solid #5f6368;   /* neutral border */
    border-radius: 4px;
    width: 240px;
  }
  /* Invalid state changes ONLY the border color to red.
     No icon, no helper/error text, no border-style change. */
  input[aria-invalid="true"] {
    border-color: #d93025;       /* the sole error signal */
  }
</style>
</head>
<body>
  <form>
    <label for="em">Email</label>
    <input id="em" type="email" value="not-an-email" aria-invalid="true">
  </form>
</body>
</html>
