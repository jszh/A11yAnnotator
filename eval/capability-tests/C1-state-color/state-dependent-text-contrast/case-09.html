<!-- SC 1.4.3 | positive | composite-alpha-text-in-state | text rgba(0,0,0,0.45) over #ffffff composites to #8c8c8c = 3.363:1 in :hover (rest opaque #1a1a1a = 17.4:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composite alpha text in hover</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .note {
    font-size: 16px;
    color: #1a1a1a;            /* rest: opaque, 17.40:1 PASS */
    background: #ffffff;
  }
  .note:hover {
    color: rgba(0, 0, 0, 0.45); /* hover: composites to #8c8c8c over white = 3.363:1 FAIL */
  }
</style>
</head>
<body>
  <p>Hover the paragraph; the text becomes semi-transparent and composites to low contrast.</p>
  <p class="note">This account note explains your current billing cycle in detail.</p>
</body>
</html>
