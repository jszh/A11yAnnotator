<!-- SC 1.4.3 | positive | rest-pass-hover-fail | normal text #8a8a8a on #ffffff = 3.45:1 in :hover (rest #1a1a1a = 17.4:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rest pass, hover fail</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .menu-item {
    display: inline-block;
    font-size: 16px;
    color: #1a1a1a;            /* rest: 17.40:1 PASS */
    background: #ffffff;
    padding: 8px 16px;
    text-decoration: none;
    cursor: pointer;
  }
  .menu-item:hover {
    color: #8a8a8a;            /* hover: 3.45:1 FAIL (normal needs 4.5:1) */
  }
</style>
</head>
<body>
  <p>Hover the navigation item to see its text fade to low contrast.</p>
  <nav>
    <a href="#products" class="menu-item">Products</a>
  </nav>
</body>
</html>
