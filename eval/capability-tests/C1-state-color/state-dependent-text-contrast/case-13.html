<!-- SC 1.4.3 | negative | passes-every-state | text #1a1a1a on #ffffff = 17.4:1 in rest AND every interactive state -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passes every state</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .item {
    display: inline-block;
    font-size: 16px;
    color: #1a1a1a;            /* 17.40:1 in every state */
    background: #ffffff;
    padding: 8px 16px;
    text-decoration: none;
  }
  /* Hover/focus/active only change the background subtly; text stays dark on light. */
  .item:hover  { background: #f3f4f6; }   /* 1a1a1a stays well above 4.5:1 */
  .item:focus  { background: #eef2ff; outline: 2px solid #1a5fc4; }
  .item:active { background: #e5e7eb; }
</style>
</head>
<body>
  <p>Hover, focus, and press the link; text contrast holds in all states.</p>
  <a href="#ok" class="item">Account settings</a>
</body>
</html>
