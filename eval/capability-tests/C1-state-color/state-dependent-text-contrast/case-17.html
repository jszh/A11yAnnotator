<!-- SC 1.4.3 | negative | large-text-3to1-holds | LARGE bold (19px bold) #767676 (4.54:1) -> #8a8a8a on #ffffff = 3.452:1 in :hover, still PASS for large -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Large text 3:1 holds in state</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .price {
    font-size: 19px;           /* >= 14pt bold counts as large text */
    font-weight: 700;
    color: #767676;            /* rest: 4.542:1 PASS */
    background: #ffffff;
    cursor: pointer;
  }
  .price:hover {
    color: #8a8a8a;            /* hover: 3.452:1 -> still PASS for large (>= 3:1) */
  }
</style>
</head>
<body>
  <p>Hover the bold large price; even on hover it stays above the 3:1 large-text threshold.</p>
  <a href="#price" class="price">$49 / month</a>
</body>
</html>
