<!-- SC 1.4.3 | positive(abstain) | rest-pass-hover-fail-over-gradient | white text over a CSS linear-gradient on :hover; at the light end (#c0d8f5) ratio is 1.46:1 FAIL. Flat-color reducer must ABSTAIN. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>White text over gradient on hover</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .banner {
    display: inline-block;
    font-size: 16px;
    color: #ffffff;            /* white text */
    background: #1a5fc4;       /* rest: solid, white = 6.04:1 PASS */
    padding: 12px 24px;
    border-radius: 6px;
    text-decoration: none;
  }
  /* On hover the background becomes a left-to-right gradient that runs very
     light at one end (#c0d8f5 -> white text = 1.46:1 FAIL there). A flat-color
     reducer cannot pick a single bg color, so it should ABSTAIN; truth is FAIL. */
  .banner:hover {
    background: linear-gradient(90deg, #0a3d8f 0%, #c0d8f5 100%);
  }
</style>
</head>
<body>
  <p>Hover the banner; the hover gradient runs too light at one end for the white text.</p>
  <a href="#promo" class="banner">Limited time offer</a>
</body>
</html>
