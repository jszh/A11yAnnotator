<!-- SC 1.4.3 | negative | near-threshold-large-stays-pass-3.1 | LARGE text (24px) #595959 (7.0:1) -> #909090 on #ffffff = 3.193:1 in :hover, just over 3:1 PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near-threshold large stays pass</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .heading {
    font-size: 24px;           /* large text -> 3:1 threshold applies */
    color: #595959;            /* rest: 7.00:1 PASS */
    background: #ffffff;
    cursor: pointer;
  }
  .heading:hover {
    color: #909090;            /* hover: 3.193:1 PASS for large text (just over 3:1) */
  }
</style>
</head>
<body>
  <p>Hover the large heading; it stays just above the 3:1 large-text threshold.</p>
  <a href="#sec" class="heading">Section overview</a>
</body>
</html>
