<!-- SC 1.4.3 | negative(exempt) | disabled-state-low-contrast-EXEMPT | :disabled label #999999 on #ffffff = 2.849:1 FAIL by ratio, but disabled/inactive text is EXEMPT from 1.4.3 -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disabled state is exempt</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .btn {
    font-size: 16px;
    color: #1a1a1a;            /* enabled: 17.40:1 PASS */
    background: #ffffff;
    border: 1px solid #1a1a1a;
    padding: 10px 18px;
  }
  /* Disabled/inactive control: low contrast, but 1.4.3 exempts inactive UI text. */
  .btn:disabled {
    color: #999999;            /* disabled: 2.849:1 (low) BUT exempt */
    border-color: #cccccc;
  }
</style>
</head>
<body>
  <p>The disabled button text is intentionally dimmed; inactive controls are exempt from 1.4.3.</p>
  <button type="button" class="btn" disabled>Submit (unavailable)</button>
</body>
</html>
