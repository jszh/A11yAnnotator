<!-- SC 1.4.3 | positive | focus-style-low-contrast | normal text #999999 on #ffffff = 2.85:1 in :focus (rest #595959 = 7.0:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus style low contrast</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .field-label {
    display: block;
    font-size: 16px;
    color: #595959;            /* rest: 7.00:1 PASS */
    background: #ffffff;
    margin-bottom: 4px;
  }
  input { font-size: 16px; padding: 6px; }
  /* When the field group receives focus, the designer "dims" the label. */
  .field:focus-within .field-label {
    color: #999999;            /* focus: 2.85:1 FAIL */
  }
</style>
</head>
<body>
  <p>Focus the input; the label text dims to low contrast on focus.</p>
  <div class="field">
    <label class="field-label" for="email">Email address</label>
    <input id="email" type="text">
  </div>
</body>
</html>
