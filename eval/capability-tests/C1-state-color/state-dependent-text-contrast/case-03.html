<!-- SC 1.4.3 | positive | active-pressed-low-contrast | normal text #9a9a9a on #e5e7eb = 2.27:1 in :active (rest #595959 on #ffffff = 7.0:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active pressed low contrast</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .btn {
    font-size: 16px;
    color: #595959;            /* rest: 7.00:1 PASS on white */
    background: #ffffff;
    border: 1px solid #cccccc;
    padding: 10px 18px;
    cursor: pointer;
  }
  .btn:active {
    color: #9a9a9a;            /* active label */
    background: #e5e7eb;       /* pressed surface; 9a9a9a on e5e7eb = 2.27:1 FAIL */
  }
</style>
</head>
<body>
  <p>Press and hold the button; the pressed (active) label drops below 4.5:1.</p>
  <button type="button" class="btn">Save changes</button>
</body>
</html>
