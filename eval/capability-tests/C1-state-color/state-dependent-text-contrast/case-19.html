<!-- SC 1.4.3 | negative | hover-darkens-improves-contrast | text #757575 (4.608:1, rest pass) -> #1a1a1a on #ffffff = 17.4:1 in :hover (improves) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover darkens improves contrast</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .link {
    font-size: 16px;
    color: #757575;            /* rest: 4.608:1 PASS (just over) */
    background: #ffffff;
    text-decoration: underline;
  }
  .link:hover {
    color: #1a1a1a;            /* hover: 17.40:1 -> contrast IMPROVES */
  }
</style>
</head>
<body>
  <p>Hover the link; the text darkens and contrast only improves.</p>
  <a href="#x" class="link">Continue reading</a>
</body>
</html>
