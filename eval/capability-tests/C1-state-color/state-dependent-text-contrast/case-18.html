<!-- SC 1.4.3 | negative | visited-color-change-still-passes | a:visited #7a5fb0 on #ffffff = 5.133:1, still PASS for normal text (>= 4.5:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited color change still passes</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .ref {
    font-size: 16px;
    color: #1a5fc4;            /* unvisited: 6.04:1 PASS */
    background: #ffffff;
    text-decoration: underline;
  }
  .ref:visited {
    color: #7a5fb0;            /* visited: 5.133:1 -> still PASS (>= 4.5:1) */
  }
</style>
</head>
<body>
  <p>This visited link recolors to a medium purple and stays a readable contrast.</p>
  <a href="https://example.com/archive" class="ref">View the archived article</a>
</body>
</html>
