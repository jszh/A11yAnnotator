<!-- SC 1.4.3 | positive | toggle-on-state-low-contrast | normal text #8a8a8a on #ffffff = 3.45:1 in checked/toggled-on state (rest #1a1a1a = 17.4:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle-on state low contrast</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .switch-text {
    font-size: 16px;
    color: #1a1a1a;            /* off/rest: 17.40:1 PASS */
    background: #ffffff;
  }
  input.sw { position: absolute; opacity: 0; }
  /* Toggled ON: the "enabled" caption is rendered in a muted color. */
  input.sw:checked ~ .switch-text {
    color: #8a8a8a;            /* on: 3.45:1 FAIL */
  }
  .sw-label { display: block; }
</style>
</head>
<body>
  <p>Check the toggle; the status caption switches to a muted, low-contrast color.</p>
  <input class="sw" type="checkbox" id="sw8">
  <label class="sw-label" for="sw8">Enable notifications</label>
  <p class="switch-text">Notifications are currently enabled for this account.</p>
</body>
</html>
