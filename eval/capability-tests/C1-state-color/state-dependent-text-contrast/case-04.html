<!-- SC 1.4.3 | positive | checked-label-low-contrast | white #ffffff text on #9ca3af checked bg = 2.54:1 (rest: #1a1a1a on #ffffff = 17.4:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checked label low contrast</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .chip {
    display: inline-block;
    font-size: 16px;
    color: #1a1a1a;            /* rest: 17.40:1 PASS on white */
    background: #ffffff;
    border: 1px solid #9ca3af;
    border-radius: 14px;
    padding: 6px 14px;
    cursor: pointer;
  }
  input.toggle { position: absolute; opacity: 0; }
  /* When the radio is checked, the chip becomes a filled "selected" pill. */
  input.toggle:checked + .chip {
    color: #ffffff;            /* white text */
    background: #9ca3af;       /* fff on 9ca3af = 2.54:1 FAIL */
  }
</style>
</head>
<body>
  <p>Select the filter chip; the checked (selected) label drops below 4.5:1.</p>
  <input class="toggle" type="radio" name="filter" id="f1">
  <label class="chip" for="f1">In stock</label>
</body>
</html>
