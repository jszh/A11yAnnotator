<!-- SC 1.4.3 | positive | near-threshold-large-2.9-in-state | LARGE text (24px) #959595 on #ffffff = 2.995:1 in :hover (just under 3:1, rest #1a1a1a = 17.4:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Near-threshold large in hover</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .promo {
    font-size: 24px;           /* large text -> 3:1 threshold applies */
    color: #1a1a1a;            /* rest: 17.40:1 PASS */
    background: #ffffff;
    cursor: pointer;
  }
  .promo:hover {
    color: #959595;            /* hover: 2.995:1 FAIL (just under 3:1 for large) */
  }
</style>
</head>
<body>
  <p>Hover the large heading; it drops just under the 3:1 large-text threshold.</p>
  <a href="#sale" class="promo">Summer sale &mdash; 30% off</a>
</body>
</html>
