<!-- SC 1.4.3 | negative(exempt) | visited-link-low-contrast-EXCEPTED | a:visited #b9a3dd on #ffffff = 2.247:1 FAIL by ratio, but a visited-link color change is EXCEPTED by 1.4.3 -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited low-contrast is excepted</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .cite {
    font-size: 16px;
    color: #1a5fc4;            /* unvisited: 6.04:1 PASS */
    background: #ffffff;
    text-decoration: underline;
  }
  .cite:visited {
    color: #b9a3dd;            /* visited: pale purple = 2.247:1 (low) BUT excepted by 1.4.3 */
  }
</style>
</head>
<body>
  <p>After visiting, this link turns a pale purple with low contrast &mdash; but a
     visited-link color change is explicitly EXCEPTED from SC 1.4.3.</p>
  <a href="https://example.com/older-post" class="cite">Read the older post</a>
</body>
</html>
