<!-- SC 1.4.3 | positive | rest-pass-hover-fail (white-on-lightening-bg) | white #ffffff on #5a8de0 = 3.322:1 in :hover (rest white on #1a5fc4 = 6.04:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tag text on lightening hover bg</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .tag {
    display: inline-block;
    font-size: 16px;
    color: #ffffff;            /* white text, normal size -> 4.5:1 threshold */
    background: #1a5fc4;       /* rest: 6.04:1 PASS */
    padding: 4px 12px;
    border-radius: 4px;
    text-decoration: none;
  }
  .tag:hover {
    background: #5a8de0;       /* hover: white on 5a8de0 = 3.322:1 FAIL for normal text */
  }
</style>
</head>
<body>
  <p>Hover the tag; the lighter hover background fails 4.5:1 for the white normal-size label.</p>
  <a href="#tag" class="tag">Featured</a>
</body>
</html>
