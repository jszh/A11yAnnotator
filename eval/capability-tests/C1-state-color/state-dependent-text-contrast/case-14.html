<!-- SC 1.4.3 | negative | state-change-stays-above-threshold | text changes #595959 (7.0:1) -> #707070 on #ffffff = 4.952:1 in :hover, still PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>State change stays above threshold</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .link {
    font-size: 16px;
    color: #595959;            /* rest: 7.00:1 PASS */
    background: #ffffff;
    text-decoration: underline;
  }
  .link:hover {
    color: #707070;            /* hover: 4.952:1 still PASS (>= 4.5:1) */
  }
</style>
</head>
<body>
  <p>Hover the link; the color shifts but stays above 4.5:1.</p>
  <a href="#doc" class="link">Download the guide</a>
</body>
</html>
