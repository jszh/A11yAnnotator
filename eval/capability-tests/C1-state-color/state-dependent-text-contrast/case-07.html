<!-- SC 1.4.3 | positive | white-text-on-lightening-hover-bg | white #ffffff on #7fb3f0 = 2.186:1 in :hover (rest white on #1a5fc4 = 6.04:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>White text on lightening hover bg</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; margin: 40px; }
  .cta {
    display: inline-block;
    font-size: 16px;
    color: #ffffff;            /* white text */
    background: #1a5fc4;       /* rest: white on 1a5fc4 = 6.04:1 PASS */
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
  }
  .cta:hover {
    background: #7fb3f0;       /* hover lightens bg; white on 7fb3f0 = 2.186:1 FAIL */
  }
</style>
</head>
<body>
  <p>Hover the button; the background lightens and the white label loses contrast.</p>
  <a href="#buy" class="cta">Add to cart</a>
</body>
</html>
