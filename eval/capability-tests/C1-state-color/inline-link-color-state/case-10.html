<!-- SC 1.4.1 | positive | hover-only-cue-not-onscreen-at-rest-and-focus | the ONLY non-color cue (underline) appears solely on :hover; rest and keyboard :focus are color-only (#1a5fb4 vs body 2.768:1). Mouse-over-only cue is not an onscreen substitute per TT 13.A -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underline only on hover, color-only otherwise</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a5fb4;              /* vs body 2.768:1 */
    text-decoration: none;       /* rest: no cue */
    outline: none;
  }
  a.body-link:hover {
    text-decoration: underline;  /* cue appears ONLY on mouse hover */
  }
  a.body-link:focus {
    text-decoration: none;       /* keyboard focus has NO cue -> color only */
    outline: none;
  }
</style>
</head>
<body>
  <p>Volunteers staff the front desk on weekends. If you would like to help, send
  a note through the <a href="/volunteer" class="body-link">volunteer sign-up
  page</a>, and the coordinator will reply with the next orientation date.</p>
</body>
</html>
