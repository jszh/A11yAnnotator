<!-- SC 1.4.1 | positive | underline-removed-on-hover-and-focus | rest underlined, BOTH :hover and :focus drop the underline; color #0d6efd vs body #1a1a1a = 3.867:1 but in the interactive states the cue is gone -> color-only -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underline removed on hover and focus</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #0d6efd;              /* vs body 3.867:1 */
    text-decoration: underline;  /* rest OK */
  }
  a.body-link:hover,
  a.body-link:focus {
    text-decoration: none;       /* both interactive states drop the only cue */
    outline: none;
  }
</style>
</head>
<body>
  <p>The garden tours run every Saturday through October. Spaces fill quickly, so
  please <a href="/booking" class="body-link">book a guided walk in advance</a>
  and bring sturdy shoes for the gravel paths near the pond.</p>
</body>
</html>
