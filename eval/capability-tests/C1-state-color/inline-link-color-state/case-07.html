<!-- SC 1.4.1 | positive | focus-removes-bold-leaving-color-only | rest cue = bold (font-weight 700), but :focus sets font-weight:400 AND no underline -> in focus state only color #1a73e8 distinguishes the link -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus removes bold leaving color only</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* vs body 3.863:1 */
    font-weight: 700;            /* rest: bold is the non-color cue */
    text-decoration: none;
  }
  a.body-link:focus {
    font-weight: 400;            /* focus: bold removed */
    text-decoration: none;       /* and no underline -> color ONLY in focus state */
    outline: none;
  }
</style>
</head>
<body>
  <p>Applications opened on Monday and close at the end of the month. To begin,
  download the <a href="/form" class="body-link">official application form</a>
  and gather two references before the portal locks for review.</p>
</body>
</html>
