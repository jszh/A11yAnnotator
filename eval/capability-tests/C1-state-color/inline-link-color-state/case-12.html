<!-- SC 1.4.1 | positive | hover-cue-rendered-via-background-image | rest underlined; :hover removes text-decoration and instead paints an underline-like stripe via a background-image gradient. A static DOM/CSS analyzer cannot resolve whether the image actually renders a perceivable underline -> ABSTAIN. Link #1a73e8 vs body 3.863:1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover cue via background image</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* vs body 3.863:1 */
    text-decoration: underline;
  }
  a.body-link:hover {
    text-decoration: none;       /* real underline removed */
    /* an image-based stripe is layered behind the text; whether it visibly
       reads as an underline cannot be determined from the DOM alone */
    background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==');
    background-repeat: repeat-x;
    background-position: 0 1.15em;
    background-size: 1px 1px;
  }
</style>
</head>
<body>
  <p>The library extended its hours for exam week. Students can reserve a quiet
  room through the <a href="/rooms" class="body-link">study-room booking
  system</a>, and the desk staff will hold any printouts until closing.</p>
</body>
</html>
