<!-- SC 1.4.1 | negative | underline-persists-color-also-shifts-on-hover | underline present in rest/hover/focus; the hover also darkens the color, but since the underline (non-color cue) never disappears the link is always distinguishable by a non-color means -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover darkens color but underline persists</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;
    text-decoration: underline;
  }
  a.body-link:hover,
  a.body-link:focus {
    color: #0d47a1;              /* color changes on hover/focus */
    text-decoration: underline;  /* but underline stays -> non-color cue always present */
  }
</style>
</head>
<body>
  <p>The science fair entries are judged on Friday afternoon. Parents who want to
  attend should review the <a href="/visitor" class="body-link">visitor
  guidelines for the gymnasium</a> so the aisles stay clear for the judges.</p>
</body>
</html>
