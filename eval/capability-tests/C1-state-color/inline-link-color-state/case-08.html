<!-- SC 1.4.1 | positive | color-only-and-link-color-matches-body-on-visited | NO underline ever; visited color #222222 matches body #1a1a1a (1.094:1) so a visited link is indistinguishable; rest color #1a5fb4 is 2.768:1 (already <3:1) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited link color matches body, no cue</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a5fb4;              /* rest vs body 2.768:1, NO underline */
    text-decoration: none;
  }
  a.body-link:visited {
    color: #222222;              /* visited vs body #1a1a1a = 1.094:1 -> blends into text */
    text-decoration: none;
  }
</style>
</head>
<body>
  <p>The author's earlier essays are collected in a single volume. Once you have
  visited the <a href="/essays" class="body-link">complete list of essays</a>,
  the entry turns the same shade as this paragraph and disappears from view.</p>
</body>
</html>
