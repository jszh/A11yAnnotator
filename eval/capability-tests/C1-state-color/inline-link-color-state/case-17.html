<!-- SC 1.4.1 | negative | visited-color-change-is-browser-setting-not-a-failure | underline persists in EVERY state (rest/hover/focus/visited); only the COLOR shifts to purple #6c2bd9 on :visited. Per TT 13.A a visited link changing color is a browser setting and is NOT failed; the non-color cue (underline) is still present in the visited state -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited color change with underline kept</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;
    text-decoration: underline;  /* cue present at rest */
  }
  a.body-link:hover,
  a.body-link:focus {
    text-decoration: underline;  /* cue still present */
  }
  a.body-link:visited {
    color: #6c2bd9;              /* visited COLOR change only (browser-setting style) */
    text-decoration: underline;  /* underline STILL present in visited state -> not a failure */
  }
</style>
</head>
<body>
  <p>The town council posts its agenda the week before each meeting. Residents who
  read the <a href="/agenda" class="body-link">upcoming meeting agenda</a> can
  sign up to speak, and the link simply turns purple after they have opened it.</p>
</body>
</html>
