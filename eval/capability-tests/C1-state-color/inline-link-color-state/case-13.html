<!-- SC 1.4.1 | negative | underline-persists-all-states | text-decoration:underline at rest, hover, focus AND visited -> a non-color cue is present in every state. Link #1a73e8. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Underline persists in all states</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;
    text-decoration: underline;
  }
  a.body-link:hover,
  a.body-link:focus,
  a.body-link:visited {
    text-decoration: underline;  /* cue persists in every state */
    color: #1a73e8;
  }
</style>
</head>
<body>
  <p>The orchestra announced its winter program this week. You can preview the
  <a href="/season" class="body-link">complete concert calendar</a> and choose
  a subscription package that fits the evenings you usually have free.</p>
</body>
</html>
