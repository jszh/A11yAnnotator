<!-- SC 1.4.1 | negative | underline-appears-on-hover-and-focus-with-3to1-color-body212121 | rest color-only but link #1a73e8 vs body #212121 = 3.574:1 (>=3:1) AND underline on BOTH hover and focus -> G183 path satisfied with a different body shade -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G183 path satisfied, body #212121</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #212121; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* vs body #212121 = 3.574:1 (>= 3:1) */
    text-decoration: none;
  }
  a.body-link:hover,
  a.body-link:focus {
    text-decoration: underline;  /* cue on both hover AND focus */
  }
</style>
</head>
<body>
  <p>The transit authority is testing a new weekend schedule this quarter. Riders
  can compare the changes on the <a href="/schedule" class="body-link">revised
  weekend timetable</a> and leave feedback through the comment form below it.</p>
</body>
</html>
