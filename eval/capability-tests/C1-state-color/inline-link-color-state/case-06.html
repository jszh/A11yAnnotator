<!-- SC 1.4.1 | positive | near-3to1-link-vs-text-2.9-no-cue | link #1e63b0 vs body #1a1a1a = 2.873:1 (just under 3:1) and NO underline in any state -> fails G183 3:1 floor AND F73 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline link just under 3:1, no cue</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1e63b0;              /* vs body #1a1a1a = 2.873:1 (just under the 3:1 floor) */
    text-decoration: none;       /* no underline in ANY state */
  }
  a.body-link:hover, a.body-link:focus { text-decoration: none; color: #1e63b0; }
</style>
</head>
<body>
  <p>The trailhead is reached by a gravel road that closes after the first snow.
  Check the <a href="/conditions" class="body-link">current trail conditions</a>
  before you drive up, because the gate is locked once the pass becomes icy.</p>
</body>
</html>
