<!-- SC 1.4.1 | positive | color-only-no-underline-any-state-low-3to1-vs-text | link #1a5fb4 vs body #1a1a1a = 2.768:1 (<3:1) and NO underline in any state -> F73 color-only -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline link color only, under 3:1, no cue</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a5fb4;              /* vs body #1a1a1a = 2.768:1 (<3:1) */
    text-decoration: none;       /* never underlined */
  }
  a.body-link:hover, a.body-link:focus, a.body-link:visited {
    text-decoration: none;       /* still no non-color cue */
    color: #1a5fb4;
  }
</style>
</head>
<body>
  <p>The museum reopens in May with a new exhibit on coastal birds. You can
  <a href="/tickets" class="body-link">reserve a timed entry slot</a> online,
  and members continue to enjoy free admission on weekday mornings.</p>
</body>
</html>
