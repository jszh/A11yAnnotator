<!-- SC 1.4.1 | negative | bold+underline-non-color-cue-every-state | link is bold AND underlined in rest/hover/focus/visited -> two non-color cues persist regardless of color; never color-only -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bold and underline non-color cue every state</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1971c2;
    font-weight: 700;            /* bold persists */
    text-decoration: underline;  /* underline persists */
  }
  a.body-link:hover,
  a.body-link:focus,
  a.body-link:visited {
    font-weight: 700;
    text-decoration: underline;  /* both cues remain in every state */
  }
</style>
</head>
<body>
  <p>The clinic posts walk-in hours every Monday. If you cannot come in person,
  the <a href="/telehealth" class="body-link">telehealth scheduling desk</a>
  can arrange a video visit, and a nurse will call to confirm the time.</p>
</body>
</html>
