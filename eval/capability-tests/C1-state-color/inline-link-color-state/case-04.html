<!-- SC 1.4.1 | positive | visited-collapses-to-body-color | underlined at rest, but :visited sets color #222222 (vs body #1a1a1a = 1.094:1) AND removes underline -> link vanishes into body text in visited state -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited link collapses to body color</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* rest vs body 3.863:1, underlined -> ok at rest */
    text-decoration: underline;
  }
  a.body-link:visited {
    color: #222222;              /* visited vs body #1a1a1a = 1.094:1 (effectively same) */
    text-decoration: none;       /* AND no underline -> no cue at all in visited state */
  }
</style>
</head>
<body>
  <p>Last year's schedule is archived for reference. If you already opened the
  <a href="/archive" class="body-link">previous season's program</a>, it now
  looks identical to the body text, so returning visitors cannot find it again.</p>
</body>
</html>
