<!-- SC 1.4.1 | positive | underline-removed-on-focus | underlined at rest, :focus removes underline; keyboard focus state is color-only; link #1a73e8 vs body #1a1a1a = 3.863:1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline link underline removed on focus</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* vs body 3.863:1 */
    text-decoration: underline;  /* rest: cue present */
    outline: none;
  }
  a.body-link:focus {
    text-decoration: none;       /* focus: underline removed, no outline -> color ONLY */
    outline: none;
  }
</style>
</head>
<body>
  <p>Our return policy changed in January. To request a refund you must read the
  <a href="/terms" class="body-link">updated terms of service</a> and confirm
  the order number from your receipt within thirty days of delivery.</p>
</body>
</html>
