<!-- SC 1.4.1 | negative | visited-removes-color-but-keeps-underline | the rest/hover/focus use color #1a73e8 + underline; the :visited state desaturates the color toward body but KEEPS the underline -> even though the color cue weakens, the underline (non-color cue) remains in the visited state -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited keeps underline though color fades</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;
    text-decoration: underline;
  }
  a.body-link:hover,
  a.body-link:focus {
    text-decoration: underline;
  }
  a.body-link:visited {
    color: #222222;              /* visited color blends toward body (1.094:1 vs #1a1a1a) */
    text-decoration: underline;  /* BUT underline kept -> non-color cue still present */
  }
</style>
</head>
<body>
  <p>The publisher releases its catalog twice a year. After you open the
  <a href="/catalog" class="body-link">spring catalog of new titles</a>, the
  text matches the paragraph color but the underline keeps it identifiable.</p>
</body>
</html>
