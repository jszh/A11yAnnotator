<!-- SC 1.4.1 | negative | visited-color-change-is-browser-setting-not-a-failure | bold is the non-color cue and persists in all states INCLUDING :visited; only the color changes to #7b2fbe on visited. Visited color change alone = browser setting per TT 13.A, and the bold cue remains -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visited color change with bold kept</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1971c2;
    font-weight: 700;            /* bold is the non-color cue */
    text-decoration: none;
  }
  a.body-link:hover,
  a.body-link:focus {
    font-weight: 700;            /* bold persists */
  }
  a.body-link:visited {
    color: #7b2fbe;              /* visited color change only */
    font-weight: 700;            /* bold STILL present in visited state */
  }
</style>
</head>
<body>
  <p>The bakery rotates its specials every weekend. Members who check the
  <a href="/specials" class="body-link">weekly specials list</a> get first pick,
  and the entry only changes color once they have already viewed it.</p>
</body>
</html>
