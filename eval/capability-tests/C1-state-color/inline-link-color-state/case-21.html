<!-- SC 1.4.1 | negative | dotted-underline-border-cue-every-state | the non-color cue is a border-bottom (dotted) that persists in rest/hover/focus/visited; color may change but the bottom border is always present -> non-color cue in every state -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Border-bottom cue persists in all states</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;
    text-decoration: none;
    border-bottom: 2px dotted #1a73e8;  /* non-color cue: a dotted underline-like border */
  }
  a.body-link:hover,
  a.body-link:focus,
  a.body-link:visited {
    border-bottom: 2px dotted currentColor;  /* border persists in every state */
  }
</style>
</head>
<body>
  <p>The community garden assigns plots each February by lottery. To enter, fill
  out the <a href="/lottery" class="body-link">plot lottery registration</a>
  and indicate whether you can help maintain the shared compost area.</p>
</body>
</html>
