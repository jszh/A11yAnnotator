<!-- SC 1.4.1 | positive | hover-color-shifts-but-still-color-only | no underline in any state; hover merely changes the hue (#1a5fb4 -> #0b5cad), so the differentiator is still color only -> F73 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover shifts color but stays color-only</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a5fb4;              /* vs body 2.768:1, no underline */
    text-decoration: none;
  }
  a.body-link:hover {
    color: #0b5cad;              /* vs body 2.609:1 -> still just a color change, no cue */
    text-decoration: none;
  }
</style>
</head>
<body>
  <p>The recipe calls for two cups of stock, but you can substitute water if you
  prefer a lighter broth. For the spice blend, follow the
  <a href="/spices" class="body-link">measurements in our pantry guide</a> and
  adjust the salt to taste at the very end.</p>
</body>
</html>
