<!-- SC 1.4.1 | negative | link-in-nav-not-embedded-in-text-block | G183/F73 apply to links inside a BLOCK OF TEXT. This <a> is a standalone item in a <nav> list, not embedded mid-sentence, and is distinguished by layout (list position, padding) -> out of scope for the inline-link rule -> PASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standalone nav link, not embedded in text</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  nav ul { list-style: none; padding: 0; display: flex; gap: 24px; border-bottom: 2px solid #cccccc; }
  nav a.nav-link {
    color: #1a5fb4;              /* color-only, but this is NOT in a block of text */
    text-decoration: none;
    padding: 12px 4px;
    display: inline-block;
  }
</style>
</head>
<body>
  <nav aria-label="Primary">
    <ul>
      <li><a href="/home" class="nav-link">Home</a></li>
      <li><a href="/about" class="nav-link">About</a></li>
      <li><a href="/contact" class="nav-link">Contact</a></li>
    </ul>
  </nav>
  <p>Welcome to the site. Use the navigation above to move between sections.</p>
</body>
</html>
