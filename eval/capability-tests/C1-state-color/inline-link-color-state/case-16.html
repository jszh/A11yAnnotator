<!-- SC 1.4.1 | negative | color-diff-ge-3to1-plus-persistent-underline | belt-and-braces: link #0d6efd vs body #1a1a1a = 3.867:1 (>=3:1) AND underline in every state -> passes by both the cue path and the 3:1 path -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3:1 color plus persistent underline</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #0d6efd;              /* vs body 3.867:1 */
    text-decoration: underline;
  }
  a.body-link:hover,
  a.body-link:focus,
  a.body-link:visited {
    text-decoration: underline;  /* underline never removed */
  }
</style>
</head>
<body>
  <p>The festival map is updated daily during the run of the show. Download the
  <a href="/map" class="body-link">printable site map</a> to find the food
  stalls, first-aid tent, and the shuttle stop near the north entrance.</p>
</body>
</html>
