<!-- SC 1.4.1 | positive | underline-removed-on-hover | link #1a73e8 underlined at rest (ok) but text-decoration:none on :hover leaves color-only; link-vs-body #1a1a1a = 3.863:1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inline link underline removed on hover</title>
<style>
  body { font-family: Georgia, serif; background: #ffffff; color: #1a1a1a; margin: 48px; max-width: 40em; line-height: 1.7; font-size: 18px; }
  a.body-link {
    color: #1a73e8;              /* link vs body #1a1a1a = 3.863:1 */
    text-decoration: underline;  /* rest: non-color cue present */
  }
  a.body-link:hover {
    text-decoration: none;       /* hover: underline removed -> color ONLY differentiator */
  }
</style>
</head>
<body>
  <p>The committee published its findings last spring, and you can read the
  <a href="/report" class="body-link">full annual report</a> before the next
  session begins. Several members have already submitted written comments.</p>
</body>
</html>
