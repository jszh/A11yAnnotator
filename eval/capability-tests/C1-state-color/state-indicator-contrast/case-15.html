<!-- SC1.4.11 | NEGATIVE | near-threshold-3.1-holds-in-state | #909090 checked tick vs white = 3.193 (PASS, just over) checked -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checked indicator just over threshold (3.193:1)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .field { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .field input { position: absolute; opacity: 0; }
  .box {
    width: 26px; height: 26px; border-radius: 4px;
    border: 2px solid #595959; background: #ffffff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* CHECKED: grey check on the white interior = #909090 vs white = 3.193:1 PASS (just over 3). */
  .field input:checked + .box::after {
    content: "";
    width: 7px; height: 12px;
    border: solid #909090;              /* checked tick vs white = 3.193:1 PASS */
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
    display: block;
  }
</style>
</head>
<body>
  <h1>Privacy</h1>
  <div class="field">
    <input type="checkbox" id="ads" checked>
    <label for="ads" class="box"></label>
    <label for="ads">Limit ad tracking (checked)</label>
  </div>
  <p>The checked checkmark is #909090 on white = 3.193:1 — just above 3:1, so it passes.</p>
</body>
</html>
