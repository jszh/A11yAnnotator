<!-- SC1.4.11 | POSITIVE | focus-ring-below-3to1 | #aaaaaa focus ring vs white page = 2.323 (FAIL) :focus -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus ring below 3:1</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .btn {
    font-size: 16px; padding: 12px 22px; border-radius: 6px;
    background: #ffffff; border: 1px solid #595959; color: #1a1a1a;
  }
  /* The focus state is conveyed ONLY by a ring. Author removes UA outline and draws a custom one. */
  .btn:focus { outline: none; }
  .btn:focus-visible, .btn:focus {
    outline: none;
    box-shadow: 0 0 0 3px #aaaaaa;      /* focus ring vs white page = 2.323:1 FAIL */
  }
</style>
</head>
<body>
  <h1>Sign in</h1>
  <button class="btn" type="button" autofocus>Continue</button>
  <p>The custom focus ring is the focus-state indicator. Against the white page it
  abuts, #aaaaaa gives 2.323:1, below the 3:1 required for a focus indicator (G195).</p>
</body>
</html>
