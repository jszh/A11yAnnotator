<!-- SC1.4.11 | NEGATIVE | toggle-on-track-vs-knob-pass | white knob on #1a73e8 ON-track = 4.505 (PASS) checked -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle ON: knob passes against its track</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .row { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
  .sw input { position: absolute; opacity: 0; }
  .track {
    width: 56px; height: 30px; border-radius: 15px;
    background: #767676; position: relative; display: inline-block;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #ffffff;                 /* OFF: white knob on #767676 = 4.5:1 */
  }
  /* CHECKED (ON): track becomes strong blue; white knob abuts it at 4.505:1. PASS. */
  .sw input:checked + .track { background: #1a73e8; }   /* ON track vs white page = 4.505:1 */
  .sw input:checked + .track::after {
    left: 29px; background: #ffffff;     /* knob vs #1a73e8 ON-track = 4.505:1 PASS */
  }
</style>
</head>
<body>
  <h1>Settings</h1>
  <div class="row">
    <span class="sw">
      <input type="checkbox" id="loc" checked>
      <label for="loc" class="track"></label>
    </span>
    <label for="loc">Location services (on)</label>
  </div>
  <p>In the ON state the white knob abuts the #1a73e8 track at 4.505:1, and the track
  vs the page is 4.505:1. The state indicator passes.</p>
</body>
</html>
