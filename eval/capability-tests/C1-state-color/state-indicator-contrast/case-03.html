<!-- SC1.4.11 | POSITIVE | pressed-active-border-fail | #b0b0b0 pressed border on #e8e8e8 surface = 1.770 (FAIL) :active -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pressed-state button border fails against its surface</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .btn {
    font-size: 16px; padding: 12px 22px; border-radius: 6px;
    background: #e8e8e8;                 /* button surface = adjacent color for the border */
    border: 3px solid #595959;          /* resting border vs #e8e8e8 = 5.7:1 PASS at rest */
    color: #1a1a1a; cursor: pointer;
  }
  /* The PRESSED state is conveyed by a border-color change (the state indicator). */
  /* In :active the border drops to #b0b0b0 vs the same #e8e8e8 surface = 1.770:1 FAIL. */
  .btn:active {
    border-color: #b0b0b0;
  }
  .hint { color: #555; }
</style>
</head>
<body>
  <h1>Toolbar</h1>
  <button class="btn" type="button">Bold</button>
  <p class="hint">The pressed state changes only the border colour. Hold the button
  (its :active state): the border becomes #b0b0b0 on the #e8e8e8 face = 1.770:1,
  below 3:1, so the pressed boundary is indistinct.</p>
</body>
</html>
