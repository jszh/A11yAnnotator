<!-- SC1.4.11 | NEGATIVE | pressed-active-border-pass | #595959 pressed border on #e8e8e8 surface = 5.717 (PASS) :active -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pressed-state button border passes against its surface</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .btn {
    font-size: 16px; padding: 12px 22px; border-radius: 6px;
    background: #ffffff; border: 3px solid #595959; color: #1a1a1a; cursor: pointer;
  }
  /* PRESSED state changes the surface and keeps a high-contrast border. */
  .btn:active {
    background: #e8e8e8;                 /* pressed surface */
    border-color: #595959;              /* pressed border vs #e8e8e8 = 5.717:1 PASS */
  }
</style>
</head>
<body>
  <h1>Editor</h1>
  <button class="btn" type="button">Italic</button>
  <p>Hold the button (its :active state): the pressed border is #595959 on the
  #e8e8e8 pressed surface = 5.717:1, well above 3:1. The pressed boundary is clear.</p>
</body>
</html>
