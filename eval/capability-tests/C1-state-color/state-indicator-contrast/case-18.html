<!-- SC1.4.11 | NEGATIVE | default-UA-control-exemption | native checked checkbox + radio, NO author styling of the indicator => UA-rendered, EXEMPT -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native checked controls: user-agent indicator is exempt</title>
<style>
  /* Only layout/typography is styled. The control INDICATORS (checkmark, radio dot,
     focus ring) are left to the user agent — NO appearance/accent-color/custom box.
     SC 1.4.11 exempts indicators whose appearance is UA-determined and not modified. */
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  fieldset { border: 1px solid #c4c4c4; border-radius: 8px; padding: 16px 20px; max-width: 420px; }
  label { display: block; margin: 10px 0; font-size: 16px; }
</style>
</head>
<body>
  <h1>Preferences (native controls)</h1>
  <fieldset>
    <legend>Email format</legend>
    <label><input type="radio" name="fmt" checked> HTML</label>
    <label><input type="radio" name="fmt"> Plain text</label>
  </fieldset>
  <fieldset>
    <legend>Options</legend>
    <label><input type="checkbox" checked> Remember this device</label>
    <label><input type="checkbox"> Show advanced settings</label>
  </fieldset>
  <p>The checked radio dot and checkbox tick are rendered by the user agent with no
  author styling. Their appearance is UA-determined and exempt from 1.4.11.</p>
</body>
</html>
