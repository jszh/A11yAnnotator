<!-- SC1.4.11 | POSITIVE | expanded-chevron-vs-open-panel-fail | #a8c4ec chevron on #dce8fb open panel = 1.442 (FAIL) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expanded chevron fails against the open panel</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .acc { border: 1px solid #c4c4c4; border-radius: 6px; overflow: hidden; width: 420px; }
  .acc-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; background: #ffffff; font-size: 17px;
  }
  /* The disclosure chevron is the EXPANDED-state indicator. */
  /* When expanded it sits over the open panel's tinted background (#dce8fb). */
  .acc[aria-expanded="true"] .acc-head { background: #dce8fb; }
  .chev {
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-top: 12px solid #a8c4ec;     /* chevron vs #dce8fb panel = 1.442:1 FAIL */
  }
  .acc[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .acc-body { padding: 16px; background: #dce8fb; }
</style>
</head>
<body>
  <h1>FAQ</h1>
  <div class="acc" aria-expanded="true">
    <div class="acc-head">How do refunds work?<span class="chev"></span></div>
    <div class="acc-body">Refunds are processed within 5 business days…</div>
  </div>
  <p>The chevron indicates the expanded state. In the open state it abuts the
  tinted header/panel (#dce8fb): #a8c4ec gives 1.442:1, below 3:1.</p>
</body>
</html>
