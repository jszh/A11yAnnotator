<html lang="en">
<head>

<title>Selected tab underline passes against its strip</title>
<style>

  .tabs { display: flex; background: #1a73e8; border-radius: 6px 6px 0 0; }

  /* SELECTED tab cue: a white underline that abuts the #1a73e8 strip = 4.505:1 PASS. */

    content: "";
    position: absolute; left: 12px; right: 12px; bottom: 4px; height: 4px;
    background: #ffffff;                 /* selected underline vs #1a73e8 strip = 4.505:1 PASS */
    border-radius: 2px;
  }
  .panel { border: 1px solid #1a73e8; padding: 24px; border-radius: 0 0 6px 6px; }
</style>
</head>

  <h1>Account</h1>
  <div class="tabs" role="tablist">
    <div class="tab" role="tab" aria-selected="false">Overview</div>
    <div class="tab" role="tab" aria-selected="true">Billing</div>
    <div class="tab" role="tab" aria-selected="false">Security</div>
  </div>
  <div class="panel" role="tabpanel">Billing details…</div>
  <p>The selected-state underline is white on the #1a73e8 strip it abuts = 4.505:1 —
