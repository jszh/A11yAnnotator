<!-- SC1.4.11 | NEGATIVE | essential-exemption | a faint tint is essential color-info, but a SEPARATE #595959 selection ring (7.005:1) carries the state cue and passes -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Essential colour + a separate passing selection ring</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .swatches { display: flex; gap: 18px; }
  .sw {
    width: 80px; height: 80px; border-radius: 10px;
    border: 1px solid #e0e0e0;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
    font-size: 12px; color: #1a1a1a;
  }
  /* The swatch FILL colour is the essential information (you are choosing a colour);
     its exact hue/contrast is the content itself and is exempt as essential. */
  .c1 { background: #fde8e8; }
  .c2 { background: #e8f0fe; }
  .c3 { background: #e9f7ef; }
  /* The SELECTED STATE is conveyed by a distinct, high-contrast ring that does NOT
     depend on the swatch colour: #595959 vs the white page = 7.005:1 PASS. */
  .sw[aria-selected="true"] {
    box-shadow: 0 0 0 3px #595959;      /* selection ring vs white = 7.005:1 PASS */
  }
</style>
</head>
<body>
  <h1>Choose a label colour</h1>
  <div class="swatches" role="listbox" aria-label="Label colour">
    <div class="sw c1" role="option" aria-selected="false">Rose</div>
    <div class="sw c2" role="option" aria-selected="true">Blue</div>
    <div class="sw c3" role="option" aria-selected="false">Mint</div>
  </div>
  <p>The pale swatch fills are essential (they ARE the colour being chosen). The
  selected-state cue is a separate #595959 ring at 7.005:1 against the page — a
  sufficient, colour-independent indicator. No barrier.</p>
</body>
</html>
