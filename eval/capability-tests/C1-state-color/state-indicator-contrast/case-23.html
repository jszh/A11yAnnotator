<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus ring above 3:1</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .btn {
    font-size: 16px; padding: 12px 22px; border-radius: 6px;
    background: #ffffff; border: 1px solid #595959; color: #1a1a1a;
  }
  .btn:focus { outline: none; }
  .btn:focus-visible, .btn:focus {
    outline: none;
    box-shadow: 0 0 0 3px #1a73e8;      /* focus ring vs white page = 4.505:1 PASS (G195) */
  }
</style>
</head>
<body>
  <h1>Sign in</h1>
  <button class="btn" type="button" autofocus>Continue</button>
  <p>The custom focus ring is #1a73e8 against the white page it abuts = 4.505:1 —
  above 3:1, satisfying the focus-indicator contrast (G195).</p>
</body>
