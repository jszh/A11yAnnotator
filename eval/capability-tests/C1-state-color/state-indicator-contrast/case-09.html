<!-- SC1.4.11 | POSITIVE | only-active-state-conveys-indicator-and-it-is-subthreshold | #c9d8f2 selection ring vs white = 1.440 (FAIL) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected item: only cue is a sub-threshold ring</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #1a1a1a; padding: 40px; }
  .grid { display: flex; gap: 16px; }
  .opt {
    width: 120px; height: 90px; border-radius: 8px;
    background: #ffffff; border: 1px solid #c9d8f2;   /* unselected: faint hairline */
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  /* The ONLY thing distinguishing the selected card is a 3px ring of the same faint blue. */
  /* No checkmark, no fill, no bold border colour change — just the ring appears. */
  .opt[aria-selected="true"] {
    border-color: #c9d8f2;
    box-shadow: 0 0 0 3px #c9d8f2;      /* selected ring vs white page = 1.440:1 FAIL */
  }
</style>
</head>
<body>
  <h1>Pick a plan</h1>
  <div class="grid" role="listbox" aria-label="Plans">
    <div class="opt" role="option" aria-selected="false">Free</div>
    <div class="opt" role="option" aria-selected="true">Pro</div>
    <div class="opt" role="option" aria-selected="false">Team</div>
  </div>
  <p>Only the selected (active) state introduces a visual indicator — the ring —
  and that ring is #c9d8f2 on white = 1.440:1, far below 3:1.</p>
</body>
</html>
