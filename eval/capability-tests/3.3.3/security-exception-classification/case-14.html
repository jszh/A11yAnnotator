<!DOCTYPE html>
<!-- 3.3.3 POSITIVE | security-exception-classification | country select-by-text: no allowed values suggested -->
<html lang="en"><head><meta charset="utf-8"><title>3.3.3 security-exception-classification case 14</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:560px;color:#1a1a1a}
  h1{font-size:20px}
  label{display:block;font-weight:600;margin-bottom:4px}
  input,select,textarea{padding:8px;width:100%;box-sizing:border-box;font:inherit}
  fieldset{border:1px solid #999;padding:12px;margin:0 0 12px}
  legend{font-weight:600;padding:0 6px}
  .hint{color:#444;font-size:14px;margin:2px 0 6px}
  .err{color:#b00020;margin-top:6px}
  button{margin-top:14px;padding:9px 18px;font:inherit}
  .far{margin-top:600px}
  
</style></head>
<body>
  <h1>Shipping</h1>
  <form id="f">
    <label for="fld">Country (2-letter code)</label>
    <input id="fld" name="cty" type="text">
    <p id="err" class="err" role="alert" hidden></p>
    <button id="submit" type="submit">Save</button>
  </form>
  <script>
    (function(){
      var f=document.getElementById('f'), fld=document.getElementById('fld'), m=document.getElementById('err');
      var valid=function(v){return ['US','CA','GB'].includes(v.trim().toUpperCase());};
      f.addEventListener('submit',function(ev){
        ev.preventDefault();
        if(!valid(fld.value)){ m.innerHTML='Not a recognised country code.'; m.hidden=false; fld.setAttribute('aria-invalid','true'); }
        else { m.hidden=true; fld.removeAttribute('aria-invalid'); }
      });
    })();
  </script>
</body></html>
