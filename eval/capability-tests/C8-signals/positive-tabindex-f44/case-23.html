<!-- NEGATIVE: tabindex="0" on a link explicitly (redundant but harmless); not positive, no F44 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Help center</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    a { color: #0b5fff; }
  </style>
</head>
<body>
  <h1>Help center</h1>
  <p>Browse the <a href="/faq">FAQ</a> or contact us.</p>
  <!-- tabindex=0 is redundant on a native link but is NOT a positive value; tab order is preserved. -->
  <p>You can also <a id="chat" href="/chat" tabindex="0">start a live chat</a>.</p>
  <p>Or read our <a href="/docs">documentation</a>.</p>
</body>
</html>
