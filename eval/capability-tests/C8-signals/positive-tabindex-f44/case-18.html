<!-- NEGATIVE: tabindex="-1" on a heading focused via script after navigation; not in tab order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPA route</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    h2:focus { outline: 2px solid #0b5fff; }
  </style>
</head>
<body>
  <nav><a href="#" onclick="document.getElementById('view-title').focus()">Go to Profile</a></nav>
  <section>
    <!-- Heading is given tabindex=-1 so the SPA can move focus to it on route change.
         Negative tabindex keeps it OUT of the Tab sequence — no positive tabindex, no F44. -->
    <h2 id="view-title" tabindex="-1">Profile</h2>
    <p>Details about the user.</p>
  </section>
</body>
</html>
