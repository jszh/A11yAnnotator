<!-- NEGATIVE: tabindex="0" roving on a toolbar — no positive value, focus follows DOM order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text editor toolbar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    [role="toolbar"] { display: flex; gap: .25rem; }
    [role="button"] { padding: .4rem .7rem; border: 1px solid #888; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Editor</h1>
  <div role="toolbar" aria-label="Formatting">
    <div id="bold-btn" role="button" tabindex="0">Bold</div>
    <div role="button" tabindex="0">Italic</div>
    <div role="button" tabindex="0">Underline</div>
  </div>
  <!-- All controls use tabindex=0; tab order matches DOM order. No F44 violation. -->
</body>
</html>
