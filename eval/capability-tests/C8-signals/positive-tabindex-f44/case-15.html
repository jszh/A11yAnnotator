<!-- NEGATIVE: no tabindex anywhere — pure native interactive elements in DOM order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Registration</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 440px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; }
    input, button { padding: .5rem; }
    input { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Create account</h1>
  <form>
    <label for="user">Username</label>
    <input id="user" name="user" type="text">

    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password">

    <!-- No tabindex attributes at all; focus follows native DOM order. No F44. -->
    <button type="submit">Register</button>
  </form>
</body>
</html>
