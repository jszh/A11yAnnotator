<!-- NEGATIVE: tabindex="0" on multiple custom buttons; all zero, focus follows DOM order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card actions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .btn { padding: .4rem .8rem; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Project Apollo</h2>
    <div class="actions">
      <span id="edit" class="btn" role="button" tabindex="0">Edit</span>
      <span class="btn" role="button" tabindex="0">Share</span>
      <span class="btn" role="button" tabindex="0">Delete</span>
    </div>
  </div>
  <!-- Three custom buttons, all tabindex=0; none positive, so tab order = DOM order. -->
</body>
</html>
