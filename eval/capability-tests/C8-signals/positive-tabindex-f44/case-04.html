<!-- POSITIVE: F44 — positive tabindex on a custom div control (role=button) reorders focus -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media player</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .ctrl { display: inline-block; padding: .5rem 1rem; border: 1px solid #333; border-radius: 6px; cursor: pointer; margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>Player controls</h1>
  <div class="ctrl" role="button" tabindex="0">Play</div>
  <!-- This custom control uses a positive tabindex, hoisting it ahead of Play -->
  <div id="stop-ctrl" class="ctrl" role="button" tabindex="2">Stop</div>
  <div class="ctrl" role="button" tabindex="0">Next</div>
</body>
</html>
