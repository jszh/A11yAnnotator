<!-- NEGATIVE: tabindex="0" on a custom widget done correctly — focusable, in DOM order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rating widget</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    .stars { font-size: 1.5rem; }
    [role="slider"] { display: inline-block; padding: .25rem .5rem; border: 1px solid #999; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Rate this article</h1>
  <!-- tabindex=0 correctly inserts the custom slider into the natural tab order; not positive -->
  <div id="rating" class="stars" role="slider" tabindex="0"
       aria-label="Rating" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3">★ ★ ★ ☆ ☆</div>
  <p><button type="button">Submit rating</button></p>
</body>
</html>
