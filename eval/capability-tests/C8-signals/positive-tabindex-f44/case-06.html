<!-- POSITIVE: F44 — multiple positive tabindexes competing produce a scrambled tab order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; }
    input { padding: .45rem; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <form>
    <label for="card">Card number</label>
    <input id="card" type="text" tabindex="3">

    <label for="exp">Expiry</label>
    <input id="exp" type="text" tabindex="1">

    <label for="cvc">CVC</label>
    <input id="cvc" type="text" tabindex="2">
  </form>
  <!-- Three competing positive tabindexes: tab visits exp, cvc, card — not DOM order -->
</body>
</html>
