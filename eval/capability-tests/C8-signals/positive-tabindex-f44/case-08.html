<!-- POSITIVE: F44 — tabindex="1" on an anchor in the header reorders the nav -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Storefront</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { background: #111; color: #fff; padding: 1rem; }
    header a { color: #fff; margin-right: 1.25rem; }
    main { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">Shop</a>
    <a href="/deals">Deals</a>
    <!-- Account link uses tabindex=1, pulling it ahead of Shop and Deals in tab order -->
    <a id="account" href="/account" tabindex="1">Account</a>
  </header>
  <main>
    <h1>Featured items</h1>
    <p>Browse our <a href="/new">new arrivals</a>.</p>
  </main>
</body>
</html>
