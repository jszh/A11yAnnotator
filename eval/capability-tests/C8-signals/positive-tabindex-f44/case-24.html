<!-- NEGATIVE (abstain edge): tabindex="2" on the page's ONLY focusable control — positive value but order is unaffected -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coming soon</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
    button { padding: .6rem 1.4rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Coming soon</h1>
  <p>Our store launches next week.</p>
  <!-- The page has exactly ONE focusable element. It carries a positive tabindex (2),
       which is the F44 trigger pattern, yet with a single control there is no other
       element whose order could be disrupted, so "meaning and operability" is not
       observably broken on THIS page. The deterministic positive-tabindex signal fires,
       but whether it constitutes a real 2.4.3 defect is genuinely ambiguous here. -->
  <button id="notify" type="button" tabindex="2">Notify me</button>
</body>
</html>
