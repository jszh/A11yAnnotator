<!-- NEGATIVE: skip link with NO tabindex; native anchor in DOM order, no F44 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Long article</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 1rem; top: 1rem; position: fixed; background: #fff; padding: .5rem; }
    main { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <!-- Skip link is a plain anchor with no tabindex; it sits first in the DOM and the tab order. -->
  <a id="skip" class="skip" href="#main">Skip to content</a>
  <nav><a href="/a">A</a><a href="/b">B</a></nav>
  <main id="main" tabindex="-1">
    <h1>Article</h1>
    <p>Body text with a <a href="/cite">citation</a>.</p>
  </main>
</body>
</html>
