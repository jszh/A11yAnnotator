<!-- NEGATIVE: form with all native controls, in DOM order, no tabindex -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shipping details</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; }
    input, select, button { padding: .5rem; }
    input, select { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Shipping</h1>
  <form>
    <label for="addr">Address</label>
    <input id="addr" name="addr" type="text">

    <label for="city">City</label>
    <input id="city" name="city" type="text">

    <label for="country">Country</label>
    <select id="country" name="country"><option>United States</option><option>Canada</option></select>

    <p><button type="submit">Continue</button></p>
  </form>
  <!-- Entirely native controls with no tabindex; tab order = DOM order. No F44. -->
</body>
</html>
