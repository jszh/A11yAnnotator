<!-- NEGATIVE: modal with tabindex="-1" container + tabindex="0" controls; nothing positive -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confirm dialog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .modal { border: 1px solid #aaa; border-radius: 8px; padding: 1.25rem; max-width: 360px; }
    .modal button { padding: .45rem .9rem; margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <!-- Dialog container uses tabindex=-1 so script can focus the dialog on open.
       Its buttons are native (implicitly tabindex 0). No positive tabindex anywhere. -->
  <div id="dialog" class="modal" role="dialog" aria-modal="true" aria-label="Confirm" tabindex="-1">
    <p>Delete this project?</p>
    <button type="button">Cancel</button>
    <button type="button">Delete</button>
  </div>
</body>
</html>
