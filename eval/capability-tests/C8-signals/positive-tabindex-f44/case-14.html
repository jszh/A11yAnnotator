<!-- NEGATIVE: tabindex="-1" used for programmatic focus only; not in tab order, not F44 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Status messages</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    #live { padding: .75rem; background: #eef; border-radius: 6px; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>Upload</h1>
  <button type="button" onclick="document.getElementById('live').focus()">Start upload</button>
  <!-- tabindex=-1 makes this region focusable by script only; it is NOT reachable by Tab,
       so it cannot reorder the tab sequence. Negative tabindex never triggers F44. -->
  <div id="live" tabindex="-1" role="status">Ready.</div>
</body>
</html>
