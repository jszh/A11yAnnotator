<!-- POSITIVE: F44 — the TRAP: visual order looks perfectly fine, but a positive tabindex breaks tab order invisibly -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; }
    input, textarea { padding: .5rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1.2rem; }
  </style>
</head>
<body>
  <h1>Contact us</h1>
  <!-- Everything is visually top-to-bottom and looks correct. The defect is invisible:
       the Send button carries tabindex=1, so keyboard tab order starts at Send, not Name. -->
  <form>
    <label for="cname">Name</label>
    <input id="cname" type="text">

    <label for="cmsg">Message</label>
    <textarea id="cmsg" rows="4"></textarea>

    <button id="send-btn" type="submit" tabindex="1">Send</button>
  </form>
</body>
</html>
