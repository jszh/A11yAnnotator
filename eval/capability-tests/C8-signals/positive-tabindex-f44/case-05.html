<!-- POSITIVE: F44 — positive tabindex makes focus jump BACKWARD relative to DOM order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Survey</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Quick survey</h1>
  <form>
    <p><label>Question 1 <input id="q1" type="text"></label></p>
    <p><label>Question 2 <input id="q2" type="text"></label></p>
    <!-- Last field in DOM, but tabindex=1 forces it to be focused FIRST, jumping focus backward -->
    <p><label>Question 3 <input id="q3" type="text" tabindex="1"></label></p>
  </form>
</body>
</html>
