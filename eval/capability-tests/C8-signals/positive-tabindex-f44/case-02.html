<!-- POSITIVE: F44 — very large tabindex="99" on a link forces an unnatural early focus position -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>News digest</title>
  <style>
    body { font-family: Georgia, serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    article { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/home">Home</a>
    <a href="/world">World</a>
    <!-- tabindex=99 still a positive value; it jumps ahead of every untabindexed element -->
    <a id="promo-link" href="/promo" tabindex="99">Promotions</a>
  </nav>
  <article>
    <h1>Markets steady ahead of report</h1>
    <p>Read more at <a href="/markets">our markets desk</a>.</p>
  </article>
</body>
</html>
