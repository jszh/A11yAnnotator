<!-- POSITIVE (edge): F44 — tabindex value written as "01" (leading zero) still parses to a positive integer -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    input, button { padding: .5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Subscribe</h1>
  <form>
    <label for="nl-email">Email address</label><br>
    <input id="nl-email" type="email">
    <!-- "01" parses per HTML integer rules to 1, a positive tabindex that reorders focus.
         A naive string-equality check for "1" would miss it; the runner should still flag it. -->
    <button id="nl-sub" type="submit" tabindex="01">Subscribe</button>
  </form>
</body>
</html>
