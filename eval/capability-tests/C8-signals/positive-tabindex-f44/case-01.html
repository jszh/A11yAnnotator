<!-- POSITIVE: F44 — tabindex="1" on a button forces it to the front of the tab sequence -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings — save action</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; }
    input, button { font-size: 1rem; padding: .5rem; }
    button { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Account settings</h1>
  <form>
    <label for="name">Display name</label>
    <input id="name" name="name" type="text">

    <label for="bio">Bio</label>
    <input id="bio" name="bio" type="text">

    <!-- This button visually sits last but tabindex=1 yanks it to the FRONT of the tab order -->
    <button id="save-btn" type="submit" tabindex="1">Save</button>
  </form>
</body>
</html>
