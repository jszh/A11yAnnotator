<!-- POSITIVE: F44 — tabindex="3" on a menu item disrupts the menu's natural order -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard menu</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    ul[role="menu"] { list-style: none; padding: 0; border: 1px solid #ccc; border-radius: 6px; }
    [role="menuitem"] { display: block; padding: .6rem 1rem; border-bottom: 1px solid #eee; }
    [role="menuitem"]:last-child { border-bottom: 0; }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <ul role="menu" aria-label="Main">
    <li role="menuitem" tabindex="0">Overview</li>
    <li role="menuitem" tabindex="0">Reports</li>
    <!-- This menu item uses a positive tabindex, breaking the menu's sequential order -->
    <li id="settings-item" role="menuitem" tabindex="3">Settings</li>
    <li role="menuitem" tabindex="0">Help</li>
  </ul>
</body>
</html>
