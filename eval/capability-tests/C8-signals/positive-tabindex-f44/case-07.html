<!-- POSITIVE: F44 — tabindex="2" on an input inside a form disrupts the field sequence -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; }
    input { padding: .5rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" name="email" type="email">

    <label for="password">Password</label>
    <!-- Password gets tabindex=2, so it is reached before Email despite coming after it -->
    <input id="password" name="password" type="password" tabindex="2">

    <button type="submit">Continue</button>
  </form>
</body>
</html>
