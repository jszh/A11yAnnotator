<!-- NEGATIVE: pseudo-before-empty-decorative — ::before content:"" conveys nothing (empty generated content) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; position: relative; }
    /* Empty generated content used only as a CSS hook for a decorative top border accent */
    .card::before { content: ""; display: block; height: 4px; background: #1a56db; margin: -1rem -1rem 1rem; border-radius: 8px 8px 0 0; }
  </style>
</head>
<body>
  <h1>Newsletter</h1>
  <div class="card" id="promo">
    <h2>Weekly digest</h2>
    <p>Get the top stories every Monday morning.</p>
  </div>
</body>
</html>
