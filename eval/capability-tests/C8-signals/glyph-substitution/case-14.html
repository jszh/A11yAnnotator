<!-- NEGATIVE: pua-icon-aria-hidden-with-label — PUA glyph aria-hidden + adjacent real visible label text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Document actions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .btn { display: inline-flex; align-items: center; gap: .4rem; font-size: 1rem; padding: .5rem 1rem; border: 1px solid #1a56db; color: #1a56db; background: #fff; cursor: pointer; }
    .glyph { font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Annual budget</h1>
  <!-- PUA download glyph is hidden from AT; the real visible word "Download" carries the meaning -->
  <button id="download" class="btn" type="button">
    <span id="dl-glyph" class="glyph" aria-hidden="true">&#xF019;</span>
    <span>Download</span>
  </button>
</body>
</html>
