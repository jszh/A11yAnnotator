<!-- POSITIVE: pua-status-badge-glyph — a PUA "warning" glyph alone conveys status, no text alternative -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Server health</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .5rem; text-align: left; }
    .badge { font-size: 1.2rem; color: #b45309; }
  </style>
</head>
<body>
  <h1>Server health</h1>
  <table>
    <thead><tr><th>Node</th><th>State</th></tr></thead>
    <tbody>
      <tr>
        <td>web-03</td>
        <!-- &#xF071; is a PUA warning-triangle icon; it is the ONLY signal of a degraded state -->
        <td><span id="status" class="badge">&#xF071;</span></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
