<!-- NEGATIVE: real-text-icon-img-with-alt — a meaningful icon delivered as an <img> with proper alt text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .wx { display: flex; align-items: center; gap: .5rem; }
  </style>
</head>
<body>
  <h1>Today</h1>
  <p class="wx">
    <!-- The status icon is a real image with an equivalent text alternative; no glyph substitution.
         data: URI keeps the file self-contained. -->
    <img id="wx-icon" width="32" height="32" alt="Rain showers"
         src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Ccircle%20cx='12'%20cy='10'%20r='6'%20fill='%239ca3af'/%3E%3C/svg%3E">
    <span>18&deg;C</span>
  </p>
</body>
</html>
