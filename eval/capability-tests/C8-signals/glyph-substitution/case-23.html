<!-- NEGATIVE/ABSTAIN: homoglyph-benign-accented-name — a single accented letter in a proper name is legitimate, not a deceptive lookalike -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Team</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Our team</h1>
  <!-- "Renée Müller" uses legitimate accented Latin letters (é U+00E9, ü U+00FC) in a real name.
       These are correct spellings, NOT cross-script lookalikes substituting for ASCII;
       the visible text equals the intended text. Borderline for a glyph-substitution detector,
       so abstaining is defensible. -->
  <p class="card" id="member">&#x52;ené&#x65; M&#xFC;ller &mdash; Lead Designer</p>
</body>
</html>
