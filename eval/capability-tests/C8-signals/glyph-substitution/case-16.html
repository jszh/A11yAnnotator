<!-- NEGATIVE: real-text-button — an ordinary "Submit" button in plain Latin text, no homoglyphs -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input { display: block; width: 100%; padding: .5rem; margin: .35rem 0 .75rem; }
    button { font-size: 1rem; padding: .55rem 1.2rem; background: #1a56db; color: #fff; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Contact us</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email">
    <!-- Plain ASCII "Submit"; every character is the real Latin letter -->
    <button id="submit" type="submit">Submit</button>
  </form>
</body>
</html>
