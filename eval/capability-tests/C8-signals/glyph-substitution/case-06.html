<!-- POSITIVE: homoglyph-nav-label — a navigation label built from Greek lookalikes, no real-text equivalent -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Storefront</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #111; font-weight: 600; }
  </style>
</head>
<body>
  <nav aria-label="Primary">
    <!-- Visible string looks like "SHOP" but uses Greek capitals:
         Ѕ? no — Greek: Σ? use lookalikes: Η U+0397, Ο U+039F, Ρ U+03A1, and Latin S impossible.
         Build "HOP" with Greek Η Ο Ρ plus leading Latin S to read "SHOP".
         AT announces a non-word; no accessible name override. -->
    <a id="nav-shop" href="/shop">S&#x0397;&#x039F;&#x03A1;</a>
    <a href="/about">About</a>
  </nav>
</body>
</html>
