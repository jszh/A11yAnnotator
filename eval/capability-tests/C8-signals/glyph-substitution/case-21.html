<!-- NEGATIVE: icon-i-aria-hidden-adjacent-label — <i class="icon"> aria-hidden + adjacent real label text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; }
    .icon::before { content: "\2699"; font-size: 1.2rem; color: #6b7280; }
  </style>
</head>
<body>
  <h1>Account</h1>
  <a class="row" href="/settings" id="settings-link">
    <!-- The gear glyph is generated decoration, hidden from AT; "Settings" text carries the name -->
    <i class="icon" aria-hidden="true"></i>
    <span>Settings</span>
  </a>
</body>
</html>
