<!-- POSITIVE: pseudo-before-mail-icon — ::before content:"\f0e0" mail icon conveys meaning, no text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    /* The link's ENTIRE meaning is delivered by a CSS-generated PUA mail glyph */
    a.mail { font-size: 1.4rem; text-decoration: none; color: #1a56db; }
    a.mail::before { content: "\f0e0"; }
  </style>
</head>
<body>
  <h1>Profile</h1>
  <!-- The anchor has no text content; its label is a pseudo-element mail icon only -->
  <a id="contact" class="mail" href="mailto:team@example.com"></a>
</body>
</html>
