<!-- NEGATIVE: pua-icon-sr-only-text — PUA icon span paired with a visually-hidden .sr-only label -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site search</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .searchbtn { font-size: 1.2rem; padding: .4rem .6rem; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <h1>Browse</h1>
  <button id="search" class="searchbtn" type="button">
    <!-- PUA magnifier glyph for sighted users, hidden from AT -->
    <span aria-hidden="true">&#xF002;</span>
    <!-- Visually-hidden real text gives AT the accessible name "Search" -->
    <span class="sr-only">Search</span>
  </button>
</body>
</html>
