<!-- POSITIVE: pua-icon-toolbar-no-names — a toolbar of PUA-icon buttons, none with accessible names -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text editor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .toolbar { display: flex; gap: .25rem; border: 1px solid #ddd; padding: .35rem; }
    .toolbar button { font-size: 1.1rem; padding: .3rem .5rem; background: #f7f7f7; border: 1px solid #ccc; cursor: pointer; }
    textarea { width: 100%; height: 120px; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Compose note</h1>
  <div class="toolbar" role="toolbar" id="bar">
    <!-- Each button is a bare Private Use Area glyph (bold / italic / link / image); no names -->
    <button type="button">&#xE100;</button>
    <button type="button">&#xE101;</button>
    <button type="button">&#xE102;</button>
    <button type="button">&#xE103;</button>
  </div>
  <textarea aria-label="Note body"></textarea>
</body>
</html>
