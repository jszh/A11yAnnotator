<!-- POSITIVE: pua-icon-no-name — a PUA "delete" glyph as the sole content of a button, no accessible name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saved items</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .iconbtn { font-family: "system-ui"; font-size: 1.25rem; border: 1px solid #ccc; background: #fff; padding: .35rem .55rem; cursor: pointer; }
    li { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; }
  </style>
</head>
<body>
  <h1>Saved items</h1>
  <ul>
    <li>
      <span>Quarterly report.pdf</span>
      <!-- &#xE001; is a Private Use Area codepoint rendered as a trash icon; no aria-label, no text -->
      <button id="del" class="iconbtn" type="button">&#xE001;</button>
    </li>
  </ul>
</body>
</html>
