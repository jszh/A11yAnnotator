<!-- POSITIVE: homoglyph-button — a "Submit" button whose letters are Cyrillic lookalikes -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input { display: block; width: 100%; padding: .5rem; margin: .35rem 0 .75rem; }
    button { font-size: 1rem; padding: .55rem 1.2rem; background: #1a56db; color: #fff; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Contact us</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email">
    <!-- Visible glyphs read "Submit" but letters are Cyrillic homoglyphs:
         Ѕ U+0405, u (latin), b (latin)... actually: Ѕ(0405) u m i t mixed.
         Here: "Submit" => Cyrillic Ѕ(U+0405) + ubmit lookalikes. AT announces a non-word. -->
    <button id="submit" type="submit">&#x0405;&#x1D58;b&#x43C;&#x456;t</button>
  </form>
</body>
</html>
