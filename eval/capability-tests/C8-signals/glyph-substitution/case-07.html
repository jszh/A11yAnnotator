<!-- POSITIVE: homoglyph-price-label — a price label using mixed-script digits/letters conveying meaning -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .price { font-size: 1.6rem; font-weight: 700; color: #047857; }
  </style>
</head>
<body>
  <h1>Wireless headphones</h1>
  <!-- "SALE" spelled with Cyrillic lookalikes: Ѕ U+0405, А U+0410, Е U+0415, plus Latin L.
       The promotional word is conveyed only through homoglyphs; AT reads garbage. -->
  <p class="price" id="sale-label">&#x0405;&#x0410;L&#x0415; &mdash; $129</p>
</body>
</html>
