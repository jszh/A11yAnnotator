<!-- POSITIVE: pseudo-before-checkmark — ::before checkmark conveys "included" status, no text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plan comparison</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .5rem; }
    /* The cell is empty; a generated check glyph is the only signal the feature is included */
    td.has::before { content: "\2714"; color: #16a34a; font-size: 1.2rem; }
  </style>
</head>
<body>
  <h1>Plans</h1>
  <table>
    <thead><tr><th>Feature</th><th>Pro</th></tr></thead>
    <tbody>
      <tr>
        <td>Priority support</td>
        <td id="incl" class="has"></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
