<!-- NEGATIVE: star-rating-with-real-text — visible stars PLUS an explicit real-text rating label -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Review</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .stars { color: #f59e0b; font-size: 1.4rem; }
    .stars span[aria-hidden] { }
  </style>
</head>
<body>
  <h1>Trail running shoe</h1>
  <!-- Decorative star glyphs are hidden from AT; the real text "4 out of 5 stars" carries the value -->
  <p class="stars" id="rating">
    <span aria-hidden="true">&#x2605;&#x2605;&#x2605;&#x2605;&#x2606;</span>
    <span>4 out of 5 stars</span>
  </p>
</body>
</html>
