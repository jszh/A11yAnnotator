<!-- POSITIVE: pua-icon-checkbox-control — a PUA glyph acts as the only label of a hamburger menu control -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mobile site</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .menu-toggle { font-size: 1.6rem; background: none; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <!-- &#xF0C9; is a PUA "hamburger menu" icon; it is the button's only content, no aria-label -->
    <button id="nav-toggle" class="menu-toggle" type="button">&#xF0C9;</button>
    <span>Acme</span>
  </header>
  <main><p>Welcome to Acme.</p></main>
</body>
</html>
