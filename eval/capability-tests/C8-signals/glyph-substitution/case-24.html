<!-- POSITIVE/ABSTAIN: pseudo-before-arrow-borderline — ::before arrow MIGHT be decorative chevron OR convey "external link" meaning -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resources</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    a.ext { text-decoration: none; color: #1a56db; }
    /* A generated arrow glyph after the link. Ambiguous: could be a purely decorative
       affordance chevron, OR it could be the only signal that this opens an external site.
       Because the meaning is genuinely uncertain, a runner may defensibly abstain. */
    a.ext::after { content: " \2197"; }
  </style>
</head>
<body>
  <h1>Resources</h1>
  <!-- Link has real text "Documentation"; the ambiguity is whether the ::after arrow adds
       unlabeled meaning (external) or is mere decoration. -->
  <a id="docs" class="ext" href="https://example.org/docs">Documentation</a>
</body>
</html>
