<!-- NEGATIVE: pseudo-before-decorative-bullet — purely decorative bullet glyph next to real text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Features</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    ul.plain { list-style: none; padding: 0; }
    /* Decorative bullet; the meaning is fully carried by the adjacent real text in each <li> */
    ul.plain li::before { content: "\2022"; color: #9ca3af; margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>Plan features</h1>
  <ul class="plain" id="feat-list">
    <li>Unlimited projects</li>
    <li>Priority email support</li>
    <li>Custom domains</li>
  </ul>
</body>
</html>
