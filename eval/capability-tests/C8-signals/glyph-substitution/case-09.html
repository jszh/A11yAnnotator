<!-- POSITIVE: pseudo-before-star-rating — ::before stars convey a rating, no text alternative -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Review</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    /* The rating value is delivered ONLY by generated star glyphs in CSS */
    .rating { color: #f59e0b; font-size: 1.4rem; }
    .rating::before { content: "\2605\2605\2605\2605\2606"; }
  </style>
</head>
<body>
  <h1>Trail running shoe</h1>
  <!-- Empty element; the "4 of 5 stars" meaning lives entirely in ::before content -->
  <div id="stars" class="rating"></div>
  <p>Lightweight and breathable.</p>
</body>
</html>
