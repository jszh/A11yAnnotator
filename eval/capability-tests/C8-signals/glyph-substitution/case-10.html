<!-- POSITIVE: pseudo-after-required — ::after content "(required)" is the ONLY indication a field is required -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; }
    /* The "(required)" string exists ONLY in CSS-generated content; not in the DOM or the field semantics */
    label.req::after { content: " (required)"; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Create account</h1>
  <form>
    <label id="pwd-label" class="req" for="pwd">Password</label>
    <input id="pwd" type="password">
  </form>
</body>
</html>
