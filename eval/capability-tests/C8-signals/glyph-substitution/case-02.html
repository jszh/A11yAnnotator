<!-- POSITIVE: pua-icon-link-only — a PUA glyph is the only content of a link, no accessible name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Document actions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    a.dl { font-size: 1.5rem; text-decoration: none; color: #1a56db; }
  </style>
</head>
<body>
  <h1>Annual budget</h1>
  <p>Review the spreadsheet before the board meeting.</p>
  <!-- &#xF019; (FontAwesome PUA "download" range) is the link's only content; no text alternative -->
  <a id="download" class="dl" href="/files/budget.xlsx">&#xF019;</a>
</body>
</html>
