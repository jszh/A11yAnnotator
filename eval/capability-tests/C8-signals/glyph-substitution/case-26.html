<!-- NEGATIVE: pseudo-before-decorative-quote — a decorative open-quote glyph next to a real blockquote -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Testimonial</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    blockquote { position: relative; padding-left: 2rem; font-style: italic; }
    /* A large decorative quotation mark; the quote's meaning is fully in the real text. */
    blockquote::before { content: "\201C"; font-size: 2.5rem; color: #d1d5db; position: absolute; left: 0; top: -.5rem; }
  </style>
</head>
<body>
  <h1>What customers say</h1>
  <blockquote id="quote">
    This tool cut our onboarding time in half. We could not run releases without it.
  </blockquote>
  <p>&mdash; Priya, VP of Engineering</p>
</body>
</html>
