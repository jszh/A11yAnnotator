<!-- POSITIVE | multipart-field-grouping 4.1.2 | sortcode-shared-label-once: one <label> for a 3-part sort code, only wired to the first input -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sort code</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: .3rem; }
    .row { display: flex; align-items: center; gap: .4rem; }
    input { width: 2.8rem; padding: .4rem; text-align: center; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Direct debit</h1>
  <label for="sc1">Sort code</label>
  <!-- the single label names ONLY sc1; sc2 and sc3 are nameless controls -->
  <div class="row">
    <input id="sc1" type="text" maxlength="2">
    <span>-</span>
    <input id="sc2" type="text" maxlength="2">
    <span>-</span>
    <input id="sc3" type="text" maxlength="2">
  </div>
</body>
</html>
