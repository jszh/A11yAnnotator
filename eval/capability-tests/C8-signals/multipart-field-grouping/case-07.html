<!-- POSITIVE | multipart-field-grouping 4.1.2 | date-only-first-labelled: only the first sub-input has a label, the other two have none -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expiry date</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    label { display: block; margin-bottom: .3rem; }
    input { width: 3.5rem; padding: .4rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Subscription renewal</h1>
  <div class="row">
    <div>
      <label for="exp-month">Card expiry</label>
      <input id="exp-month" type="text" maxlength="2" placeholder="MM">
    </div>
    <span>/</span>
    <!-- day and year inputs are UNlabelled; only the first carries a name -->
    <input id="exp-day" type="text" maxlength="2" placeholder="DD">
    <span>/</span>
    <input id="exp-year" type="text" maxlength="4" placeholder="YYYY">
  </div>
</body>
</html>
