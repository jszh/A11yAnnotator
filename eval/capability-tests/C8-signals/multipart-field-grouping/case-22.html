<!-- NEGATIVE | multipart-field-grouping 4.1.2 | otp-aria-labelledby-per-box-ok: OTP boxes named via aria-labelledby to per-box visible captions -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two-factor code</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .otp { display: flex; gap: .6rem; margin: 1rem 0; }
    .cell { text-align: center; }
    .cell span { display: block; font-size: .7rem; color: #555; margin-bottom: .2rem; }
    .cell input { width: 2.5rem; height: 2.5rem; text-align: center; font-size: 1.2rem; border: 1px solid #888; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Enter your one-time passcode</h1>
  <div class="otp" role="group" aria-label="One-time passcode">
    <div class="cell"><span id="c1">1st digit</span><input type="text" inputmode="numeric" maxlength="1" name="d1" aria-labelledby="c1"></div>
    <div class="cell"><span id="c2">2nd digit</span><input type="text" inputmode="numeric" maxlength="1" name="d2" aria-labelledby="c2"></div>
    <div class="cell"><span id="c3">3rd digit</span><input type="text" inputmode="numeric" maxlength="1" name="d3" aria-labelledby="c3"></div>
    <div class="cell"><span id="c4">4th digit</span><input type="text" inputmode="numeric" maxlength="1" name="d4" aria-labelledby="c4"></div>
  </div>
</body>
</html>
