<!-- NEGATIVE | multipart-field-grouping 4.1.2 | aria-labelledby-group-plus-part-ok: aria-labelledby combines group heading id + per-part label id -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card details</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .cc { display: flex; gap: .5rem; margin: 1rem 0; }
    .cc input { width: 3.6rem; text-align: center; padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .hide { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <h1>Payment</h1>
  <span id="cc-grp">Card number</span>
  <span class="hide" id="g1">group 1</span>
  <span class="hide" id="g2">group 2</span>
  <span class="hide" id="g3">group 3</span>
  <span class="hide" id="g4">group 4</span>
  <!-- each input is named by group heading + its own part id -->
  <div class="cc">
    <input id="cc1" type="text" inputmode="numeric" maxlength="4" aria-labelledby="cc-grp g1">
    <input id="cc2" type="text" inputmode="numeric" maxlength="4" aria-labelledby="cc-grp g2">
    <input id="cc3" type="text" inputmode="numeric" maxlength="4" aria-labelledby="cc-grp g3">
    <input id="cc4" type="text" inputmode="numeric" maxlength="4" aria-labelledby="cc-grp g4">
  </div>
</body>
</html>
