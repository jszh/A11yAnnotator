<!-- NEGATIVE | multipart-field-grouping 4.1.2 | expiry-wrapping-label-ok: each card-expiry part wrapped in its own <label> text -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card expiry</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .5rem; margin: 1rem 0; }
    label { display: inline-flex; flex-direction: column; font-size: .8rem; gap: .25rem; }
    input { width: 4rem; padding: .4rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Card on file</h1>
  <p>Expiration</p>
  <!-- implicit association: input nested inside a label whose text names it -->
  <div class="row">
    <label>Expiry month<input id="exp-mm" type="text" maxlength="2" placeholder="MM"></label>
    <span>/</span>
    <label>Expiry year<input id="exp-yy" type="text" maxlength="2" placeholder="YY"></label>
  </div>
</body>
</html>
