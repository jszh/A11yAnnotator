<!-- ABSTAIN | multipart-field-grouping 4.1.2 | group-name-only-fieldset-no-part-names: fieldset/legend names the GROUP but sub-inputs have no individual name (grey area) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone number</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .area { width: 3.5rem; } .prefix { width: 3.5rem; } .line { width: 5rem; }
  </style>
</head>
<body>
  <h1>Reach you by phone</h1>
  <!-- legend gives the GROUP a name, but each input still has no per-control name.
       F68 (per-control name) vs "named via grouping context" is genuinely arguable here. -->
  <fieldset>
    <legend>Phone number</legend>
    <div class="row">
      <input id="ph-area" class="area" type="text" maxlength="3">
      <span>-</span>
      <input id="ph-prefix" class="prefix" type="text" maxlength="3">
      <span>-</span>
      <input id="ph-line" class="line" type="text" maxlength="4">
    </div>
  </fieldset>
</body>
</html>
