<!-- POSITIVE | multipart-field-grouping 4.1.2 | cc-4-groups-no-names: credit-card number as 4 groups, none named -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Payment</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .cc { display: flex; gap: .5rem; margin: 1rem 0; }
    .cc input { width: 3.6rem; text-align: center; padding: .4rem; border: 1px solid #888; border-radius: 4px; letter-spacing: .1em; }
  </style>
</head>
<body>
  <h1>Card details</h1>
  <p>Card number</p>
  <!-- four 4-digit groups, no per-input name, no group name -->
  <div class="cc">
    <input id="cc1" type="text" inputmode="numeric" maxlength="4">
    <input id="cc2" type="text" inputmode="numeric" maxlength="4">
    <input id="cc3" type="text" inputmode="numeric" maxlength="4">
    <input id="cc4" type="text" inputmode="numeric" maxlength="4">
  </div>
</body>
</html>
