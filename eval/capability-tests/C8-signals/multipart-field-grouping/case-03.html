<!-- POSITIVE | multipart-field-grouping 4.1.2 | ssn-3-inputs-no-names: SSN three inputs, no names of any kind -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tax form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .a { width: 3.5rem; } .b { width: 2.8rem; } .c { width: 4rem; }
  </style>
</head>
<body>
  <h1>W-9 information</h1>
  <div class="label-text">Social Security Number</div>
  <!-- three controls, no label/aria-label/title; the "Social Security Number" div is unassociated -->
  <div class="row">
    <input id="ssn1" class="a" type="text" maxlength="3">
    <span>-</span>
    <input id="ssn2" class="b" type="text" maxlength="2">
    <span>-</span>
    <input id="ssn3" class="c" type="text" maxlength="4">
  </div>
</body>
</html>
