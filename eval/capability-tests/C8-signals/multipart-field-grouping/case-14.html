<!-- NEGATIVE | multipart-field-grouping 4.1.2 | date-aria-label-plus-fieldset-ok: aria-label per input AND fieldset/legend group name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Date of birth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .mm { width: 3rem; } .dd { width: 3rem; } .yyyy { width: 4.5rem; }
  </style>
</head>
<body>
  <h1>Verify your identity</h1>
  <fieldset>
    <legend>Date of birth</legend>
    <!-- each input has its own aria-label AND a group legend names the whole field -->
    <div class="row">
      <input id="dob-month" class="mm" type="text" maxlength="2" aria-label="Month" placeholder="MM">
      <span>/</span>
      <input id="dob-day" class="dd" type="text" maxlength="2" aria-label="Day" placeholder="DD">
      <span>/</span>
      <input id="dob-year" class="yyyy" type="text" maxlength="4" aria-label="Year" placeholder="YYYY">
    </div>
  </fieldset>
</body>
</html>
