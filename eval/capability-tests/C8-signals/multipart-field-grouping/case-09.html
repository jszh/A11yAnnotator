<!-- POSITIVE | multipart-field-grouping 4.1.2 | role-group-no-name-unnamed-inputs: role=group present but no accessible name, inputs unnamed -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone entry</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .grp { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; padding: .5rem; border: 1px dashed #ccc; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .area { width: 3.5rem; } .rest { width: 6rem; }
  </style>
</head>
<body>
  <h1>Mobile number</h1>
  <!-- role=group with NO aria-label/aria-labelledby, and the two inputs have no names either -->
  <div class="grp" role="group">
    <input id="mob-area" class="area" type="text" maxlength="3">
    <span>-</span>
    <input id="mob-rest" class="rest" type="text" maxlength="7">
  </div>
</body>
</html>
