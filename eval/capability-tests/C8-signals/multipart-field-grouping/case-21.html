<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Postal code</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: flex-end; gap: .6rem; margin: 1rem 0; }
    .field label { display: block; font-size: .8rem; margin-bottom: .25rem; }
    input { width: 4rem; padding: .4rem; text-align: center; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>UK postcode</h1>
  <div class="row">
    <div class="field"><label for="pc-out">Outward code</label><input id="pc-out" type="text" maxlength="4"></div>
    <div class="field"><label for="pc-in">Inward code</label><input id="pc-in" type="text" maxlength="3"></div>
  </div>
</body>
</html>
