<!-- NEGATIVE | multipart-field-grouping 4.1.2 | fieldset-legend-plus-title-ok: fieldset/legend + each input also carries a title -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone number</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .area { width: 3.5rem; } .prefix { width: 3.5rem; } .line { width: 5rem; }
  </style>
</head>
<body>
  <h1>Reach you by phone</h1>
  <fieldset>
    <legend>Phone number</legend>
    <!-- title gives each control its own programmatic name (H65); legend names the group -->
    <div class="row">
      <input id="ph-area" class="area" type="text" maxlength="3" title="Area code">
      <span>-</span>
      <input id="ph-prefix" class="prefix" type="text" maxlength="3" title="Prefix">
      <span>-</span>
      <input id="ph-line" class="line" type="text" maxlength="4" title="Line number">
    </div>
  </fieldset>
</body>
</html>
