<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tax form</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: flex-end; gap: .6rem; margin: 1rem 0; }
    .field label { display: block; font-size: .8rem; margin-bottom: .25rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .a input { width: 3.5rem; } .b input { width: 2.8rem; } .c input { width: 4rem; }
  </style>
</head>
<body>
  <h1>W-9 information</h1>
  <p id="ssn-grp">Social Security Number</p>
  <div class="row">
    <div class="field a"><label for="ssn1">First three digits</label><input id="ssn1" type="text" maxlength="3"></div>
    <div class="field b"><label for="ssn2">Middle two digits</label><input id="ssn2" type="text" maxlength="2"></div>
    <div class="field c"><label for="ssn3">Last four digits</label><input id="ssn3" type="text" maxlength="4"></div>
  </div>
</body>
</html>
