<!-- POSITIVE | multipart-field-grouping 4.1.2 | phone-3-inputs-no-names: phone split into 3 bare inputs, no labels, no fieldset, no group name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact details</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .area { width: 3.5rem; } .prefix { width: 3.5rem; } .line { width: 5rem; }
  </style>
</head>
<body>
  <h1>Create your account</h1>
  <p>Phone</p>
  <!-- 3 separate inputs, NONE has a label/aria-label/title; the "Phone" text is a plain <p>, not tied to any control -->
  <div class="row">
    <input id="phone-area" class="area" type="text" maxlength="3">
    <span>-</span>
    <input id="phone-prefix" class="prefix" type="text" maxlength="3">
    <span>-</span>
    <input id="phone-line" class="line" type="text" maxlength="4">
  </div>
</body>
</html>
