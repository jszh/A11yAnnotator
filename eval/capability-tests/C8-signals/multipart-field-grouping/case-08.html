<!-- POSITIVE | multipart-field-grouping 4.1.2 | adjacent-text-not-tied: sub-inputs "named" only by adjacent free text not programmatically associated -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shipping address</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    .cap { font-size: .8rem; color: #555; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .zip { width: 4.5rem; } .ext { width: 3.5rem; }
  </style>
</head>
<body>
  <h1>Where should we ship?</h1>
  <p>Postal code</p>
  <!-- the "ZIP" / "+4" captions are loose <span>s with no for/id link -->
  <div class="row">
    <input id="zip-main" class="zip" type="text" maxlength="5">
    <span class="cap">ZIP</span>
    <span>-</span>
    <input id="zip-ext" class="ext" type="text" maxlength="4">
    <span class="cap">+4</span>
  </div>
</body>
</html>
