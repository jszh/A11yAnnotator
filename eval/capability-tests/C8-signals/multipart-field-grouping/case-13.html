<!-- NEGATIVE | multipart-field-grouping 4.1.2 | phone-per-input-label-for-ok: each phone part has a <label for> name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact details</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: flex-end; gap: .6rem; margin: 1rem 0; }
    .field label { display: block; font-size: .8rem; margin-bottom: .25rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .area input { width: 3.5rem; } .prefix input { width: 3.5rem; } .line input { width: 5rem; }
  </style>
</head>
<body>
  <h1>Create your account</h1>
  <!-- each sub-input is named individually via label/for -->
  <div class="row">
    <div class="field area"><label for="ph-area">Area code</label><input id="ph-area" type="text" maxlength="3"></div>
    <div class="field prefix"><label for="ph-prefix">Prefix</label><input id="ph-prefix" type="text" maxlength="3"></div>
    <div class="field line"><label for="ph-line">Line number</label><input id="ph-line" type="text" maxlength="4"></div>
  </div>
</body>
</html>
