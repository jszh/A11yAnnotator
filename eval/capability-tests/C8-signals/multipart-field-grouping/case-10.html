<!-- POSITIVE | multipart-field-grouping 4.1.2 | empty-label-elements: <label> elements present but EMPTY, so no name is conveyed -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Routing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Bank transfer</h1>
  <p>Routing number (3 parts)</p>
  <!-- labels are wired with for= but contain no text, so the controls get no accessible name -->
  <div class="row">
    <label for="rt1"></label>
    <input id="rt1" type="text" maxlength="3" style="width:3rem">
    <span>-</span>
    <label for="rt2"></label>
    <input id="rt2" type="text" maxlength="3" style="width:3rem">
    <span>-</span>
    <label for="rt3"></label>
    <input id="rt3" type="text" maxlength="3" style="width:3rem">
  </div>
</body>
</html>
