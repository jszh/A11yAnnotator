<!-- ABSTAIN | multipart-field-grouping 4.1.2 | group-name-only-role-group-no-part-names: role=group + aria-label names the group, sub-inputs unnamed (grey area) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Date of birth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .grp { padding: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .row { display: flex; align-items: center; gap: .4rem; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .mm { width: 3rem; } .dd { width: 3rem; } .yyyy { width: 4.5rem; }
  </style>
</head>
<body>
  <h1>Verify your identity</h1>
  <!-- the group carries a name via role=group + aria-label, but the three inputs have no individual name.
       Whether the group name satisfies 4.1.2 for each control is the grey area. -->
  <div class="grp" role="group" aria-label="Date of birth">
    <div class="row">
      <input id="dob-month" class="mm" type="text" maxlength="2" placeholder="MM">
      <span>/</span>
      <input id="dob-day" class="dd" type="text" maxlength="2" placeholder="DD">
      <span>/</span>
      <input id="dob-year" class="yyyy" type="text" maxlength="4" placeholder="YYYY">
    </div>
  </div>
</body>
</html>
