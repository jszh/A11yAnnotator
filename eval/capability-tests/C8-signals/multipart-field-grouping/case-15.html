<!-- NEGATIVE | multipart-field-grouping 4.1.2 | otp-aria-label-each-in-named-group-ok: each OTP box aria-label "Digit N" inside role=group with a name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verification</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .otp { display: flex; gap: .5rem; margin: 1rem 0; }
    .otp input { width: 2.5rem; height: 2.5rem; text-align: center; font-size: 1.2rem; border: 1px solid #888; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Enter the code we texted you</h1>
  <!-- group named "Verification code"; each box individually named "Digit N" -->
  <div class="otp" role="group" aria-label="Verification code">
    <input name="otp1" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
    <input name="otp2" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
    <input name="otp3" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
    <input name="otp4" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
    <input name="otp5" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
    <input name="otp6" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
  </div>
</body>
</html>
