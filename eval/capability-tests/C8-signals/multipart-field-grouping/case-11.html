<!-- POSITIVE | multipart-field-grouping 4.1.2 | aria-labelledby-broken-ids: aria-labelledby points to NON-EXISTENT ids, so no name resolves -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account number</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { width: 4rem; padding: .4rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Add a payee</h1>
  <p>Account number</p>
  <!-- each input references a labelledby id that does not exist in the DOM -->
  <div class="row">
    <input id="acct1" type="text" maxlength="4" aria-labelledby="lbl-acct1">
    <span>-</span>
    <input id="acct2" type="text" maxlength="4" aria-labelledby="lbl-acct2">
    <span>-</span>
    <input id="acct3" type="text" maxlength="4" aria-labelledby="lbl-acct3">
  </div>
</body>
</html>
