<!-- NEGATIVE | multipart-field-grouping 4.1.2 | single-combined-input-ok: NOT split — one input for the whole value, trivially named -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phone entry</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: .3rem; }
    input { width: 14rem; padding: .5rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Contact number</h1>
  <!-- a single combined control, fully named; nothing is split so each "part" is moot -->
  <label for="phone-full">Phone number (including area code)</label>
  <input id="phone-full" type="tel" placeholder="(555) 123-4567" autocomplete="tel">
</body>
</html>
