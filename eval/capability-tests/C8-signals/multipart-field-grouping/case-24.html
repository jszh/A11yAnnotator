<!-- NEGATIVE | multipart-field-grouping 4.1.2 | native-date-input-ok: single native <input type=date>, one named control -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Date of birth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-bottom: .3rem; }
    input { padding: .5rem; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Profile</h1>
  <!-- the browser renders M/D/Y spinners, but it is ONE labelled control; no separate unnamed inputs exist -->
  <label for="dob">Date of birth</label>
  <input id="dob" type="date">
</body>
</html>
