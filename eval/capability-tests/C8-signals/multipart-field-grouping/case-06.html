<!-- POSITIVE | multipart-field-grouping 4.1.2 | time-hhmm-no-names: time hh/mm two inputs, no names -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Appointment</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { width: 3rem; padding: .4rem; text-align: center; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Book a slot</h1>
  <p>Preferred time</p>
  <!-- hour + minute inputs, neither named; the ":" is decorative text -->
  <div class="row">
    <input id="time-hh" type="text" inputmode="numeric" maxlength="2">
    <span aria-hidden="true">:</span>
    <input id="time-mm" type="text" inputmode="numeric" maxlength="2">
  </div>
</body>
</html>
