<!-- POSITIVE | multipart-field-grouping 4.1.2 | date-mdy-placeholder-only: M/D/Y as 3 inputs, placeholder-only (MM/DD/YYYY are not accessible names) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Date of birth</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .4rem; margin: 1rem 0; }
    input { padding: .4rem; border: 1px solid #888; border-radius: 4px; }
    .mm { width: 3rem; } .dd { width: 3rem; } .yyyy { width: 4.5rem; }
  </style>
</head>
<body>
  <h1>Verify your identity</h1>
  <p>Date of birth</p>
  <!-- placeholders are NOT accessible names; no label/aria-label; no fieldset -->
  <div class="row">
    <input id="dob-month" class="mm" type="text" placeholder="MM" maxlength="2">
    <span>/</span>
    <input id="dob-day" class="dd" type="text" placeholder="DD" maxlength="2">
    <span>/</span>
    <input id="dob-year" class="yyyy" type="text" placeholder="YYYY" maxlength="4">
  </div>
</body>
</html>
