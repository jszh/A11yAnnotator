<!-- NEGATIVE | multipart-field-grouping 4.1.2 | time-per-input-label-for-ok: time hh/mm each labelled "Hour"/"Minute" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Appointment</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: flex-end; gap: .6rem; margin: 1rem 0; }
    .field label { display: block; font-size: .8rem; margin-bottom: .25rem; }
    input { width: 3rem; padding: .4rem; text-align: center; border: 1px solid #888; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Book a slot</h1>
  <div class="row">
    <div class="field"><label for="time-hh">Hour</label><input id="time-hh" type="text" inputmode="numeric" maxlength="2"></div>
    <span>:</span>
    <div class="field"><label for="time-mm">Minute</label><input id="time-mm" type="text" inputmode="numeric" maxlength="2"></div>
  </div>
</body>
</html>
