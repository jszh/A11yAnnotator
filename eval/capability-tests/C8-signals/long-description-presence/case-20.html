<!-- NEGATIVE | long-description-presence 1.1.1 | svg-title-desc-fullsteps: a flowchart SVG with <title> + <desc> giving the full steps (H53/SVG desc) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login process</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Login process</h1>
  <!-- The SVG carries a short <title> AND a full <desc> describing every step and branch; AT exposes <desc> as the description. -->
  <svg id="login-flow" role="img" aria-labelledby="lf-title" aria-describedby="lf-desc" width="420" height="160" viewBox="0 0 420 160">
    <title id="lf-title">Login process flowchart</title>
    <desc id="lf-desc">The user enters their email and password and submits the form. If the credentials are valid, the system creates a session and redirects to the dashboard. If they are invalid, an error message is shown and the user is returned to the login form to try again. After three failed attempts the account is temporarily locked.</desc>
    <rect x="10"  y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <rect x="160" y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <rect x="310" y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <line x1="100" y1="80" x2="160" y2="80" stroke="#333"/>
    <line x1="250" y1="80" x2="310" y2="80" stroke="#333"/>
  </svg>
</body>
</html>
