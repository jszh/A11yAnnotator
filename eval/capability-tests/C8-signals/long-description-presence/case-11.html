<!-- POSITIVE | long-description-presence 1.1.1 | describedby-empty-target: aria-describedby resolves to an element that exists but is EMPTY -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Budget allocation chart</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <h1>Budget allocation</h1>
  <!-- aria-describedby points to a real element (#budget-desc) but it contains no text, so no long description is actually provided. -->
  <svg id="budget-chart" role="img" aria-label="Budget allocation by department" aria-describedby="budget-desc" width="320" height="200" viewBox="0 0 320 200">
    <rect x="30"  y="70"  width="50" height="110" fill="#1a73e8"/>
    <rect x="110" y="40"  width="50" height="140" fill="#1a73e8"/>
    <rect x="190" y="110" width="50" height="70"  fill="#1a73e8"/>
    <line x1="20" y1="180" x2="300" y2="180" stroke="#333"/>
  </svg>
  <div id="budget-desc" class="sr"></div>
</body>
</html>
