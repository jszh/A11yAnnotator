<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Temperature trend</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    figure { margin: 0; border: 1px solid #ddd; padding: 1rem; }
    figcaption { color: #333; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Temperature trend</h1>
  <figure>
    <svg id="temp-chart" role="img" aria-label="Average monthly temperature line chart" width="320" height="200" viewBox="0 0 320 200">
      <polyline points="20,160 90,140 160,90 230,60 290,100" fill="none" stroke="#e8711a" stroke-width="3"/>
      <line x1="15" y1="180" x2="300" y2="180" stroke="#333"/>
    </svg>
    <!-- figcaption is a real long description carrying the data and the trend (G74). -->
    <figcaption>Average monthly temperature in degrees Celsius: January 4, February 6, March 11, April 15, May 12. Temperatures climbed steadily from winter to a peak in April before easing slightly in May.</figcaption>
  </figure>
</body>
</html>
