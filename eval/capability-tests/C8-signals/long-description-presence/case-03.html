<!-- POSITIVE | long-description-presence 1.1.1 | flowchart-title-only: flow diagram SVG with <title> only, no <desc>, no describedby, no adjacent text equivalent -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order fulfilment process</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Order fulfilment process</h1>
  <!-- Process flowchart: title names it but gives none of the steps/branches. A <title> is a short label, not the long description the flow requires. -->
  <svg id="flow" role="img" width="420" height="160" viewBox="0 0 420 160">
    <title>Order fulfilment flowchart</title>
    <rect x="10"  y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <rect x="160" y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <rect x="310" y="55" width="90" height="50" fill="#eef" stroke="#557"/>
    <line x1="100" y1="80" x2="160" y2="80" stroke="#333"/>
    <line x1="250" y1="80" x2="310" y2="80" stroke="#333"/>
  </svg>
</body>
</html>
