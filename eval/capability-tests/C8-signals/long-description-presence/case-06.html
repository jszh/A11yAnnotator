<!-- POSITIVE | long-description-presence 1.1.1 | adjacent-table-unrelated: a complex chart with an adjacent table that is decorative/unrelated, not an equivalent -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Energy usage by source</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
    table { border-collapse: collapse; margin-top: 1.5rem; }
    th, td { border: 1px solid #ccc; padding: .35rem .6rem; }
  </style>
</head>
<body>
  <h1>Energy usage by source</h1>
  <!-- Stacked bar chart of energy by source. The adjacent table below is an unrelated office-hours table, NOT the chart's data, so no equivalent exists. -->
  <svg id="energy-chart" role="img" aria-label="Energy usage by source" width="320" height="200" viewBox="0 0 320 200">
    <rect x="40"  y="60"  width="60" height="120" fill="#1a73e8"/>
    <rect x="130" y="40"  width="60" height="140" fill="#34a853"/>
    <rect x="220" y="100" width="60" height="80"  fill="#fbbc04"/>
    <line x1="20" y1="180" x2="300" y2="180" stroke="#333"/>
  </svg>
  <table>
    <caption>Office opening hours</caption>
    <thead><tr><th>Day</th><th>Opens</th><th>Closes</th></tr></thead>
    <tbody>
      <tr><td>Monday</td><td>09:00</td><td>17:00</td></tr>
      <tr><td>Tuesday</td><td>09:00</td><td>17:00</td></tr>
    </tbody>
  </table>
</body>
</html>
