<!-- POSITIVE | long-description-presence 1.1.1 | svg-chart-no-longdesc: complex bar chart SVG role=img with only a short aria-label, no describedby/figcaption/table -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Regional sales dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .chart { border: 1px solid #ddd; padding: 1rem; }
  </style>
</head>
<body>
  <h1>Regional sales</h1>
  <div class="chart">
    <!-- Complex multi-series bar chart; aria-label "Sales chart" cannot convey the four data values. No long-desc source anywhere. -->
    <svg id="sales-chart" role="img" aria-label="Sales chart" width="320" height="200" viewBox="0 0 320 200">
      <rect x="20"  y="120" width="50" height="60"  fill="#1a73e8"/>
      <rect x="90"  y="80"  width="50" height="100" fill="#1a73e8"/>
      <rect x="160" y="40"  width="50" height="140" fill="#1a73e8"/>
      <rect x="230" y="100" width="50" height="80"  fill="#1a73e8"/>
      <line x1="15" y1="180" x2="300" y2="180" stroke="#333"/>
    </svg>
  </div>
</body>
</html>
