<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Market share figure</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    figure { margin: 0; border: 1px solid #ddd; padding: 1rem; }
    figcaption { color: #555; font-style: italic; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Market share</h1>
  <figure>
    <!-- Pie/segment chart of market share by vendor. The figcaption is a generic label, not an equivalent long description. -->
    <svg id="share-chart" role="img" aria-label="Market share by vendor" width="240" height="240" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="100" fill="#ddd"/>
      <path d="M120 120 L120 20 A100 100 0 0 1 213 153 Z" fill="#1a73e8"/>
      <path d="M120 120 L213 153 A100 100 0 0 1 60 207 Z" fill="#34a853"/>
      <path d="M120 120 L60 207 A100 100 0 0 1 120 20 Z" fill="#fbbc04"/>
    </svg>
    <figcaption>Figure 1.</figcaption>
  </figure>
</body>
</html>
