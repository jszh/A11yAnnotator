<!-- NEGATIVE | long-description-presence 1.1.1 | describedby-sibling-region-numbers: describedby to a sibling region containing the numbers -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quarterly headcount</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
    .desc-region { margin-top: 1rem; padding: .75rem; background: #f6f8fa; border: 1px solid #e1e4e8; }
  </style>
</head>
<body>
  <h1>Quarterly headcount</h1>
  <svg id="headcount" role="img" aria-label="Quarterly headcount by department" aria-describedby="headcount-desc" width="320" height="200" viewBox="0 0 320 200">
    <rect x="20"  y="100" width="50" height="80"  fill="#1a73e8"/>
    <rect x="90"  y="70"  width="50" height="110" fill="#1a73e8"/>
    <rect x="160" y="50"  width="50" height="130" fill="#1a73e8"/>
    <rect x="230" y="90"  width="50" height="90"  fill="#1a73e8"/>
    <line x1="15" y1="180" x2="300" y2="180" stroke="#333"/>
  </svg>
  <!-- describedby resolves to a sibling region that lists the per-quarter numbers (G92, sibling region option). -->
  <div id="headcount-desc" class="desc-region" role="region" aria-label="Headcount data">
    <p>Headcount by quarter: Q1 had 80 staff, Q2 grew to 110, Q3 reached a high of 130, and Q4 settled at 90. Growth was strongest between Q2 and Q3.</p>
  </div>
</body>
</html>
