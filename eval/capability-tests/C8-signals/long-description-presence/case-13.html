<!-- NEGATIVE | long-description-presence 1.1.1 | describedby-resolves-fulltext: SVG chart role=img with aria-describedby -> a paragraph giving the full data -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quarterly sales</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Quarterly sales</h1>
  <!-- aria-describedby resolves to #sales-desc which carries the full equivalent data (G92). -->
  <svg id="q-chart" role="img" aria-label="Quarterly sales bar chart" aria-describedby="sales-desc" width="320" height="200" viewBox="0 0 320 200">
    <rect x="20"  y="120" width="50" height="60"  fill="#1a73e8"/>
    <rect x="90"  y="80"  width="50" height="100" fill="#1a73e8"/>
    <rect x="160" y="40"  width="50" height="140" fill="#1a73e8"/>
    <rect x="230" y="100" width="50" height="80"  fill="#1a73e8"/>
    <line x1="15" y1="180" x2="300" y2="180" stroke="#333"/>
  </svg>
  <p id="sales-desc">Quarterly sales in thousands of units: Q1 was 30, Q2 rose to 50, Q3 peaked at 70, and Q4 fell back to 40. The strongest quarter was Q3 and the weakest was Q1.</p>
</body>
</html>
