<!-- NEGATIVE | long-description-presence 1.1.1 | img-figcaption-table-combo: complex img inside <figure> with an associated data table as the equivalent -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Survey results</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    figure { margin: 0; border: 1px solid #ddd; padding: 1rem; }
    table { border-collapse: collapse; margin-top: .75rem; }
    th, td { border: 1px solid #ccc; padding: .35rem .6rem; }
    caption { caption-side: top; text-align: left; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Survey results</h1>
  <figure>
    <!-- Placeholder bar-chart image; the correctly associated data table inside the same figure presents the equivalent values. -->
    <img id="survey-chart" src="survey-results.png" alt="Survey results by response category" width="600" height="320">
    <figcaption>
      <table>
        <caption>Survey responses by category (chart data)</caption>
        <thead><tr><th scope="col">Response</th><th scope="col">Count</th></tr></thead>
        <tbody>
          <tr><th scope="row">Very satisfied</th><td>120</td></tr>
          <tr><th scope="row">Satisfied</th><td>240</td></tr>
          <tr><th scope="row">Neutral</th><td>90</td></tr>
          <tr><th scope="row">Dissatisfied</th><td>50</td></tr>
        </tbody>
      </table>
    </figcaption>
  </figure>
</body>
</html>
