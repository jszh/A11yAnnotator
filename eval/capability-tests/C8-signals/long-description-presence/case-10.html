<!-- POSITIVE | long-description-presence 1.1.1 | details-empty: a chart with a <details> long-description container that is EMPTY (no real text) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customer satisfaction trend</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
    details { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Customer satisfaction trend</h1>
  <svg id="csat-chart" role="img" aria-label="Customer satisfaction trend line chart" width="320" height="200" viewBox="0 0 320 200">
    <polyline points="20,150 90,120 160,130 230,80 290,60" fill="none" stroke="#1a73e8" stroke-width="3"/>
    <line x1="15" y1="180" x2="300" y2="180" stroke="#333"/>
  </svg>
  <!-- The <details> looks like a long-description container but its body is empty, so no equivalent text resolves. -->
  <details>
    <summary>Chart description</summary>
  </details>
</body>
</html>
