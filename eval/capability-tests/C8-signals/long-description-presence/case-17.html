<!-- NEGATIVE | long-description-presence 1.1.1 | describedby-hidden-realtext: aria-describedby -> a visually-hidden but real long-description div -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conversion funnel</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    svg { border: 1px solid #ddd; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <h1>Conversion funnel</h1>
  <!-- aria-describedby resolves to a visually-hidden div that nonetheless contains the full equivalent text (exposed to AT). -->
  <svg id="funnel" role="img" aria-label="Conversion funnel" aria-describedby="funnel-desc" width="300" height="200" viewBox="0 0 300 200">
    <polygon points="30,20 270,20 220,80 80,80" fill="#1a73e8"/>
    <polygon points="80,90 220,90 185,150 115,150" fill="#34a853"/>
    <polygon points="115,160 185,160 165,195 135,195" fill="#fbbc04"/>
  </svg>
  <div id="funnel-desc" class="visually-hidden">Funnel stages: 10,000 visitors viewed the landing page, 3,200 added an item to the cart, 1,100 began checkout, and 540 completed a purchase, a 5.4 percent overall conversion rate.</div>
</body>
</html>
