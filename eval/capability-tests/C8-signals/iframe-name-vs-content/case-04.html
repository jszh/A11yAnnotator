<!-- POSITIVE | iframe-name-vs-content 4.1.2 | generic-title-iframe: iframe title="iframe" wrapping a chat widget; the title just names the element type -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Support</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 240px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Need help?</h1>
  <!-- title="iframe" describes the HTML element, not the live-chat content. -->
  <iframe title="iframe" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;background:#f4f6f8}.hd{background:#1a73e8;color:#fff;padding:10px;font-size:14px}.msg{margin:10px;padding:8px 10px;border-radius:10px;background:#fff;display:inline-block;font-size:13px}.me{background:#1a73e8;color:#fff;float:right}.bar{position:absolute;bottom:0;left:0;right:0;padding:8px;background:#fff;border-top:1px solid #ddd}</style></head><body><div class="hd">Live chat &mdash; Agent Mia</div><div class="msg">Hi! How can I help you today?</div><div class="bar"><input style="width:80%" placeholder="Type a message..."></div></body></html>'></iframe>
</body>
</html>
