<!-- POSITIVE | iframe-name-vs-content 4.1.2 | generic-title-frame: iframe title="frame" wrapping a contact form; generic word identifies nothing -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get in touch</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 260px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Contact</h1>
  <!-- title="frame" is generic boilerplate; it does not describe the contact form inside. -->
  <iframe title="frame" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;padding:14px}label{display:block;font-size:13px;margin:8px 0 2px}input,textarea{width:100%;padding:6px;box-sizing:border-box}button{margin-top:10px;padding:8px 14px;background:#1a73e8;color:#fff;border:0}</style></head><body><h2 style="margin:0 0 8px;font-size:16px">Send a message</h2><label>Name</label><input><label>Email</label><input><label>Message</label><textarea rows="2"></textarea><button>Send</button></body></html>'></iframe>
</body>
</html>
