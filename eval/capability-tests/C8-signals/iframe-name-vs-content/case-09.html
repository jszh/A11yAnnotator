<!-- POSITIVE | iframe-name-vs-content 4.1.2 | empty-aria-label-override: iframe has title plus aria-label="" which overrides the name to empty -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 320px; height: 200px; border: 1px solid #ccc; display:block; }
  </style>
</head>
<body>
  <h1>Local forecast</h1>
  <!-- aria-label="" takes precedence over the title per name computation, leaving NO accessible name. -->
  <iframe title="Weather widget" aria-label="" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;background:#3a7bd5;color:#fff;height:198px;text-align:center}.w{padding:24px}.t{font-size:44px;margin:4px}.c{font-size:14px}</style></head><body><div class="w"><div class="c">San Francisco</div><div class="t">18&deg;</div><div class="c">Partly cloudy &middot; H 20&deg; L 12&deg;</div></div></body></html>'></iframe>
</body>
</html>
