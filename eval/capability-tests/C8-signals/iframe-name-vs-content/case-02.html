<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Find our office</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 240px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Visit us</h1>
  <!-- title="" is an empty accessible name; H64 requires a non-empty descriptive title. -->
  <iframe id="map-frame" title="" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif}.map{background:#e8f0e8;height:220px;position:relative;overflow:hidden}.road{position:absolute;background:#fff;height:8px;width:100%;top:90px}.road2{position:absolute;background:#fff;width:8px;height:100%;left:140px}.pin{position:absolute;top:70px;left:130px;color:#d00;font-size:28px}.lbl{position:absolute;bottom:8px;left:8px;background:#fff;padding:2px 6px;font-size:12px}</style></head><body><div class="map"><div class="road"></div><div class="road2"></div><div class="pin">&#9679;</div><div class="lbl">Map &middot; 123 Main St</div></div></body></html>'></iframe>

</html>
