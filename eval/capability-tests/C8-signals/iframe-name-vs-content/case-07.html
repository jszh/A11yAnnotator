<!-- POSITIVE | iframe-name-vs-content 4.1.2 | generic-title-page: iframe title="page" wrapping an event calendar; generic non-descriptive name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Schedule</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 240px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Upcoming dates</h1>
  <!-- title="page" tells the user nothing about the calendar contents. -->
  <iframe title="page" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;padding:12px}h2{margin:0 0 8px;font-size:15px}table{border-collapse:collapse;width:100%}td{border:1px solid #ddd;height:34px;text-align:center;font-size:12px;color:#444}.hl{background:#1a73e8;color:#fff;border-radius:4px}</style></head><body><h2>June 2026</h2><table><tr><td>S</td><td>M</td><td>T</td><td>W</td><td>T</td><td>F</td><td>S</td></tr><tr><td>1</td><td>2</td><td>3</td><td>4</td><td class="hl">5</td><td>6</td><td>7</td></tr><tr><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td></tr></table></body></html>'></iframe>
</body>
</html>
