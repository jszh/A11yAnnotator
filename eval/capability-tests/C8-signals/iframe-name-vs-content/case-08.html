<!-- POSITIVE | iframe-name-vs-content 4.1.2 | numeric-id-title: iframe title="frame-1" wrapping a payment form; an ID-like token is not a description -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 250px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Complete your order</h1>
  <!-- title="frame-1" is a machine ID; it does not describe the payment form. -->
  <iframe title="frame-1" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;padding:14px}h2{margin:0 0 8px;font-size:16px}label{display:block;font-size:12px;margin:8px 0 2px}input{width:100%;padding:6px;box-sizing:border-box}.row{display:flex;gap:8px}.row>div{flex:1}button{margin-top:12px;padding:9px 16px;background:#111;color:#fff;border:0;width:100%}</style></head><body><h2>Card payment</h2><label>Card number</label><input placeholder="4242 4242 4242 4242"><div class="row"><div><label>Expiry</label><input placeholder="06/28"></div><div><label>CVC</label><input placeholder="123"></div></div><button>Pay $49.00</button></body></html>'></iframe>
</body>
</html>
