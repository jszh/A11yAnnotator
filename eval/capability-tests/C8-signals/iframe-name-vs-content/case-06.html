<!-- POSITIVE | iframe-name-vs-content 4.1.2 | generic-title-embedded-content: iframe title="embedded content" wrapping a poll widget; boilerplate name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Community poll</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 220px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Have your say</h1>
  <!-- title="embedded content" is exactly the kind of generic name H64 warns against. -->
  <iframe title="embedded content" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;padding:14px}h2{margin:0 0 10px;font-size:16px}.opt{display:block;margin:6px 0;padding:8px;border:1px solid #ccc;border-radius:6px}button{margin-top:10px;padding:8px 14px;background:#0a8;color:#fff;border:0}</style></head><body><h2>Which feature should we build next?</h2><label class="opt"><input type="radio" name="p"> Dark mode</label><label class="opt"><input type="radio" name="p"> Offline sync</label><label class="opt"><input type="radio" name="p"> Mobile app</label><button>Vote</button></body></html>'></iframe>
</body>
</html>
