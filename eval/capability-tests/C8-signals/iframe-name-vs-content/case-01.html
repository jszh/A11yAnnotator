<!-- POSITIVE | iframe-name-vs-content 4.1.2 | no-title: iframe with NO title attribute wrapping a video player UI; frame has no accessible name -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Watch the launch event</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 100%; height: 220px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Spring product launch</h1>
  <p>Replay the keynote below.</p>
  <!-- No title at all: a frame user / AT cannot tell what this embedded video is. -->
  <iframe srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif}.player{background:#111;color:#fff;height:200px;position:relative}.bigplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#e50914;text-align:center;line-height:64px;font-size:28px}.bar{position:absolute;bottom:0;left:0;right:0;height:6px;background:#555}.fill{width:35%;height:6px;background:#e50914}</style></head><body><div class="player"><div class="bigplay">&#9654;</div><div class="bar"><div class="fill"></div></div></div></body></html>'></iframe>
</body>
</html>
