<!-- POSITIVE | iframe-name-vs-content 4.1.2 | generic-title-content: iframe title="content" wrapping an embedded advertisement; says nothing specific -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daily news</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    iframe { width: 320px; height: 250px; border: 1px solid #ccc; display: block; }
  </style>
</head>
<body>
  <h1>Today's headlines</h1>
  <!-- title="content" is uninformative; the frame is a promotional ad. -->
  <iframe title="content" srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#ff7a00,#ff2d55);color:#fff;height:248px;text-align:center}.ad{padding:30px 16px}.ad h2{margin:0;font-size:22px}.cta{margin-top:18px;display:inline-block;background:#fff;color:#d00;padding:10px 18px;border-radius:6px;font-weight:bold}.sm{font-size:11px;position:absolute;bottom:4px;right:6px}</style></head><body><div class="ad"><h2>50% OFF SNEAKERS</h2><p>Limited time only</p><span class="cta">Shop now &#8594;</span></div><span class="sm">Advertisement</span></body></html>'></iframe>
</body>
</html>
