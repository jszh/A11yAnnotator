<!-- NEGATIVE | pointer-only-handler 2.1.1 | native-checkbox-change: a native checkbox with a change handler is keyboard-operable for free -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Terms</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: flex; align-items: center; gap: .5rem; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <!-- native checkbox: Space toggles it; the change handler reacts regardless of input modality -->
  <label><input id="agree" type="checkbox"> I agree to the terms</label>
  <p id="status">Not accepted</p>
  <script>
    document.getElementById('agree').addEventListener('change', function () {
      document.getElementById('status').textContent = this.checked ? 'Accepted' : 'Not accepted';
    });
  </script>
</body>
</html>
