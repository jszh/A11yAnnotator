<!-- POSITIVE | pointer-only-handler 2.1.1 | addeventlistener-click-no-keydown: div wired via addEventListener('click') with no keydown listener, no tabindex/role -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gallery — like photo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .like { display: inline-block; padding: .5rem 1rem; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Sunset over the bay</h1>
  <!-- click handler attached in JS; no keydown, no tabindex, no role -->
  <div id="like" class="like">♥ Like</div>
  <p id="count">0 likes</p>
  <script>
    var n = 0;
    document.getElementById('like').addEventListener('click', function () {
      n += 1;
      document.getElementById('count').textContent = n + ' likes';
    });
  </script>
</body>
</html>
