<!-- POSITIVE | pointer-only-handler 2.1.1 | onmouseup-activation: activation bound to mouseup, which the keyboard never produces -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Survey — rate us</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .star { font-size: 1.6rem; color: #bbb; cursor: pointer; }
  </style>
</head>
<body>
  <h1>How did we do?</h1>
  <!-- onmouseup activation only; no tabindex, no role, no keydown -->
  <div id="star" class="star" onmouseup="this.style.color='#f5b400'; this.textContent='★';">☆</div>
</body>
</html>
