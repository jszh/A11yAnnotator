<!-- NEGATIVE | pointer-only-handler 2.1.1 | link-styled-as-button: an <a href> styled to look like a button is still a real, keyboard-operable link -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Get started</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    a.button { display: inline-block; padding: .6rem 1.4rem; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 8px; }
    a.button:focus { outline: 3px solid #ffbf47; }
  </style>
</head>
<body>
  <h1>Ready to begin?</h1>
  <!-- looks like a button but is an <a href>: focusable and Enter activates navigation -->
  <a id="start" class="button" href="/signup">Create your account</a>
</body>
</html>
