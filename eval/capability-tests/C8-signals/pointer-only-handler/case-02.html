<!-- POSITIVE | pointer-only-handler 2.1.1 | span-onclick-styled-as-button: a <span> styled like a button with onclick, no tabindex/role/key handler -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart — apply coupon</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .btn { display: inline-block; padding: .5rem 1.1rem; background: #34a853; color: #fff; border-radius: 6px; cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <h1>Your cart</h1>
  <p>Coupon SPRING applied? Click apply.</p>
  <!-- span looks like a button but has no keyboard path at all -->
  <span id="apply" class="btn" onclick="alert('Coupon applied')">Apply coupon</span>
</body>
</html>
