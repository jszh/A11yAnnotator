<!-- POSITIVE | pointer-only-handler 2.1.1 | custom-toggle-click-only: a custom switch that flips aria-checked on click only, no key handler -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notifications</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .switch { display: inline-block; width: 48px; height: 26px; background: #ccc; border-radius: 13px; position: relative; cursor: pointer; vertical-align: middle; }
    .switch[aria-checked="true"] { background: #34a853; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .15s; }
    .switch[aria-checked="true"]::after { left: 25px; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <p>Email alerts
    <!-- role=switch + aria-checked but NO tabindex and NO keydown: a screen-reader/keyboard user cannot toggle it -->
    <span id="alerts" class="switch" role="switch" aria-checked="false" aria-label="Email alerts"></span>
  </p>
  <script>
    document.getElementById('alerts').addEventListener('click', function () {
      var on = this.getAttribute('aria-checked') === 'true';
      this.setAttribute('aria-checked', String(!on));
    });
  </script>
</body>
</html>
