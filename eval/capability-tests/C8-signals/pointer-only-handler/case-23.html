<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .plan { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; }
    .plan button { font-size: 1rem; padding: .5rem 1.1rem; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Choose a plan</h1>
  <!-- the wrapper has an onclick convenience, but the genuine operable control is a native <button> inside -->
  <div id="plan" class="plan" onclick="document.getElementById('choose').click()">
    <h2>Pro</h2>
    <p>$12 / month</p>
    <button id="choose" type="button" onclick="event.stopPropagation(); this.textContent='Selected ✓'">Choose Pro</button>
  </div>
</body>
</html>
