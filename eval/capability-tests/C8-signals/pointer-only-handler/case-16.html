<!-- NEGATIVE | pointer-only-handler 2.1.1 | div-role-tabindex-keydown: the correct ARIA-widget pattern (role=button + tabindex=0 + keydown for Enter/Space) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings — reset</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .ctl { display: inline-block; padding: .5rem 1rem; background: #d93025; color: #fff; border-radius: 6px; cursor: pointer; }
    .ctl:focus { outline: 3px solid #ffbf47; }
  </style>
</head>
<body>
  <h1>Preferences</h1>
  <!-- correct custom button: role=button, tabindex=0, AND a keydown handler that activates on Enter/Space -->
  <div id="reset" class="ctl" role="button" tabindex="0">Reset to defaults</div>
  <script>
    var btn = document.getElementById('reset');
    function activate() { alert('Reset to defaults'); }
    btn.addEventListener('click', activate);
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        activate();
      }
    });
  </script>
</body>
</html>
