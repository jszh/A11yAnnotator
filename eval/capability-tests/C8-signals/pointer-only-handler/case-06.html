<!-- POSITIVE | pointer-only-handler 2.1.1 | mousedown-only: handler bound on mousedown only, which never fires from the keyboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Editor — bold toggle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .tool { display: inline-block; width: 2.2rem; height: 2.2rem; line-height: 2.2rem; text-align: center; font-weight: 700; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Document editor</h1>
  <!-- pointer-down only: mousedown never fires on keyboard activation, and there is no tabindex/role/keydown -->
  <div id="bold" class="tool" data-active="false">B</div>
  <script>
    document.getElementById('bold').addEventListener('mousedown', function () {
      var on = this.getAttribute('data-active') === 'true';
      this.setAttribute('data-active', String(!on));
      this.style.background = on ? '' : '#dde7ff';
    });
  </script>
</body>
</html>
