<!-- POSITIVE | pointer-only-handler 2.1.1 | role-button-no-tabindex: element has role="button" and a click handler but NO tabindex, so focus is unreachable -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings — reset</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .ctl { display: inline-block; padding: .5rem 1rem; background: #d93025; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Preferences</h1>
  <!-- role=button claims the semantics but without tabindex it is NOT in the focus order, and there is no key handler either -->
  <div id="reset" class="ctl" role="button" onclick="alert('Reset to defaults')">Reset to defaults</div>
</body>
</html>
