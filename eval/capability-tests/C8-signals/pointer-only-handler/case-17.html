<!-- NEGATIVE | pointer-only-handler 2.1.1 | div-onclick-plus-equivalent-keydown: a div with onclick that ALSO has an equivalent keydown trigger -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile — follow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .follow { display: inline-block; padding: .5rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; cursor: pointer; }
    .follow:focus { outline: 3px solid #ffbf47; }
  </style>
</head>
<body>
  <h1>@designhub</h1>
  <!-- onclick inline AND a keydown handler that fires the same action; focusable via tabindex=0, role=button -->
  <div id="follow" class="follow" role="button" tabindex="0"
       onclick="this.textContent='Following'"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.textContent='Following';}">Follow</div>
</body>
</html>
