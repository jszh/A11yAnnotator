<!-- POSITIVE | pointer-only-handler 2.1.1 | icon-span-onclick: an "icon" <span> (no text) with onclick, no tabindex/role/label/key handler -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inbox</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; align-items: center; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
    .trash { font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Inbox</h1>
  <div class="row">
    <span>Receipt #8841</span>
    <!-- an icon glyph span with onclick: no tabindex, no role, no accessible name, no key handler -->
    <span id="del" class="trash" onclick="this.closest('.row').remove()">🗑</span>
  </div>
</body>
</html>
