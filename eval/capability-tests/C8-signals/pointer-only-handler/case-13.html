<!-- NEGATIVE | pointer-only-handler 2.1.1 | native-button-onclick: a native <button> with onclick is keyboard-operable for free -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter — dismiss banner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .promo { background: #eef3ff; border: 1px solid #b9c8ff; padding: 1rem; border-radius: 8px; }
    .close { margin-top: .5rem; padding: .4rem .9rem; background: #1a73e8; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Subscribe to our newsletter</h1>
  <div class="promo">
    <p>Get weekly updates in your inbox.</p>
    <!-- native button: focusable and Enter/Space activate it automatically -->
    <button id="dismiss" type="button" class="close" onclick="this.closest('.promo').remove()">Dismiss</button>
  </div>
</body>
</html>
