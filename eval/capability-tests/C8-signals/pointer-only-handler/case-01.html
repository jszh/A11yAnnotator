<!-- POSITIVE | pointer-only-handler 2.1.1 | div-onclick-no-tabindex: a <div> with an inline onclick and no tabindex / role / key handler -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter — dismiss banner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .promo { background: #eef3ff; border: 1px solid #b9c8ff; padding: 1rem; border-radius: 8px; }
    .close { display: inline-block; margin-top: .5rem; padding: .4rem .9rem; background: #1a73e8; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Subscribe to our newsletter</h1>
  <div class="promo">
    <p>Get weekly updates in your inbox.</p>
    <!-- mouse-only: not focusable (no tabindex), no role, no keydown -->
    <div id="dismiss" class="close" onclick="this.closest('.promo').remove()">Dismiss</div>
  </div>
</body>
</html>
