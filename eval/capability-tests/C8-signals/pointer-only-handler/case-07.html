<!-- POSITIVE | pointer-only-handler 2.1.1 | anchor-no-href-onclick: <a> WITHOUT href acting as a button via onclick; not keyboard-focusable -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Help — open chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    a.fakebtn { color: #1a73e8; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Support</h1>
  <p>Need a hand?
    <!-- an <a> with NO href is not in the tab order and emulates a link/button via script only -->
    <a id="chat" class="fakebtn" onclick="alert('Opening live chat…')">Chat with us</a>
  </p>
</body>
</html>
