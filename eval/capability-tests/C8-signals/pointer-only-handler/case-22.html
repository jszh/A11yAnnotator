<!-- NEGATIVE | pointer-only-handler 2.1.1 | form-submit-button: a real <button type="submit"> in a form is keyboard-operable for free -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .75rem 0 .25rem; }
    input, button { font-size: 1rem; padding: .5rem; }
    button { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form onsubmit="return false">
    <label for="email">Email</label>
    <input id="email" type="email" name="email">
    <!-- native submit button: focusable, Enter/Space activate, and Enter in a field also submits -->
    <button id="submit" type="submit">Sign in</button>
  </form>
</body>
</html>
