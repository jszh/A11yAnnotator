<!-- NEGATIVE | pointer-only-handler 2.1.1 | native-select-change: a real <select> with a change handler is keyboard-operable for free -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sort options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    select { font-size: 1rem; padding: .4rem; }
  </style>
</head>
<body>
  <h1>Products</h1>
  <label for="sort">Sort by</label>
  <!-- native select: arrow keys and Enter operate it; change handler is modality-agnostic -->
  <select id="sort" onchange="document.getElementById('out').textContent='Sorted by '+this.value">
    <option value="price">Price</option>
    <option value="rating">Rating</option>
    <option value="newest">Newest</option>
  </select>
  <p id="out">Sorted by price</p>
</body>
</html>
