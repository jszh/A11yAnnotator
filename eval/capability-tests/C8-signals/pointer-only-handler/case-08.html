<!-- POSITIVE | pointer-only-handler 2.1.1 | clickable-card: a whole card <div> is clickable to navigate, with no tabindex/role/key handler -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Articles</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; cursor: pointer; }
    .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>Latest articles</h1>
  <!-- the entire card navigates on click; keyboard users cannot reach or activate it -->
  <div id="card" class="card" onclick="location.href='/articles/42'">
    <h2>How we cut load time in half</h2>
    <p>An engineering deep-dive into our caching layer.</p>
  </div>
</body>
</html>
