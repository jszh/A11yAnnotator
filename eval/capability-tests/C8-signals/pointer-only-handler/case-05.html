<!-- POSITIVE | pointer-only-handler 2.1.1 | tabindex0-onclick-no-keydown: div is focusable (tabindex=0) but has only onclick, so Enter/Space do nothing -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile — follow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .follow { display: inline-block; padding: .5rem 1.2rem; background: #1a73e8; color: #fff; border-radius: 6px; cursor: pointer; }
    .follow:focus { outline: 3px solid #ffbf47; }
  </style>
</head>
<body>
  <h1>@designhub</h1>
  <!-- focusable via tabindex=0, but only a click handler: pressing Enter or Space while focused does NOTHING -->
  <div id="follow" class="follow" tabindex="0" role="button" onclick="this.textContent='Following'">Follow</div>
</body>
</html>
