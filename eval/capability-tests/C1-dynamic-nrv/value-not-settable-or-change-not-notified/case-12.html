<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>4.1.2 value-not-settable-or-change-not-notified case 12</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:40px;max-width:620px;color:#1a1a1a}
  h1{font-size:20px}
  button,[role=button]{font:inherit;padding:9px 16px;cursor:pointer;border:1px solid #555;background:#f4f4f4;border-radius:6px}
  [role=switch],[role=checkbox]{display:inline-block}
  .panel{border:1px solid #bbb;padding:10px;margin-top:8px;background:#fafafa}
  .icon{display:inline-block;width:1em;height:1em;vertical-align:-2px}
  .slider{position:relative;width:240px;height:28px;border:1px solid #555;border-radius:14px;background:#eee;outline-offset:3px}
  .thumb{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:#356;left:2px}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  output,.val{font-variant-numeric:tabular-nums;font-weight:600}
  .stepper button{min-width:40px}
  [aria-pressed=true]{background:#356;color:#fff}
  .on{background:#356;color:#fff}
</style></head>
<body>
<!-- 4.1.2 POSITIVE | value-not-settable-or-change-not-notified | aria-valuenow-non-numeric -->
  <h1>Rating</h1>
  <div id="sl" role="slider" tabindex="0" aria-label="Rating" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3"
    class="slider" style="width:120px" onkeydown="key(event)"><span class="thumb" id="th" style="left:58px"></span></div>
  <span class="val" id="v">3 stars</span>
<script>
var val=3;function key(e){if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();
  val=e.key==='ArrowRight'?Math.min(5,val+1):Math.max(1,val-1);
  document.getElementById('th').style.left=((val-1)*28+2)+'px';document.getElementById('v').textContent=val+' stars';
  /* BUG: aria-valuenow is set to a non-numeric string like "3 stars", which is invalid for aria-valuenow (must be a number); the numeric value is not programmatically determinable. */
  document.getElementById('sl').setAttribute('aria-valuenow',val+' stars');}
</script>
</body></html>
