<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looks read-only but is editable (trap)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<label>Display name
  <input type="text" value="alex" style="display:block;margin-top:6px;padding:8px;width:60%;background:#fff;border:1px solid #989898;color:#1a1a1a">
</label>
<p>No readonly/disabled attribute — the field is editable.</p>
</main>
</body>
</html>
