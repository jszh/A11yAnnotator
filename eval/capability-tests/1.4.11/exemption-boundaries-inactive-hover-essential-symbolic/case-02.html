<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aria-disabled but still operable (trap)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<button class="btn" style="background:#fff;border:2px solid #989898;color:#1a1a1a" aria-disabled="true" tabindex="0" onclick="void 0">Continue</button>
<p>aria-disabled is set, but the control is still focusable and still responds to activation.</p>
</main>
</body>
</html>
