<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unselected tab no indicator (exempt state)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<div role="tablist" style="display:flex;gap:4px">
  <button role="tab" aria-selected="true" class="btn" style="background:#fff;border-bottom:3px solid #1a4971;color:#1a1a1a">Overview</button>
  <button role="tab" aria-selected="false" class="btn" style="background:#fff;border-bottom:3px solid #f5f5f5;color:#1a1a1a">Details</button>
</div>
<p>The selected tab has a high-contrast underline; the unselected tab's faint underline carries no required state.</p>
</main>
</body>
</html>
