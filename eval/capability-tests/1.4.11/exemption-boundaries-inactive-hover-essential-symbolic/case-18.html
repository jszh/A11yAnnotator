<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand logo essential colors (exempt)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<svg width="160" height="60" viewBox="0 0 160 60" role="img" aria-label="Pale Co.">
  <rect width="160" height="60" fill="#ffffff"></rect>
  <!-- the brand mark is intentionally pale; the logo's specific appearance is essential -->
  <circle cx="30" cy="30" r="18" fill="#f0f0f0" stroke="#e2e2e2"></circle>
  <text x="58" y="38" font-size="22" fill="#1a1a1a">Pale Co.</text>
</svg>
<p>The pale mark is the registered brand; its presentation is essential.</p>
</main>
</body>
</html>
