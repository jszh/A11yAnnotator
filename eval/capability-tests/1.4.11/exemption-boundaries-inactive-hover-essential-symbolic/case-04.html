<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selected-tab indicator low contrast (not exempt)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<div role="tablist" style="display:flex;gap:4px">
  <button role="tab" aria-selected="true" class="btn" style="background:#fff;border-bottom:3px solid #a6a6a6;color:#1a1a1a">Overview</button>
  <button role="tab" aria-selected="false" class="btn" style="background:#fff;border-bottom:3px solid transparent;color:#1a1a1a">Details</button>
</div>
<p>The underline marks which tab is selected.</p>
</main>
</body>
</html>
