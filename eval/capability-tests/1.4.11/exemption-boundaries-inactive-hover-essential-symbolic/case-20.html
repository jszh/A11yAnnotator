<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resting state compliant; hover-only faint glow</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<style>
  .h:hover { box-shadow: 0 0 0 2px #f2f2f2; }
</style>
<button class="btn h" style="background:#fff;border:2px solid #1a4971;color:#1a1a1a">Edit</button>
<p>At rest the border is high contrast (#1a4971). A faint glow appears only on hover and is not required to perceive or operate the control.</p>
</main>
</body>
</html>
