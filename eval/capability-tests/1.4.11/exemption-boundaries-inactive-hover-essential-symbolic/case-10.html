<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>'Brand' faint divider that carries grouping meaning (not essential)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<section>
  <h2>Account</h2>
  <div>Email: alex@example.com</div>
  <!-- faint divider that groups settings; presentation is a brand choice, not essential -->
  <div style="height:2px;background:#eeeeee;margin:10px 0"></div>
  <h2>Security (separate group)</h2>
  <div>Two-factor: on</div>
</section>
</main>
</body>
</html>
