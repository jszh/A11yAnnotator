<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disabled native button low contrast (exempt)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<button class="btn" disabled style="background:#fafafa;border:2px solid #cfcfcf;color:#b0b0b0">Submit order</button>
<p>This button has the <code>disabled</code> attribute; it is not focusable and does nothing.</p>
</main>
</body>
</html>
