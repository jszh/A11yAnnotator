<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom checkbox (not default UA) low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<label style="display:flex;gap:8px;align-items:center">
  <span role="checkbox" aria-checked="true" tabindex="0" style="width:18px;height:18px;display:inline-block;border:2px solid #989898;border-radius:3px;position:relative">
    <span style="position:absolute;left:4px;top:0;color:#989898">&#10003;</span>
  </span>
  I agree to the terms
</label>
</main>
</body>
</html>
