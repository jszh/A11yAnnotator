<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looks disabled but is operable (trap)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<p>This action button is greyed but fully clickable.</p>
<button class="btn" style="background:#fafafa;border:2px solid #989898;color:#9a9a9a" onclick="void 0" tabindex="0">Submit order</button>
<p>It has no <code>disabled</code> attribute, is in the tab order, and fires on click.</p>
</main>
</body>
</html>
