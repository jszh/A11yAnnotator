<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepper current-step marker low contrast (meaning-bearing)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<ol style="list-style:none;display:flex;gap:24px;padding:0">
  <li><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#1a1a1a"></span> Cart</li>
  <li><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #a6a6a6"></span> Shipping (current)</li>
  <li><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #1a1a1a"></span> Payment</li>
</ol>
</main>
</body>
</html>
