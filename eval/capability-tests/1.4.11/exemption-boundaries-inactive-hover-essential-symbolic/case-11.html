<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom widget focus ring low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<div tabindex="0" class="btn" style="background:#fff;border:2px solid #1a1a1a;outline:2px solid #989898;outline-offset:2px;color:#1a1a1a">Custom control (focused)</div>
<p>The shown outline is the focus indicator in its focused state.</p>
</main>
</body>
</html>
