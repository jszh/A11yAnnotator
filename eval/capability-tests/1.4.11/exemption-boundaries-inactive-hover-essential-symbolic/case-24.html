<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Default UA focus ring (exempt)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<a href="#">A normal link that uses the browser's default focus ring when tabbed to.</a>
<p>The author has not overridden :focus / outline; the focus indicator is the user agent default.</p>
</main>
</body>
</html>
