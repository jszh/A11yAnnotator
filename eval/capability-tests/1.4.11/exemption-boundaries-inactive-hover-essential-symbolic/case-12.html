<!DOCTYPE html>
<html lang="en">
<head>

<title>Status badge outline low contrast (meaning-bearing)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<span style="display:inline-block;padding:2px 8px;border:2px solid #989898;border-radius:10px;color:#1a1a1a;font-size:12px">NEW</span>
<span> Feature available</span>
<p>The badge outline distinguishes the badge from surrounding text.</p>
</main>
