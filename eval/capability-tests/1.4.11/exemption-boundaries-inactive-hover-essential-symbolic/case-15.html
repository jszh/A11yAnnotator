<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Default UA checkbox/radio (exempt)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<form>
  <label><input type="checkbox"> Subscribe</label><br>
  <label><input type="radio" name="r"> Option A</label>
  <label><input type="radio" name="r"> Option B</label>
</form>
<p>Native controls with default user-agent styling; no author CSS applied to their visuals.</p>
</main>
</body>
</html>
