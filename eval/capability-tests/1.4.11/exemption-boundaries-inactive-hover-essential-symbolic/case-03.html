<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon-only button, low-contrast glyph carries meaning (trap)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<p>Delete the selected item (icon-only control).</p>
<button class="btn" style="background:#fff;border:1px solid #1a1a1a" aria-label="Delete">
  <svg width="20" height="20" viewBox="0 0 20 20" role="img" aria-label="Delete">
    <!-- trash glyph #a6a6a6 vs white ~2.5:1 -->
    <path d="M4 6 H16 M7 6 V4 H13 V6 M6 6 L7 17 H13 L14 6" fill="none" stroke="#a6a6a6" stroke-width="1.6"></path>
  </svg>
</button>
</main>
</body>
</html>
