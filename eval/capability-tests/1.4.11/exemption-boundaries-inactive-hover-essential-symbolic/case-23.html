<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Required color scale shown WITH redundant numeric labels (exempt as redundant)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; border:none; }
  
</style>
</head>
<body>
<main class="case">
<div style="display:flex;align-items:center;gap:6px">
  <span style="width:30px;height:18px;background:#dfe7ef;display:inline-block"></span><span>0&ndash;10</span>
  <span style="width:30px;height:18px;background:#cdd9e6;display:inline-block"></span><span>10&ndash;20</span>
  <span style="width:30px;height:18px;background:#bccadf;display:inline-block"></span><span>20&ndash;30</span>
</div>
<p>Adjacent swatches are similar, but every band is labeled with its numeric range.</p>
</main>
</body>
</html>
