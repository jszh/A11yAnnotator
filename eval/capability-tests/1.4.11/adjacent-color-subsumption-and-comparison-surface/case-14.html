<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input on tinted panel, outline passes</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div class="card" style="background:#fff8e1">
  <input type="text" style="display:block;padding:8px;width:60%;background:#fff8e1;border:2px solid #5a3e1b;color:#1a1a1a">
</div>
</main>
</body>
</html>
