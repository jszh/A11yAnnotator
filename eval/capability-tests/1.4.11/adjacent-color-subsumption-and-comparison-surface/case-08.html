<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status dot on shaded table row (fails vs row shade)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<table style="border-collapse:collapse;width:60%">
  <tr style="background:#ffffff"><td style="padding:8px">Order 1</td><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#767676"></span></td></tr>
  <tr style="background:#a9b7c6"><td style="padding:8px">Order 2</td><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#767676"></span></td></tr>
</table>
<p>The status dot color means 'pending'.</p>
</main>
</body>
</html>
