<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout border on dark scrim (fails vs scrim)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div style="background:#444444;padding:30px;border-radius:8px">
  <div style="background:#444444;border:2px solid #6e6e6e;border-radius:6px;padding:14px;color:#eee">
    Tip: drag to reorder.
  </div>
</div>
</main>
</body>
</html>
