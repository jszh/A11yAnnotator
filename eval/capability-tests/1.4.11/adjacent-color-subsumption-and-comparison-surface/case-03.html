<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toggle on colored card (track edge fails vs card)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div class="card" style="background:#9fb0c9">
  <span>Notifications</span>
  <svg width="56" height="32" viewBox="0 0 56 32" role="img" aria-label="toggle off" style="vertical-align:middle">
    <rect x="2" y="6" width="52" height="20" rx="10" fill="#9fb0c9" stroke="#767676" stroke-width="2"></rect>
    <circle cx="16" cy="16" r="8" fill="#767676"></circle>
  </svg>
</div>
</main>
</body>
</html>
