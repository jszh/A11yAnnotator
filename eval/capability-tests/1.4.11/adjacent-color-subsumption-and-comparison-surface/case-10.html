<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress fill vs track (fails vs track)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div style="width:60%;height:16px;background:#a9b7c6;border-radius:8px;overflow:hidden">
  <div style="width:55%;height:100%;background:#8a8a8a"></div>
</div>
<p>The filled portion indicates progress; its edge against the unfilled track shows how far along.</p>
</main>
</body>
</html>
