<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Border over gradient card (abstain)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div class="card" style="background:linear-gradient(135deg,#f6d365 0%,#5a3e1b 100%)">
  <button class="btn" style="background:transparent;border:2px solid #6e6e6e;color:#1a1a1a">Continue</button>
</div>
</main>
</body>
</html>
