<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost button on colored card (boundary vs card fails)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div class="card" style="background:#a9b7c6">
  <p style="margin:0 0 12px">Settings</p>
  <button class="btn" style="background:transparent;border:2px solid #767676;color:#1a1a1a">Continue</button>
</div>
</main>
</body>
</html>
