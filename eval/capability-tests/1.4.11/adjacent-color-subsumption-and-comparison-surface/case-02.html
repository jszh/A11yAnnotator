<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input outline on tinted panel (fails vs panel)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div class="card" style="background:#c0c0c0">
  <label>Search</label>
  <input type="text" style="display:block;margin-top:6px;padding:8px;width:60%;background:#c0c0c0;border:2px solid #808080;color:#1a1a1a">
</div>
</main>
</body>
</html>
