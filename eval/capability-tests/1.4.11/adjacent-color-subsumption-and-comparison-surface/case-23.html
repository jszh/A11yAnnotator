<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button overhanging card onto page, governing edge passes</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<div style="position:relative">
  <div class="card" style="background:#a9b7c6;width:160px">card</div>
  <button class="btn" style="position:relative;margin-top:-14px;left:120px;background:#ffffff;border:2px solid #595959;color:#1a1a1a">OK</button>
</div>
</main>
</body>
</html>
