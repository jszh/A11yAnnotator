<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus ring on colored selected row (fails vs row)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 680px; }
  .btn { display:inline-block; padding:10px 18px; border-radius:6px; font-size:15px; }
  .card { padding:24px; border-radius:10px; }
  
</style>
</head>
<body>
<main class="case">
<ul style="list-style:none;padding:0;width:60%">
  <li style="padding:10px;background:#ffffff">Inbox</li>
  <li style="padding:10px;background:#c0c0c0;outline:2px solid #808080;outline-offset:-2px">Drafts (selected, focused)</li>
  <li style="padding:10px;background:#ffffff">Sent</li>
</ul>
</main>
</body>
</html>
