<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | state-indicator-contrast-adjacent-surface | DEFAULT user-agent checkbox/radio — UA-styling exemption -->
<html lang="en"><head><meta charset="utf-8"><title>Native checked controls (exempt)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* Native checkbox and radio in their CHECKED state, with NO author styling. The checked tick/dot is drawn
     by the browser's default user-agent stylesheet — exempt from 1.4.11. */
  label { display:block; margin:12px 0; }
</style></head>
<body>
  <label><input type="checkbox" checked> I agree to the terms</label>
  <fieldset>
    <legend>Delivery</legend>
    <label><input type="radio" name="d" checked> Standard</label>
    <label><input type="radio" name="d"> Express</label>
  </fieldset>
</body></html>
