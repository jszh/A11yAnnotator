<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | state-indicator-contrast-adjacent-surface | near-threshold PASS vs adjacent knob (3.056:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Near-threshold passing ON toggle</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* ON-track #34a853 vs the white knob = 3.056:1 — just OVER 3:1. Adversarial near-miss that must read PASS.
     (Mirror of the boundary near-threshold pass; checks the runner's boundary direction is correct.) */
  .switch { position:relative; display:inline-block; width:56px; height:30px; background:#34a853; border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#ffffff; border-radius:50%; }
</style></head>
<body>
  <span class="switch" role="switch" aria-checked="true" aria-label="Sync"><span class="knob"></span></span>
</body></html>
