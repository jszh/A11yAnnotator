<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (no barrier) | state-indicator-contrast-adjacent-surface | runnerShould=ABSTAIN: tick over GRADIENT box, truth PASSES -->
<html lang="en"><head><meta charset="utf-8"><title>Dark tick over gradient box (passes)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* Same gradient-fill structure as the abstain POSITIVE, but the tick is dark #102a52. It is >= 4.5:1 against
     the LIGHTEST point of the gradient, so worst-side still passes. The runner cannot reduce the gradient fill
     to one flat color and SHOULD abstain; the human/vision truth is PASS. */
  .box { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px;
         background:linear-gradient(135deg,#1a73e8 0%, #cfe0fb 100%); border-radius:4px; }
  .tick { color:#102a52; font:bold 18px/1 system-ui; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="box" role="checkbox" aria-checked="true"><span class="tick" aria-hidden="true">&#10003;</span></span>
    Subscribe to the newsletter
  </label>
</body></html>
