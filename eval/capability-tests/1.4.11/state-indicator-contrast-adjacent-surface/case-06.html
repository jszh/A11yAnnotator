<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | ON-track green near-threshold FAIL vs knob (2.658:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Near-threshold ON toggle</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* ON-state green track #45b368 vs the white knob it abuts = 2.658:1 — just under 3:1.
     Adversarial near-miss: the on/off state cannot be told apart from the knob edge. */
  .switch { position:relative; display:inline-block; width:56px; height:30px; background:#45b368; border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#ffffff; border-radius:50%; }
</style></head>
<body>
  <span class="switch" role="switch" aria-checked="true" aria-label="Notifications"><span class="knob"></span></span>
</body></html>
