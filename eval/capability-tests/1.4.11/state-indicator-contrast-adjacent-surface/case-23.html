<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | state-indicator-contrast-adjacent-surface | selected-tab underline clearly passes vs neutral strip (4.047:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Tab underline clearly passing</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:0; }
  /* Underline #1a73e8 vs the neutral strip #f1f3f4 it sits on = 4.047:1 — clearly perceivable selected state. */
  .tabs { display:flex; background:#f1f3f4; padding:0 12px; }
  .tab { padding:14px 18px; color:#202020; position:relative; }
  .tab.sel::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; background:#1a73e8; }
</style></head>
<body>
  <div class="tabs" role="tablist">
    <span class="tab sel" role="tab" aria-selected="true">Overview</span>
    <span class="tab" role="tab" aria-selected="false">Reviews</span>
    <span class="tab" role="tab" aria-selected="false">Specs</span>
  </div>
</body></html>
