<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | selected-tab underline vs colored tab strip (1.547:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Tab underline vs tab strip</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:0; }
  /* The selected tab is shown ONLY by an underline. Its adjacent surface is the blue tab strip #5a8fe0,
     not the page. Underline #8ab4f8 vs strip #5a8fe0 = 1.547:1 (FAIL). Note the underline vs the white page
     below it is 2.1:1 too, but the determinant adjacency is the strip the underline sits on. */
  .tabs { display:flex; background:#5a8fe0; padding:0 12px; }
  .tab { padding:14px 18px; color:#ffffff; position:relative; }
  .tab.sel::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; background:#8ab4f8; }
</style></head>
<body>
  <div class="tabs" role="tablist">
    <span class="tab sel" role="tab" aria-selected="true">Overview</span>
    <span class="tab" role="tab" aria-selected="false">Reviews</span>
    <span class="tab" role="tab" aria-selected="false">Specs</span>
  </div>
</body></html>
