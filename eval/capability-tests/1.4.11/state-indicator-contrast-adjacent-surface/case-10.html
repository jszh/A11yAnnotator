<!DOCTYPE html>
<!-- 1.4.11 POSITIVE (real barrier) | state-indicator-contrast-adjacent-surface | runnerShould=ABSTAIN: underline over a PHOTO/patterned strip -->
<html lang="en"><head><meta charset="utf-8"><title>Tab underline over patterned strip</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:0; }
  /* The selected-tab underline sits on a busy patterned strip (stand-in for a photographic banner). No flat
     adjacent color exists, so the runner must ABSTAIN. Truth: the light #e7eef9 underline disappears wherever
     it crosses the lighter tiles of the pattern — selected state not perceivable along its run. */
  .strip {
    display:flex; padding:0 12px;
    background: repeating-linear-gradient(90deg,#3f5d8a 0 18px,#dfe7f3 18px 36px);
  }
  .tab { padding:14px 18px; color:#ffffff; text-shadow:0 1px 2px rgba(0,0,0,.6); position:relative; }
  .tab.sel::after { content:""; position:absolute; left:8px; right:8px; bottom:0; height:3px; background:#e7eef9; }
</style></head>
<body>
  <div class="strip" role="tablist">
    <span class="tab sel" role="tab" aria-selected="true">Home</span>
    <span class="tab" role="tab" aria-selected="false">Trips</span>
    <span class="tab" role="tab" aria-selected="false">Saved</span>
  </div>
</body></html>
