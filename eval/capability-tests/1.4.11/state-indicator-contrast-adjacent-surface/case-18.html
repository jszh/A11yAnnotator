<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | state-indicator-contrast-adjacent-surface | semi-transparent ON-track composites ABOVE 3:1 (3.789:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Translucent ON-track that still passes</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The ON-track uses rgba(46,125,70,0.85). Over the white page it composites to #4d9162, which is 3.789:1
     vs the white knob it abuts — passes. Tests that the runner composites the alpha (against the known flat
     backdrop) instead of bailing as "translucent → inconclusive". */
  .switch { position:relative; display:inline-block; width:56px; height:30px;
            background:rgba(46,125,70,0.85); border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#ffffff; border-radius:50%; }
</style></head>
<body>
  <span class="switch" role="switch" aria-checked="true" aria-label="Backups"><span class="knob"></span></span>
</body></html>
