<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | state-indicator-contrast-adjacent-surface | ESSENTIAL: color-name swatch picker, low contrast is the information -->
<html lang="en"><head><meta charset="utf-8"><title>Color picker swatches (essential)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* A color picker: each swatch IS the choosable color, and the SELECTED swatch is marked by a ring. The
     near-white "Snow" swatch #f7f7f7 has low contrast vs the page (1.05:1), but presenting the true color is
     ESSENTIAL — 1.4.11 exempts presentations essential to the information. The SELECTION indicator itself (the
     dark ring #303030 around the chosen swatch) is a separate, passing cue (>=7:1 vs the swatch). No barrier. */
  .grid { display:flex; gap:14px; }
  .sw { width:40px; height:40px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .sw.sel { outline:3px solid #303030; outline-offset:2px; }
  .a { background:#f7f7f7; } .b { background:#1a73e8; } .c { background:#d93025; }
</style></head>
<body>
  <p>Theme color:</p>
  <div class="grid" role="radiogroup" aria-label="Color">
    <span class="sw a sel" role="radio" aria-checked="true" aria-label="Snow"></span>
    <span class="sw b" role="radio" aria-checked="false" aria-label="Blue"></span>
    <span class="sw c" role="radio" aria-checked="false" aria-label="Red"></span>
  </div>
</body></html>
