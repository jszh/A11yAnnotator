<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | OFF-track grey near-threshold FAIL vs page (2.958:1) -->
<html lang="en"><head><meta charset="utf-8"><title>OFF toggle track vs page</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The OFF state of an ENABLED switch. The OFF track is the state indicator; its adjacent surface is the
     white page. Track #969696 vs page #ffffff = 2.958:1 (just under 3:1). The control is active (not disabled),
     so the exemption does not apply — the off state's boundary fails. */
  .switch { position:relative; display:inline-block; width:56px; height:30px; background:#ffffff;
            border:2px solid #969696; border-radius:15px; }
  .knob   { position:absolute; top:2px; left:2px; width:24px; height:24px; background:#969696; border-radius:50%; }
</style></head>
<body>
  <span class="switch" role="switch" aria-checked="false" aria-label="Auto-renew"><span class="knob"></span></span>
</body></html>
