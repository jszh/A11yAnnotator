<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | selected-chip ring vs adjacent chip fill (2.184:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Selected chip ring vs fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* In a multi-select chip group, the SELECTED chip is indicated by a 2px inner ring. Its adjacent surface
     is the chip's own green fill #6cc187, not the page. Ring #ffffff vs fill #6cc187 = 2.184:1 (FAIL) — you
     cannot tell the selected chip from the others. */
  .chips { display:flex; gap:10px; }
  .chip { padding:8px 16px; border-radius:16px; background:#e0e0e0; color:#333; }
  .chip.sel { background:#6cc187; color:#08381c; box-shadow:inset 0 0 0 2px #ffffff; }
</style></head>
<body>
  <div class="chips" role="group" aria-label="Toppings">
    <span class="chip" role="button" aria-pressed="false">Cheese</span>
    <span class="chip sel" role="button" aria-pressed="true">Mushroom</span>
    <span class="chip" role="button" aria-pressed="false">Onion</span>
  </div>
</body></html>
