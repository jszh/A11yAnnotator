<!DOCTYPE html>
<!-- 1.4.11 POSITIVE (real barrier) | state-indicator-contrast-adjacent-surface | runnerShould=ABSTAIN: tick over a GRADIENT box fill -->
<html lang="en"><head><meta charset="utf-8"><title>Tick over gradient box fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The box fill is a GRADIENT, so the deterministic runner cannot reduce the tick's adjacent surface to one
     flat color and must ABSTAIN. Truth: the pale tick #c9defb melts into the light end of the gradient —
     the checked state is not perceivable along the lighter half of the box. */
  .box { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px;
         background:linear-gradient(135deg,#1a73e8 0%, #cfe0fb 100%); border-radius:4px; }
  .tick { color:#c9defb; font:bold 18px/1 system-ui; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="box" role="checkbox" aria-checked="true"><span class="tick" aria-hidden="true">&#10003;</span></span>
    Subscribe to the newsletter
  </label>
</body></html>
