<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (no barrier) | state-indicator-contrast-adjacent-surface | runnerShould=ABSTAIN: ANTI-ALIASED dot edge, truth PASSES -->
<html lang="en"><head><meta charset="utf-8"><title>Anti-aliased selected dot (passes)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The selected dot is a small circle, so its edge against the white ring interior is anti-aliased — a
     pixel-sampling runner reads blended intermediate pixels at the boundary and should ABSTAIN. The author's
     used colors give dot #14532d vs inner #ffffff = ~9:1, a clear PASS. */
  .ring { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
          background:#ffffff; border:2px solid #767676; border-radius:50%; }
  .dot { width:9px; height:9px; background:#14532d; border-radius:50%; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="ring" role="radio" aria-checked="true"><span class="dot" aria-hidden="true"></span></span>
    Pay on delivery
  </label>
</body></html>
