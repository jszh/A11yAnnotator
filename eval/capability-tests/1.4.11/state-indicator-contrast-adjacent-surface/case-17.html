<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | state-indicator-contrast-adjacent-surface | ADJACENT governs PASS though page-bg would FALSELY flag -->
<html lang="en"><head><meta charset="utf-8"><title>Adjacent passes, page would mislead</title>
<style>
  body { margin:0; background:#6cc187; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The PAGE behind the switch is green #6cc187. The ON-track is white #ffffff with a green knob #2e7d46.
     A naive page-bg checker would compare the white track to the green page (2.184:1) and wrongly FAIL it.
     But the determinant is the indicator vs its ADJACENT surface: green knob #2e7d46 vs white track = 5.07:1.
     The state is clearly perceivable — PASS. Tests that the runner uses adjacency, not the page. */
  .switch { position:relative; display:inline-block; width:56px; height:30px; background:#ffffff;
            border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#2e7d46; border-radius:50%; }
</style></head>
<body>
  <span class="switch" role="switch" aria-checked="true" aria-label="Location"><span class="knob"></span></span>
</body></html>
