<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | ADJACENT-SURFACE TRAP: track passes page, FAILS adjacent knob (2.184:1) -->
<html lang="en"><head><meta charset="utf-8"><title>ON-toggle track vs adjacent knob</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The ON state is conveyed by the green track. Its ADJACENT surface is the white knob, not the page.
     Track #6cc187 vs white knob #ffffff = 2.184:1 (FAIL). (Same track vs the dark card behind it would be
     6.48:1 — a page-bg-only checker would wrongly pass it; the adjacent knob governs.) */
  .card { background:#2b2b2b; padding:28px; border-radius:10px; display:inline-block; }
  .switch { position:relative; width:56px; height:30px; background:#6cc187; border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#ffffff; border-radius:50%; }
</style></head>
<body>
  <div class="card">
    <span class="switch" role="switch" aria-checked="true" aria-label="Wi-Fi"><span class="knob"></span></span>
  </div>
</body></html>
