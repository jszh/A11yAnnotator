<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | WORST-SIDE-GOVERNS: dot reads on outer ring but FAILS vs inner fill (1.374:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Radio dot — worst adjacency governs</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The selected dot has TWO adjacencies: the dark outer ring border (passes) and the white ring interior
     it actually sits in (FAILS). Dot #cdddf7 vs inner #ffffff = 1.374:1. The worst adjacency — the surface the
     indicator truly abuts — governs, so the selected state is not perceivable. */
  .ring { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
          background:#ffffff; border:3px solid #303030; border-radius:50%; }
  .dot { width:10px; height:10px; background:#cdddf7; border-radius:50%; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="ring" role="radio" aria-checked="true"><span class="dot" aria-hidden="true"></span></span>
    Pay with card
  </label>
</body></html>
