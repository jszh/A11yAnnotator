<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | SEMI-TRANSPARENT tick composites below 3:1 (2.226:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Translucent tick on box fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The checked tick is drawn with rgba(255,255,255,0.5). Over the box fill #1a73e8 it composites to
     #8db9f4, giving tick-vs-fill = 2.226:1 (FAIL). The runner must alpha-composite the tick against its
     ADJACENT surface (the box fill) before comparing — the page white is irrelevant. */
  .box { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
         background:#1a73e8; border-radius:4px; }
  .tick { color:rgba(255,255,255,0.5); font:bold 18px/1 system-ui; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="box" role="checkbox" aria-checked="true"><span class="tick" aria-hidden="true">&#10003;</span></span>
    Remember this device
  </label>
</body></html>
