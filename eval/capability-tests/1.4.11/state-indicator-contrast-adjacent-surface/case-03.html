<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | checkbox tick vs faint box fill (2.247:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Checkbox tick vs box fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The checked state is the white tick INSIDE the box. Its adjacent surface is the box fill #7fb0ee.
     Tick #ffffff vs fill #7fb0ee = 2.247:1 (FAIL) — the tick that signals "checked" is barely visible. */
  .box { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
         background:#7fb0ee; border-radius:4px; }
  .tick { color:#ffffff; font:bold 16px/1 system-ui; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="box" role="checkbox" aria-checked="true"><span class="tick" aria-hidden="true">&#10003;</span></span>
    Email me product updates
  </label>
</body></html>
