<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | state-indicator-contrast-adjacent-surface | state ALSO carried by a passing cue; faint accent is redundant decoration -->
<html lang="en"><head><meta charset="utf-8"><title>Redundant faint accent, sufficient primary state cue</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The selected tab's state is carried by its FILL flipping to solid #1a73e8 (4.5:1 vs the #f1f3f4 strip) —
     a sufficient, perceivable state indicator. A faint 1px top accent #d7e3f8 is purely decorative garnish and
     is NOT the information required to identify the selected state. Out of scope; no barrier. */
  .tabs { display:flex; background:#f1f3f4; padding:6px; gap:6px; border-radius:8px; }
  .tab { padding:10px 16px; border-radius:6px; color:#333; }
  .tab.sel { background:#1a73e8; color:#ffffff; border-top:1px solid #d7e3f8; }
</style></head>
<body>
  <div class="tabs" role="tablist">
    <span class="tab sel" role="tab" aria-selected="true">Inbox</span>
    <span class="tab" role="tab" aria-selected="false">Sent</span>
    <span class="tab" role="tab" aria-selected="false">Drafts</span>
  </div>
</body></html>
