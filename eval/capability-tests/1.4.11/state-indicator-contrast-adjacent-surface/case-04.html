<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | radio selected dot vs inner ring fill (1.544:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Radio dot vs inner ring</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The "selected" state is the inner dot. Its adjacent surface is the white ring interior.
     Dot #b9d2f5 vs inner #ffffff = 1.544:1 (FAIL) — the selection dot is nearly invisible. */
  .ring { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
          background:#ffffff; border:2px solid #767676; border-radius:50%; }
  .dot { width:10px; height:10px; background:#b9d2f5; border-radius:50%; }
  label { display:inline-flex; align-items:center; gap:10px; }
</style></head>
<body>
  <label>
    <span class="ring" role="radio" aria-checked="true"><span class="dot" aria-hidden="true"></span></span>
    Standard shipping
  </label>
</body></html>
