<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | state-indicator-contrast-adjacent-surface | DISABLED toggle — inactive exemption -->
<html lang="en"><head><meta charset="utf-8"><title>Disabled toggle (exempt)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* This switch is DISABLED (aria-disabled + greyed). Its ON-track #8fd6a3 vs the white knob is 1.7:1,
     below 3:1, but 1.4.11 exempts inactive/disabled components. No barrier. An enabled, passing switch is
     shown alongside to bait an over-eager runner. */
  .row { display:flex; gap:24px; align-items:center; }
  .switch { position:relative; width:56px; height:30px; border-radius:15px; }
  .knob   { position:absolute; top:3px; right:3px; width:24px; height:24px; background:#ffffff; border-radius:50%; }
  .off-disabled { background:#8fd6a3; opacity:.6; }
  .on-active    { background:#2e7d46; }
</style></head>
<body>
  <div class="row">
    <span class="switch off-disabled" role="switch" aria-checked="true" aria-disabled="true" aria-label="Beta features (locked)"><span class="knob"></span></span>
    <span class="switch on-active" role="switch" aria-checked="true" aria-label="Dark mode"><span class="knob"></span></span>
  </div>
</body></html>
