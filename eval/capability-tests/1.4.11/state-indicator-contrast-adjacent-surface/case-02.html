<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | state-indicator-contrast-adjacent-surface | ADJACENT TRAP: row check passes page, FAILS highlight row (1.068:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Selected-row check vs highlight row</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* "Selected" is shown by a checkmark on the highlighted row. The mark's adjacent surface is the blue
     highlight #2f6fd6, not the white page. Mark #3b6fb0 vs #2f6fd6 = 1.068:1 (FAIL) — the selected state is
     invisible. The same mark vs the white page is 5.14:1, which a page-bg checker would wrongly pass. */
  ul { list-style:none; margin:0; padding:0; width:300px; border:1px solid #767676; border-radius:6px; overflow:hidden; }
  li { padding:12px 16px; display:flex; justify-content:space-between; }
  li.sel { background:#2f6fd6; color:#ffffff; }
  .mark { color:#3b6fb0; font-weight:bold; }
</style></head>
<body>
  <ul role="listbox" aria-label="Plan">
    <li>Free</li>
    <li class="sel" aria-selected="true">Pro <span class="mark" aria-hidden="true">&#10003;</span></li>
    <li>Team</li>
  </ul>
</body></html>
