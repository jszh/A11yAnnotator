<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | borderless white card on faint gray page (1.225:1) -->
<html lang="en"><head><meta charset="utf-8"><title>White card melts into gray page</title>
<style>
  body { margin:0; background:#e8e8e8; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The card is a clickable component whose ONLY boundary is its fill edge against the page.
     Fill #ffffff vs page #e8e8e8 = 1.225:1. No border, no shadow — boundary is imperceptible. */
  .card {
    background:#ffffff; padding:24px; width:320px; border:none; border-radius:0;
    cursor:pointer; color:#202020;
  }
</style></head>
<body>
  <div class="card" role="button" tabindex="0">
    <strong>Premium plan</strong>
    <p>Tap to select this plan.</p>
  </div>
</body></html>
