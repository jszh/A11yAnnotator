<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | semi-transparent border composites below 3:1 (1.527:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Semi-transparent border below threshold</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The author set the edge with rgba(0,0,0,0.18). Over the white page it composites to #d1d1d1,
     which is 1.527:1 vs #ffffff. The boundary is the only cue and it is well under 3:1. */
  .card {
    background:#ffffff; padding:20px; width:300px; color:#202020;
    border:1px solid rgba(0,0,0,0.18); border-radius:8px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card" role="button" tabindex="0">
    <strong>Notification settings</strong>
    <p>Manage how you are alerted.</p>
  </div>
</body></html>
