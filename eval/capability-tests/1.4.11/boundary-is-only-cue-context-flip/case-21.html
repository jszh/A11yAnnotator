<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | boundary-is-only-cue-context-flip | ESSENTIAL: logo-swatch whose exact color is the information -->
<html lang="en"><head><meta charset="utf-8"><title>Brand color swatch (essential)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* This swatch shows the brand's exact paint color #f3f3f3 against the white page (1.07:1).
     The low edge contrast is ESSENTIAL — presenting the true color is the purpose; raising its
     boundary contrast would defeat the swatch. 1.4.11 exempts cases where a particular presentation
     is essential to the information conveyed. (A bordered, labeled chrome frames it, which IS the operable cue.) */
  .swatch-row { display:inline-flex; align-items:center; gap:12px; border:1px solid #767676; padding:8px 12px; border-radius:6px; }
  .swatch { width:40px; height:40px; background:#f3f3f3; }
  code { font:13px monospace; }
</style></head>
<body>
  <p>Picked brand color:</p>
  <div class="swatch-row"><span class="swatch" aria-hidden="true"></span><code>#F3F3F3 “Cloud”</code></div>
</body></html>
