<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | boundary-is-only-cue-context-flip | edge IS faint but component has a SECOND sufficient cue -->
<html lang="en"><head><meta charset="utf-8"><title>Faint edge but strong fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The 1px #e0e0e0 hairline (1.32:1) is decorative; the button is NOT identified by its edge.
     Its solid blue fill #1a73e8 vs page #ffffff = 4.5:1 is the perceivable boundary. 1.4.11 requires
     the visual information NEEDED to identify the component to reach 3:1 — that information is the fill,
     which passes. The faint hairline is not "required to identify" the component. */
  .btn {
    display:inline-block; padding:11px 24px; background:#1a73e8; color:#ffffff;
    border:1px solid #e0e0e0; border-radius:6px; cursor:pointer;
  }
</style></head>
<body>
  <button class="btn" type="button">Place order</button>
</body></html>
