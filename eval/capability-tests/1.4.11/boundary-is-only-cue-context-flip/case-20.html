<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | boundary-is-only-cue-context-flip | CONTEXT FLIP that stays ABOVE 3:1 on the dark surface -->
<html lang="en"><head><meta charset="utf-8"><title>Theme flip that still passes</title>
<style>
  body { margin:0; background:#1a1a1a; font:16px/1.4 system-ui, sans-serif; padding:48px; color:#f0f0f0; }
  /* Dark-card flip done RIGHT: edge #8d8d8d vs the dark card #1a1a1a. #8d8d8d-on-#1a1a1a = 4.69:1.
     Same "context flip" structure as the positives but the author recolored the edge for the dark theme,
     so the boundary still passes. */

  .btn {
    display:inline-block; padding:10px 22px; background:#1a1a1a; color:#f0f0f0;
    border:2px solid #8d8d8d; border-radius:6px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card">
    <button class="btn" type="button">Save changes</button>
  </div>
</body></html>
