<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | boundary-is-only-cue-context-flip | DISABLED component — inactive exemption -->
<html lang="en"><head><meta charset="utf-8"><title>Disabled button (exempt)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The button is DISABLED. Its faint #d6d6d6 edge (1.453:1) is below 3:1, but 1.4.11 explicitly
     exempts inactive/disabled user-interface components. No barrier. An adjacent ENABLED button is
     present so the page is not trivially empty, and to bait an over-eager runner. */
  .btn {
    display:inline-block; padding:10px 22px; background:#ffffff; border-radius:6px; font:inherit;
  }
  .btn-disabled { border:2px solid #d6d6d6; color:#a9a9a9; cursor:not-allowed; }
  .btn-active   { border:2px solid #767676; color:#202020; cursor:pointer; }
</style></head>
<body>
  <button class="btn btn-disabled" type="button" disabled>Submit (locked)</button>
  <button class="btn btn-active" type="button">Cancel</button>
</body></html>
