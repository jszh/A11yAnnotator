<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | boundary-is-only-cue-context-flip | borderless chip whose FILL contrast is sufficient (3.95:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Borderless chip with sufficient fill</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* Borderless chip, same pattern as the positive case-06, but the fill #767676 vs page #ffffff = 4.54:1.
     With no border, the fill IS the boundary cue and it passes. */
  .chip {
    display:inline-block; padding:8px 16px; background:#767676; color:#ffffff;
    border:none; border-radius:16px; cursor:pointer;
  }
</style></head>
<body>
  <p>Filters:</p>
  <span class="chip" role="button" tabindex="0">In stock</span>
</body></html>
