<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (no barrier) | boundary-is-only-cue-context-flip | runnerShould=ABSTAIN: edge over GRADIENT but truth PASSES -->
<html lang="en"><head><meta charset="utf-8"><title>Strong edge over a gradient</title>
<style>
  body { margin:0; font:16px/1.4 system-ui, sans-serif; padding:48px;
         background:linear-gradient(120deg,#dfe6ee 0%, #f6f8fa 100%); }
  /* Same gradient-backdrop structure as the abstain POSITIVE, but the author used a dark #303030 edge.
     #303030 is >= 7:1 against the LIGHTEST point of the gradient, so worst-side still passes. The runner
     cannot reduce the gradient to one flat color and SHOULD abstain; the human/vision truth is PASS. */
  .card {
    background:#ffffff; padding:22px; width:300px; color:#202020;
    border:2px solid #303030; border-radius:8px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card" role="button" tabindex="0">
    <strong>Weather widget</strong>
    <p>Tap to expand the forecast.</p>
  </div>
</body></html>
