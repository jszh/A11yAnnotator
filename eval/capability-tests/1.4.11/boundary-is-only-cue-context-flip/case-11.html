<!DOCTYPE html>
<!-- 1.4.11 POSITIVE (real barrier) | boundary-is-only-cue-context-flip | runnerShould=ABSTAIN: edge over an inline SVG "photo"/pattern -->
<html lang="en"><head><meta charset="utf-8"><title>Edge over busy patterned hero</title>
<style>
  body { margin:0; font:16px/1.4 system-ui, sans-serif; padding:0; }
  .hero {
    position:relative; height:260px;
    /* A busy repeating checker pattern (stand-in for a photo). No flat adjacent color exists. */
    background:
      repeating-conic-gradient(#dfe3e8 0% 25%, #f3f5f7 0% 50%) 0 / 36px 36px;
    display:flex; align-items:center; justify-content:center;
  }
  /* The CTA's only boundary is a near-white #f2f2f2 outline that the runner cannot evaluate against
     the patterned backdrop (must ABSTAIN). Truth: the outline is lost wherever it crosses the light tiles. */
  .cta {
    padding:12px 28px; background:#f2f2f2; color:#222;
    border:2px solid #f2f2f2; border-radius:6px; cursor:pointer;
  }
</style></head>
<body>
  <div class="hero">
    <button class="cta" type="button">Shop the sale</button>
  </div>
</body></html>
