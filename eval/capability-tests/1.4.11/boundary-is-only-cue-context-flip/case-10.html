<!DOCTYPE html>
<!-- 1.4.11 POSITIVE (real barrier) | boundary-is-only-cue-context-flip | runnerShould=ABSTAIN: edge over a GRADIENT -->
<html lang="en"><head><meta charset="utf-8"><title>Faint edge over gradient backdrop</title>
<style>
  body { margin:0; font:16px/1.4 system-ui, sans-serif; padding:48px;
         background:linear-gradient(120deg,#c9d2dc 0%, #eef1f4 100%); }
  /* The card sits on a GRADIENT, so the deterministic runner cannot reduce the adjacent surface to
     one flat color and must DEFER/abstain. The TRUE answer is a barrier: the #d9dde2 edge melts into
     the gradient along its run (no point on the edge reaches 3:1 against the local backdrop). */
  .card {
    background:#eef1f4; padding:22px; width:300px; color:#202020;
    border:1px solid #d9dde2; border-radius:8px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card" role="button" tabindex="0">
    <strong>Weather widget</strong>
    <p>Tap to expand the forecast.</p>
  </div>
</body></html>
