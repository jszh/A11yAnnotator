<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | WORST-SIDE-GOVERNS, all-flat: 3 sides pass, 1 side fails (1.518:1) -->
<html lang="en"><head><meta charset="utf-8"><title>One edge crosses a colored sidebar</title>
<style>
  body { margin:0; font:16px/1.4 system-ui, sans-serif; display:flex; }
  /* The list-row component has a flat #767676 outline. Three of its sides sit on white (4.54:1, fine),
     but its left edge abuts a #5a5a5a sidebar where the same outline reads 1.518:1.
     Worst side governs -> barrier. Fully flat/opaque, so the runner SHOULD decide (no abstain). */
  .sidebar { width:90px; background:#5a5a5a; min-height:200px; }
  .content { flex:1; background:#ffffff; padding:24px; }
  .row {
    background:#ffffff; padding:14px 18px; border:2px solid #767676; border-radius:6px;
    cursor:pointer; margin-left:-12px; /* nudge so its left edge overlaps the sidebar band */
  }
  .wrap { position:relative; }
</style></head>
<body>
  <div class="sidebar"></div>
  <div class="content">
    <div class="row" role="button" tabindex="0">Account &amp; billing</div>
  </div>
</body></html>
