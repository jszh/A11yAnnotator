<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | WORST-SIDE-GOVERNS: button straddles two surfaces, bad side 1.775:1 -->
<html lang="en"><head><meta charset="utf-8"><title>Worst-side governs — button over band</title>
<style>
  body { margin:0; font:16px/1.4 system-ui, sans-serif; }
  /* The button's fill #1a73e8 is the boundary cue. Against the white area it is 4.5:1 (fine),
     but its right half overlaps a blue promo band #0b4ea2 where fill-vs-surface = 1.775:1.
     The worst boundary governs: part of the component's edge is indistinguishable. */
  .stage { position:relative; padding:48px; }
  .band { position:absolute; top:0; right:0; width:50%; height:100%; background:#0b4ea2; }
  .btn {
    position:relative; display:inline-block; padding:12px 26px; background:#1a73e8;
    color:#ffffff; border:none; border-radius:6px; cursor:pointer; margin-left:38%;
  }
</style></head>
<body>
  <div class="stage">
    <div class="band"></div>
    <button class="btn" type="button">Get started</button>
  </div>
</body></html>
