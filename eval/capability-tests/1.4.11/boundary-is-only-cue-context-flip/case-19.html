<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | boundary-is-only-cue-context-flip | DECORATIVE divider, not a component boundary -->
<html lang="en"><head><meta charset="utf-8"><title>Decorative hairline rule</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; max-width:520px; }
  /* The faint #ededed rule (1.171:1) separates two paragraphs of prose. It is purely decorative —
     it is NOT the boundary of any user-interface component and bears no information. Out of 1.4.11 scope. */
  hr.rule { border:none; border-top:1px solid #ededed; margin:24px 0; }
</style></head>
<body>
  <h1>About us</h1>
  <p>We started in a garage with a single idea.</p>
  <hr class="rule">
  <p>Today we serve customers in forty countries.</p>
</body></html>
