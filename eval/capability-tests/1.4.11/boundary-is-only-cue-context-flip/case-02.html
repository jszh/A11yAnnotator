<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | flat-opaque near-threshold FAIL (2.849:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Faint outlined input</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* A text input whose only visible boundary is a 1px hairline. #999999 vs #ffffff = 2.849:1 (< 3:1). */
  .field {
    width:280px; padding:9px 12px; background:#ffffff; color:#202020;
    border:1px solid #999999; border-radius:4px; font:inherit;
  }
  label { display:block; margin-bottom:6px; }
</style></head>
<body>
  <label for="e">Email address</label>
  <input class="field" id="e" type="email" placeholder="">
</body></html>
