<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | segmented-control divider too faint (1.558:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Segmented control divider</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* A segmented toggle (Day | Week | Month). The boundaries that separate the three segments
     into distinct controls are 1px dividers #cfcfcf on white = 1.558:1. The segments read as one blob. */
  .seg { display:inline-flex; background:#ffffff; border:1px solid #cfcfcf; border-radius:6px; overflow:hidden; }
  .seg button { padding:8px 18px; background:#ffffff; color:#333; border:none; cursor:pointer; }
  .seg button + button { border-left:1px solid #cfcfcf; }
</style></head>
<body>
  <div class="seg" role="group" aria-label="Range">
    <button type="button">Day</button>
    <button type="button">Week</button>
    <button type="button">Month</button>
  </div>
</body></html>
