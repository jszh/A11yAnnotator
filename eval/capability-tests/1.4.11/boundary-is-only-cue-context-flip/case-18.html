<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE | boundary-is-only-cue-context-flip | semi-transparent border composites ABOVE 3:1 (3.363:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Semi-transparent border that still passes</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* Edge is rgba(0,0,0,0.45). Composited over the white page it is #8c8c8c = 3.363:1 vs #ffffff — passes.
     Tests that the runner correctly composites the alpha before comparing (not treats it as inconclusive
     when the backdrop IS a known flat color). */
  .card {
    background:#ffffff; padding:20px; width:300px; color:#202020;
    border:1px solid rgba(0,0,0,0.45); border-radius:8px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card" role="button" tabindex="0">
    <strong>Saved addresses</strong>
    <p>Edit your delivery locations.</p>
  </div>
</body></html>
