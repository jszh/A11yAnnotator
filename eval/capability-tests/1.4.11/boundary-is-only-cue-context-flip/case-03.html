<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | CONTEXT FLIP: same edge color, dark-theme surface erodes it (1.518:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Theme flip erodes edge</title>
<style>
  body { margin:0; background:#5a5a5a; font:16px/1.4 system-ui, sans-serif; padding:48px; color:#f0f0f0; }
  /* This #767676 edge reads 4.54:1 on white, but the dark "card" surface flips it to 1.518:1.
     The button fill matches the card, so the edge is the ONLY boundary — and it is lost. */
  .card { background:#5a5a5a; padding:32px; border-radius:8px; }
  .btn {
    display:inline-block; padding:10px 22px; background:#5a5a5a; color:#f0f0f0;
    border:2px solid #767676; border-radius:6px; cursor:pointer;
  }
</style></head>
<body>
  <div class="card">
    <p>Dark surface — the button's edge is its only boundary.</p>
    <button class="btn" type="button">Save changes</button>
  </div>
</body></html>
