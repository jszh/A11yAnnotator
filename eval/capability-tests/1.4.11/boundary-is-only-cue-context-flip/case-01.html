<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | flat-opaque near-threshold FAIL (2.958:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Near-threshold faint button edge</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* The ONLY perceivable boundary of this button is its 2px edge. Edge #969696 vs page #ffffff = 2.958:1 (< 3:1). */
  .btn {
    display:inline-block; padding:10px 22px; background:#ffffff; color:#202020;
    border:2px solid #969696; border-radius:6px; cursor:pointer;
  }
</style></head>
<body>
  <p>Borderless-looking text button — its edge is the only thing distinguishing it from the page.</p>
  <button class="btn" type="button">Continue</button>
</body></html>
