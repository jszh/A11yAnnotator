<!DOCTYPE html>
<!-- 1.4.11 NEGATIVE (exempt) | boundary-is-only-cue-context-flip | DEFAULT user-agent control — UA-styling exemption -->
<html lang="en"><head><meta charset="utf-8"><title>Default UA controls (exempt)</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* These controls carry NO author border/background styling. Their boundary is whatever the browser's
     default user-agent stylesheet draws. 1.4.11 exempts default user-agent styling the author has not modified. */
  label { display:block; margin:14px 0 4px; }
</style></head>
<body>
  <label for="n">Full name</label>
  <input id="n" type="text">
  <label for="c">Country</label>
  <select id="c">
    <option>United States</option>
    <option>Canada</option>
  </select>
  <p><button type="submit">Submit</button></p>
</body></html>
