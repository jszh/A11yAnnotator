<!DOCTYPE html>
<!-- 1.4.11 POSITIVE | boundary-is-only-cue-context-flip | borderless chip relying on fill contrast (1.160:1) -->
<html lang="en"><head><meta charset="utf-8"><title>Borderless filter chip</title>
<style>
  body { margin:0; background:#ffffff; font:16px/1.4 system-ui, sans-serif; padding:48px; }
  /* A borderless, selectable filter chip. Its identity depends entirely on fill #eeeeee
     standing off the page #ffffff = 1.160:1. There is no edge at all; the chip is invisible as a component. */
  .chip {
    display:inline-block; padding:8px 16px; background:#eeeeee; color:#333333;
    border:none; border-radius:16px; cursor:pointer;
  }
</style></head>
<body>
  <p>Filters:</p>
  <span class="chip" role="button" tabindex="0">In stock</span>
</body></html>
