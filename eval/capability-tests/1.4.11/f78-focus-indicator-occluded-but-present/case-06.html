<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: yellow focus outline ~1.2:1 vs white</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A bright-looking yellow (#ffeb3b) reads as "obviously visible" to a
     sighted designer, but against the white adjacent surface it is only
     ~1.2:1 -> fails the 3:1 non-text contrast threshold. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #ffeb3b; outline-offset:2px; }
  .btn:focus-visible { outline:3px solid #ffeb3b; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Profile</h1>
  <button class="btn" id="target">Edit profile</button>
</body>
</html>
