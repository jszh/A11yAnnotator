<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: focus ring clipped by overflow:hidden ancestor</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focus outline is drawn OUTSIDE the button (outline-offset:4px),
     but the tight overflow:hidden wrapper clips everything beyond the
     button box -> the focus indicator is clipped away (F78). */
  .clip { overflow:hidden; width:160px; height:44px; }
  .btn {
    width:160px; height:44px; box-sizing:border-box;
    background:#1565c0; color:#fff; border:0; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:4px solid #000000; outline-offset:4px; }
  .btn:focus-visible { outline:4px solid #000000; outline-offset:4px; }
</style>
</head>
<body>
  <h1>Cart</h1>
  <div class="clip">
    <button class="btn" id="target">Checkout</button>
  </div>
</body>
</html>
