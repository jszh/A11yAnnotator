<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: default UA focus ring kept (outline not removed)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* No focus rules at all -> the browser's default focus ring is retained.
     The UA-provided focus indicator is relied upon and not suppressed;
     this is the conformant baseline (no F78). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
</style>
</head>
<body>
  <h1>Newsletter</h1>
  <button class="btn" id="target">Subscribe</button>
</body>
</html>
