<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: indicator hidden via outline:none + color-only swap</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* On focus the only change is the text color shifting from #222 to #444.
     No bounding indicator is added, and the #222->#444 text change is itself
     ~1.0-1.x:1 against itself -> there is no >=3:1 focus indicator (F78). */
  .link {
    color:#222; text-decoration:underline; font-size:18px;
  }
  .link:focus { outline:none; color:#444444; }
  .link:focus-visible { outline:none; color:#444444; }
</style>
</head>
<body>
  <h1>Help</h1>
  <p>See the <a class="link" id="target" href="#">documentation</a> for details.</p>
</body>
</html>
