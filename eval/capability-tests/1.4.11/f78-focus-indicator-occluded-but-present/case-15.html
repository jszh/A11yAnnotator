<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: box-shadow focus ring #595959 7:1 on white</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* outline:none is compensated by a clearly contrasting box-shadow ring
     (#595959 ~7:1 vs white). Adequate replacement indicator (no F78). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; box-shadow:0 0 0 3px #595959; }
  .btn:focus-visible { outline:none; box-shadow:0 0 0 3px #595959; }
</style>
</head>
<body>
  <h1>Account</h1>
  <button class="btn" id="target">Delete account</button>
</body>
</html>
