<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: focus outline occluded by overlapping next element</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  .row { position:relative; }
  /* The focused button's outline is offset outward, but the SIBLING card
     is absolutely positioned on top (z-index:5) and covers the area where
     the indicator would be drawn -> indicator occluded (F78). */
  .btn {
    position:relative; z-index:1;
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:4px solid #0d47a1; outline-offset:5px; }
  .btn:focus-visible { outline:4px solid #0d47a1; outline-offset:5px; }
  .overlay {
    position:absolute; left:0; top:-8px; width:220px; height:70px;
    background:#ffffff; z-index:5; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
</style>
</head>
<body>
  <h1>Dashboard</h1>
  <div class="row">
    <button class="btn" id="target">Open report</button>
    <div class="overlay">Promotional panel</div>
  </div>
</body>
</html>
