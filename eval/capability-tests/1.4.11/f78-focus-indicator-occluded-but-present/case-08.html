<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: outline color matches button (1:1, invisible)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focus outline is the SAME color as the button it surrounds and the
     same as nothing else around it sits on the button edge -> the indicator
     is drawn but is 1:1 against the adjacent (button) surface, so it provides
     no visible change of appearance. */
  .btn {
    background:#2962ff; color:#fff; border:0;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #2962ff; outline-offset:0; }
  .btn:focus-visible { outline:3px solid #2962ff; outline-offset:0; }
</style>
</head>
<body>
  <h1>Compose</h1>
  <button class="btn" id="target">Send</button>
</body>
</html>
