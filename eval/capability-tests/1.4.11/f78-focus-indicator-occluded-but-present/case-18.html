<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: overflow:hidden ancestor but indicator drawn inside</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The wrapper has overflow:hidden, but the focus indicator is an INSET
     box-shadow drawn entirely INSIDE the button box, so nothing is clipped.
     The inset white ring vs the #1565c0 button is ~5.75:1, fully visible. */
  .clip { overflow:hidden; width:160px; height:44px; }
  .btn {
    width:160px; height:44px; box-sizing:border-box;
    background:#1565c0; color:#fff; border:0; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
</style>
</head>
<body>
  <h1>Cart</h1>
  <div class="clip">
    <button class="btn" id="target">Checkout</button>
  </div>
</body>
</html>
