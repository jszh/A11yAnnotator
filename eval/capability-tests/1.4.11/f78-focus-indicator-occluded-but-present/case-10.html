<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: zero-width outline (outline-width:0)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* An author "kept" an outline but set its width to 0, so nothing renders.
     A high-contrast COLOR is declared, which can fool a naive color-only
     check, but width:0 means no indicator is painted (F78). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:0 solid #000000; outline-offset:2px; }
  .btn:focus-visible { outline:0 solid #000000; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Export</h1>
  <button class="btn" id="target">Download CSV</button>
</body>
</html>
