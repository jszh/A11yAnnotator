<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: focus ring clipped by scroll container edge</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focusable chip sits at the very left edge of a horizontally
     scrollable strip with overflow-x:hidden on the LEFT side. The outline
     on the left of the chip is clipped by the container, leaving the
     contrasting perimeter incomplete/occluded on that edge (F78). */
  .strip {
    overflow:hidden; width:300px; white-space:nowrap;
    border:1px solid #ddd; padding:8px; padding-left:0;
  }
  .chip {
    display:inline-block; margin-left:0;
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:6px 14px; font-size:15px; cursor:pointer;
  }
  .chip:focus { outline:3px solid #0d47a1; outline-offset:2px; }
  .chip:focus-visible { outline:3px solid #0d47a1; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Filters</h1>
  <div class="strip">
    <button class="chip" id="target">All</button>
    <button class="chip">Open</button>
    <button class="chip">Closed</button>
  </div>
</body>
</html>
