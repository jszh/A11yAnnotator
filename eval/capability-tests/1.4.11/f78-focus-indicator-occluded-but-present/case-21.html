<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: two-color outline, both edges contrasting</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A robust pattern: white inner ring + dark outer ring so the indicator
     contrasts no matter what color is directly adjacent. Inner white vs the
     #1565c0 button ~5.75:1; outer #0d47a1 vs white page ~8.6:1. Visible on
     any background (G195 robust focus style). */
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus {
    outline:none;
    box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #0d47a1;
  }
  .btn:focus-visible {
    outline:none;
    box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #0d47a1;
  }
</style>
</head>
<body>
  <h1>Compose</h1>
  <button class="btn" id="target">Send</button>
</body>
</html>
