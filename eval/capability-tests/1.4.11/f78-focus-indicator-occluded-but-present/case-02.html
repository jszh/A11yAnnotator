<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: focus outline too faint (1.6:1 vs white)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A focus indicator EXISTS but its color (#ccc) contrasts only ~1.6:1
     against the adjacent white page/button background -> below 3:1. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #cccccc; outline-offset:2px; }
  .btn:focus-visible { outline:3px solid #cccccc; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Newsletter</h1>
  <button class="btn" id="target">Subscribe</button>
</body>
</html>
