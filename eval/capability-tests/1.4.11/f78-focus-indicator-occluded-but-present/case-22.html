<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Abstain: focus outline over a gradient adjacent surface</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  /* The page background is a continuous gradient running from near-white
     (#f8f9fa) to a saturated blue (#0d47a1). The focus outline (#1a73e8)
     sits on this gradient, so the adjacent color varies along the
     perimeter -> a single deterministic ratio cannot be computed and a
     pixel-uniform assumption does not hold. Runner should ABSTAIN. */
  .hero {
    min-height:240px;
    background:linear-gradient(90deg,#f8f9fa 0%, #1a73e8 55%, #0d47a1 100%);
    display:flex; align-items:center; padding:0 40px;
  }
  .btn {
    background:transparent; color:#fff; border:1px solid #fff;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #1a73e8; outline-offset:3px; }
  .btn:focus-visible { outline:3px solid #1a73e8; outline-offset:3px; }
</style>
</head>
<body>
  <div class="hero">
    <button class="btn" id="target">Get started</button>
  </div>
</body>
</html>
