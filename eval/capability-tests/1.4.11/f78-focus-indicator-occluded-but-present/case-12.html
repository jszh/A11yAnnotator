<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: gray outline #aaa ~2.1:1 on light-gray surface</title>
<style>
  body { background:#f5f5f5; font-family:system-ui,sans-serif; margin:40px; }
  /* Card surface is #f5f5f5; the focus outline is #aaaaaa which is only
     ~2.1:1 against that adjacent surface -> below 3:1 (F78 contrast facet). */
  .card { background:#f5f5f5; padding:24px; display:inline-block; }
  .btn {
    background:#f5f5f5; color:#222; border:1px solid #888;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #aaaaaa; outline-offset:3px; }
  .btn:focus-visible { outline:3px solid #aaaaaa; outline-offset:3px; }
</style>
</head>
<body>
  <h1>Billing</h1>
  <div class="card">
    <button class="btn" id="target">Update card</button>
  </div>
</body>
</html>
