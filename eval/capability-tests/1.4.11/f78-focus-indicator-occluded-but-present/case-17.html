<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: blue outline #1a73e8 4.5:1 on white</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* 3px blue (#1a73e8) focus outline -> ~4.5:1 vs the white adjacent
     surface, above 3:1 (G195). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #1a73e8; outline-offset:2px; }
  .btn:focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Profile</h1>
  <button class="btn" id="target">Edit profile</button>
</body>
</html>
