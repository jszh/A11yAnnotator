<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: outline:none with no replacement</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* Author suppresses the UA focus ring and provides NO visible replacement.
     Under focus, no focus indicator is rendered at all (F78). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; }
  .btn:focus-visible { outline:none; }
</style>
</head>
<body>
  <h1>Settings</h1>
  <p>Suppressed focus ring, no replacement provided.</p>
  <button class="btn" id="target">Save changes</button>
</body>
</html>
