<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F78 positive: outline:none + too-faint box-shadow replacement</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* Outline removed; the box-shadow "replacement" uses #e0e0e0 which is
     ~1.3:1 against the white page -> the replacement indicator is below 3:1. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; box-shadow:0 0 0 3px #e0e0e0; }
  .btn:focus-visible { outline:none; box-shadow:0 0 0 3px #e0e0e0; }
</style>
</head>
<body>
  <h1>Account</h1>
  <button class="btn" id="target">Delete account</button>
</body>
</html>
