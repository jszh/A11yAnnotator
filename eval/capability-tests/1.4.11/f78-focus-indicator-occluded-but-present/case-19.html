<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: white focus outline 15.9:1 on dark surface</title>
<style>
  body { background:#222222; color:#eee; font-family:system-ui,sans-serif; margin:40px; }
  /* On a dark (#222) page, a 3px white focus outline is ~15.9:1 against the
     adjacent surface -> well above 3:1 (G195). */
  .btn {
    background:#222222; color:#fff; border:1px solid #888;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #ffffff; outline-offset:2px; }
  .btn:focus-visible { outline:3px solid #ffffff; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Dark mode</h1>
  <button class="btn" id="target">Toggle</button>
</body>
</html>
