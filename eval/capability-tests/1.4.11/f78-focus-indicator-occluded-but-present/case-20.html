<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: thick outline, outer edge on contrasting white</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The button is light gray (#e8e8e8). The focus outline is offset OUTSIDE
     the button (outline-offset:3px) so its full perimeter sits on the white
     page. #0d47a1 vs white -> ~8.6:1. The relevant adjacent surface for the
     offset outline is the white page, which it contrasts strongly. */
  .btn {
    background:#e8e8e8; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:4px solid #0d47a1; outline-offset:3px; }
  .btn:focus-visible { outline:4px solid #0d47a1; outline-offset:3px; }
</style>
</head>
<body>
  <h1>Export</h1>
  <button class="btn" id="target">Download CSV</button>
</body>
</html>
