<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: sticky header present but control not occluded</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:0; }
  .header {
    position:sticky; top:0; height:90px; background:#1565c0; color:#fff;
    display:flex; align-items:center; padding:0 24px; z-index:10;
  }
  .content { padding:40px 24px; }
  /* A sticky header exists, but the focusable control is well below it with
     ample spacing; its 3px #d32f2f (~5:1) outline is fully visible and is
     NOT covered by the header (no occlusion, no F78). */
  .field {
    padding:10px; font-size:16px; border:1px solid #767676;
  }
  .field:focus { outline:3px solid #d32f2f; outline-offset:3px; }
  .field:focus-visible { outline:3px solid #d32f2f; outline-offset:3px; }
</style>
</head>
<body>
  <div class="header">My App</div>
  <div class="content">
    <label>Search<br>
      <input class="field" id="target" type="text" placeholder="Type here">
    </label>
  </div>
</body>
</html>
