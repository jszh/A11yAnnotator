<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative: black focus outline 21:1 on white</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* Solid 3px black focus outline on a white adjacent surface -> 21:1,
     far above the 3:1 threshold (G195). */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #000000; outline-offset:2px; }
  .btn:focus-visible { outline:3px solid #000000; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Settings</h1>
  <button class="btn" id="target">Save changes</button>
</body>
</html>
