<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: full outline near edge but margin keeps it on page</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:0; }
  /* The button is near the right edge but a generous right margin keeps the
     whole offset outline inside the viewport and on the white page. No side is
     pushed off-component. #005fcc vs white ~6:1, complete perimeter. */
  .rail { position:fixed; right:24px; top:60px; }
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #005fcc; outline-offset:4px; }
  .btn:focus-visible { outline:3px solid #005fcc; outline-offset:4px; }
</style>
</head>
<body>
  <h1>Reader</h1>
  <div class="rail">
    <button class="btn" id="target">Next</button>
  </div>
</body>
</html>
