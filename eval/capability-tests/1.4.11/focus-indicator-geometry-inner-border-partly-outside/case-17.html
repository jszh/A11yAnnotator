<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: corner-clipped wrapper but indicator drawn inside</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The wrapper is overflow:hidden and the button is in the corner, BUT the
     focus indicator is an inset ring inside the button, so the clipping does
     not touch the indicator. White inset ring vs #1565c0 ~5.75:1, complete. */
  .wrap { overflow:hidden; display:inline-block; }
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:14px 22px; font-size:16px; cursor:pointer; box-sizing:border-box;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
</style>
</head>
<body>
  <h1>Corner</h1>
  <div class="wrap">
    <button class="btn" id="target">Action</button>
  </div>
</body>
</html>
