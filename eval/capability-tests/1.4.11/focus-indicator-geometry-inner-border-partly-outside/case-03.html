<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: outline partly outside, clipped on two sides</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:0; }
  /* The button is flush in the top-left corner of a clipping wrapper. The
     offset focus outline extends beyond the top and left edges, which are
     clipped by overflow:hidden. Only the bottom and right portions of the
     perimeter survive, so the contrasting perimeter is partial/insufficient. */
  .wrap { overflow:hidden; }
  .btn {
    margin:0;
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #000000; outline-offset:4px; }
  .btn:focus-visible { outline:3px solid #000000; outline-offset:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <button class="btn" id="target">Top-left action</button>
  </div>
</body>
</html>
