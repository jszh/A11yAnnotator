<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: bottom underline indicator that itself meets 3:1</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A single thick bottom underline can be an acceptable focus indicator for
     the 1.4.11 CONTRAST facet as long as the indicator area itself is >=3:1
     against its adjacent colors. Here the 3px underline is solid black
     (21:1 vs the white fill above it and the white page below). The
     contrasting portion that exists clears 3:1. */
  .tab {
    background:#ffffff; color:#222; border:0;
    padding:12px 18px; font-size:16px; cursor:pointer;
  }
  .tab:focus { outline:none; box-shadow:inset 0 -3px 0 0 #000000; }
  .tab:focus-visible { outline:none; box-shadow:inset 0 -3px 0 0 #000000; }
</style>
</head>
<body>
  <h1>Tabs</h1>
  <button class="tab" id="target">Overview</button>
</body>
</html>
