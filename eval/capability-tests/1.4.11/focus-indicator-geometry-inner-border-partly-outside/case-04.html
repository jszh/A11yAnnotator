<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: indicator extends off-screen past viewport edge</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:0; }
  /* The button is positioned hard against the right viewport edge. Its
     offset focus outline on the right is pushed past the viewport and is not
     rendered, so only three sides of the perimeter are visible; the
     contrasting perimeter is incomplete. */
  .rail { position:fixed; right:0; top:60px; }
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
    margin-right:-2px;
  }
  .btn:focus { outline:3px solid #0d47a1; outline-offset:4px; }
  .btn:focus-visible { outline:3px solid #0d47a1; outline-offset:4px; }
</style>
</head>
<body>
  <h1>Reader</h1>
  <div class="rail">
    <button class="btn" id="target">Next</button>
  </div>
</body>
</html>
