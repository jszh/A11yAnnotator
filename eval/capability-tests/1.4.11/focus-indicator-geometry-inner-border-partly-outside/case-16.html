<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: inner ring on light card, contrasts against fill</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A complete inner ring (#005fcc) sits inside a light-blue card button
     (#e3f2fd). #005fcc vs #e3f2fd ~5.2:1 around the full perimeter. The
     indicator is entirely inside the component but contrasts with the fill. */
  .btn {
    background:#e3f2fd; color:#0d47a1; border:1px solid #90caf9;
    padding:14px 22px; font-size:16px; cursor:pointer; box-sizing:border-box;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #005fcc; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #005fcc; }
</style>
</head>
<body>
  <h1>Plan</h1>
  <button class="btn" id="target">Choose Pro</button>
</body>
</html>
