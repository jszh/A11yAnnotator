<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: full-perimeter inner ring at 5:1</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A complete inner ring runs around ALL four sides. White ring inside a
     #1565c0 button is ~5.75:1 against the fill, contrasting on the entire
     perimeter. Inner-border geometry is fine when it bounds the whole edge. */
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:14px 22px; font-size:16px; cursor:pointer; box-sizing:border-box;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #ffffff; }
</style>
</head>
<body>
  <h1>Checkout</h1>
  <button class="btn" id="target">Pay now</button>
</body>
</html>
