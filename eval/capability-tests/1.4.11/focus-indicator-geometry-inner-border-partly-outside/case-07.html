<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: left-edge accent bar only (3 of 4 sides bare)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* On focus only a thin LEFT accent bar appears (border-left). The top,
     right, and bottom edges get no indicator, and the left bar is #cccccc
     (~1.6:1 vs white) -> the lone contrasting edge is also below 3:1. */
  .item {
    display:block; width:240px;
    background:#ffffff; color:#222; border:1px solid #e0e0e0;
    padding:12px 16px; font-size:16px; cursor:pointer; text-align:left;
  }
  .item:focus { outline:none; border-left:4px solid #cccccc; }
  .item:focus-visible { outline:none; border-left:4px solid #cccccc; }
</style>
</head>
<body>
  <h1>Menu</h1>
  <button class="item" id="target">Inbox</button>
</body>
</html>
