<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: full offset outline entirely on contrasting page</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The whole offset outline sits on the white page with ample margin on all
     sides; no edge is clipped or pushed off-component. #0d47a1 vs white
     ~8.6:1 around the complete perimeter. */
  .btn {
    background:#e8e8e8; color:#222; border:1px solid #767676;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #0d47a1; outline-offset:4px; }
  .btn:focus-visible { outline:3px solid #0d47a1; outline-offset:4px; }
</style>
</head>
<body>
  <h1>Files</h1>
  <button class="btn" id="target">Upload</button>
</body>
</html>
