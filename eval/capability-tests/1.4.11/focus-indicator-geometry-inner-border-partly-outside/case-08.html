<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: outline mostly behind an adjacent opaque tile</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* Two tiles abut with zero gap. The focused tile's offset outline on its
     right side is painted underneath the neighboring opaque tile, so that
     side of the perimeter is hidden. Only part of the contrasting perimeter
     remains visible. */
  .grid { display:flex; }
  .tile {
    width:120px; height:80px;
    background:#ffffff; color:#222; border:1px solid #767676;
    font-size:15px; cursor:pointer; position:relative;
  }
  .tile + .tile { z-index:2; background:#ffffff; }
  .tile:focus { outline:3px solid #0d47a1; outline-offset:3px; z-index:1; }
  .tile:focus-visible { outline:3px solid #0d47a1; outline-offset:3px; z-index:1; }
</style>
</head>
<body>
  <h1>Gallery</h1>
  <div class="grid">
    <button class="tile" id="target">Photo A</button>
    <button class="tile">Photo B</button>
  </div>
</body>
</html>
