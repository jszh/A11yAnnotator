<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: inner outline whose contrasting side touches same-color fill</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focus indicator is an INSET ring drawn inside the button using the
     button's own blue (#1565c0). Its inner perimeter is adjacent to the blue
     fill (1:1) and its outer perimeter is adjacent to the blue fill too, so
     the indicator geometry is fully inside and 1:1 against its only adjacent
     color -> no contrasting perimeter. */
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:14px 22px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #1565c0; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #1565c0; }
</style>
</head>
<body>
  <h1>Checkout</h1>
  <button class="btn" id="target">Pay now</button>
</body>
</html>
