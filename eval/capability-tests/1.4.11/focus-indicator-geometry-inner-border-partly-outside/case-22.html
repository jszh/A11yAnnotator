<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: default UA focus ring (full perimeter, author-unmodified)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* No focus CSS authored. The UA draws its default focus ring around the
     full perimeter; geometry and contrast are the user-agent's, not the
     author's. Conformant baseline. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
</style>
</head>
<body>
  <h1>Default</h1>
  <button class="btn" id="target">Confirm</button>
</body>
</html>
