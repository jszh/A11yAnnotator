<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: 1px hairline inner outline, negligible contrasting area</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The inner outline is only 1px and #9e9e9e (~2.7:1 vs white), placed
     just inside the button border. Both the thinness and the sub-3:1 color
     mean the contrasting portion of the perimeter is insufficient. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:12px 20px; font-size:16px; cursor:pointer; box-sizing:border-box;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 1px #9e9e9e; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 1px #9e9e9e; }
</style>
</head>
<body>
  <h1>Editor</h1>
  <button class="btn" id="target">Insert</button>
</body>
</html>
