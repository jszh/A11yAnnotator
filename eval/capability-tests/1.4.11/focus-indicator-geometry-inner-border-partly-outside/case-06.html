<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: light inner border on white component (#90caf9 partial)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focus indicator is a light-blue inner border (#90caf9) on a white
     button. Against the white fill it is only ~1.75:1, and the geometry places
     it entirely inside the component, so the only adjacent color is the white
     fill it fails to contrast with. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:14px 22px; font-size:16px; cursor:pointer; box-sizing:border-box;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 3px #90caf9; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 3px #90caf9; }
</style>
</head>
<body>
  <h1>Form</h1>
  <button class="btn" id="target">Continue</button>
</body>
</html>
