<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: outline outside but on same-color neighboring panel</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:0; }
  /* The button sits on a blue panel and is itself blue (#1565c0). Its offset
     focus outline is also blue-ish (#2962ff) and lands on the blue panel, so
     the part of the perimeter outside the button is ~1.0-1.1:1 against the
     blue panel. The geometry pushes the indicator onto a non-contrasting
     adjacent surface. */
  .panel { background:#1565c0; padding:40px; }
  .btn {
    background:#1565c0; color:#fff; border:1px solid #1565c0;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #2962ff; outline-offset:4px; }
  .btn:focus-visible { outline:3px solid #2962ff; outline-offset:4px; }
</style>
</head>
<body>
  <div class="panel">
    <button class="btn" id="target">Learn more</button>
  </div>
</body>
</html>
