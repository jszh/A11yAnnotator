<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: inset+outset combined ring, contrast on every side</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A combined inset white ring AND an outset dark ring. Even where the button
     abuts neighbors, at least one of the two complete rings contrasts against
     its adjacent surface on every side. Inner white vs #1565c0 ~5.75:1;
     outer #0d47a1 vs white ~8.6:1. */
  .grid { display:flex; gap:0; }
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:12px 20px; font-size:16px; cursor:pointer; position:relative;
  }
  .btn:focus {
    outline:none; z-index:1;
    box-shadow:inset 0 0 0 2px #ffffff, 0 0 0 3px #0d47a1;
  }
  .btn:focus-visible {
    outline:none; z-index:1;
    box-shadow:inset 0 0 0 2px #ffffff, 0 0 0 3px #0d47a1;
  }
</style>
</head>
<body>
  <h1>Group</h1>
  <div class="grid">
    <button class="btn" id="target">One</button>
    <button class="btn">Two</button>
  </div>
</body>
</html>
