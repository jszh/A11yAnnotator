<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: thick solid outline, both edges high-contrast</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A 4px black outline offset 2px from the button. Its outer edge is on the
     white page (21:1) and its inner edge is on the white button (21:1), so
     both perimeters are highly contrasting and the band is thick. Sound
     geometry, sound contrast. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:4px solid #000000; outline-offset:2px; }
  .btn:focus-visible { outline:4px solid #000000; outline-offset:2px; }
</style>
</head>
<body>
  <h1>Confirm</h1>
  <button class="btn" id="target">Delete</button>
</body>
</html>
