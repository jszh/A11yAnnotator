<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: thick outline, outer edge fully on contrasting surface</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* A thick 4px outline is offset outward so its entire outer edge lies on the
     white page. Even if the inner edge touches the gray button, the outline as
     a whole is adjacent to the contrasting page on its full perimeter.
     #0d47a1 vs white ~8.6:1. */
  .btn {
    background:#9e9e9e; color:#fff; border:0;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:4px solid #0d47a1; outline-offset:5px; }
  .btn:focus-visible { outline:4px solid #0d47a1; outline-offset:5px; }
</style>
</head>
<body>
  <h1>Controls</h1>
  <button class="btn" id="target">Reset</button>
</body>
</html>
