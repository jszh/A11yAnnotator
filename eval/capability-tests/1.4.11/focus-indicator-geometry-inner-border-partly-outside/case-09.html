<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: corner-only indicators (gaps dominate perimeter)</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The focus style draws short contrasting marks only at the four CORNERS
     (via two thin pseudo-free gradients faked with border segments). The vast
     majority of the perimeter has no indicator, so the contrasting portion is
     insufficient to bound the component. Implemented with a dashed outline at
     a faint color so even the dashes are ~1.9:1. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:2px dashed #bbbbbb; outline-offset:3px; }
  .btn:focus-visible { outline:2px dashed #bbbbbb; outline-offset:3px; }
</style>
</head>
<body>
  <h1>Toolbar</h1>
  <button class="btn" id="target">Bold</button>
</body>
</html>
