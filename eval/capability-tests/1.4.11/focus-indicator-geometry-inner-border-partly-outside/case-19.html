<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry negative: double ring contrasts on both inner and outer edges</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* Inner white ring + outer dark ring, both complete around the perimeter.
     Inner white vs the #1565c0 button ~5.75:1; outer #0d47a1 vs the white
     page ~8.6:1. Geometry is sound: every side has a contrasting edge. */
  .btn {
    background:#1565c0; color:#fff; border:0;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus {
    outline:none;
    box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #0d47a1;
  }
  .btn:focus-visible {
    outline:none;
    box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #0d47a1;
  }
</style>
</head>
<body>
  <h1>Submit</h1>
  <button class="btn" id="target">Send form</button>
</body>
</html>
