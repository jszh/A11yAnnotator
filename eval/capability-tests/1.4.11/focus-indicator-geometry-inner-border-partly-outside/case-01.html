<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: inner partial border, the only contrasting edge is too faint</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The only focus indicator is a bottom inner border, and even that single
     edge is #bbbbbb (~1.9:1 vs the white button) -> the contrasting portion
     of the perimeter is below 3:1, and the rest of the perimeter has no
     indicator at all. */
  .btn {
    background:#ffffff; color:#222; border:1px solid #767676;
    padding:10px 18px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; border-bottom:3px solid #bbbbbb; }
  .btn:focus-visible { outline:none; border-bottom:3px solid #bbbbbb; }
</style>
</head>
<body>
  <h1>Tabs</h1>
  <button class="btn" id="target">Overview</button>
</body>
</html>
