<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: inner ring contrasting only against the page, hidden by fill</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The "focus indicator" is a dark inset ring placed well inside the button.
     But the button fill is dark too (#3c4043), so the inset ring (#1a1a1a)
     is ~1.7:1 against the dark fill it sits on. The geometry keeps the ring
     entirely on the dark interior surface, where it does not contrast. */
  .btn {
    background:#3c4043; color:#fff; border:0;
    padding:16px 24px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:none; box-shadow:inset 0 0 0 4px #1a1a1a; }
  .btn:focus-visible { outline:none; box-shadow:inset 0 0 0 4px #1a1a1a; }
</style>
</head>
<body>
  <h1>Player</h1>
  <button class="btn" id="target">Play</button>
</body>
</html>
