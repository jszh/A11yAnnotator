<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry positive: offset outline same color as button, no contrasting band</title>
<style>
  body { background:#ffffff; font-family:system-ui,sans-serif; margin:40px; }
  /* The offset focus outline (#757575) is the SAME color as the button fill
     (#757575). On its inner side it abuts the identical button fill (1:1),
     and because outline-offset is small the visible band reads as a thicker
     same-color extension of the button rather than a contrasting border.
     The only genuinely contrasting edge is the thin outer line against white,
     which is too small a portion of the perimeter to bound the component.
     The geometry produces an insufficient contrasting perimeter. */
  .btn {
    background:#757575; color:#fff; border:0;
    padding:12px 20px; font-size:16px; cursor:pointer;
  }
  .btn:focus { outline:3px solid #757575; outline-offset:1px; }
  .btn:focus-visible { outline:3px solid #757575; outline-offset:1px; }
</style>
</head>
<body>
  <h1>Deals</h1>
  <button class="btn" id="target">View deal</button>
</body>
</html>
