<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line chart trend lines low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Revenue (line) vs cost (line) over four quarters.</figcaption>
  <svg width="320" height="200" viewBox="0 0 320 200" role="img" aria-label="Line chart comparing revenue and cost">
    <rect width="320" height="200" fill="#ffffff"></rect>
    <!-- revenue line #989898 vs white = 2.88:1 ; required to read the trend -->
    <polyline points="20,160 110,120 200,90 300,40" fill="none" stroke="#989898" stroke-width="3"></polyline>
    <!-- cost line #a6a6a6 vs white ~2.5:1 -->
    <polyline points="20,170 110,150 200,130 300,150" fill="none" stroke="#a6a6a6" stroke-width="3"></polyline>
  </svg>
</figure>
</main>
</body>
</html>
