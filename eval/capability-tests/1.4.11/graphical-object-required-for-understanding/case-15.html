<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search icon sufficient contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Search.</figcaption>
  <svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Search">
    <rect width="48" height="48" fill="#ffffff"></rect>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#1a4971" stroke-width="4"></circle>
    <line x1="29" y1="29" x2="42" y2="42" stroke="#1a4971" stroke-width="4"></line>
  </svg>
</figure>
</main>
</body>
</html>
