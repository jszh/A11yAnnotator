<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatter clusters encoded by color fail</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Sample groups A and B (group is shown by dot color).</figcaption>
  <svg width="300" height="200" viewBox="0 0 300 200" role="img" aria-label="Scatter plot of groups A and B">
    <rect width="300" height="200" fill="#ffffff"></rect>
    <!-- group A #8f8f8f, group B #9c9c9c => mutual ~1.2:1 and each near/under 3:1 vs white -->
    <g fill="#8f8f8f"><circle cx="60" cy="150" r="6"/><circle cx="80" cy="120" r="6"/><circle cx="100" cy="140" r="6"/></g>
    <g fill="#9c9c9c"><circle cx="200" cy="70" r="6"/><circle cx="220" cy="90" r="6"/><circle cx="240" cy="60" r="6"/></g>
  </svg>
</figure>
</main>
</body>
</html>
