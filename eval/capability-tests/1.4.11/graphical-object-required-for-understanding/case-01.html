<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pie chart adjacent wedges low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Sales by region (color is the only way to tell wedges apart).</figcaption>
  <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Pie chart of sales by region">
    <!-- two adjacent wedges 204060 vs 5e84ab => 2.73:1, required to distinguish regions -->
    <path d="M120 120 L120 20 A100 100 0 0 1 220 120 Z" fill="#204060"></path>
    <path d="M120 120 L220 120 A100 100 0 0 1 120 220 Z" fill="#5e84ab"></path>
    <path d="M120 120 L120 220 A100 100 0 0 1 20 120 Z" fill="#9ab8d8"></path>
    <path d="M120 120 L20 120 A100 100 0 0 1 120 20 Z" fill="#cfe0f0"></path>
  </svg>
</figure>
</main>
</body>
</html>
