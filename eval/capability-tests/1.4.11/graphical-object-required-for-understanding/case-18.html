<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuous gradient legend (abstain)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Temperature scale (continuous).</figcaption>
  <svg width="300" height="60" viewBox="0 0 300 60" role="img" aria-label="Temperature color scale">
    <defs><linearGradient id="t" x1="0" x2="1">
      <stop offset="0" stop-color="#2166ac"/><stop offset="0.5" stop-color="#f7f7f7"/><stop offset="1" stop-color="#b2182b"/>
    </linearGradient></defs>
    <rect x="10" y="10" width="280" height="30" fill="url(#t)"></rect>
  </svg>
</figure>
</main>
</body>
</html>
