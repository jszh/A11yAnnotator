<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pie wedges with redundant text labels low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Each wedge is labeled in text; color is decorative.</figcaption>
  <svg width="280" height="240" viewBox="0 0 280 240" role="img" aria-label="Pie chart with text labels: North 40%, South 35%, East 25%">
    <path d="M120 120 L120 20 A100 100 0 0 1 220 120 Z" fill="#9aa7b3"></path>
    <path d="M120 120 L220 120 A100 100 0 0 1 80 215 Z" fill="#a3afba"></path>
    <path d="M120 120 L80 215 A100 100 0 0 1 120 20 Z" fill="#9faab6"></path>
    <text x="170" y="80" font-size="12" fill="#1a1a1a">North 40%</text>
    <text x="150" y="180" font-size="12" fill="#1a1a1a">South 35%</text>
    <text x="40" y="120" font-size="12" fill="#1a1a1a">East 25%</text>
  </svg>
</figure>
</main>
</body>
</html>
