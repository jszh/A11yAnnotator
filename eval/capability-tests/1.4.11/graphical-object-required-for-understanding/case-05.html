<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donut chart one required boundary fails</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Storage usage by category (each color is a category).</figcaption>
  <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Donut chart of storage by category">
    <circle cx="120" cy="120" r="100" fill="none" stroke="#0b3d2e" stroke-width="40"
      stroke-dasharray="120 408" transform="rotate(-90 120 120)"></circle>
    <circle cx="120" cy="120" r="100" fill="none" stroke="#e9c46a" stroke-width="40"
      stroke-dasharray="120 408" stroke-dashoffset="-120" transform="rotate(-90 120 120)"></circle>
    <!-- this segment vs its neighbor below is fine, but the next pair fails -->
    <circle cx="120" cy="120" r="100" fill="none" stroke="#2a9d8f" stroke-width="40"
      stroke-dasharray="120 408" stroke-dashoffset="-240" transform="rotate(-90 120 120)"></circle>
    <!-- #2f9488 adjacent to #2a9d8f => ~1.05:1 required boundary FAILS -->
    <circle cx="120" cy="120" r="100" fill="none" stroke="#2f9488" stroke-width="40"
      stroke-dasharray="168 360" stroke-dashoffset="-360" transform="rotate(-90 120 120)"></circle>
  </svg>
</figure>
</main>
</body>
</html>
