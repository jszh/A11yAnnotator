<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar chart bars sufficient vs background</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Monthly totals.</figcaption>
  <svg width="280" height="200" viewBox="0 0 280 200" role="img" aria-label="Bar chart monthly totals">
    <rect width="280" height="200" fill="#ffffff"></rect>
    <rect x="30" y="60" width="40" height="120" fill="#264653"></rect>
    <rect x="90" y="40" width="40" height="140" fill="#264653"></rect>
    <rect x="150" y="90" width="40" height="90" fill="#264653"></rect>
    <rect x="210" y="20" width="40" height="160" fill="#264653"></rect>
  </svg>
</figure>
</main>
</body>
</html>
