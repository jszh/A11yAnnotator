<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Required-field marker shape low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Required fields are flagged with a small solid triangle marker.</figcaption>
  <label>Email
    <svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-label="required" style="vertical-align:middle">
      <!-- triangle marker #adadad vs white ~2.35:1 ; required to know the field is mandatory -->
      <path d="M7 1 L13 13 L1 13 Z" fill="#adadad"></path>
    </svg>
  </label>
  <input type="email" style="display:block;margin-top:6px">
</figure>
</main>
</body>
</html>
