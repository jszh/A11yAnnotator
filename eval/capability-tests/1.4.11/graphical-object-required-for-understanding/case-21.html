<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar chart with decorative low-contrast drop shadow</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Quarterly units (bars carry the data).</figcaption>
  <svg width="280" height="200" viewBox="0 0 280 200" role="img" aria-label="Bar chart quarterly units">
    <rect width="280" height="200" fill="#ffffff"></rect>
    <!-- decorative soft shadow under each bar: #f0f0f0 vs white ~1.07:1 but NOT required -->
    <rect x="34" y="64" width="40" height="120" fill="#f0f0f0"></rect>
    <rect x="30" y="60" width="40" height="120" fill="#2a6f97"></rect>
    <rect x="94" y="44" width="40" height="140" fill="#f0f0f0"></rect>
    <rect x="90" y="40" width="40" height="140" fill="#2a6f97"></rect>
  </svg>
</figure>
</main>
</body>
</html>
