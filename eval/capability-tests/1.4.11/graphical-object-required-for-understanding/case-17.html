<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedge over photographic background (abstain)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Data overlay on a photo backdrop.</figcaption>
  <svg width="300" height="200" viewBox="0 0 300 200" role="img" aria-label="Chart over photo">
    <defs>
      <radialGradient id="g1" cx="30%" cy="30%" r="90%">
        <stop offset="0%" stop-color="#f6d365"/><stop offset="40%" stop-color="#7b8a5a"/>
        <stop offset="70%" stop-color="#3a5a40"/><stop offset="100%" stop-color="#1b2a1f"/>
      </radialGradient>
    </defs>
    <rect width="300" height="200" fill="url(#g1)"></rect>
    <path d="M150 100 L150 30 A70 70 0 0 1 220 100 Z" fill="#6a8caf"></path>
  </svg>
</figure>
</main>
</body>
</html>
