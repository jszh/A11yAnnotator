<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decorative logo swoosh low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Company logo.</figcaption>
  <svg width="200" height="80" viewBox="0 0 200 80" role="img" aria-label="Acme">
    <text x="10" y="50" font-size="34" fill="#1a1a1a" font-weight="bold">Acme</text>
    <!-- decorative low-contrast swoosh #eaeaea vs white -->
    <path d="M10 62 Q100 78 190 62" fill="none" stroke="#eaeaea" stroke-width="4"></path>
  </svg>
</figure>
</main>
</body>
</html>
