<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choroplot map adjacent regions low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Risk level by zone (color encodes risk; no text labels).</figcaption>
  <svg width="300" height="180" viewBox="0 0 300 180" role="img" aria-label="Risk map by zone">
    <!-- adjacent regions 3a7d44 vs 4f9a59 => 1.45:1 ; required to read which zone is which risk -->
    <rect x="0" y="0" width="150" height="180" fill="#3a7d44"></rect>
    <rect x="150" y="0" width="150" height="180" fill="#4f9a59"></rect>
  </svg>
</figure>
</main>
</body>
</html>
