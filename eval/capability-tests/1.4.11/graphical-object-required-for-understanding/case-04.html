<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mute icon slash low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Audio status icon (a diagonal slash means muted).</figcaption>
  <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Audio muted">
    <rect width="64" height="64" fill="#ffffff"></rect>
    <path d="M14 26 H24 L36 16 V48 L24 38 H14 Z" fill="#1a1a1a"></path>
    <!-- the meaning-bearing 'muted' slash: #a6a6a6 vs white = ~2.5:1, below 3:1 -->
    <line x1="42" y1="18" x2="56" y2="46" stroke="#a6a6a6" stroke-width="4"></line>
  </svg>
</figure>
</main>
</body>
</html>
