<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essential reproduction of a low-contrast UI (documentation)</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Screenshot reproduced verbatim to document a vendor bug. The faint divider is part of what is being reported.</figcaption>
  <svg width="300" height="120" viewBox="0 0 300 120" role="img" aria-label="Reproduction of vendor screen showing a faint divider as documented">
    <rect width="300" height="120" fill="#ffffff" stroke="#1a1a1a"></rect>
    <text x="12" y="30" font-size="13" fill="#1a1a1a">Vendor Panel (as shipped)</text>
    <line x1="0" y1="60" x2="300" y2="60" stroke="#eeeeee" stroke-width="2"></line>
    <text x="12" y="90" font-size="13" fill="#1a1a1a">Footer</text>
  </svg>
</figure>
</main>
</body>
</html>
