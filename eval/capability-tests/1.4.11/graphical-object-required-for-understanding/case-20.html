<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauge needle sufficient</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Pressure gauge.</figcaption>
  <svg width="220" height="140" viewBox="0 0 220 140" role="img" aria-label="Pressure gauge">
    <path d="M20 120 A90 90 0 0 1 200 120" fill="none" stroke="#1a1a1a" stroke-width="3"></path>
    <line x1="110" y1="120" x2="160" y2="55" stroke="#b00020" stroke-width="4"></line>
    <circle cx="110" cy="120" r="6" fill="#1a1a1a"></circle>
  </svg>
</figure>
</main>
</body>
</html>
