<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow diagram connector sufficient</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Start to Review.</figcaption>
  <svg width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="Flow Start to Review">
    <rect x="10" y="40" width="90" height="40" fill="#ffffff" stroke="#1a1a1a"></rect>
    <text x="55" y="65" text-anchor="middle" font-size="13" fill="#1a1a1a">Start</text>
    <rect x="220" y="40" width="90" height="40" fill="#ffffff" stroke="#1a1a1a"></rect>
    <text x="265" y="65" text-anchor="middle" font-size="13" fill="#1a1a1a">Review</text>
    <line x1="100" y1="60" x2="215" y2="60" stroke="#1a1a1a" stroke-width="3"></line>
    <path d="M215 60 l-10 -5 v10 z" fill="#1a1a1a"></path>
  </svg>
</figure>
</main>
</body>
</html>
