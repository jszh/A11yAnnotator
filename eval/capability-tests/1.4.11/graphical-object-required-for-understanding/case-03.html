<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked bar segments low contrast</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#ffffff; color:#1a1a1a; }
  .case { max-width: 640px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color:#333; margin-top:8px; }
  svg { display:block; }
</style>
</head>
<body>
<main class="case">
<figure>
  <figcaption>Budget: fixed vs variable (stacked).</figcaption>
  <svg width="120" height="220" viewBox="0 0 120 220" role="img" aria-label="Stacked bar of fixed and variable budget">
    <rect x="30" y="20" width="60" height="90" fill="#6a7f99"></rect>
    <!-- adjacent segment #58708e vs #6a7f99 ~1.2:1 ; boundary needed to read split -->
    <rect x="30" y="110" width="60" height="90" fill="#58708e"></rect>
  </svg>
</figure>
</main>
</body>
</html>
